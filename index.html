<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening Lab | Ron Taylor Masterclass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}
.listenfor{margin-top:18px;background:var(--gold-soft);border:1px solid #bfe0dc;border-radius:10px;padding:16px 18px}
.listenfor h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.listenfor p{font-size:15.5px;color:#2d3a38}

.respond{margin-top:22px}
.respond h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}

.startlist{list-style:none;display:grid;gap:8px;margin:14px 0 8px}
.startlist button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.startlist button:hover{border-color:var(--gold)}
.startlist .n{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:lining-nums}
.startlist b{display:block;font-family:var(--serif);font-size:18px}
.startlist small{color:var(--muted);font-size:13.5px}
.startlist .lv{font-size:12.5px;font-weight:700;color:var(--gold);text-align:right}
.startlist .ck{color:var(--gold);font-weight:700}
.cats{margin-top:20px;padding-top:14px;border-top:1px solid rgba(127,127,127,.35)}.cats h4{margin:0 0 6px;font-size:17px}.cats ol{margin:8px 0 0;padding-left:26px}.cats li{margin:4px 0;line-height:1.5}

<script>
const BOOK = [{"part": 1, "title": "Words You Know but Don't Hear", "desc": "Short stories built around the small words Brazilians often miss when listening.", "scripts": [{"num": 1, "title": "The Neighbour", "lines": [["P", "So, do you know Doug?", "Tom"], ["S", "I do. He's my neighbour. He lives in 4B, right across the hall.", "Ann"], ["P", "Where does he work?", "Tom"], ["S", "At Vancouver General Hospital. He's a nurse. But he doesn't work on weekends.", "Ann"], ["P", "Did he start there this year?", "Tom"], ["S", "No, he didn't. He started three years ago, in June.", "Ann"], ["P", "Was he a nurse before that?", "Tom"], ["S", "No, he wasn't. He was a cook, but he didn't like the hours.", "Ann"], ["P", "Does he like the hospital?", "Tom"], ["S", "He does. He says the people are friendly. The hours are long, though.", "Ann"], ["P", "Do they pay well?", "Tom"], ["S", "I don't know. He didn't tell me.", "Ann"], ["P", "Didn't you ask him?", "Tom"], ["S", "I did ask him! He just laughed and changed the subject.", "Ann"], ["P", "Ha. Does his wife work there too?", "Tom"], ["S", "Karen? No, she doesn't. She teaches grade three at a school on Oak Street.", "Ann"], ["P", "Does she like it?", "Tom"], ["S", "She does. She loves the kids.", "Ann"], ["P", "Do they have kids of their own?", "Tom"], ["S", "They don't. But they do have a big dog. His name is Bear.", "Ann"], ["P", "Does Bear bark a lot?", "Tom"], ["S", "He doesn't bark much. But he did bark all night last Saturday.", "Ann"], ["P", "Why? What happened?", "Tom"], ["S", "Doug and Karen went to a wedding in Victoria, and they didn't come home until Sunday. Bear was alone, and he wasn't happy.", "Ann"], ["P", "Did you hear him?", "Tom"], ["S", "Did I hear him? The whole building heard him!", "Ann"], ["P", "Did anyone complain?", "Tom"], ["S", "Mrs. Porter did. She lives in 4A. She called the manager at two in the morning.", "Ann"], ["P", "What did the manager do?", "Tom"], ["S", "He called Doug, but Doug didn't answer his phone.", "Ann"], ["P", "Didn't anyone have a key?", "Tom"], ["S", "No, nobody did. Doug doesn't give his key to anyone.", "Ann"], ["P", "So what happened on Sunday?", "Tom"], ["S", "Well, Doug and Karen came home, and Mrs. Porter was waiting for them in the hallway. She was really angry.", "Ann"], ["P", "Oh no. Did Doug apologize?", "Tom"], ["S", "He did. He apologized, and he bought her flowers.", "Ann"], ["P", "And does she like him now?", "Tom"], ["S", "She does! Now she walks Bear every afternoon.", "Ann"]], "words": 322, "kind": "story", "scene": "Ann and Tom are having coffee on Ann's balcony.", "F": "do/does/did, don't/doesn't/didn't, emphatic \"I did\"", "V": "", "t": [[2.0, 3.43], [4.1, 4.72], [4.94, 5.88], [6.1, 8.61], [9.28, 10.59], [11.26, 13.0], [13.22, 14.01], [14.23, 15.92], [16.59, 18.19], [18.86, 19.73], [19.95, 22.09], [22.76, 24.63], [25.3, 26.14], [26.36, 28.68], [29.35, 31.08], [31.75, 32.41], [32.63, 34.23], [34.45, 35.84], [36.51, 37.77], [38.44, 39.27], [39.49, 40.51], [41.18, 42.59], [43.26, 44.24], [44.46, 46.68], [47.35, 48.05], [48.27, 50.05], [50.72, 51.4], [51.62, 52.54], [52.76, 55.36], [56.03, 57.27], [57.94, 58.68], [58.9, 60.03], [60.7, 62.56], [63.23, 63.91], [64.13, 65.8], [66.02, 67.02], [67.69, 69.29], [69.96, 71.17], [71.39, 73.57], [74.24, 74.94], [75.16, 76.27], [76.94, 81.83], [82.05, 84.1], [84.77, 86.13], [86.8, 87.78], [88.0, 89.39], [90.06, 91.62], [92.29, 93.35], [93.57, 94.85], [95.07, 97.21], [97.88, 99.46], [100.13, 102.88], [103.55, 105.32], [105.99, 107.23], [107.45, 109.52], [110.19, 111.98], [112.65, 117.43], [117.65, 118.93], [119.6, 120.58], [120.8, 122.31], [122.98, 123.62], [123.84, 126.32], [126.99, 128.67], [129.34, 130.09], [130.31, 132.21]], "R": [["You're having coffee with a new neighbour.", "Neighbour", "So, how long have you lived in the building?", "About six months. We moved here from Brazil in the spring. How about you?"], ["Your neighbour invites you over.", "Neighbour", "Would you like to come for coffee on Saturday?", "I'd love to, thanks! What time is good for you?"]]}, {"num": 2, "title": "The Phone Call", "lines": [["P", "Is the shop far?", "Jenny"], ["S", "It isn't far. I can walk there in fifteen minutes.", "Tim"], ["P", "Is the pay good?", "Jenny"], ["S", "It is. It's better than my last job.", "Tim"], ["P", "Does it have benefits?", "Jenny"], ["S", "It does. Dental and medical, after three months.", "Tim"], ["P", "So why are you so nervous?", "Jenny"], ["S", "Because my manager, Linda, wasn't there when I picked up my uniform. Her assistant said she was at a meeting in the morning, and then at the dentist. He said she'll call me tonight about my schedule.", "Tim"], ["P", "What time will she call?", "Jenny"], ["S", "He wasn't sure. Maybe around eight. And it's eight thirty now.", "Tim"], ["P", "She will call. Relax.", "Jenny"], ["S", "I can't relax. Maybe she won't call. Maybe she forgot. What if the job isn't mine anymore?", "Tim"], ["P", "Tim, it is your job. They gave you a uniform!", "Jenny"], ["P", "Hi, Tim, it's Linda. Sorry I'm so late. It was a crazy day. Can you talk now?", "Linda"], ["S", "I can, yes.", "Tim"], ["P", "Great. Can you start at eight tomorrow, not nine? We're very busy this week.", "Linda"], ["S", "I can.", "Tim"], ["P", "Is that a problem?", "Linda"], ["S", "No, it isn't. That's fine.", "Tim"], ["P", "Good. One more thing. You won't work on Saturdays this month, but you will work Saturdays in December. Is that okay?", "Linda"], ["S", "That's okay. It wasn't a problem at my last job either.", "Tim"], ["P", "Can you bring your own tools?", "Linda"], ["S", "I can. They're all in my car.", "Tim"], ["P", "Perfect. See you at eight. Don't be late. The boss is always here at seven thirty.", "Linda"], ["S", "Who's the boss?", "Tim"], ["P", "My husband. He's never late, and he won't let you forget it.", "Linda"], ["P", "Well? Was it good news?", "Jenny"], ["S", "It was. I can't wait.", "Tim"]], "words": 259, "kind": "story", "scene": "It's the night before Tim's first day at a car repair shop on Kingsway. He's at home with his wife, Jenny, waiting for a phone call.", "F": "is/isn't, was/wasn't, can/can't, will/won't", "V": "", "t": [[2.0, 3.15], [3.82, 4.7], [4.92, 6.62], [7.29, 8.34], [9.01, 9.67], [9.89, 11.43], [12.1, 13.4], [14.07, 14.71], [14.93, 16.93], [17.6, 19.07], [19.74, 23.73], [23.95, 28.26], [28.48, 30.79], [31.46, 32.8], [33.47, 34.39], [34.61, 35.65], [35.87, 36.96], [37.63, 38.55], [38.77, 39.6], [40.27, 41.23], [41.45, 42.54], [42.76, 43.8], [44.02, 45.88], [46.55, 47.96], [48.18, 49.69], [50.36, 51.71], [51.93, 53.21], [53.43, 54.6], [54.82, 55.95], [56.62, 57.52], [58.19, 58.89], [59.11, 61.37], [61.59, 62.89], [63.56, 64.25], [64.92, 66.07], [66.74, 67.66], [67.88, 68.64], [69.31, 69.89], [70.11, 71.07], [71.29, 75.34], [75.56, 76.57], [77.24, 78.07], [78.29, 80.63], [81.3, 82.67], [83.34, 84.02], [84.24, 85.39], [86.06, 86.83], [87.05, 88.03], [88.25, 89.17], [89.39, 91.63], [92.3, 93.2], [93.87, 94.78], [95.0, 97.39], [98.06, 98.68], [98.9, 99.99], [100.66, 101.3], [101.52, 102.35]], "R": [["Your new boss calls the night before your first day.", "Manager", "Can you start at seven thirty tomorrow?", "Yes, seven thirty is fine. Where should I go when I arrive?"], ["Your manager gives you information on the phone.", "Manager", "Park behind the building and come to the side door.", "Okay. Behind the building, side door. Thanks, see you tomorrow!"]]}, {"num": 3, "title": "Ann's Saturday", "lines": [["P", "Hi, sweetheart! How was your Saturday?", "Mom"], ["S", "Really good. I woke up early, but it was raining, so I decided to clean my apartment.", "Ann"], ["P", "On a Saturday? What did you clean?", "Mom"], ["S", "Everything. I washed the dishes and cleaned the kitchen. Then I vacuumed the floor, dusted the shelves, and folded the laundry. I finished at eleven.", "Ann"], ["P", "You must have been tired.", "Mom"], ["S", "I was, but I wanted to go out. The rain stopped a little after twelve, so I walked to Robson Street and looked for a new jacket. I needed a warm one for the winter.", "Ann"], ["P", "Did you find one?", "Mom"], ["S", "I did. I tried on three. The first one was too big, and the second one was too expensive. But I loved the third one. It's blue, with a hood. When I looked at the price tag, I was so surprised. It was only forty dollars.", "Ann"], ["P", "Forty dollars? Was it on sale?", "Mom"], ["S", "It was. I asked the cashier, and he said everything was half price. So I paid for it, thanked him, and walked home. On the way, I stopped at a bakery and ordered a hot chocolate. I sat by the window and watched the people on the street. A dog walked past in a little raincoat, and I laughed.", "Ann"], ["P", "And what did you have for dinner?", "Mom"], ["S", "I cooked. I baked some chicken and boiled some potatoes.", "Ann"], ["P", "Good for you. And how was your week?", "Mom"], ["S", "Busy. I worked late on Wednesday. And on Friday, my boss invited me to lunch.", "Ann"], ["P", "He invited you to lunch? That's nice.", "Mom"], ["S", "It was. He wanted to talk about a new project. He asked me to lead it.", "Ann"], ["P", "Did you accept?", "Mom"], ["S", "Of course I accepted!", "Ann"], ["P", "That's wonderful! Oh, have you started your piano lessons?", "Mom"], ["S", "I started last month, Mom. I've already learned three songs.", "Ann"], ["P", "Play one for me!", "Mom"], ["S", "Okay, a short one. Are you listening?", "Ann"], ["P", "I loved it! You really practised.", "Mom"], ["S", "I did. It was a good Saturday.", "Ann"]], "words": 323, "kind": "story", "scene": "On Saturday evening, Ann calls her mother in Halifax.", "F": "-ed endings in all three sounds: /t/, /d/, /ɪd/", "V": "", "t": [[2.0, 3.11], [3.33, 4.59], [5.26, 6.03], [6.25, 10.68], [11.35, 12.33], [12.55, 13.56], [14.23, 14.95], [15.17, 17.46], [17.68, 21.49], [21.71, 22.95], [23.62, 25.03], [25.7, 27.7], [27.92, 33.24], [33.46, 35.27], [35.94, 36.99], [37.66, 38.3], [38.52, 39.56], [39.78, 43.3], [43.52, 45.01], [45.23, 46.45], [46.67, 49.49], [49.71, 51.24], [51.91, 52.96], [53.18, 54.29], [54.96, 55.6], [55.82, 58.93], [59.15, 61.8], [62.02, 65.43], [65.65, 68.74], [68.96, 71.95], [72.62, 74.03], [74.7, 75.34], [75.56, 78.35], [79.02, 79.83], [80.05, 81.23], [81.9, 82.45], [82.67, 84.14], [84.36, 87.22], [87.89, 89.32], [89.54, 90.42], [91.09, 91.73], [91.95, 93.99], [94.21, 95.47], [96.14, 97.15], [97.82, 99.16], [99.83, 100.79], [101.01, 103.19], [103.86, 105.54], [105.76, 107.4], [108.07, 109.12], [109.79, 111.2], [111.42, 112.33], [113.0, 113.88], [114.1, 115.29], [115.96, 116.6], [116.82, 118.12]], "R": [["Your mother calls on Saturday evening.", "Mom", "So, what did you do today?", "Not much. I cleaned the apartment and went for a walk. What about you?"], ["Your mother asks about your plans.", "Mom", "Are you doing anything tomorrow?", "I'm meeting a friend for lunch, and then I'm going to relax."]]}, {"num": 4, "title": "The Party", "lines": [["P", "Where were you last night? I called you three times.", "Sarah"], ["S", "I was at home. I went to bed early, so I didn't hear my phone. Where were you?", "Beth"], ["P", "We were at Wayne and Colleen's party. It's their new apartment in Kitsilano. They're very happy there.", "Sarah"], ["S", "Is it near the beach?", "Beth"], ["P", "Yes, it's ten minutes from Kits Beach.", "Sarah"], ["S", "Is it bigger than their old place?", "Beth"], ["P", "Much bigger. It has two bedrooms and a big kitchen. And there's a view of the mountains from their balcony.", "Sarah"], ["S", "Were there many people?", "Beth"], ["P", "About twenty. Brent and Shauna were there, and Curtis came too. First, we had dinner. Then we played games. Then Wayne showed us his new guitar.", "Sarah"], ["S", "Can he play it?", "Beth"], ["P", "Not really. But he thinks he can. He played three songs, and they all sounded the same.", "Sarah"], ["S", "Ha! Was their cat there?", "Beth"], ["P", "Yes. Its name is Max. It's very friendly. It sat on my lap all night.", "Sarah"], ["S", "You're lucky. I stayed home because of the weather.", "Beth"], ["P", "The weather wasn't that bad!", "Sarah"], ["S", "It was raining, and it was cold. I didn't know whether it was going to snow.", "Beth"], ["P", "It didn't snow. It rained a little, then it stopped.", "Sarah"], ["S", "Well, I wasn't sure. You know I don't like driving in the snow.", "Beth"], ["P", "You could take the bus. There's a bus stop on Fourth Avenue, right in front of their building.", "Sarah"], ["S", "I didn't know that. Where exactly is their building?", "Beth"], ["P", "It's on the corner of Fourth and Vine. There's a bakery next to it.", "Sarah"], ["S", "Oh, I know that bakery. Their cinnamon buns are amazing.", "Beth"], ["P", "They're the best in Vancouver. Colleen bought a dozen for the party, and they were gone in ten minutes.", "Sarah"], ["S", "Now I'm really sad I didn't go.", "Beth"], ["P", "Well, your friends missed you, Beth. Everyone asked where you were. Next time, you're coming with us.", "Sarah"], ["S", "Okay. But only if there are cinnamon buns.", "Beth"], ["P", "Then I'll bring the cinnamon buns myself.", "Sarah"]], "words": 317, "kind": "story", "scene": "Sarah calls her friend Beth the morning after a party.", "F": "than/then, their/there/they're, your/you're, its/it's, were/where, weather/whether", "V": "", "t": [[2.0, 3.22], [3.44, 4.8], [5.47, 6.45], [6.67, 9.28], [9.5, 10.26], [10.93, 12.83], [13.05, 15.25], [15.47, 16.77], [17.44, 18.51], [19.18, 21.29], [21.96, 23.54], [24.21, 25.1], [25.32, 27.35], [27.57, 29.96], [30.63, 31.72], [32.39, 33.37], [33.59, 36.02], [36.24, 37.41], [37.63, 38.87], [39.09, 41.05], [41.72, 42.51], [43.18, 44.06], [44.28, 45.56], [45.78, 48.66], [49.33, 49.88], [50.1, 51.13], [51.8, 52.52], [52.74, 53.96], [54.18, 55.37], [55.59, 57.11], [57.78, 58.5], [58.72, 60.6], [61.27, 62.72], [63.39, 65.25], [65.47, 67.49], [68.16, 69.21], [69.43, 71.18], [71.85, 72.96], [73.18, 75.23], [75.9, 77.18], [77.4, 80.83], [81.5, 82.5], [82.72, 84.2], [84.87, 86.74], [86.96, 88.5], [89.17, 90.75], [90.97, 92.7], [93.37, 94.9], [95.12, 98.71], [99.38, 101.08], [101.75, 103.42], [103.64, 105.09], [105.31, 107.08], [107.75, 108.34], [108.56, 110.51], [111.18, 113.31]], "R": [["A friend calls the morning after a party.", "Friend", "Did you have fun last night?", "Yes, it was great! Thanks for inviting me. What time did you get home?"], ["Your friend asks about someone you met.", "Friend", "What did you think of my cousin?", "He was really nice. We talked about soccer for an hour!"]]}, {"num": 5, "title": "The Prize", "lines": [["P", "You look happy. How was your day?", "Nancy"], ["S", "Quite a day. I left at seven, like always, and I walked to work.", "Steve"], ["P", "You could take the bus, you know.", "Nancy"], ["S", "I know, but I like the quiet streets. It's quite a long walk, about forty minutes, but I enjoy it. And I passed the three trees.", "Steve"], ["P", "Emma's three trees?", "Nancy"], ["S", "Yes. It was so cold this morning, I could see my breath in the air. And my shoes were loose, so I had to stop and tie them. I didn't want to be late.", "Steve"], ["P", "Because of the big meeting.", "Nancy"], ["S", "Right. When I got to work, the meeting room was full. There was only one free seat, next to the window. Then Carol stood at the front and said, \"Every year, we give a prize to our best new employee. This year, the prize goes to Steve!\"", "Steve"], ["P", "Steve! That's wonderful!", "Nancy"], ["S", "Everyone clapped. She handed me a sheet of paper and asked me to read it out loud. \"A weekend trip to a farm on Vancouver Island. Travel by ship. All meals included.\"", "Steve"], ["P", "By ship? You mean the ferry?", "Nancy"], ["S", "The ferry. But someone at the back asked, \"Sheep?\" And Carol said, \"No, ship. S-H-I-P.\" So I said, \"But there are sheep on the farm too. I'll see the sheep from the ship!\"", "Steve"], ["P", "Ha! Was everyone happy for you?", "Nancy"], ["S", "Everyone, except Rick. He sat in the corner with his arms crossed and said, \"I hate to lose. I started here the same month as Steve, and I never win anything.\"", "Steve"], ["P", "Poor Rick.", "Nancy"], ["S", "Then someone joked, \"You live too far away, Rick. You leave work early every day to catch your train.\"", "Steve"], ["P", "What did you do?", "Nancy"], ["S", "I accepted the prize and thanked Carol. Then I walked over to Rick and said, \"Breathe, Rick. Take a deep breath. It's just a prize.\"", "Steve"], ["P", "And?", "Nancy"], ["S", "He asked, \"What's the price of that trip?\" Carol said, \"About five hundred dollars.\" Then he said, \"Okay. Congratulations, Steve. I accept it. Next year, it's my turn.\"", "Steve"], ["P", "That was nice of him.", "Nancy"], ["S", "It was. So I told him, \"Next year, I'll bring you a sweater, made from real sheep.\"", "Steve"]], "words": 355, "kind": "story", "scene": "Steve lives in a small house near Trout Lake. Tonight, he tells his wife, Nancy, about his day.", "F": "work/walk, live/leave, ship/sheep, sheet/seat, three/tree, quite/quiet, price/prize, lose/loose, breath/breathe, accept/except", "V": "", "t": [[2.0, 2.96], [3.18, 4.2], [4.87, 5.62], [5.84, 8.7], [9.37, 10.88], [11.55, 13.35], [13.57, 16.81], [17.03, 18.44], [19.11, 20.26], [20.93, 21.5], [21.72, 25.07], [25.29, 28.02], [28.24, 29.48], [30.15, 31.47], [32.14, 32.7], [32.92, 35.18], [35.4, 37.88], [38.1, 43.28], [43.5, 45.29], [45.96, 46.71], [46.93, 47.89], [48.56, 49.5], [49.72, 53.28], [53.5, 56.17], [56.39, 57.37], [57.59, 58.76], [59.43, 60.2], [60.42, 61.44], [62.11, 62.82], [63.04, 64.94], [65.16, 66.54], [66.76, 67.81], [68.03, 70.5], [70.72, 72.15], [72.82, 73.42], [73.64, 75.05], [75.72, 76.98], [77.2, 81.16], [81.38, 85.16], [85.83, 86.58], [87.25, 89.81], [90.03, 92.71], [93.38, 94.34], [95.01, 96.98], [97.2, 99.69], [99.91, 100.96], [101.18, 102.29], [102.96, 103.53], [104.2, 106.04], [106.26, 108.41], [108.63, 109.83], [110.05, Why not now?", "Emily"], ["S", "Because you have school.", "Mom"], ["P", "Which is better, English or Portuguese?", "Emily"], ["S", "What did you say?", "Mom"], ["P", "Which. Is. Better. English. Or. Portuguese?", "Emily"], ["S", "Both. That's why we speak two languages at home.", "Mom"], ["P", "Then why does Dad speak Portuguese when he's angry?", "Emily"], ["S", "Ha! Who told you that?", "Mom"], ["P", "Nobody. I heard him.", "Emily"], ["S", "When?", "Mom"], ["P", "When he lost his keys.", "Emily"], ["S", "Okay. Let's not tell Dad about this conversation.", "Mom"], ["P", "Okay. Mom? What's for dinner?", "Emily"]], "words": 242, "kind": "story", "scene": "Emily is six, and she has just started grade one. She asks her mom questions all day long.", "F": "what/which, who, where/were, when/then, why/while, how", "V": "", "t": [[2.0, 3.54], [4.21, 5.42], [6.09, 7.18], [7.85, 8.6], [9.27, 10.44], [11.11, 12.01], [12.68, 13.91], [14.58, 15.2], [15.42, 16.62], [16.84, 18.03], [18.7, 19.9], [20.12, 21.5], [22.17, 22.86], [23.08, 24.06], [24.73, 26.39], [27.06, 28.55], [29.22, 30.23], [30.9, 32.71], [33.38, 34.57], [35.24, 36.35], [37.02, 37.64], [37.86, 39.06], [39.73, 40.67], [40.89, 41.8], [42.47, 43.6], [44.27, 46.19], [46.86, 47.95], [48.62, 49.84], [50.51, 51.47], [52.14, 53.29], [53.96, 55.69], [56.36, 57.25], [57.92, 61.06], [61.28, 63.03], [63.7, 64.23], [64.45, 65.65], [65.87, 67.66], [68.33, 69.25], [69.92, 72.18], [72.85, 73.89], [74.56, 75.31], [75.98, 76.88], [77.55, 78.7], [79.37, 81.46], [82.13, 83.09], [83.76, 84.31], [84.53, 85.0], [85.22, 85.84], [86.06, 86.74], [86.96, 87.52], [87.74, 88.63], [89.3, 89.88], [90.1, 92.28], [92.95, 95.59], [96.26, 96.82], [97.04, 98.08], [98.75, 99.54], [99.76, 100.59], [101.26, 101.84], [102.51, 103.75], [104.42, 105.01], [105.23, 107.5], [108.17, 108.91], [109.13, 109.75], [109.97, 110.93]], "R": [["A child asks you a question.", "Child", "Why is the sky blue?", "That's a great question! Let's look it up together."], ["Your child asks for something before dinner.", "Child", "Can I have a cookie?", "Not right now. Dinner is almost ready. Maybe after dinner."]]}, {"num": 7, "title": "A New Family", "lines": [["P", "Look at them. The kids became friends in about five minutes.", "Bonnie"], ["S", "I know! My son is six, and my daughter is eight. Is Kyle six too?", "Julia"], ["P", "He is, and Megan is eight. Your son is playing soccer with him, and your daughter is on the swings with her.", "Bonnie"], ["S", "Perfect. How long have you lived here?", "Julia"], ["P", "We moved from Calgary in August. What about you?", "Bonnie"], ["S", "We've lived in Vancouver for four years. We had an apartment in Burnaby before, but now we have a house near here.", "Julia"], ["P", "We have a small apartment for now. Todd has a new job at a hospital. He's a nurse.", "Bonnie"], ["S", "And what do you do?", "Julia"], ["P", "I'm an engineer. I had an interview last week. I should hear back soon.", "Bonnie"], ["S", "Good luck! I hope you get it.", "Julia"], ["P", "Hi, I'm Todd. Bonnie, did you ask them?", "Todd"], ["P", "Not yet. Julia, you should come to dinner on Friday.", "Bonnie"], ["S", "We would love to, but we couldn't find a babysitter for Friday.", "Julia"], ["P", "Bring the kids! Ours will love playing with them.", "Todd"], ["S", "Are you sure? They're very loud.", "Julia"], ["P", "So are ours. It'll be fine.", "Todd"], ["S", "Okay, then. My husband, Mike, has a meeting on Friday afternoon, but he said he could leave early. What should we bring?", "Julia"], ["P", "Nothing. Just bring yourselves.", "Bonnie"], ["S", "We could bring a cake. The kids would love that.", "Julia"], ["P", "Come in, come in! Dinner is almost ready. Todd made a big pot of chili.", "Bonnie"], ["S", "It smells delicious. We brought a chocolate cake from a bakery on Main Street.", "Julia"], ["P", "Oh, the kids will be happy. Kyle, Megan, look what they brought!", "Todd"], ["P", "Megan, that's your third piece. You shouldn't eat so , "Sorry, we heard you through the wall. Jeff, we'll drive you. Bob's up late anyway.", "Joan"], ["S", "It's true. I don't sleep much. I'm always watching hockey until one in the morning.", "Bob"], ["S", "Are you sure? I'd pay you for gas.", "Jeff"], ["P", "You won't pay us anything. That's what friends are for.", "Joan"], ["S", "Well, then I'll bring you something from the hotel. They've got the best chocolate cake in the city.", "Jeff"], ["S", "Now that's a deal.", "Bob"]], "words": 264, "kind": "story", "scene": "Jeff's from Winnipeg. He's worked at the front desk of a hotel on Burrard Street since March. Tonight, he's talking with his wife, Pat.", "F": "contractions (he's = he is / he has, 'd = would / had, 'll), third-person -s", "V": "", "t": [[2.0, 2.94], [3.61, 4.12], [4.34, 6.2], [6.42, 8.59], [8.81, 11.24], [11.91, 12.87], [13.09, 14.05], [14.72, 16.94], [17.16, 20.6], [21.27, 22.7], [23.37, 23.9], [24.12, 25.49], [26.16, 27.12], [27.34, 32.67], [32.89, 34.55], [34.77, 37.42], [38.09, 38.96], [39.63, 41.25], [41.47, 43.54], [43.76, 45.66], [46.33, 47.38], [47.6, 49.33], [49.55, 52.28], [52.95, 53.74], [53.96, 54.79], [55.46, 57.57], [57.79, 59.33], [59.55, 61.04], [61.26, 63.22], [63.89, 65.0], [65.67, 67.83], [68.5, 69.9], [70.57, 71.64], [71.86, 73.23], [73.9, 75.73], [75.95, 77.21], [77.43, 78.84], [79.51, 80.51], [80.73, 82.18], [82.4, 85.84], [86.51, 87.25], [87.47, 88.6], [89.27, 90.64], [90.86, 92.27], [92.94, 95.15], [95.37, 97.53], [98.2, 99.56]], "R": [["Your partner asks about your new work schedule.", "Partner", "So, what are your new hours?", "I'm working nights now, from eleven to seven. It'll take some time to get used to."], ["A coworker asks you to change shifts.", "Coworker", "Could you work my shift on Friday?", "I'd like to help, but I have plans on Friday. Could I do Saturday instead?"]]}, {"num": 10, "title": "Make or Do? At the Office", "lines": [["P", "Paula, can I tell you something small? This morning, Greg asked if you did the research for the Pacific Foods report, and you said, \"Yes, I made it on Friday.\"", "Linda"], ["S", "Oh no. Was that wrong?", "Paula"], ["P", "Just a little. We say \"do research,\" not \"make research.\"", "Linda"], ["S", "In Portuguese, we use one verb for both: \"fazer.\" How do I know which one to use?", "Paula"], ["P", "There's a simple idea. \"Make\" is usually for creating something new. \"Do\" is usually for tasks, activities, and work. But honestly, you also have to memorize some of them.", "Linda"], ["S", "Can you give me some examples?", "Paula"], ["P", "Sure. I wrote two lists on this sticky note. Make a mistake, make a decision, make a phone call, make an appointment, make progress, make money.", "Linda"], ["S", "And \"do\"?", "Paula"], ["P", "Do research, do business, do a favour, do your best, do a good job, do overtime.", "Linda"], ["S", "Thank you. I'll practise this afternoon. I have to make a phone call to a client and make an appointment for Thursday.", "Paula"], ["P", "Perfect. Both correct.", "Linda"], ["P", "So, how was your afternoon?", "Linda"], ["S", "Good. I made the phone call, and I made the appointment. Then Tom asked me to do him a favour. He wanted me to check some numbers. He said, \"I want to make sure they're correct.\"", "Paula"], ["P", "And were they?", "Linda"], ["S", "Almost. I found one small error. I told him, \"You made a mistake in row twelve.\" He said I saved him.", "Paula"], ["P", "Ha! And your meeting with Greg?", "Linda"], ["S", "He said I'm doing a great job, and I've made a lot of progress this month. I told him I'm making an effort, especially with my English.", "Paula"], ["P", "That's great.", "Linda"], ["S", "He also said my work on the Pacific Foods account made a big difference. They've decided to do more business with us next year.", "Paula"], ["P", "Fantastic news. Anything else?", "Linda"], ["S", "We need to do some overtime next week. I said, \"No problem. I'll do my best.\"", "Paula"], ["P", "Every verb was correct.", "Linda"], ["S", "I know. I checked the sticky note before I answered.", "Paula"]], "words": 324, "kind": "story", "scene": "Paula, a new analyst from Brazil, is at her desk. Her colleague Linda stops by with a sticky note.", "F": "make vs. do (in Portuguese, both are \"fazer\"), did, -ed", "V": "make a mistake, make a decision, make a phone call, make an appointment, make progress, make sure, make an effort, make a difference, make money; do research, do business, do a favour, do your best, do well, do a good job, do overtime", "t": [[2.0, 3.98], [4.2, 11.27], [11.94, 12.66], [12.88, 13.82], [14.49, 15.45], [15.67, 18.17], [18.84, 22.21], [22.43, 24.28], [24.95, 26.3], [26.52, 28.97], [29.19, 32.03], [32.25, 35.19], [35.86, 37.57], [38.24, 38.9], [39.12, 41.04], [41.26, 46.59], [47.26, 48.09], [48.76, 53.52], [54.19, 54.94], [55.16, 56.78], [57.0, 61.42], [62.09, 62.9], [63.12, 64.12], [64.79, 66.32], [66.99, 67.53], [67.75, 70.46], [70.68, 72.92], [73.14, 75.01], [75.23, 77.52], [78.19, 79.04], [79.71, 80.48], [80.7, 82.17], [82.39, 85.19], [85.41, 86.66], [87.33, 87.97], [88.19, 89.56], [90.23, 94.62], [94.84, 98.47], [99.14, 100.06], [100.73, 105.14], [105.36, 108.44], [109.11, 110.3], [110.52, 111.46], [112.13, 114.48], [114.7, 116.08], [116.3, 117.39], [118.06, 119.43], [120.1, 120.76], [120.98, 123.32]], "R": [["A coworker points out an error.", "Coworker", "I think there's a small mistake in the report.", "Oh, thanks for telling me. I'll make sure to fix it today."], ["Your coworker asks about your progress.", "Coworker", "How's the research going?", "I'm making progress. I'll do the last part tomorrow."]]}, {"num": 11, "title": "Make or Do? At Home", "lines": [["P", "Okay, everyone. I made a list. First, who's going to make breakfast?", "Sophie"], ["S", "I'll make breakfast. Pancakes.", "Dad"], ["P", "Yes!", "Lucas"], ["P", "Next, who's going to do the dishes after breakfast? Dad made breakfast, so he doesn't have to do the dishes. Lucas, you do the dishes.", "Sophie"], ["P", "Why me?", "Lucas"], ["P", "Because you didn't do them last week.", "Sophie"], ["P", "Fine.", "Lucas"], ["P", "Next, Mom, can you do the laundry?", "Sophie"], ["S", "I can. But everyone has to make their own bed first.", "Mom"], ["P", "Do I have to make my bed on Saturdays?", "Lucas"], ["S", "Yes. Every day.", "Mom"], ["P", "Okay. We need to do the shopping. Who's going to make the shopping list?", "Sophie"], ["S", "I'll make the list, and I'll do the shopping this afternoon.", "Dad"], ["P", "Lucas, you made a mess! There's water all over the floor!", "Sophie"], ["P", "At least I did them!", "Lucas"], ["S", "Sophie, what are you doing?", "Mom"], ["P", "My homework. It's a science project. I'm making a model of a volcano.", "Sophie"], ["S", "It's making a mess too.", "Mom"], ["S", "I'm back. I did some exercise at the community centre. Sophie, you're doing your hair. Where are you going?", "Mom"], ["P", "To Megan's birthday party. I made a card for her.", "Sophie"], ["S", "That's nice. You've made a lot of friends here.", "Mom"], ["P", "I have. And nobody makes fun of my accent anymore.", "Sophie"], ["P", "Mom, Dad's making dinner, and you're doing nothing.", "Lucas"], ["S", "That's right. I did the laundry this morning. Now it's my turn to relax.", "Mom"], ["P", "Can I do nothing next Saturday?", "Lucas"], ["S", "You can, after you make your bed and do the dishes.", "Mom"]], "words": 233, "kind": "story", "scene": "Every Saturday morning, this family has a meeting to divide the chores. The kids like to practise their English, so the meeting is in English.", "F": "make vs. do in everyday life, have to, doesn't, did/didn't, can", "V": "make the bed, make breakfast, make dinner, make a mess, make noise, make friends, make a list, make fun of; do the dishes, do the laundry, do homework, do the shopping, do exercise, do your hair, do nothing", "t": [[2.0, 3.02], [3.24, 4.14], [4.36, 6.13], [6.8, 8.17], [8.39, 9.37], [10.04, 10.61], [11.28, 1 ], ["P", "Linda, I started my cover letter last night. Could you look at it?", "Paula"], ["P", "Sure. Hmm. Don't write \"To whom it may concern.\" You know who it's for. Write \"Dear Greg.\"", "Linda"], ["P", "When should I use \"whom\"?", "Paula"], ["P", "In very formal writing. In conversation, most people just say \"who.\" \"Who did you work with?\" is normal. \"With whom did you work?\" sounds very formal.", "Linda"], ["P", "That's helpful. What about the rest?", "Paula"], ["P", "This is good, but you shouldn't say, \"I think I could maybe be a good leader.\" It sounds like you aren't sure. Say, \"I am confident I can lead this team.\"", "Linda"], ["P", "In Brazil, that would sound arrogant.", "Paula"], ["P", "Here, it sounds confident. That's what Greg wants to see.", "Linda"], ["S", "Paula, I got your application. I'm glad you applied. Can we meet on Tuesday at ten?", "Greg"], ["P", "Of course.", "Paula"], ["P", "Good advice?", "Linda"], ["P", "Great advice. Thank you for advising me.", "Paula"]], "words": 292, "kind": "story", "scene": "On Monday, Greg announced that the company is looking for a new team lead. Paula wants to apply, but she isn't sure she's ready. On Tuesday, she looks for Linda.", "F": "at/in, advice/advise (the /s/ and /z/ sounds), affect/effect, who/whom, what/that, would/wouldn't, could/couldn't, should/shouldn't, -ed", "V": "position, apply, application, cover letter, \"To whom it may concern,\" confident, \"If I were you...\"", "t": [[2.0, 3.96], [4.63, 7.06], [7.28, 9.46], [10.13, 12.9], [13.57, 14.47], [14.69, 15.52], [16.19, 19.24], [19.91, 20.81], [21.03, 22.5], [22.72, 23.85], [24.52, 27.23], [27.9, 29.1], [29.32, 33.05], [33.72, 35.11], [35.33, 36.52], [37.19, 39.9], [40.57, 41.93], [42.15, 42.9], [43.12, 44.7], [45.37, 46.16], [46.38, 48.04], [48.26, 49.67], [50.34, 51.49], [52.16, 53.19], [53.41, 55.01], [55.68, 58.22], [58.44, 59.5], [60.17, 60.83], [61.05, 61.65], [61.87, 63.73], [63.95, 65.16], [65.38, 66.49], [67.16, 68.61], [69.28, 70.69], [70.91, 73.41], [73.63, 74.84], [75.06, 75.92], [76.14, 77.42], [77.64, 78.9], [79.57, 80.5], [80.72, 81.79], [82.46, 86.28], [86.5, 88.04], [88.26, 90.75], [91.42, 93.34], [94.01, 95.65], [95.87, 97.47], [98.14, 100.04], [100.26, 101.84], [102.06, 104.15], [104.82, 105.61], [106.28, 107.24], [107.91, 108.85], [109.07, 110.56]], "R": [["A coworker tells you about a new job opening.", "Coworker", "Are you going to apply for the team lead position?", "I'm thinking about it. Could you give me some advice about my cover letter?"], ["Your coworker gives you advice.", "Coworker", "If I were you, I'd talk to the manager first.", "That's a good idea. I'll ask her if she has a few minutes this week."]]}, {"num": 13, "title": "The Plan", "lines": [["P", "So, Marcos, tell me about yourself. How old are you?", "Sarah"], ["S", "I'm forty-two years old. I'm currently living in Burnaby with my wife and our two kids.", "Marcos"], ["P", "Are you from Vancouver?", "Sarah"], ["S", "Actually, I'm from São Paulo, but I've lived here since 2023. In Brazil, I was an accountant for fifteen years.", "Marcos"], ["P", "And now?", "Sarah"], ["S", "Now I work at a warehouse, but I intend to work as an accountant again. That's why I'm taking this course. I attend classes on Tuesday and Thursday nights. I'm tired, but I'm learning a lot.", "Marcos"], ["P", "I saw you talking to Mrs. Thompson last week.", "Sarah"], ["S", "Yes, I attended a meeting with her because I had a question about my essay. She said my ideas were good, but I should add more examples, and my summary at the end was too long.", "Marcos"], ["P", "That's good advice.", "Sarah"], ["S", "Then I made a mistake. I asked her, \"Can I make my résumé shorter?\"", "Marcos"], ["P", "Your résumé? You mean your summary!", "Sarah"], ["S", "That's what she said. A résumé is the document you use to apply for a job. In Portuguese, \"resumo\" means summary. I'm sensitive to criticism, so I felt a little embarrassed.", "Marcos"], ["P", "Don't worry. Everyone makes mistakes like that.", "Sarah"], ["S", "That's what she said too. Then I told her, \"I have a doubt about the next assignment.\"", "Marcos"], ["P", "You mean you have a question.", "Sarah"], ["S", "Exactly. She was very kind about it. After the meeting, I went to the library to study, and then to a bookstore on Kingsway to buy a new dictionary.", "Marcos"], ["P", "So, what's your plan now?", "Sarah"], ["S", "On the bus home, I made a decision. Next time, I'll ask for help earlier. I won't wait until the last week.", "Marcos"], ["P", "Do you think you'll go back to Brazil one day?", "Sarah"], ["S", "I'm not sure. My relatives always ask, \"When are you coming back?\" My aunts, my uncles, my cousins, everyone. And my parents want me to come home. I miss them a lot.", "Marcos"], ["P", "But?", "Sarah"], ["S", "But my kids are happy here. They speak English better than I do! Last month, I finally realized something. This is our home now. And when I pass my exams, I'll achieve my dream of working as an accountant in Canada.", "Marcos"], ["P", "So you're staying.", "Sarah"], ["S", "I intend to stay.", "Marcos"]], "words": 364, "kind": "story", "scene": "Marcos and his classmate Sarah are having coffee before their Canadian accounting class at a community college.", "F": "Portuguese translation traps: I'm 42 years old (not \"I have\"), currently/actually (atualmente), take a course, attend (not \"assist\"), summary/résumé (resumo), library/bookstore (livraria), make a decision, I'm not sure (not \"I have doubt\"), sensitive (not \"sensible\"), relatives/parents (parentes/pais), realize/achieve (realizar), intend (not \"pretend\")", "V": "", "t": [[2.0, 4.11], [4.33, 5.36], [6.03, 7.41], [7.63, 11.02], [11.69, 12.91], [13.58, 18.27], [18.49, 21.2], [21.87, 22.64], [23.31, 27.19], [27.41, 29.06], [29.28, 31.92], [32.14, 33.93], [34.6, 37.04], [37.71, 41.95], [42.17, 48.12], [48.79, 49.88], [50.55, 51.75], [51.97, 54.5], [55.17, 56.07], [56.29, 57.42], [58.09, 59.12], [59.34, 62.81], [63.03, 65.32], [65.54, 69.03], [69.7, 70.51], [70.73, 72.65], [73.32, 74.67], [74.89, 78.02], [78.69, 80.04], [80.71, 81.52], [81.74, 83.21], [83.43, 89.98], [90.65, 92.02], [92.69, 94.44], [94.66, 96.53], [96.75, 98.5], [99.17, 101.33], [102.0, 102.89], [103.11, 106.08], [106.3, 108.75], [108.97, 110.93], [111.15, 112.22], [112.89, 113.49], [114.16, 115.69], [115.91, 117.64], [117.86, 120.1], [120.32, 121.54], [121.76, 127.07], [127.74, 128.7], [129.37, 130.44]], "R": [["A classmate asks about your plans.", "Classmate", "So, what's your plan after this course?", "I want to get my accounting certificate and find a job in Vancouver."], ["Your classmate suggests studying together.", "Classmate", "Do you want to study together before the exam?", "Sure! How about Thursday after class, in the library?"]]}]}, {"part": 2, "title": "Immigration and Settling In", "desc": "From Express Entry to citizenship, and the paperwork of the first year.", "scripts": [{"num": 14, "title": "Express Entry: From Profile to Invitation", "lines": [["P", "Karen, we don't understand anything about the system. Where do we start?", "Luana"], ["S", "Most skilled workers apply through Express Entry. First, you create an online profile. Then you go into a pool with thousands of other people.", "Karen"], ["P", "A pool?", "Luana"], ["S", "It's like a big list. Everyone in the pool gets a score. It's called the CRS score, the Comprehensive Ranking System. The maximum is twelve hundred points.", "Karen"], ["P", "How do we get points?", "Diego"], ["S", "Age, education, language, and work experience. Younger people get more points. And language is very important. You'll need to take an English test, like CELPIP or IELTS.", "Karen"], ["P", "What about my university degree from Brazil?", "Luana"], ["S", "You'll need an Educational Credential Assessment, an ECA. An organization checks your degree and says what it's equal to in Canada.", "Karen"], ["P", "And my work experience?", "Diego"], ["S", "You'll need to find your NOC code. It's the Canadian code for your job. For example, a civil engineer has a specific code.", "Karen"], ["P", "Karen, we did the English test. My score was good, but Luana's was higher.", "Diego"], ["S", "Then Luana should be the main applicant. Her score gives you more points. What's your CRS score?", "Karen"], ["P", "Four hundred and sixty-eight. Is that enough?", "Luana"], ["S", "It depends. Every few weeks, the government has a draw. They invite the people with the highest scores. Sometimes the cut-off is lower, sometimes it's higher.", "Karen"], ["P", "What happens if we don't get invited?", "Luana"], ["S", "You can improve your score. Retake the language test, or learn some French. Or try a provincial program, like the BC PNP. Some of their programs need a job offer. If BC nominates you, you get six hundred extra points.", "Karen"], ["P", "Six hundred? That's huge.", "Diego"], ["S", "It is. That almost guarantees an invitation.", "Karen"], ["P", "Karen, it's me again. We checked the draws every week for three months, and our score wasn't high enough. But I found a job offer from a company in Surrey, and I applied to the BC PNP. Five months later, I was nominated!", "Luana"], ["S", "That's fantastic! Now watch your email.", "Karen"], ["P", "Diego! Diego, come here! It says, \"Invitation to Apply\"!", "Luana"], ["P", "What does that mean?", "Diego"], ["P", "It means we're going to Canada.", "Luana"]], "words": 342, "kind": "story", "scene": "Luana and her husband, Diego, want to immigrate to Canada from Brazil. Their friend Karen, in Vancouver, explains the system on a video call.", "F": "immigration numbers (scores, points, days, years), didn't, does, have to, will, can", "V": "Express Entry, profile, pool, Comprehensive Ranking System (CRS), points, draw, Invitation to Apply (ITA), language test (CELPIP/IELTS), Educational Credential Assessment (ECA), work experience, NOC code, Provincial Nominee Program (BC PNP), job offer", "t": [[2.0, 4.79], [5.01, 6.02], [6.69, 9.42], [9.64, 11.75], [11.97, 15.0], [15.67, 16.35], [17.02, 18.32], [18.54, 20.34], [20.56, 24.08], [24.3, 26.39], [27.06, 28.17], [28.84, 31.99], [32.21, 33.88], [34.1, 36.08], [36.3, 39.48], [40.15, 42.54], [43.21, 46.47], [46.69, 50.87], [51.54, 52.82], [53.49, 55.33], [55.55, 57.55], [57.77, 60.82], [61.49, 62.99], [63.21, 65.38], [66.05, 68.06], [68.28, 69.94], [70.16, 71.64], [72.31, 73.8], [74.02, 74.85], [75.52, 76.5], [76.72, 79.03], [79.25, 81.53], [81.75, 84.74], [85.41, 87.62], [88.29, 89.7], [89.92, 92.48], [92.7, 96.12], [96.34, 98.62], [98.84, 102.4], [103.07, 103.92], [104.14, 104.95], [105.62, 106.46], [106.68, 108.77], [109.44, 110.87], [111.09, 115.4], [115.62, 120.97], [121.19, 123.43], [124.1, 125.32], [125.54, 126.86], [127.53, 128.28], [128.5, 129.71], [129.93, 132.13], [132.8, 133.76], [134.43, 136.2]], "R": [["A friend asks about moving to Canada.", "Friend", "How does Express Entry work?", "You create a profile, get points, and wait for a draw. If your score is high enough, you get an Invitation to Apply."], ["Someone asks about your language test.", "Friend", "Have you taken your language test yet?", "Not yet. I'm taking CELPIP next month. I'm studying every day."]]}, {"num": 15, "title": "After the Invitation: Documents, Biometrics, and Medical Exams", "lines": [["P", "Congratulations! But now the real work begins. You have sixty days to submit your full application. Don't wait until the last week.", "Karen"], ["S", "We made a list. Passports, birth certificates, our marriage certificate, my ECA, our language test results, reference letters from our employers, and police certificates.", "Luana"], ["P", "Police certificates? From where?", "Diego"], ["P", "From every country you lived in for six months or more since you were eighteen. For you, Diego, that's Brazil and Portugal.", "Karen"], ["P", "Portugal? That was ten years ago.", "Diego"], ["P", "It doesn't matter. You lived there for a year, so you need one. You also need proof of funds. Bank letters that show you have enough money to support your family in Canada.", "Karen"], ["S", "Karen, we submitted everything on day fifty-two. The certificate from Portugal took three weeks! Two days later, we got an email. It said, \"Acknowledgement of Receipt.\"", "Luana"], ["P", "That means they received it. Now you wait.", "Karen"], ["P", "Now we have a biometrics letter. We have to give our fingerprints and a photo. The letter says we have thirty days.", "Diego"], ["P", "You can book an appointment at a visa application centre in São Paulo. It takes about fifteen minutes each. Your son has to do it too, because he's over fourteen.", "Karen"], ["S", "And the medical exams? Can we go to our own doctor?", "Luana"], ["P", "No, you can't. You have to see a panel physician, a doctor approved by the Canadian government.", "Karen"], ["S", "We did the exams yesterday. They checked our blood pressure, our hearing and our eyes, and did a chest X-ray and a blood test. The nurse said the results go directly to Canada. We won't see them.", "Luana"], ["P", "That's normal.", "Karen"], ["S", "Karen, the processing time says six months. It's been four months, and nothing has changed. Is something wrong?", "Luana"], ["P", "Probably not. They're doing background checks. It takes time.", "Karen"], ["S", "Diego? There's a new message in our account. It says, \"Confirmation of Permanent Residence.\" I read it three times.", "Luana"], ["P", "Did we get it?", "Diego"], ["S", "We did. We're permanent residents. Well, almost. First, we have to land.", "Luana"]], "words": 326, "kind": "story", "scene": "Luana and Diego got their Invitation to Apply. Karen helps them with the next steps.", "F": "deadlines and dates, lists of documents, have to, did, doesn't, won't, -ed", "V": "Invitation to Apply (ITA), deadline, submit, police certificate, proof of funds, biometrics (fingerprints and photo), medical exam, panel physician, acknowledgement of receipt (AOR), processing time, background check, Confirmation of Permanent Residence (COPR), permanent resident visa", "t": [[2.0, 3.22], [3.44, 5.29], [5.51, 8.58], [8.8, 10.47], [11.14, 12.06], [12.28, 21.49], [22.16, 23.29], [23.51, 24.19], [24.86, 28.81], [29.03, 31.78], [32.45, 33.2], [33.42, 34.59], [35.26, 36.29], [36.51, 38.73], [38.95, 40.61], [40.83, 44.67], [45.34, 48.33], [48.55, 51.0], [51.22, 53.2], [53.42, 55.56], [56.23, 57.66], [57.88, 58.88], [59.55, 61.28], [61.5, 63.74], [63.96, 65.64], [66.31, 70.6], [70.82, 72.7], [72.92, 75.93], [76.6, 77.85], [78.07, 79.59], [80.26, 81.24], [81.46, 86.03], [86.7, 88.23], [88.45, 94.06], [94.28, 97.1], [97.32, 98.3], [98.97, 99.89], [100.56, 103.2], [103.42, 105.81], [106.03, 107.1], [107.77, 108.84], [109.06, 110.63], [110.85, 111.92], [112.59, 113.32], [113.54, 115.46], [115.68, 118.53], [118.75, 120.08], [120.75, 121.56], [122.23, 122.91], [123.13, 124.47], [124.69, 125.72], [125.94, 127.33]], "R": [["A friend asks about your immigration application.", "Friend", "What documents do you still need?", "We still need our police certificates and proof of funds. Then we can submit."], ["You have an appointment for biometrics.", "Officer", "Are you here for biometrics?", "Yes, I have an appointment at ten. Here's my letter."]]}, {"num": 16, "title": "Landing in Canada", "lines": [["P", "Good morning. Can I see your passports and your Confirmation of Permanent Residence documents?", "Officer"], ["S", "Good morning. Here they are.", "Luana"], ["P", "Thank you. Is this your first time in Canada?", "Officer"], ["S", "No, we visited Vancouver two years ago, as tourists.", "Luana"], ["P", "And where will you live?", "Officer"], ["S", "In Surrey. I have a job there. We're staying with a friend for the first month.", "Luana"], ["P", "What's your friend's address?", "Officer"], ["S", "It's on this paper.", "Luana"], ["P", "Thank you. Your PR cards will be mailed to that address. They usually take a few weeks. Make sure your friend knows to watch for them.", "Officer"], ["S", "Okay.", "Luana"], ["P", "Are you bringing more than ten thousand dollars in cash with you?", "Officer"], ["S", "No. We have about two thousand in cash. The rest is in our bank account.", "Luana"], ["P", "Do you have goods to follow? Things you're shipping from Brazil that will arrive later?", "Officer"], ["S", "Yes. We're shipping twelve boxes. They'll arrive in September.", "Luana"], ["P", "Then you need to list them on this form now. Write down everything that's coming. When the boxes arrive, you won't pay duty on them, as long as they're on this list.", "Officer"], ["S", "Okay. Clothes, books, kitchen things, my husband's tools, and the kids' toys. Is that enough detail?", "Luana"], ["P", "That's fine. Keep this copy. You'll need it when your boxes arrive. Now, please sign your documents here, both of you.", "Officer"], ["P", "Congratulations. You're now permanent residents of Canada. Welcome to Canada.", "Officer"], ["S", "Thank you so much.", "Luana"], ["P", "Mom, that's it? We're Canadian now?", "Son"], ["S", "Not Canadian citizens yet. Permanent residents. Citizenship comes later.", "Luana"], ["S", "Welcome home!", "Karen"], ["S", "Karen! You made a sign!", "Luana"]], "words": 249, "kind": "story", "scene": "July 15th, six in the morning, Vancouver International Airport. After forty minutes in the line for new permanent residents, a CBSA officer calls Luana's family.", "F": "questions from an immigration officer, do, is, will/won't, dates, dollar amounts", "V": "port of entry, landing, Canada Border Services Agency (CBSA) officer, Confirmation of Permanent Residence (COPR), permanent resident visa, declare, goods to follow, mailing address, PR card, \"Welcome to Canada\"", "t": [[2.0, 2.83], [3.05, 7.43], [8.1, 8.95], [9.17, 10.0], [10.67, 11.46], [11.68, 13.54], [14.21, 17.51], [18.18, 19.23], [19.9, 20.56], [20.78, 21.89], [22.11, 24.24], [24.91, 26.21], [26.88, 27.99], [28.66, 29.45], [29.67, 32.3], [32.52, 34.14], [34.36, 36.34], [37.01, 37.61], [38.28, 41.2], [41.87, 42.38], [42.6, 44.37], [44.59, 46.45], [47.12, 48.53], [48.75, 51.59], [52.26, 52.79], [53.01, 54.54], [54.76, 56.15], [56.82, 58.76], [58.98, 60.8], [61.02, 65.39], [66.06, 66.66], [66.88, 70.93], [71.15, 72.45], [73.12, 73.97], [74.19, 75.3], [75.52, 77.42], [77.64, 80.29], [80.96, 82.2], [82.42, 84.53], [84.75, 85.94], [86.61, 87.61], [88.28, 89.24], [89.46, 90.68], [91.35, 92.97], [93.19, 94.39], [94.61, 96.01], [96.68, 97.69], [98.36, 99.04], [99.26, 100.11]], "R": [["A border officer speaks to you at the airport.", "Officer", "Do you have anything to declare?", "No, nothing to declare. We have some clothes and personal things."], ["The officer asks about your belongings.", "Officer", "Do you have goods to follow?", "Yes, we're shipping some boxes from Brazil next month. Here's the list."]]}, {"num": 17, "title": "First Week in Vancouver", "lines": [["P", "Sorry I'm late. I was at the phone store on Broadway until eleven.", "Bruno"], ["S", "That's okay. I bought a coffee for you and a sandwich for me. Did you get a phone plan?", "Carla"], ["P", "I did. It's forty dollars a month. I got one for you too.", "Bruno"], ["S", "Thank you! Did you get the internet for the apartment too?", "Carla"], ["P", "Not yet. They can't install it until next Tuesday. How was the bank?", "Bruno"], ["S", "Good. I went at nine o'clock in the morning, and I stayed until ten thirty. The woman at the desk, Helen, was very friendly. She asked how long I've been in Canada.", "Carla"], ["P", "What did you say?", "Bruno"], ["S", "I said, \"For three weeks. I arrived on January 5th.\" Then she asked for a letter from my employer. I didn't have it.", "Carla"], ["P", "Oh no.", "Bruno"], ["S", "It's fine. She said I can bring it by Friday. They're open until five. She also asked if I want a credit card too.", "Carla"], ["P", "Do you?", "Bruno"], ["S", "Not today. Maybe next month.", "Carla"], ["P", "It's so cold today. It was minus five this morning. In Recife, it's thirty degrees right now.", "Bruno"], ["S", "You've complained about the weather since the day you arrived.", "Carla"], ["P", "That's because it's been cold since the day I arrived. I came in December, remember? I've been here for two months.", "Bruno"], ["S", "Wait until February. It rains every day too.", "Carla"], ["P", "Then I'm going back to Brazil for February.", "Bruno"]], "words": 225, "kind": "story", "scene": "Carla is from Recife. She arrived in Vancouver three weeks ago. After a morning at the bank, she meets her husband, Bruno, at a café on Main Street.", "F": "to/for, to/too, for/since, in/on/at, by/until, from/since", "V": "", "t": [[2.0, 2.96], [3.18, 6.02], [6.69, 7.6], [7.82, 10.41], [10.63, 11.97], [12.64, 13.26], [13.48, 14.82], [15.04, 16.3], [16.97, 17.72], [17.94, 20.43], [21.1, 21.83], [22.05, 24.12], [24.34, 25.28], [25.95, 26.48], [26.7, 30.8], [31.02, 33.62], [33.84, 35.87], [36.54, 37.41], [38.08, 39.51], [39.73, 41.52], [41.74, 44.0], [44.22, 45.18], [45.85, 46.51], [47.18, 47.95], [48.17, 50.11], [50.33, 51.89], [52.11, 54.82], [55.49, 56.17], [56.84, 57.74], [57.96, 59.11], [59.78, 60.98], [61.2, 62.73], [62.95, 65.32], [65.99, 69.13], [69.8, 72.4], [72.62, 74.11], [74.33, 75.72], [76.39, 77.78], [78.0, 79.51], [80.18, 82.55]], "R": [["A friend asks about your first week in Vancouver.", "Friend", "So, how's your first week going?", "It's good, but tiring. I opened a bank account today. Tomorrow, I'm getting my SIN."], ["Someone asks what you think of the city.", "Friend", "Do you like Vancouver so far?", "Yes, I love the mountains. But the rain is taking some time to get used to!"]]}, {"num": 18, "title": "Getting a Social Insurance Number", "lines": [["P", "Good morning. Is this your first SIN?", "Officer"], ["S", "Yes, it is. What does SIN mean, exactly?", "Marcelo"], ["P", "Social Insurance Number. You need it to work in Canada, to get paid, and to file your taxes. Can I see your permanent resident card and your passport?", "Officer"], ["S", "Here you go.", "Marcelo"], ["P", "Thank you. What's your mother's maiden name?", "Officer"], ["S", "Maiden name?", "Marcelo"], ["P", "Her last name before she was married.", "Officer"], ["S", "Oh, okay. Silva.", "Marcelo"], ["P", "And your father's full name?", "Officer"], ["S", "Roberto Almeida.", "Marcelo"], ["P", "Thank you. Here's your Social Insurance Number. It's nine digits long. Please keep this letter in a safe place at home.", "Officer"], ["S", "Should I carry it in my wallet?", "Marcelo"], ["P", "No, you shouldn't. Your SIN is confidential. Only give it to your employer, your bank, and the government. If someone else asks for it, like a store or a landlord, you don't have to give it to them.", "Officer"], ["S", "Does it cost anything?", "Marcelo"], ["P", "It doesn't. It's free. Next, ma'am?", "Officer"], ["P", "I'm on a work permit. My PR application is still processing.", "Ana"], ["P", "Then your SIN is a little different. It starts with a nine. That's for people who are in Canada temporarily. It has an expiry date, the same date as your work permit. When you renew your permit, you'll need to update your SIN too.", "Officer"], ["P", "Okay. Thank you.", "Ana"], ["P", "One more piece of advice. Every year, you need to file your taxes by April 30th. Even if you didn't work much, you should still file. You might get benefits, like the Canada child benefit if you have kids.", "Officer"], ["S", "We have two kids.", "Marcelo"], ["P", "Then definitely file. It can make a big difference.", "Officer"], ["P", "Nine digits. I'll never remember it.", "Ana"], ["S", "You don't have to remember it. You just have to keep it safe.", "Marcelo"]], "words": 277, "kind": "story", "scene": "Marcelo's friend told him, \"Before you do anything else, get your SIN.\" On Tuesday, he and his wife, Ana, go to a Service Canada office. After thirty-five minutes, their number, B twenty-seven, appears on the screen.", "F": "government office language, nine-digit numbers, dates, does/doesn't, do/don't, didn't, is, should/shouldn't", "V": "Service Canada, Social Insurance Number (SIN), permanent resident card, work permit, take a number, application, maiden name, confidential, expiry date, Canada Revenue Agency (CRA), file your taxes, benefits", "t": [[2.0, 2.9], [3.12, 4.69], [5.36, 6.3], [6.52, 8.19], [8.86, 10.39], [10.61, 14.52], [14.74, 17.75], [18.42, 19.23], [19.9, 20.69], [20.91, 22.42], [23.09, 23.96], [24.63, 26.6], [27.27, 28.08], [28.3, 28.92], [29.59, 31.08], [31.75, 32.82], [33.49, 34.28], [34.5, 36.39], [36.61, 37.98], [38.2, 40.72], [41.39, 42.84], [43.51, 44.55], [44.77, 46.61], [46.83, 49.86], [50.08, 54.6], [55.27, 56.4], [57.07, 57.9], [58.12, 58.98], [59.2, 60.11], [60.78, 62.0], [62.22, 64.84], [65.51, 67.65], [67.87, 69.13], [69.35, 71.86], [72.08, 75.45], [75.67, 79.09], [79.76, 80.46], [80.68, 81.43], [82.1, 83.55], [83.77, 87.14], [87.36, 89.94], [90.16, 94.19], [94.86, 95.91], [96.58, 97.96], [98.18, 99.68], [100.35, 101.33], [101.55, 102.89], [103.56, 104.91], [105.13, 106.66]], "R": [["You're at Service Canada.", "Officer", "How can I help you today?", "Hi, I'd like to apply for a Social Insurance Number. Here's my PR card."], ["The officer asks about your name.", "Officer", "Is your maiden name different?", "Yes, it is. My maiden name is Costa."]]}, {"num": 19, "title": "Apartment Hunting", "lines": [["P", "Okay, let's compare the three apartments. The first one was on Main Street, near 16th Avenue.", "Lisa"], ["S", "Right. Two thousand one hundred and fifty dollars. That's the cheapest.", "Brian"], ["P", "But it's on the fourth floor, and the building doesn't have an elevator. And does the rent include hydro?", "Lisa"], ["S", "No, it doesn't. The landlord said hydro is about sixty dollars a month. And internet is extra too.", "Brian"], ["P", "The second one was on Cambie Street, near 41st Avenue. I loved it. It's bigger and brighter, and it's close to the Canada Line.", "Lisa"], ["S", "But it's two thousand nine hundred. That's too much for us. And the price isn't negotiable.", "Brian"], ["P", "And the third one is on Fraser Street, near 30th Avenue. On the phone, I wasn't sure if the manager said thirteenth or thirtieth.", "Lisa"], ["S", "Thirtieth. Three-zero. Two thousand four hundred and forty dollars.", "Brian"], ["P", "It has a small balcony, and the bus stop is right outside.", "Lisa"], ["S", "And it does have laundry. There's a washer and dryer in the unit.", "Brian"], ["P", "It's available on the first of March. The deposit is half a month's rent. That's twelve hundred and twenty dollars.", "Lisa"], ["S", "So, should we take it?", "Brian"], ["P", "Let's read the lease first. The manager, Helen, said she'll call tonight.", "Lisa"], ["P", "Hi, it's Helen from the Fraser Street apartment. Is this six oh four, five five five, one eight seven zero?", "Helen"], ["P", "Yes, it is.", "Lisa"], ["P", "Did you read the lease? Did you decide?", "Helen"], ["P", "We did. We'll take it.", "Lisa"], ["P", "Wonderful. Can you sign on February 14th?", "Helen"], ["P", "Valentine's Day? Perfect. Brian, this is the best gift you've ever given me.", "Lisa"], ["S", "I didn't give it to you. We're paying for it together.", "Brian"]], "words": 266, "kind": "story", "scene": "Lisa and Brian want a two-bedroom apartment near a SkyTrain station. Their budget is $2,500 a month. They've seen three apartments today.", "F": "13/30, 14/40, 16/60, rent and prices, phone numbers, dates, does/doesn't, \"hydro\"", "V": "", "t": [[2.0, 4.3], [4.52, 7.57], [8.24, 8.97], [9.19, 12.05], [12.27, 13.57], [14.24, 17.7], [17.92, 19.64], [20.31, 21.53], [21.75, 25.4], [25.62, 27.67], [28.34, 31.79], [32.01, 32.8], [33.02, 36.24], [36.91, 38.94], [39.16, 40.67], [40.89, 42.94], [43.61, 46.92], [47.14, 51.15], [51.82, 52.72], [52.94, 54.22], [54.44, 57.38], [58.05, 61.51], [62.18, 63.71], [63.93, 66.34], [67.01, 69.06], [69.28, 71.22], [71.4
