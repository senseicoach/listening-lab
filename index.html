[55.19, 57.39], [57.61, 58.84], [59.06, 62.37], [62.59, 66.69], [67.36, 68.83], [69.5, 70.42], [70.64, 72.28], [72.95, 74.31], [74.98, 76.31], [76.53, 79.11], [79.33, 82.89], [83.11, 85.01], [85.23, 87.04], [87.71, 88.37], [88.59, 89.96], [90.63, 92.12], [92.34, 94.99], [95.21, 97.66], [97.88, 101.08], [101.3, 103.07], [103.74, 104.7], [105.37, 107.93], [108.15, 111.03], [111.7, 113.88], [114.1, 114.99]], "R": [["It's your turn to give an update in a team meeting.", "Manager", "Paula, what's your update?", "The client report is on track. I'll have the first draft by Thursday."], ["You didn't hear something in the meeting.", "Manager", "We need it by the twelfth.", "Sorry, I didn't catch that. Did you say the twelfth?"]]}, {"num": 85, "title": "Calling in Sick", "lines": [["P", "Hi Greg, it's Paula. I'm sorry, but I'm sick today. I have a fever and a sore throat, so I won't be in. I'll check my email this afternoon if I can. I think Linda can cover the client call at ten. I sent her the notes yesterday. I'll let you know tomorrow morning how I'm feeling. Thanks.", "Paula"], ["P", "Linda, it's Paula. I'm sick today. Can you cover the Pacific Foods call at ten? The notes are in the shared folder.", "Paula"], ["S", "No problem! Feel better. Drink lots of tea.", "Linda"], ["P", "Hey, I got your message. How are you feeling?", "Greg"], ["P", "Not great.", "Paula"], ["P", "Don't worry about work. Just rest. Linda's got the call.", "Greg"], ["P", "Thanks. Do I need a doctor's note?", "Paula"], ["P", "No. In BC, employers can't ask for a doctor's note for short absences like this.", "Greg"], ["P", "Does this count as a sick day?", "Paula"], ["P", "Yes. After three months, you get five paid sick days a year. You aren't there yet, but don't worry. We'll pay you for today.", "Greg"], ["P", "Good morning, Greg. I'm feeling better, but I still have a cough. Would it be okay if I worked from home today? I don't want to make anyone else sick.", "Paula"], ["P", "Of course. Thanks for thinking of the team.", "Greg"], ["S", "Welcome back! The call went fine. The client asked about you.", "Linda"], ["P", "Thanks for covering for me.", "Paula"], ["S", "Anytime.", "Linda"], ["P", "Linda, look. I submitted a vacation request for the last two weeks of December, to visit my family in Brazil. It's already approved!", "Paula"], ["S", "Being sick wasn't fun, but at least your week ended well.", "Linda"]], "words": 251, "kind": "story", "scene": "On Tuesday morning at seven fifteen, Paula wakes up with a fever and a terrible sore throat. She calls her manager, Greg, but he doesn't answer.", "F": "leaving a voicemail, days and dates, didn't, can, will/won't, should", "V": "call in sick, voicemail, sick day, paid sick days, doctor's note, cover (for someone), vacation request, work from home, feel better", "t": [[2.0, 3.28], [3.5, 5.29], [5.51, 8.39], [8.61, 11.28], [11.5, 14.27], [14.49, 16.24], [16.46, 19.17], [19.39, 19.99], [20.66, 21.77], [21.99, 23.08], [23.3, 25.79], [26.01, 27.78], [28.45, 29.43], [29.65, 30.63], [30.85, 32.11], [32.78, 34.43], [34.65, 36.05], [36.72, 37.56], [38.23, 39.85], [40.07, 41.11], [41.33, 42.85], [43.52, 44.11], [44.33, 45.91], [46.58, 47.27], [47.49, 52.82], [53.49, 55.17], [55.84, 56.55], [56.77, 60.33], [60.55, 62.68], [62.9, 64.57], [65.24, 66.35], [66.57, 68.91], [69.13, 71.57], [71.79, 73.77], [74.44, 75.44], [75.66, 77.43], [78.1, 79.09], [79.31, 80.44], [80.66, 82.17], [82.84, 84.31], [84.98, 85.84], [86.51, 87.38], [87.6, 93.92], [94.14, 95.35], [96.02, 99.11]], "R": [["You're sick and call your manager.", "Manager", "Hi, Paula. Is everything okay?", "Hi, Greg. I'm sick with a fever, so I need to call in sick today."], ["A coworker offers to help.", "Coworker", "Do you want me to cover your meeting?", "That would be great, thank you. The notes are in the shared folder."]]}, {"num": 86, "title": "Taking a Phone Message", "lines": [["P", "Good afternoon, Greg Walker's desk. How can I help you?", "Paula"], ["S", "Hi, this is Matthew Thornton from Pacific Foods. Is Greg available?", "Matthew"], ["P", "I'm sorry, he's in a meeting right now. Can I take a message?", "Paula"], ["S", "Sure. Please ask him to call me back today.", "Matthew"], ["P", "Of course. Could you spell your last name, please?", "Paula"], ["S", "T-H-O-R-N-T-O-N.", "Matthew"], ["P", "Thank you. And what's the best number to reach you?", "Paula"], ["S", "Six oh four, five five five, twenty-nine fifty. Extension twelve.", "Matthew"], ["P", "Let me read that back. Six oh four, five five five, two nine five zero, extension one two.", "Paula"], ["S", "That's right.", "Matthew"], ["P", "May I ask what it's about?", "Paula"], ["S", "It's about the contract. We need to change the delivery date from the 18th to the 22nd. It's urgent.", "Matthew"], ["P", "Does Greg have your email address?", "Paula"], ["S", "He does, but here it is, just in case. It's m underscore thornton at pacific dash foods dot c-a.", "Matthew"], ["P", "M underscore thornton, at pacific, dash, foods, dot c-a?", "Paula"], ["S", "Exactly.", "Matthew"], ["P", "Thank you, Mr. Thornton. I'll give Greg the message as soon as his meeting finishes.", "Paula"], ["P", "Did you take this message?", "Greg"], ["P", "I did. He said it was urgent.", "Paula"], ["P", "This is perfect. You got the number, the extension, and the reason. Most people just write \"Matt called.\"", "Greg"], ["P", "We can do the 22nd. That was a big order. Thanks for picking up my phone.", "Greg"], ["P", "No problem. But I was nervous. Phone calls are harder than talking in person. You can't see the person's face, and you can't see their mouth.", "Paula"], ["P", "That makes sense. But you did great. And asking him to spell his name was smart. Thornton is a hard one.", "Greg"]], "words": 261, "kind": "story", "scene": "On Wednesday afternoon, Greg's phone rings again and again at his desk, but Greg is in a meeting. Paula picks it up.", "F": "spelling names, phone numbers, email addresses (at, dot, underscore, dash), dates, can/can't, will, did", "V": "take a message, \"May I ask who's calling?\", \"Could you spell that?\", \"Let me read that back,\" extension, return a call, urgent", "t": [[2.0, 4.05], [4.27, 5.44], [6.11, 8.78], [9.0, 10.06], [10.73, 12.97], [13.19, 14.54], [15.21, 15.76], [15.98, 17.92], [18.59, 19.38], [19.6, 21.48], [22.15, 23.56], [24.23, 24.98], [25.2, 27.18], [27.85, 30.79], [31.01, 32.1], [32.77, 34.01], [34.23, 39.16], [39.83, 40.6], [41.27, 42.74], [43.41, 44.6], [44.82, 48.68], [48.9, 49.69], [50.36, 52.22], [52.89, 54.92], [55.14, 58.89], [59.56, 63.63], [64.3, 65.07], [65.74, 67.19], [67.41, 70.74], [71.41, 72.93], [73.6, 74.26], [74.48, 75.78], [76.45, 77.69], [77.91, 80.59], [80.81, 83.37], [84.04, 85.84], [86.06, 87.53], [87.75, 89.67], [90.34, 91.34], [91.56, 92.69], [92.91, 95.58], [95.8, 99.04], [99.71, 100.86], [101.08, 102.43], [102.65, 105.12], [105.34, 107.22]], "R": [["You answer a colleague's phone.", "Caller", "Hi, is Greg there?", "He's in a meeting right now. May I ask who's calling?"], ["You take a message.", "Caller", "It's Matthew Klein, 604-555-0142.", "Could you spell your last name? And let me read that back: 604-555-0142."]]}, {"num": 87, "title": "Scheduling a Meeting Across Time Zones", "lines": [["P", "Can you find a time that works for everyone?", "Greg"], ["S", "Sure. What time zones are they in?", "Paula"], ["P", "Toronto is Eastern time. That's three hours ahead of us. Halifax is Atlantic time. That's four hours ahead.", "Greg"], ["S", "Hi Sandra, I'm organizing a call with our team, your team, and the Halifax office. Are you available on Wednesday or Thursday afternoon?", "Paula"], ["P", "Wednesday afternoon I'm booked. Thursday, I'm free from one to four, Eastern time.", "Sandra"], ["S", "One to four in Toronto. That's ten to one in Vancouver. Thanks, Sandra.", "Paula"], ["S", "Hi Brian, would Thursday work for a one-hour call?", "Paula"], ["S", "Thursday's good. But I leave at four thirty, Atlantic time.", "Brian"], ["S", "Four thirty in Halifax is twelve thirty in Vancouver. So the call has to finish by twelve thirty our time.", "Paula"], ["S", "Greg, you have a meeting from ten to eleven on Thursday. How about eleven thirty to twelve thirty our time? That's two thirty in Toronto and three thirty in Halifax.", "Paula"], ["P", "Does that work for Halifax? Brian always leaves early.", "Greg"], ["S", "It does. It finishes at four thirty his time, right when he leaves.", "Paula"], ["P", "Nice work. Send the invite.", "Greg"], ["P", "So sorry! Something came up. Could we move the call to three o'clock Eastern?", "Sandra"], ["S", "Three o'clock in Toronto is twelve o'clock here. We'd finish at one, but Brian leaves at twelve thirty our time. Unfortunately, three o'clock Eastern doesn't work for Halifax. Could you do two forty-five Eastern for forty-five minutes instead?", "Paula"], ["P", "Perfect.", "Sandra"], ["P", "That was a tricky one. How did you do it?", "Greg"], ["S", "Look at my notebook. It's full of times and arrows. Lots of math!", "Paula"]], "words": 255, "kind": "story", "scene": "On Monday, Greg asks Paula to organize a one-hour video call with their partners in Toronto and Halifax this week.", "F": "time zones, times and days, can, does/doesn't, would/could", "V": "time zone, Pacific time, Eastern time, Atlantic time, calendar invite, available, \"Does that work for you?\", booked, \"Something came up,\" video call", "t": [[2.0, 4.79], [5.46, 6.06], [6.28, 7.88], [8.55, 10.51], [10.73, 12.68], [12.9, 15.03], [15.25, 16.91], [17.58, 23.04], [23.26, 26.49], [27.16, 28.82], [29.04, 31.79], [32.46, 34.0], [34.22, 35.99], [36.21, 37.21], [37.88, 40.85], [41.52, 42.46], [42.68, 45.04], [45.71, 49.0], [49.22, 52.29], [52.96, 56.2], [56.42, 59.32], [59.54, 63.11], [63.78, 65.63], [65.85, 67.82], [68.49, 69.17], [69.39, 72.65], [73.32, 74.41], [74.63, 75.89], [76.56, 77.43], [77.65, 78.78], [79.0, 81.2], [81.87, 84.65], [84.87, 88.45], [88.67, 92.64], [92.86, 96.93], [97.6, 98.37], [99.04, 100.49], [100.71, 102.05], [102.72, 103.88], [104.1, 105.63], [105.85, 106.75]], "R": [["You're scheduling a call with Toronto and Halifax.", "Colleague", "What time works for you?", "How about eleven Pacific? That's two in Toronto and three in Halifax. Does that work for you?"], ["Someone cancels.", "Colleague", "Sorry, something came up. Can we move it?", "No problem. How about Thursday at the same time?"]]}, {"num": 88, "title": "The Email Mistake", "lines": [["P", "Linda, I made a big mistake.", "Bianca"], ["S", "Okay. What happened?", "Linda"], ["P", "I finished the price quote for Coast Furniture, and I sent it to Coast Flooring by mistake. It has all our prices and discounts. It's confidential.", "Bianca"], ["S", "Okay. First, take a breath. When did you send it?", "Linda"], ["P", "About two minutes ago.", "Bianca"], ["S", "Did you try to recall it? Sometimes you can recall a message if the person didn't open it yet.", "Linda"], ["P", "I tried. It said, \"Recall failed.\"", "Bianca"], ["S", "Then you need to tell Greg right away. It's always better if he hears it from you first.", "Linda"], ["P", "Greg, do you have a minute? I need to give you a heads-up about something.", "Bianca"], ["P", "Sure. What's up?", "Greg"], ["P", "I sent the Coast Furniture price quote to the wrong client. I'm really sorry. I should have checked the address before I clicked \"Send.\"", "Bianca"], ["P", "Okay. Thanks for telling me right away. Send a short email to Coast Flooring. Say it was sent by mistake, and ask them to delete it. Keep it simple and polite.", "Greg"], ["P", "How about this? \"Hello, I sent you an email a few minutes ago by mistake. It was meant for another client. Please disregard it and delete it. My apologies for the confusion.\"", "Bianca"], ["P", "That's perfect. Send it.", "Greg"], ["P", "Greg, they replied. They said, \"No problem. Deleted. Have a great weekend!\"", "Bianca"], ["P", "See? Now send the quote to Coast Furniture.", "Greg"], ["P", "I did. This time, I checked the address three times.", "Bianca"], ["P", "Don't worry too much about it. It happens to everyone. I once sent a salary spreadsheet to the whole company.", "Greg"], ["P", "Really?", "Bianca"], ["P", "Really. The important thing is that you told me right away. You didn't hide it.", "Greg"], ["P", "Thank you. I learned something today. It's okay to make a mistake, as long as you take responsibility and fix it.", "Bianca"]], "words": 288, "kind": "story", "scene": "It's Friday afternoon. Bianca has just sent a confidential price quote to the wrong client. She walks to her colleague Linda's desk.", "F": "apologizing and fixing a mistake, did/didn't, was, should have, -ed", "V": "attachment, recall an email, confidential, \"Please disregard,\" \"My apologies,\" take responsibility, heads-up, \"It happens\"", "t": [[2.0, 3.66], [4.33, 5.08], [5.3, 6.18], [6.85, 12.33], [12.55, 14.62], [14.84, 16.03], [16.7, 17.45], [17.67, 18.95], [19.17, 20.32], [20.99, 22.27], [22.94, 24.35], [24.57, 28.47], [29.14, 29.93], [30.15, 31.65], [32.32, 34.24], [34.46, 36.97], [37.64, 38.99], [39.21, 41.62], [42.29, 43.01], [43.23, 44.15], [44.82, 48.08], [48.3, 49.39], [49.61, 52.26], [52.93, 53.84], [54.06, 56.07], [56.29, 58.74], [58.96, 62.33], [62.55, 64.39], [65.06, 66.1], [66.32, 70.01], [70.23, 71.92], [72.14, 74.08], [74.3, 76.26], [76.93, 78.06], [78.28, 79.16], [79.83, 80.96], [81.18, 82.61], [82.83, 83.58], [83.8, 85.01], [85.68, 86.39], [86.61, 88.89], [89.56, 90.22], [90.44, 92.83], [93.5, 95.27], [95.49, 97.2], [97.42, 100.64], [101.31, 101.99], [102.66, 103.43], [103.65, 106.61], [106.83, 108.11], [108.78, 109.53], [109.75, 111.16], [111.38, 116.05]], "R": [["You sent a confidential file to the wrong person.", "Coworker", "What happened?", "I sent a price quote to the wrong client. I need to fix it right away."], ["You write an email to fix it.", "Coworker", "What will you write?", "\"My apologies, I sent this in error. Please disregard it and delete it.\""]]}, {"num": 89, "title": "The Three-Month Review", "lines": [["P", "Come in. Don't look so worried. This is a good conversation. As you know, your probation period ends this week. I'm happy to tell you that you passed. You're officially part of the team.", "Greg"], ["S", "Thank you. That's a relief.", "Paula"], ["P", "Let's talk about how things are going. First, your strengths. Your sales report last month was excellent. The numbers were accurate, and the charts were very clear. The client asked who made it.", "Greg"], ["S", "Really?", "Paula"], ["P", "Really. Also, you're always on time, and you finish your work before the deadline. People notice that. Now, areas for improvement. In meetings, you don't speak up very often. You have good ideas. I've seen them in your emails. But in meetings, you're quiet.", "Greg"], ["S", "That's true. Sometimes I'm afraid my English isn't good enough.", "Paula"], ["P", "Your English is fine, and the team wants to hear from you. Going forward, I'd like you to share at least one idea in every Monday meeting. Does that sound fair?", "Greg"], ["S", "That sounds fair. I'll try.", "Paula"], ["P", "Second, your emails are sometimes very long. Busy people don't read long emails. Try to put the most important information in the first two lines.", "Greg"], ["S", "Okay. In Brazil, we usually start with more greetings and context.", "Paula"], ["P", "That's common. Here, people like it short and direct, but still polite.", "Greg"], ["P", "Now, some good news. The company has a professional development budget. You can spend up to one thousand dollars a year on courses.", "Greg"], ["S", "Can I use it for an English course?", "Paula"], ["P", "You can. A business writing course would be perfect.", "Greg"], ["S", "What are my goals for the next three months?", "Paula"], ["P", "Three goals. Speak up in meetings, keep your emails shorter, and take the lead on one small project. Linda can mentor you.", "Greg"], ["S", "Thank you, Greg.", "Paula"], ["P", "Thank you. You've done a great job. We're glad you're here.", "Greg"], ["P", "Well?", "Linda"], ["S", "I passed.", "Paula"], ["P", "I knew you would.", "Linda"]], "words": 303, "kind": "story", "scene": "Three months after Paula started, Greg sent her a calendar invite: \"Three-Month Review, Thursday, two o'clock.\" She was nervous all week. At two o'clock exactly, she knocks on his door.", "F": "feedback language, does, will, -ed", "V": "performance review, probation, strengths, areas for improvement, feedback, goals, speak up, professional development, \"going forward\"", "t": [[2.0, 2.87], [3.09, 4.57], [4.79, 6.54], [6.76, 9.96], [10.18, 12.31], [12.53, 14.39], [15.06, 15.8], [16.02, 17.0], [17.67, 19.81], [20.03, 21.35], [21.57, 24.32], [24.54, 27.95], [28.17, 29.97], [30.64, 31.32], [31.99, 32.76], [32.98, 37.52], [37.74, 39.11], [39.33, 41.31], [41.53, 44.24], [44.46, 45.87], [46.09, 47.9], [48.12, 49.85], [50.52, 51.37], [51.59, 54.54], [55.21, 58.68], [58.9, 63.7], [63.92, 65.31], [65.98, 67.03], [67.25, 68.06], [68.73, 71.52], [71.74, 74.07], [74.29, 78.17], [78.84, 79.54], [79.76, 83.58], [84.25, 85.38], [85.6, 89.02], [89.69, 91.2], [91.42, 94.39], [94.61, 98.23], [98.9, 100.82], [101.49, 102.45], [102.67, 105.1], [105.77, 107.89], [108.56, 109.67], [109.89, 115.54], [115.76, 117.42], [118.09, 119.07], [119.74, 120.66], [120.88, 122.44], [122.66, 124.09], [124.76, 125.38], [126.05, 126.82], [127.49, 128.47]], "R": [["It's your three-month review.", "Manager", "What do you think your strengths are?", "I'm organized, and I meet my deadlines. I'd like to speak up more in meetings."], ["Your manager gives you a goal.", "Manager", "Going forward, I'd like you to share your ideas more.", "That's fair. I'll try to share one idea in every meeting."]]}, {"num": 90, "title": "Disagreeing with Your Manager", "lines": [["P", "I need the client report by Friday instead of next Wednesday. The client moved their meeting.", "Greg"], ["S", "I see why you need it earlier. But I'm not sure Friday is realistic for the whole report. The data from the Toronto office isn't ready yet. They said it won't arrive until Thursday afternoon.", "Paula"], ["P", "Hmm. I didn't know that.", "Greg"], ["S", "Could I suggest something? I could finish the first two sections by Friday. Those are the most important ones for the meeting. Then I'd send the full report on Tuesday.", "Paula"], ["P", "That's fair enough. Thanks for flagging that. Let's do it your way.", "Greg"], ["P", "Paula, the report was good, and the client was happy. But I want to mention one thing. In the meeting on Friday, when the client asked about the budget, you said, \"That's wrong.\" It was true, but it sounded a little harsh.", "Greg"], ["S", "Oh. In Portuguese, \"that's wrong\" isn't rude. What would be better?", "Paula"], ["P", "Something like, \"I think those numbers might be from an older version. Let me double-check.\" It says the same thing, but the client doesn't lose face.", "Greg"], ["S", "I understand. I didn't mean to be rude. In Brazil, we're more direct.", "Paula"], ["P", "Honestly, sometimes I wish we were. People here can be so indirect that nobody knows what was decided. I know you didn't mean it. That's why I'm telling you. You're doing great work, and I want people to hear your ideas, not just your tone.", "Greg"], ["S", "Thanks for telling me, Greg. I'd rather know than not know.", "Paula"], ["P", "That's a great attitude.", "Greg"], ["S", "Tonight, I'm writing some phrases in my notebook. \"I see your point, but...\", \"Could I suggest...?\", \"I might be wrong, but...\", and \"Let me double-check.\"", "Paula"]], "words": 275, "kind": "story", "scene": "On Tuesday, Greg calls Paula into his office. The client report has three sections, and she has only finished one.", "F": "polite disagreement and receiving criticism, would/could, didn't, doesn't, was, dates", "V": "concern, \"I see your point, but...\", \"Could I suggest...?\", \"I'm not sure that...\", feedback, criticism, deadline, realistic, compromise, \"fair enough,\" \"Thanks for flagging that\"", "t": [[2.0, 6.12], [6.34, 7.98], [8.65, 10.27], [10.49, 14.14], [14.36, 17.47], [17.69, 20.51], [21.18, 21.84], [22.06, 23.41], [24.08, 25.46], [25.68, 28.52], [28.74, 31.32], [31.54, 33.91], [34.58, 35.79], [36.01, 37.57], [37.79, 39.29], [39.96, 43.22], [43.44, 45.27], [45.49, 51.0], [51.22, 53.76], [54.43, 54.94], [55.16, 57.53], [57.75, 58.75], [59.42, 63.58], [63.8, 65.29], [65.51, 69.01], [69.68, 70.64], [70.86, 72.27], [72.49, 73.98], [74.65, 77.04], [77.26, 81.57], [81.79, 83.43], [83.65, 85.25], [85.47, 90.79], [91.46, 92.91], [93.13, 94.66], [95.33, 96.89], [97.56, 100.4], [100.62, 102.11]], "R": [["Your manager wants something too fast.", "Manager", "Can you finish all three sections by tomorrow?", "I see your point, but I'm not sure that's realistic. Could I suggest Friday for the full report?"], ["Your manager agrees to a compromise.", "Manager", "Okay, two sections by tomorrow and the last one Friday.", "Fair enough. Thanks, Greg."]]}, {"num": 91, "title": "The Bad Video Call", "lines": [["P", "Good morning, everyone. Can everyone hear me?", "Linda"], ["S", "Yes.", "Scott"], ["P", "Heather, I think you're on mute.", "Linda"], ["P", "Sorry about that! Can you hear me now?", "Heather"], ["P", "Yes, loud and clear. Paula, over to you.", "Linda"], ["S", "Okay, I'll share my screen. Can you see my screen?", "Paula"], ["S", "We can see it. It's the first slide, right?", "Scott"], ["S", "Yes. So, as you can see, we finished the design phase on the fourteenth, and...", "Paula"], ["P", "Sorry, you're breaking up. Can you repeat that?", "Heather"], ["S", "Is that better?", "Paula"], ["P", "A little. You froze for a second.", "Heather"], ["S", "We finished the design phase on the fourteenth, and we're now in testing.", "Paula"], ["P", "Oh, you're back! We lost you.", "Linda"], ["S", "I'm so sorry. My connection dropped. I had to restart my router.", "Paula"], ["P", "No problem. It happens.", "Linda"], ["S", "Did the budget include testing?", "Scott"], ["S", "Sorry, Scott, I didn't catch that. Could you say it again?", "Paula"], ["S", "I asked if the budget includes the testing phase.", "Scott"], ["S", "It does. Everything is included until the launch.", "Paula"], ["P", "I have a question about the timeline, but it's a bit complicated. Maybe we should take this offline.", "Heather"], ["P", "Good idea. Heather, can you send your question by email, and we'll set up a separate call?", "Linda"], ["P", "Sounds good.", "Heather"], ["P", "It's ten fifty. I think we covered everything. I'll send a summary in the chat and by email. Thanks, everyone.", "Linda"], ["S", "Linda, sorry about my internet. That was embarrassing.", "Paula"], ["P", "Don't worry. Everybody's internet fails sometimes. Next time, try using a cable instead of Wi-Fi. And keep your phone ready, so you can join by phone if your computer drops.", "Linda"], ["S", "I'm buying a network cable this afternoon.", "Paula"]], "words": 252, "kind": "story", "scene": "On Thursday at ten, Paula has her first video call with the clients in Calgary, Scott and Heather. Linda leads the call.", "F": "video call language, didn't, can, is, was, times, could", "V": "\"You're on mute,\" \"Can you hear me?\", \"You're breaking up,\" \"You froze,\" \"Can you see my screen?\", share your screen, camera, connection, \"Let's take this offline,\" reschedule, \"I'll drop off and rejoin,\" chat", "t": [[2.0, 3.49], [3.71, 5.01], [5.68, 6.26], [6.93, 8.49], [9.16, 10.31], [10.53, 11.64], [12.31, 13.65], [13.87, 15.2], [15.87, 17.47], [17.69, 18.94], [19.61, 20.53], [20.75, 22.1], [22.77, 23.36], [23.58, 27.79], [28.46, 29.82], [30.04, 31.19], [31.86, 32.8], [33.47, 34.22], [34.44, 35.74], [36.41, 40.4], [41.07, 41.99], [42.21, 43.17], [43.84, 44.92], [45.14, 46.45], [46.67, 48.31], [48.98, 49.96], [50.18, 51.08], [51.75, 53.28], [53.95, 55.81], [56.03, 57.29], [57.96, 60.62], [61.29, 61.98], [62.2, 64.46], [65.13, 68.63], [68.85, 70.66], [71.33, 72.25], [72.47, 76.56], [77.23, 78.19], [78.86, 80.01], [80.23, 81.83], [82.05, 84.61], [84.83, 85.94], [86.61, 88.43], [88.65, 89.82], [90.49, 91.32], [91.54, 93.7], [93.92, 96.84], [97.06, 101.11], [101.78, 104.17]], "R": [["A video call has problems.", "Client", "Paula, you're breaking up.", "Sorry, my connection is bad. Can you hear me now?"], ["You want to share your screen.", "Client", "Can we see the report?", "Sure, I'll share my screen. Can everyone see it?"]]}]}, {"part": 12, "title": "On the Construction Site", "desc": "Safety, measurements, and site vocabulary.", "scripts": [{"num": 92, "title": "Safety Orientation on a Construction Site", "lines": [["P", "You're the new guy? Welcome. Before you do anything, we need to do your safety orientation. Every morning you sign in on this clipboard, and every afternoon you sign out. If there's an emergency, we need to know who's on site.", "Doug"], ["S", "Okay.", "Diego"], ["P", "Hard hat, steel-toed boots, high-vis vest, and safety glasses. That's your PPE. You wear it all the time on site. No exceptions.", "Doug"], ["S", "Understood.", "Diego"], ["P", "Now, fall protection. If you're working more than three metres high, that's about ten feet, you must wear a harness, and it must be tied off. Did you get fall protection training?", "Doug"], ["S", "I did, in Brazil.", "Diego"], ["P", "Okay, but you'll need to do our course too. It's on Thursday. Until then, you don't work above three metres.", "Doug"], ["P", "See that green sign near the gate? That's the muster point. If you hear three long horn blasts, stop what you're doing and walk here. Don't run. Don't go back for your tools.", "Doug"], ["S", "Who's the first aid attendant?", "Diego"], ["P", "Helen. She's in the blue trailer. If you get hurt, even a small cut, you report it to her. Every injury gets written down. That's the law with WorkSafeBC.", "Doug"], ["P", "One more thing. In BC, you have the right to refuse unsafe work. If something doesn't look safe, you stop and tell me. You won't get in trouble. I'd rather lose ten minutes than lose a worker.", "Doug"], ["S", "Understood.", "Diego"], ["P", "Every morning at seven, we have a toolbox talk. It's a short safety meeting. Today's topic is ladders. Coffee break is at nine, lunch is at noon for thirty minutes, and we finish at three thirty. Any questions?", "Doug"], ["S", "Just one. Where's the washroom?", "Diego"], ["P", "See those three blue boxes by the fence? Welcome to construction.", "Doug"]], "words": 280, "kind": "story", "scene": "It's Diego's first morning at a construction site in Burnaby. He arrives at six forty-five. The site supervisor, Doug, meets him at the trailer.", "F": "rules and instructions (must, have to, don't, can't), times, 3 metres/10 feet, doesn't, did", "V": "site supervisor, orientation, PPE (personal protective equipment), hard hat, steel-toed boots, high-vis vest, safety glasses, fall protection, harness, WorkSafeBC, first aid attendant, muster point, toolbox talk, sign in/sign out, refuse unsafe work", "t": [[2.0, 3.24], [3.46, 4.35], [4.57, 8.43], [8.65, 13.37], [13.59, 17.07], [17.74, 18.4], [19.07, 23.25], [23.47, 24.88], [25.1, 27.17], [27.39, 28.62], [29.29, 30.08], [30.75, 32.42], [32.64, 39.63], [39.85, 41.95], [42.62, 43.68], [44.35, 46.83], [47.05, 48.43], [48.65, 51.43], [52.1, 54.04], [54.26, 55.77], [55.99, 60.37], [60.59, 61.63], [61.85, 63.58], [64.25, 65.7], [66.37, 67.16], [67.38, 69.09], [69.31, 72.76], [72.98, 75.07], [75.29, 77.43], [78.1, 79.33], [79.55, 83.18], [83.4, 86.56], [86.78, 88.25], [88.47, 91.16], [91.83, 92.62], [93.29, 96.4], [96.62, 98.33], [98.55, 100.34], [100.56, 106.34], [106.56, 107.78], [108.45, 109.22], [109.44, 110.46], [111.13, 113.65], [113.87, 115.47]], "R": [["It's your safety orientation on a construction site.", "Supervisor", "Where's your PPE?", "I have my hard hat, steel-toed boots, and high-vis vest. Do I need safety glasses too?"], ["The supervisor explains fall protection.", "Supervisor", "Above three metres, you always wear a harness.", "Understood. Could you show me how to check it?"]]}, {"num": 93, "title": "Feet, Inches, and the Wrong Delivery", "lines": [["P", "We're framing the walls on the second floor today. Grab a tape measure.", "Rick"], ["S", "In metres?", "Diego"], ["P", "Ha! Not on this site. The country uses metres, but construction uses feet and inches. You'll get used to it. Those are two-by-fours. Cut ten of them to eight feet, six and a half inches. Then we put the studs up, sixteen inches on centre.", "Rick"], ["S", "Sixteen inches on centre?", "Diego"], ["P", "The middle of one stud to the middle of the next stud is sixteen inches.", "Rick"], ["S", "Here's the first one.", "Diego"], ["P", "That's eight six and a quarter. You need a half.", "Rick"], ["S", "Sorry. The lines on the tape measure are very small.", "Diego"], ["P", "Everybody makes that mistake at first. The long line in the middle of the inch is a half. The shorter lines are quarters.", "Rick"], ["S", "Okay. The next nine are perfect.", "Diego"], ["P", "Delivery. Here's the invoice.", "Driver"], ["P", "Forty sheets of drywall? We ordered fourteen.", "Rick"], ["P", "It says forty here.", "Driver"], ["P", "Gary, did you order fourteen or forty sheets of drywall? Fourteen. Okay. The supplier heard forty.", "Rick"], ["P", "I can take twenty-six back, but you'll need to call the office.", "Driver"], ["P", "See, Diego? Even Canadians confuse fourteen and forty.", "Rick"], ["P", "Heads up!", "Rick"], ["P", "Are you okay?", "Rick"], ["S", "I'm okay. It didn't hit me. It landed about a metre away.", "Diego"], ["P", "Good. That's a near miss. We have to report it, even if nobody got hurt.", "Rick"], ["S", "This morning's toolbox talk is about falling objects. Yesterday, a board wasn't tied down near the edge on the third floor. We got lucky. Luck isn't a safety plan.", "Doug"], ["P", "How was your day?", "Wife"], ["S", "I learned three things. Half an inch, sixteen inches on centre, and when someone yells \"heads up,\" you look up fast.", "Diego"]], "words": 269, "kind": "story", "scene": "On Tuesday, Diego's foreman, Rick, gives him his first real job.", "F": "imperial measurements, 14/40, 16 inches, fractions (a half, a quarter), did/didn't, was/wasn't, can, -ed", "V": "foreman, apprentice, two-by-four, stud, on centre, drywall, sheet, tape measure, drawings, delivery, order, invoice, \"heads up!\", near miss", "t": [[2.0, 4.62], [4.84, 6.08], [6.75, 7.56], [8.23, 8.79], [9.01, 10.01], [10.23, 14.05], [14.27, 15.38], [15.6, 16.88], [17.1, 20.0], [20.22, 23.08], [23.75, 25.28], [25.95, 29.9], [30.57, 31.62], [32.29, 33.82], [34.04, 34.94], [35.61, 36.25], [36.47, 38.64], [39.31, 41.36], [41.58, 43.91], [44.13, 45.66], [46.33, 46.99], [47.21, 48.54], [49.21, 49.97], [50.19, 51.3], [51.97, 53.4], [53.62, 54.78], [55.45, 56.58], [57.25, 60.64], [60.86, 61.65], [61.87, 62.57], [62.79, 64.16], [64.83, 68.13], [68.8, 69.74], [69.96, 72.65], [73.32, 74.02], [74.69, 75.63], [76.3, 77.13], [77.35, 78.27], [78.49, 80.01], [80.68, 81.21], [81.43, 82.48], [82.7, 85.47], [86.14, 89.57], [89.79, 93.93], [94.15, 95.28], [95.5, 97.23], [97.9, 98.92], [99.59, 100.68], [100.9, 106.11]], "R": [["The foreman gives you a job.", "Foreman", "Put the studs at sixteen inches on centre.", "Okay. Sixteen inches on centre. Can I check the drawings first?"], ["The delivery is wrong.", "Driver", "Here's your order. Sign here.", "Wait, this isn't what we ordered. We need two-by-fours, not two-by-sixes."]]}]}, {"part": 13, "title": "Business Meetings Around Vancouver", "desc": "Fictional meetings set at well-known Vancouver organizations.", "scripts": [{"num": 94, "title": "BC Hydro: The Storm Review Meeting", "lines": [["P", "Thanks for coming, everyone. I know it was a long week. Today, we'll look at three things: what happened, what went well, and what we could do better.", "Sandra"], ["P", "At the peak of the storm, about one hundred and twenty thousand customers were without power. Within twenty-four hours, we restored power to ninety percent of them. The last customers got their power back after three days.", "Sandra"], ["S", "Where were the biggest problems?", "Camila"], ["P", "Mostly the North Shore and the Fraser Valley. Trees fell on the lines. In some places, the roads were blocked, so our crews couldn't get there.", "Marnie"], ["P", "What went well?", "Sandra"], ["P", "The crews did an amazing job. Some of them worked sixteen-hour shifts.", "Marnie"], ["S", "And the outage map worked. Over two million people checked it during the storm, and it didn't crash.", "Blair"], ["P", "What could we do better?", "Sandra"], ["S", "The call centre. The average wait time was forty minutes. People were frustrated. Some of them waited over an hour.", "Blair"], ["P", "That's too long. What do you suggest?", "Sandra"], ["S", "We could add a recorded message with the latest update, so people don't need to wait for an agent. And we could bring in extra staff before the storm, not after.", "Blair"], ["P", "Good idea. Marnie?", "Sandra"], ["P", "Vegetation management. We need to trim more trees near the lines before winter, especially on the North Shore.", "Marnie"], ["P", "Okay. Let's recap the action items. Blair will prepare a plan for extra call centre staff and the recorded message. Marnie will send me a list of the highest-risk areas for tree trimming. And Camila will analyze which lines failed most often.", "Sandra"], ["S", "When do you need it?", "Camila"], ["P", "By the end of the month. Is that realistic?", "Sandra"], ["S", "Yes, that works.", "Camila"], ["P", "Great. Any other business? Then let's wrap up. Thanks again, everyone. You kept the lights on.", "Sandra"]], "words": 288, "kind": "story", "scene": "On Monday morning, Camila's team at BC Hydro meets to review last week's windstorm. Camila is the newest engineer on the team. Their manager, Sandra, starts at nine sharp.", "F": "meeting language, numbers (customers, percentages, hours), did/didn't, was, will, should", "V": "agenda, outage, restore power, crews, call centre, wait time, outage map, vegetation management, lessons learned, \"What went well?\", \"What could we do better?\", action items, owner, deadline", "t": [[2.0, 3.64], [3.86, 5.36], [5.58, 10.21], [10.88, 15.78], [16.0, 19.95], [20.17, 23.26], [23.93, 25.47], [26.14, 28.48], [28.7, 30.05], [30.27, 34.02], [34.69, 35.63], [36.3, 38.09], [38.31, 40.28], [40.95, 42.25], [42.47, 46.37], [47.04, 48.22], [48.89, 49.93], [50.15, 52.28], [52.5, 53.87], [54.09, 55.77], [56.44, 57.47], [57.69, 58.9], [59.57, 65.21], [65.43, 68.8], [69.47, 70.38], [70.6, 71.35], [72.02, 73.58], [73.8, 78.41], [79.08, 79.82], [80.04, 81.75], [81.97, 86.45], [86.67, 90.72], [90.94, 94.21], [94.88, 95.97], [96.64, 97.89], [98.11, 99.33], [100.0, 100.98], [101.65, 102.4], [102.62, 103.73], [103.95, 105.14], [105.36, 106.88], [107.1, 108.4]], "R": [["Your team reviews a storm.", "Manager", "What went well last week?", "The crews restored power quickly. The outage map was very helpful for customers."], ["The manager asks what to improve.", "Manager", "What could we do better?", "The call centre wait times were long. Maybe we need more staff during storms."]]}, {"num": 95, "title": "Vancouver Coastal Health: Planning for Respiratory Season", "lines": [["P", "Good afternoon, everyone. Every year, from November to March, we see more patients with the flu, COVID, and RSV. Last year, our medical units were at one hundred and ten percent occupancy in January. That means we had more patients than beds.", "Dr. Morrison"], ["S", "Where did the extra patients go?", "Manager"], ["P", "Some stayed in Emergency for hours, waiting for a bed upstairs. Some were in hallways. We don't want that again.", "Dr. Morrison"], ["P", "Staffing is our biggest problem. Last January, sick calls went up by thirty percent, and nurses worked a lot of overtime. People are tired.", "Janet"], ["P", "What do you suggest?", "Dr. Morrison"], ["P", "We should build a list of casual nurses now, not in December. And we should plan the holiday schedule early, so people know when they're working.", "Janet"], ["S", "Can I add something? Staff vaccination. Last year, only sixty percent of our staff got the flu vaccine. We'd like to reach seventy-five percent.", "Paul"], ["P", "How can we do that?", "Dr. Morrison"], ["S", "We'll run vaccine clinics on every unit, on day and night shifts. Nurses won't have to go anywhere. We'll come to them.", "Paul"], ["P", "I like that. On nights, it's hard to leave the unit.", "Beatriz"], ["P", "What about the surge plan? If occupancy goes over one hundred percent, which beds can we open?", "Dr. Morrison"], ["P", "There's an empty unit on the fifth floor. But we can't open it without more staff.", "Janet"], ["P", "Let's circle back on that next week, after I talk to the director. So, three things. Janet will start the casual nurse list. Paul will schedule the vaccine clinics, starting October 15th. And I'll confirm the surge plan by next Friday.", "Dr. Morrison"], ["P", "So, Beatriz, what did you think?", "Janet"], ["P", "It was very organized. In Brazil, our meetings were longer, and we didn't always leave with a plan.", "Beatriz"], ["P", "Trust me. Some of our meetings are like that too.", "Janet"]], "words": 292, "kind": "story", "scene": "In September, the nursing managers at Vancouver General Hospital meet to plan for respiratory season. Beatriz is a nurse on the medical unit. Her manager, Janet, asked her to join the meeting.", "F": "healthcare meeting language, percentages, dates, will/won't, should, can/can't, do", "V": "respiratory season, flu, COVID-19, RSV, occupancy, admitted patients, beds, staffing, overtime, sick calls, surge plan, vaccine clinic, infection control, \"Can I add something?\", \"Let's circle back\"", "t": [[2.0, 3.62], [3.84, 9.88], [10.1, 15.84], [16.06, 18.62], [19.29, 20.99], [21.66, 25.8], [26.02, 27.52], [27.74, 29.19], [29.86, 31.65], [31.87, 37.29], [37.51, 38.68], [39.35, 40.74], [41.41, 44.82], [45.04, 49.09], [49.76, 50.89], [51.11, 52.29], [52.51, 56.22], [56.44, 58.45], [59.12, 60.46], [61.13, 64.78], [65.0, 66.62], [66.84, 67.84], [68.51, 69.34], [69.56, 71.8], [72.47, 74.18], [74.4, 79.05], [79.72, 81.83], [82.05, 84.06], [84.73, 88.67], [88.89, 90.15], [90.37, 92.85], [93.07, 97.33], [97.55, 100.48], [101.15, 102.92], [103.59, 105.02], [105.24, 109.46], [110.13, 110.96], [111.18, 113.04]], "R": [["You're in a hospital planning meeting.", "Manager", "Can your unit handle more patients this winter?", "We can, but we'll need more staff. We already have a lot of sick calls."], ["Someone asks about vaccines.", "Manager", "Should we hold a vaccine clinic for staff?", "Yes, I think that's a good idea. Maybe in October, before flu season."]]}, {"num": 96, "title": "TransLink: Fixing a Crowded Bus Route", "lines": [["P", "We've received a lot of complaints about this route. Let's look at the data.", "Neil"], ["S", "Ridership on this route has gone up twenty percent in the last year. During peak hours, from seven to nine in the morning, the buses are very crowded. We also had over three hundred pass-ups last month.", "Rafael"], ["P", "Can you explain pass-ups for everyone?", "Neil"], ["S", "A pass-up is when a bus is too full to pick up more passengers, so it drives past the stop. People have to wait for the next bus.", "Rafael"], ["P", "And how often do the buses come right now?", "Neil"], ["S", "Every twelve minutes in the morning peak.", "Rafael"], ["P", "We did a survey last month. Seventy percent of riders said crowding was their biggest problem. Many people said they were late for work or school.", "Dana"], ["P", "So what are our options?", "Neil"], ["S", "Option one, we add more buses, so they come every eight minutes during peak hours. Option two, we use longer buses, the articulated ones, on this route.", "Rafael"], ["P", "What does each option cost?", "Neil"], ["S", "Option one needs six more buses and drivers. Option two needs four longer buses, but we don't have any extra ones right now.", "Rafael"], ["S", "I'd like to push back a little on option one. We don't have enough drivers at the moment. We're still hiring.", "Greg"], ["P", "That's a good point. Could we do option one partly? Maybe every ten minutes instead of eight?", "Neil"], ["S", "We could. We'd need three more drivers, not six. That's possible.", "Greg"], ["P", "What's the timeline?", "Neil"], ["S", "The next service change is in April. If we decide by the end of this month, we can include it.", "Rafael"], ["P", "Okay. Let's go with every ten minutes for now. We'll review the data again after three months. If it isn't enough, we'll look at the longer buses.", "Neil"], ["P", "The riders will be happy.", "Dana"], ["P", "Great analysis, Rafael. The pass-up data made a big difference.", "Neil"], ["S", "Thanks. I ride that route every day. I've been passed up twice this month.", "Rafael"]], "words": 315, "kind": "story", "scene": "Rafael is a transit planner at TransLink. On Wednesday, his team meets to talk about one of their busiest bus routes. Their manager, Neil, opens the meeting.", "F": "data and percentages, times, ridership numbers, did, does, will, could", "V": "route, ridership, peak hours, crowding, pass-ups, frequency, \"every eight minutes,\" service change, budget, survey, feedback, trade-off, \"What's the timeline?\", \"I'd like to push back a little\"", "t": [[2.0, 5.14], [5.36, 6.76], [7.43, 10.89], [11.11, 15.63], [15.85, 18.73], [19.4, 21.88], [22.55, 28.03], [28.25, 30.11], [30.78, 33.42], [34.09, 36.01], [36.68, 38.22], [38.44, 42.09], [42.31, 44.76], [45.43, 47.11], [47.78, 52.48], [52.7, 56.67], [57.34, 59.15], [59.82, 62.46], [62.68, 67.4], [68.07, 70.31], [70.53, 72.58], [72.8, 73.86], [74.53, 75.88], [76.1, 78.17], [78.39, 80.95], [81.62, 82.32], [82.54, 84.59], [84.81, nd with a card, they can borrow books, use the computers, and even take online courses.", "Maureen"], ["S", "Should we partner with settlement agencies? They meet new families every day.", "Owen"], ["P", "Yes. Let's contact three agencies and ask them to share our program information.", "Maureen"], ["S", "What about feedback? Do we know what people want?", "Colleague"], ["P", "We'll do a short survey at the conversation circles next month. Five questions, in simple English. Thanks, everyone. The library is often the first place newcomers feel welcome. Let's keep it that way.", "Maureen"], ["S", "Luana, you were a newcomer not long ago, right?", "Owen"], ["P", "I was. The library was the first place where I made a Canadian friend.", "Luana"]], "words": 300, "kind": "story", "scene": "Luana is a library assistant at a Vancouver Public Library branch. This month, the programs team meets at the Central Library on West Georgia Street. Their supervisor, Maureen, starts with good news.", "F": "program planning, attendance numbers, days and times, can, will, should, -ed", "V": "branch, program, conversation circle, attendance, waitlist, volunteer, facilitator, collection, languages, library card, partner, settlement agency, promote, feedback", "t": [[2.0, 5.29], [5.51, 7.66], [7.88, 12.27], [12.94, 13.82], [14.04, 15.66], [16.33, 17.74], [17.96, 20.13], [20.35, 22.42], [22.64, 24.01], [24.68, 25.83], [26.5, 30.38], [30.6, 35.11], [35.78, 37.01], [37.23, 39.3], [39.97, 40.51], [41.18, 42.99], [43.21, 46.11], [46.33, 53.35], [54.02, 55.0], [55.22, 59.74], [60.41, 64.25], [64.47, 66.48], [67.15, 67.87], [68.09, 69.71], [70.38, 71.58], [71.8, 75.53], [75.75, 80.72], [81.39, 83.59], [83.81, 85.6], [86.27, 87.0], [87.22, 91.61], [92.28, 93.43], [93.65, 95.15], [95.82, 99.3], [99.52, 101.71], [101.93, 103.04], [103.26, 106.61], [106.83, 108.15], [108.82, 111.51], [112.18, 112.82], [113.04, 116.69]], "R": [["Your team talks about library programs.", "Supervisor", "How is the conversation circle going?", "Really well. Attendance is high, and there's a waitlist. We need more volunteers."], ["Someone asks for ideas.", "Colleague", "How can we reach more newcomers?", "We could partner with settlement agencies and offer programs in more languages."]]}, {"num": 98, "title": "TD Bank: The Monday Morning Huddle", "lines": [["P", "Good morning, team! Let's start with a shout-out. Last week, our customer survey score was ninety-two percent. That's our best score this year. One customer wrote about Terry. She said he helped her father open his first account and explained everything slowly and patiently.", "Janice"], ["S", "Oh, thanks. I just did my job.", "Terry"], ["P", "Next, appointments. This week, we have thirty-five appointments booked. Twelve of them are new-to-Canada customers. Many of them just arrived, so please take your time. Explain the newcomer package, the chequing account, and how to build credit.", "Janice"], ["P", "Do we have the information in other languages? Many Brazilian customers ask for me.", "Pedro"], ["P", "We do. There are brochures in several languages at the front desk. And Pedro, if a customer speaks Portuguese, please take them if you're free.", "Janice"], ["P", "Of course.", "Pedro"], ["P", "Now, an important heads-up about fraud. Last week, two of our older customers almost sent money to scammers. In one case, someone called and said they were the customer's grandson. He said he was in jail and needed bail money right away.", "Janice"], ["S", "What should we do if we see something like that?", "Jason"], ["P", "Watch for red flags. If an older customer wants to withdraw a large amount of cash, and they seem nervous or in a hurry, ask some gentle questions. \"Who is this money for? Did someone call you?\" If you're worried, call me or the assistant manager.", "Janice"], ["S", "Should we stop the transaction?", "Jason"], ["P", "We can't always stop it. It's their money. But we can take time, explain the risk, and ask them to call their family first. Most people are grateful.", "Janice"], ["P", "Last thing. Mortgage renewals. A lot of customers are renewing this year, and rates are different from five years ago. If a customer has questions, book them an appointment with Alison, our mortgage specialist.", "Janice"], ["P", "It's eight fifty-five. Okay, team, let's have a great week.", "Janice"], ["S", "Nine o'clock. I'm unlocking the doors. Here comes our first customer.", "Jason"]], "words": 315, "kind": "story", "scene": "Every Monday at eight forty-five, before the branch opens, the team at the TD branch on Main Street has a ten-minute huddle. They stand in a circle near the tellers. The branch manager, Janice, holds a coffee and a clipboard.", "F": "short team meeting, customer numbers, percentages, appointments, did, should, will", "V": "branch, huddle, customer experience, survey score, appointments, new-to-Canada customers, chequing account, newcomer package, fraud, scam, red flags, \"Heads up,\" \"Shout-out,\" \"Let's have a great week\"", "t": [[2.0, 3.07], [3.29, 4.78], [5.0, 8.61], [8.83, 10.38], [10.6, 12.37], [12.59, 18.12], [18.79, 19.88], [20.1, 21.78], [22.45, 23.65], [23.87, 26.3], [26.52, 28.97], [29.19, 32.11], [32.33, 36.37], [37.04, 39.4], [39.62, 41.78], [42.45, 43.26], [43.48, 46.62], [46.84, 51.19], [51.86, 52.58], [53.25, 55.54], [55.76, 59.68], [59.9, 63.61], [63.83, 67.1], [67.77, 69.96], [70.63, 72.04], [72.26, 79.79], [80.01, 81.36], [81.58, 82.81], [83.03, 85.79], [86.46, 87.99], [88.66, 90.13], [90.35, 91.38], [91.6, 96.1], [96.32, 97.75], [98.42, 99.32], [99.54, 100.75], [100.97, 105.58], [105.8, 110.94], [111.61, 112.93], [113.15, 115.31], [115.98, 116.85], [117.07, 118.44], [118.66, 120.22]], "R": [["It's a morning huddle at a bank.", "Manager", "Any updates before we open?", "I have three appointments with new-to-Canada customers today. They want chequing accounts."], ["A customer asks about a newcomer package.", "Customer", "Do you have a program for newcomers?", "Yes, we do. It includes a chequing account with no monthly fee for the first year."]]}, {"num": 99, "title": "BMO: Applying for a Small Business Loan", "lines": [["P", "Tell me about the business.", "Greg"], ["S", "We opened three years ago. We sell Brazilian baked goods, coffee, and lunch. In our first year, our revenue was two hundred and ten thousand dollars. Last year, it was four hundred and eighty thousand.", "Renata"], ["P", "That's great growth. And your profit?", "Greg"], ["S", "Last year, about sixty-five thousand after expenses.", "Renata"], ["P", "How much do you need for the new location?", "Greg"], ["S", "About one hundred and fifty thousand dollars. That includes the equipment, the renovation, and three months of rent.", "Renata"], ["P", "Okay. Did you bring your business plan and your financial statements?", "Greg"], ["S", "I did. Here are the statements for the last three years, and here's our plan for the new location.", "Renata"], ["P", "This is a very good plan. Let me ask a few questions. What's your cash flow like in the winter? Some businesses slow down.", "Greg"], ["S", "January and February are slower, about twenty percent lower. But we plan for it. We always keep two months of expenses in our savings account.", "Renata"], ["P", "Good. Do you have any other debt?", "Greg"], ["S", "Just a small equipment loan. We'll finish paying it next year.", "Renata"], ["P", "And collateral? Something the bank can hold, in case the business can't pay.", "Greg"], ["S", "We own our condo. We have some equity in it.", "Renata"], ["P", "Here's what I can probably offer, but it isn't final yet. A loan of one hundred and fifty thousand dollars, over a five-year term. The interest rate would be prime plus two percent. Your monthly payments would be around three thousand dollars.", "Greg"], ["S", "Three thousand a month. We can manage that. What's the next step?", "Renata"], ["P", "I'll send your application to our credit team. They'll review everything, and you'll have an answer in about two weeks.", "Greg"], ["P", "Renata, it's Greg Wilson. Congratulations. Your loan is approved.", "Greg"], ["S", "Thank you! Honey! We're going to North Vancouver!", "Renata"], ["P", "That's it. Free pão de queijo for every customer this afternoon!", "Husband"]], "words": 302, "kind": "story", "scene": "Renata's Brazilian bakery on Commercial Drive has been open for three years. Every weekend, there's a line outside for their pão de queijo. Now she and her husband want to open a second location in North Vancouver. She meets Greg Wilson, a commercial banker at BMO.", "F": "business finance numbers, percentages, years, do, did, will, would, can/can't", "V": "small business loan, commercial banking, business plan, financial statements, revenue, profit, cash flow, collateral, interest rate, prime rate, term, monthly payments, approval, \"What's the next step?\"", "t": [[2.0, 3.58], [4.25, 5.68], [5.9, 8.48], [8.7, 12.45], [12.67, 15.26], [15.93, 17.27], [17.49, 18.81], [19.48, 22.53], [23.2, 25.59], [26.26, 28.59], [28.81, 32.35], [33.02, 33.94], [34.16, 37.87], [38.54, 39.24], [39.46, 44.07], [44.74, 46.55], [46.77, 48.63], [48.85, 51.11], [51.33, 53.17], [53.84, 57.23], [57.45, 58.58], [58.8, 62.02], [62.69, 63.39], [63.61, 65.17], [65.84, 67.38], [67.6, 69.13], [69.8, 71.08], [71.3, 74.97], [75.64, 76.84], [77.06, 78.34], [79.01, 82.65], [82.87, 87.61], [87.83, 90.71], [90.93, 94.28], [94.95, 96.14], [96.36, 97.52], [97.74, 98.82], [99.49, 102.2], [102.42, 106.39], [107.06, 108.92], [109.14, 110.52], [110.74, 112.22], [112.89, 113.61], [113.83, 114.45], [114.67, 116.23], [116.9, 117.58], [117.8, 120.77]], "R": [["You're applying for a small business loan.", "Banker", "Tell me about your business.", "We have a Brazilian bakery on Commercial Drive. We've been open three years, and we want a second location."], ["The banker asks for documents.", "Banker", "Do you have a business plan and financial statements?", "Yes, I brought our business plan and the last three years of financial statements."]]}, {"num": 100, "title": "City of Vancouver: The Bike Lane Consultation", "lines": [["P", "We received over four thousand survey responses. Thank you all for your hard work at the open houses. Now, let's look at what people said.", "Shelley"], ["S", "Overall, fifty-eight percent of people support the bike lane. Twenty-nine percent are against it, and thirteen percent aren't sure.", "Lucas"], ["P", "Who supports it?", "Shelley"], ["S", "Mostly residents who live nearby and people who ride bikes. Many parents said they want a safer route for their kids to get to school.", "Lucas"], ["P", "And who is against it?", "Shelley"], ["S", "Mostly business owners on the street. Their biggest concern is parking. The design removes about forty parking spaces.", "Lucas"], ["P", "I talked to twenty business owners. The coffee shop owner told me forty percent of his customers drive. He's worried he'll lose business.", "Garth"], ["P", "On one hand, safety is our priority. Last year, there were eleven collisions involving cyclists on this street. On the other hand, we don't want to hurt local businesses. Is there a compromise?", "Shelley"], ["S", "What if we keep some parking on the side streets? And we could add two loading zones, so delivery trucks don't block the bike lane.", "Lucas"], ["P", "That could work. The business owners also asked for more time. They want to see the final design before council votes.", "Garth"], ["P", "Fair enough. Let's hold a meeting just for the businesses next month.", "Shelley"], ["S", "What's the deadline for the council report?", "Colleague"], ["P", "We need to finish it by June 15th. Council will vote in July. Who's writing the summary of the survey results?", "Shelley"], ["S", "I will. I'll have a draft by the end of next week.", "Lucas"], ["P", "Perfect. Garth, can you organize the business meeting?", "Shelley"], ["P", "Sure.", "Garth"], ["P", "Lucas, you explained the data reall   for (let k = start; k < ST.segs.length; k++) {
    if (id !== RUN) return;
    const g = ST.segs[k]; ST.seg = k; highlight(k); status(k); updSeg();
    const mine = echo && ST.roleplay && g.name === roleName();
    const T = ST.hasAudio && ALL.find(x => x.num === ST.num).t, flow = ST.hasAudio && !echo && !only;
    if (mine) { status(k, "your line, say it now"); await wait(T ? (T[k][1] - T[k][0]) * 1000 / +PREF.arate + 1200 : g.t.split(" ").length * 470 / +PREF.rate + 900); }
    else if (ST.hasAudio) await playSeg(k, flow);
    else await utter(g.t, g.sp);
    if (id !== RUN) return;
    if (echo && !mine) { status(k, "your turn, repeat it"); await wait(T ? (T[k][1] - T[k][0]) * 1000 * +PREF.gap / +PREF.arate + 700 : g.t.split(" ").length * 380 * +PREF.gap / +PREF.rate + 700); }
    else if (!ST.hasAudio && k + 1 < ST.segs.length && ST.segs[k + 1].turn !== g.turn) await wait(260);
    if (only) break;
  }
  if (id === RUN) { setPlaying(false); highlight(-1); const nl = $("#nowline"); if (nl) nl.textContent = only ? `Sentence ${ST.seg + 1} of ${ST.segs.length}. Play it again or go to the next one.` : "Finished. Press Play to hear it again."; }
}
function setPlaying(on) { const p = $("#play"); if (p) p.textContent = on ? "Playing…" : "Play"; }
function stopAll() {
  RUN++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (REC) REC.pause();
  setPlaying(false); highlight(-1);
}
function updSeg() { const b = $("#splay"); if (b) b.textContent = `Play sentence ${ST.seg + 1} of ${ST.segs.length}`; }

function wirePlayer(s, opts = {}) {
  if (ST.hasAudio) {
    if (!REC || REC.dataset.n != ST.num) { REC = new Audio(audioUrl(ST.num)); REC.preload = "auto"; REC.dataset.n = ST.num; }
    $("#arate").value = ["0.75", "0.9", "1"].includes(PREF.arate) ? PREF.arate : "1";
    $("#arate").onchange = e => { PREF.arate = e.target.value; savePref(); REC.playbackRate = +e.target.value; };
    $("#back10").onclick = () => { const T = ALL.find(x => x.num === ST.num).t; const at = Math.max(0, (REC.currentTime || 0) - 10); let k = 0; T.forEach((g, i) => { if (g[0] <= at) k = i; }); ST.seg = k; playFrom(k); };
  } else {
  fillVoices();
  $("#rate").value = PREF.rate;
  $("#rate").onchange = e => { PREF.rate = e.target.value; savePref(); };
  $("#pv").onchange = e => { PREF.pv = e.target.value; savePref(); };
  if ($("#sv")) $("#sv").onchange = e => { PREF.sv = e.target.value; savePref(); };
  }
  if ($("#gap")) { $("#gap").value = PREF.gap; $("#gap").onchange = e => { PREF.gap = e.target.value; savePref(); }; }
  if ($("#roleplay")) $("#roleplay").onchange = e => ST.roleplay = e.target.checked;
  $("#play").onclick = () => playFrom(opts.resume && ST.seg < ST.segs.length - 1 ? ST.seg : 0, { echo: !!opts.echo });
  $("#stop").onclick = stopAll;
  if ($("#splay")) {
    updSeg();
    $("#splay").onclick = () => playFrom(ST.seg, { only: true });
    $("#sprev").onclick = () => { ST.seg = Math.max(0, ST.seg - 1); playFrom(ST.seg, { only: true }); };
    $("#snext").onclick = () => { ST.seg = Math.min(ST.segs.length - 1, ST.seg + 1); playFrom(ST.seg, { only: true }); };
  }
  document.querySelectorAll(".seg").forEach(e => e.onclick = () => playFrom(+e.dataset.seg, { only: !!opts.tapOne, echo: !!opts.echo }));
}

function nextRow(k) {
  return `<div class="nextrow">${k > 0 ? `<button class="btn secondary" data-go="${k - 1}">Back to round ${k}</button>` : "<span></span>"}${k < 5 ? `<button class="btn" data-go="${k + 1}">Go to round ${k + 2}: ${ROUNDS[k + 1][0].toLowerCase()}</button>` : `<button class="btn gold" id="finish">${DONE.has(ST.num) ? "Completed ✓" : "Mark this story as completed"}</button>`}</div>`;
}

function renderPanel(s) {
  const k = ST.round, P = $("#panel"), dlg = true;
  const answerBox = `<div class="field"><label for="answer">Your transcription</label><textarea id="answer" placeholder="Write exactly what you hear. You don't need to write the speakers' names.">${esc(ST.answer)}</textarea></div>`;
  const gistQs = ["Who is talking, and where are they?", "What is the problem, the news, or the question?", "How does the conversation end?"];
  if (k === 0) P.innerHTML = `<h3>Round 1: Listen for the main idea</h3>
    <p class="hint">Listen to the whole exchange once. Don't write while you listen. When it finishes, answer these questions in your own words.</p>
    ${playerHTML()}${dialogueHTML(s, false)}
    <ul class="prompts" style="margin-top:18px">${gistQs.map(q => `<li>${q}</li>`).join("")}</ul>
    <div class="field"><label for="gist">Your answers</label><textarea id="gist" class="short">${esc(ST.gist)}</textarea></div>${nextRow(k)}`;
  if (k === 1) P.innerHTML = `<h3>Round 2: Transcribe</h3>
    <p class="hint">Play one sentence at a time and write exactly what you hear. Replay a sentence as many times as you need. If you can't hear a word, leave a space and keep going.</p>
    ${playerHTML({ lines: true })}${dialogueHTML(s, false)}${answerBox}${nextRow(k)}`;
  if (k === 2) P.innerHTML = `<h3>Round 3: Listen again and fix</h3>
    <p class="hint">Play the whole story from the beginning and follow your transcription. Fix anything you're unsure about. Listen closely for the small words: <i>a, the, to, of, it's, don't, that</i>.</p>
    ${playerHTML()}${answerBox}${nextRow(k)}`;
  if (k === 3) P.innerHTML = `<h3>Round 4: Compare</h3>
    <p class="hint">Check your transcription against the text. Look at the words you missed. Were they small words? Words linked together? New words you didn't know?</p>
    ${answerBox}<div class="actions"><button class="btn gold" id="check">Check my transcription</button></div><div id="result"></div><div class="cats"><h4>Why did you miss it?</h4><p class="hint">For each word or phrase you missed, decide which kind of mistake it was. Over time, this shows you what to practise.</p><ol type="A"><li><b>New vocabulary:</b> you didn't know the word.</li><li><b>Known word, not recognized:</b> you know it when you read it, but you didn't hear it.</li><li><b>Connected speech:</b> words were linked or shortened, like “wanna” or “gotta.”</li><li><b>Small words:</b> you missed little words like “a,” “the,” “to” or “of.”</li><li><b>Meaning:</b> you heard every word, but misunderstood what the person meant.</li></ol></div>${nextRow(k)}`;
  if (k === 4) P.innerHTML = `<h3>Round 5: Shadow</h3>
    <p class="hint">Now the text is visible. Follow the highlight while the voices speak, and tap any sentence to hear it from there. Then play it again and speak along with the voices, at the same time, copying their rhythm and the small words.</p>
    ${playerHTML({ resume: false })}${dialogueHTML(s, true)}
    <div class="listenfor"><h4>Listen for</h4><p>${esc(s.F)}</p>${s.V ? `<p><b>Words and phrases:</b> ${esc(s.V)}</p>` : ""}</div>${nextRow(k)}`;
  if (k === 5) P.innerHTML = `<h3>Round 6: Retell and Respond</h3>
    <p class="hint">First, echo: after each sentence there's a pause, so say it out loud. Then tick the box and take ${esc(roleName())}'s part: that voice goes quiet and you say the lines yourself. Finally, close the text and tell the story in your own words, as if you were telling a friend. Last, answer two short situations in your own words.</p>
    ${playerHTML({ echo: true })}${dialogueHTML(s, true)}
    <div class="mine"><h4>Tell it in your own words</h4>
      <ul class="prompts"><li>Who is in the story, and where are they?</li><li>What happens first, next, and at the end?</li><li>Use at least three of the words from “Listen for.”</li><li>Say it out loud in one or two minutes, without looking at the text.</li></ul>
      <div class="field"><label for="mineTxt">My notes (saved in this browser)</label><textarea id="mineTxt" class="short">${esc(store.get("mine:" + s.num, ""))}</textarea></div>
    </div><div class="respond"><h4>Respond</h4><p class="hint">Now it's your turn. Read the situation, say your answer out loud, and write it if you like. Then compare it with the model answer.</p>
      ${(s.R || []).map((r, i) => `<div class="rsp"><p class="rsit">${esc(r[0])}</p><p class="rq"><b>${esc(r[1])}:</b> “${esc(r[2])}”</p><div class="field"><label for="rsp${i}">Your answer (saved in this browser)</label><textarea id="rsp${i}" class="short" data-rsp="${i}">${esc(store.get(`rsp:${s.num}:${i}`, ""))}</textarea></div><button class="btn secondary" data-model="${i}">Show a model answer</button><p class="model" id="model${i}" hidden><b>Model answer:</b> ${esc(r[3])}<span>Your answer doesn't have to match. Any natural, polite reply that fits the situation is good.</span></p></div>`).join("")}
    </div>${nextRow(k)}`;
  if ($("#mineTxt")) $("#mineTxt").oninput = e => store.set("mine:" + s.num, e.target.value);
  P.querySelectorAll("[data-rsp]").forEach(t => t.oninput = e => store.set(`rsp:${ST.num}:${t.dataset.rsp}`, e.target.value));
  P.querySelectorAll("[data-model]").forEach(b => b.onclick = () => { const m = $("#model" + b.dataset.model); m.hidden = !m.hidden; b.textContent = m.hidden ? "Show a model answer" : "Hide the model answer"; });
  if (k !== 3) wirePlayer(s, { echo: k === 5, tapOne: k === 5 });
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if ($("#finish")) $("#finish").onclick = () => { ST.done.add(5); markDone(ST.num); renderScript(ST.num); renderNav($("#q").value); };
  if (k === 3) { $("#check").onclick = () => { saveFields(); check(s); }; if (ST.result) showResult(s); }
}

/* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'éãçõáíóúâêô½%]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').replace(/—|–/g, " ").split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
function check(s) {
  const FULL = tokens(fullText(s)), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  const lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), other = [], extra = [], rest = [];
  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), other, extra };
  ST.done.add(3); showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the text yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  const acad = [...new Set(R.other.filter(w => w.length > 7))].slice(0, 20);
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="send">Email my results to Ron</button><button class="btn secondary" id="copy">Copy my results</button></div>
      <p>This opens your email app with your results already written. Nothing is sent until you press send. If your email app doesn't open, copy your results and paste them into an email to ${TEACHER_EMAIL}.</p>
      <p class="status" id="status" role="status"></p>
    </div></div>`;
  $("#sname").oninput = e => { ST.name = e.target.value; store.set("name", ST.name); };
  $("#send").onclick = () => { location.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(`Listening Lab: Story ${s.num}, ${s.title}`)}&body=${encodeURIComponent(resultText(s))}`; };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    $("#status").textContent = "Copied. Paste it into an email or a message to Ron.";
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Story: ${s.num}. ${s.title} (Part ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
</html>
