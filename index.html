he school supplies?"], ["A friend asks where to buy cheap party supplies.", "Friend", "Where should I buy party decorations?", "Try the dollar store. Everything's under five dollars."]]}, {"num": 42, "title": "A Trip to Canadian Tire", "lines": [["P", "Ha! A credit card? You need a trip to Canadian Tire.", "Glen"], ["S", "What's Canadian Tire? A tire store?", "Fábio"], ["P", "It sells tires, but it sells almost everything else too. Car stuff, tools, camping gear, sports equipment, kitchen things, Christmas decorations. It's a Canadian classic. I'll come with you on Saturday.", "Glen"], ["S", "This store is huge.", "Fábio"], ["P", "First, the automotive section. You need a snow brush and an ice scraper. This one has both, for fifteen dollars.", "Glen"], ["S", "Perfect. What else?", "Fábio"], ["P", "Windshield washer fluid for winter. Make sure it says \"minus forty.\" The summer kind can freeze.", "Glen"], ["S", "Minus forty? It never gets that cold in Vancouver.", "Fábio"], ["P", "No, but in the mountains, it can. Do you have winter tires?", "Glen"], ["S", "No. Do I need them?", "Fábio"], ["P", "Not in the city, usually. But if you drive on the highway to Whistler or into the mountains after October 1st, you need them. You can buy them here, and they'll install them in the garage.", "Glen"], ["S", "Excuse me. How much are winter tires for a Toyota Corolla?", "Fábio"], ["P", "About six hundred to eight hundred dollars for four tires, plus installation. We're pretty busy this time of year, so you should book an appointment. The next opening is in two weeks.", "Employee"], ["S", "Two weeks? Everyone had the same idea.", "Fábio"], ["P", "Every November!", "Employee"], ["P", "One more stop. The seasonal aisle. Christmas lights, fake trees, and snow shovels. You'll want one of these too, just in case.", "Glen"], ["S", "Do you have a Triangle Rewards card?", "Cashier"], ["S", "No, what's that?", "Fábio"], ["P", "When I was a kid, Canadian Tire gave you \"Canadian Tire money,\" little paper coupons that looked like real money. My dad kept a big jar of it. Now it's a card.", "Glen"], ["S", "Then I'll sign up.", "Fábio"], ["S", "Glen! Look! Two minutes with my new brush, and the windshield is clean!", "Fábio"], ["P", "Thumbs up!", "Glen"]], "words": 288, "kind": "story", "scene": "It's Fábio's first November in Vancouver. One morning, his windshield is covered in frost, so he scrapes it with his credit card. His neighbour Glen sees him.", "F": "finding products and asking for help, seasonal items, prices, do, didn't, should, will, -ed", "V": "Canadian Tire, automotive, tools, hardware, camping, sporting goods, seasonal, snow brush, ice scraper, windshield washer fluid, winter tires, installation, Triangle Rewards, \"Canadian Tire money\"", "t": [[2.0, 2.73], [2.95, 4.23], [4.45, 6.6], [7.27, 8.53], [8.75, 9.69], [10.36, 14.05], [14.27, 19.77], [19.99, 21.85], [22.07, 23.97], [24.64, 25.81], [26.48, 28.49], [28.71, 31.16], [31.38, 33.87], [34.54, 35.23], [35.45, 36.13], [36.8, 39.04], [39.26, 41.52], [41.74, 43.36], [44.03, 45.04], [45.26, 47.2], [47.87, 49.81], [50.03, 51.61], [52.28, 52.83], [53.05, 53.9], [54.57, 56.26], [56.48, 62.67], [62.89, 66.36], [67.03, 67.93], [68.15, 70.77], [71.44, 75.88], [76.1, 79.56], [79.78, 81.53], [82.2, 82.92], [83.14, 84.59], [85.26, 86.31], [86.98, 88.28], [88.5, 89.97], [90.19, 93.01], [93.23, 95.64], [96.31, 98.29], [98.96, 99.9], [100.57, 108.42], [108.64, 110.75], [110.97, 112.4], [113.07, 114.08], [114.75, 115.32], [115.54, 116.05], [116.27, 119.22], [119.89, 120.87]], "R": [["It's a frosty morning. Your neighbour sees you scraping the windshield with a card.", "Neighbour", "You know you can get an ice scraper at Canadian Tire, right?", "Really? I didn't know. I'll go today. Where can I find them in the store?"], ["You ask about winter tires.", "Employee", "Would you like winter tires installed?", "Yes, please. How long does the installation take?"]]}, {"num": 43, "title": "Furnishing an Apartment at IKEA", "lines": [["P", "Go to IKEA. There's one in Coquitlam and one in Richmond. You'll find everything there. But go on a weekday if you can. Weekends are crazy.", "Crystal"], ["S", "Any tips?", "Priscila"], ["P", "Follow the arrows on the floor. The showroom goes in a big circle. If you want to skip a section, look for the shortcuts. And write down the aisle and bin numbers.", "Crystal"], ["S", "Excuse me, can our son stay in the play area while we shop?", "Priscila"], ["P", "He can stay for up to one hour. He needs to be tall enough. Let me measure him. He's just tall enough.", "Employee"], ["S", "I like this sofa. What does the tag say?", "Tiago"], ["S", "The price, and \"Aisle 24, Bin 17.\"", "Priscila"], ["S", "What does that mean?", "Tiago"], ["S", "Write it down. Crystal told me. You don't take the furniture here. You find it downstairs in boxes.", "Priscila"], ["S", "Okay. We still need a bed, a dining table, four chairs, and a bookshelf.", "Tiago"], ["S", "And I'll write down every number.", "Priscila"], ["S", "It's noon. Let's pick up our son and eat some Swedish meatballs.", "Tiago"], ["S", "Now the marketplace. Lamps, towels, and kitchen things.", "Priscila"], ["S", "The self-serve furniture area is like a giant warehouse. Here's Aisle 24, Bin 17. The sofa is in three flat boxes.", "Tiago"], ["S", "These boxes are too big for our car.", "Priscila"], ["P", "We can arrange delivery. There's a fee, and it'll arrive in three to five days.", "Employee"], ["S", "And do you assemble it?", "Tiago"], ["P", "We have an assembly service for an extra cost, or you can do it yourself. Every box has instructions and an Allen key.", "Employee"], ["S", "We'll do it ourselves.", "Tiago"], ["S", "Two full weekends. And we have four screws left over. Where did they come from?", "Priscila"], ["S", "No idea. I'll sit down carefully. It didn't fall. I think we're fine.", "Tiago"]], "words": 277, "kind": "story", "scene": "Priscila and Tiago have moved into an unfurnished apartment. They have two suitcases, a mattress, and four plates. Priscila's coworker Crystal has some advice.", "F": "following signs and instructions, aisle and bin numbers, prices, didn't, can, should, will, -ed", "V": "showroom, arrows, shortcut, marketplace, self-serve furniture area, aisle, bin, flat-pack, assembly, Allen key, instructions, delivery, return policy, supervised play area", "t": [[2.0, 3.11], [3.33, 5.97], [6.19, 7.71], [7.93, 9.61], [9.83, 11.16], [11.83, 12.64], [13.31, 15.04], [15.26, 17.07], [17.29, 20.0], [20.22, 22.35], [23.02, 26.46], [27.13, 28.79], [29.01, 30.53], [30.75, 31.81], [32.03, 33.35], [34.02, 35.13], [35.35, 36.46], [37.13, 40.1], [40.77, 41.73], [42.4, 43.27], [43.49, 44.65], [44.87, 46.55], [46.77, 48.84], [49.51, 50.17], [50.39, 54.02], [54.69, 56.44], [57.11, 57.81], [58.03, 60.87], [61.54, 62.75], [62.97, 64.89], [65.56, 68.81], [69.03, 71.16], [71.38, 73.43], [74.1, 76.36], [77.03, 78.4], [78.62, 81.43], [82.1, 83.27], [83.94, 87.96], [88.18, 90.71], [91.38, 92.54], [93.21, 94.32], [94.54, 96.5], [96.72, 97.93], [98.6, 99.44], [99.66, 100.87], [101.09, 101.97], [102.19, 103.17]], "R": [["You're shopping at IKEA.", "Employee", "Can I help you?", "Yes, please. Where's the self-serve furniture area? I need aisle 14, bin 8."], ["A friend asks about your new furniture.", "Friend", "Did you put it together yourself?", "Yes! It took three hours, but we did it. The instructions were confusing."]]}, {"num": 44, "title": "Ordering at a Restaurant", "lines": [["P", "Hi, folks! I'm Megan, and I'll be taking care of you tonight. Can I start you off with something to drink?", "Megan"], ["S", "Could I get a glass of water, please?", "Rafa"], ["P", "Sure. Still or sparkling?", "Megan"], ["S", "Just tap water, please.", "Rafa"], ["P", "A glass of white wine, please.", "Tanya"], ["S", "And a local beer for me.", "Marty"], ["P", "Today's special is the wild salmon with rice and vegetables. It's thirty-two dollars. Are you ready to order, or do you need a few more minutes?", "Megan"], ["S", "I think we're ready. Could we start with the calamari to share?", "Marty"], ["P", "Of course. And for your mains?", "Megan"], ["P", "I'll have the salmon special, please. Does it come with a salad?", "Tanya"], ["P", "It doesn't, but you can add a side salad for five dollars.", "Megan"], ["S", "I'd like the burger, please.", "Marty"], ["P", "Would you like fries or salad with that?", "Megan"], ["S", "Fries, please.", "Marty"], ["S", "I'll have the steak, please.", "Rafa"], ["P", "How would you like it cooked?", "Megan"], ["S", "Medium-rare.", "Rafa"], ["P", "For your side, you can have mashed potatoes, fries, or seasonal vegetables.", "Megan"], ["S", "Mashed potatoes, please.", "Rafa"], ["P", "Do you have any allergies I should know about?", "Megan"], ["S", "I don't, but Tanya is allergic to nuts.", "Rafa"], ["P", "Thanks for letting me know. I'll tell the kitchen.", "Megan"], ["P", "Is everything tasting okay?", "Megan"], ["P", "It's delicious.", "Tanya"], ["S", "Can I get a box for this? There's still half of my steak.", "Rafa"], ["P", "Absolutely. Can I get you anything else? Dessert? Coffee?", "Megan"], ["S", "No, thanks. Just the bill, please.", "Rafa"], ["P", "Together or separate?", "Megan"], ["P", "Separate, please.", "Tanya"], ["S", "Fifty-one dollars and twenty cents. The machine shows eighteen percent, twenty percent, twenty-two percent, or custom. I'll choose eighteen.", "Rafa"], ["S", "Marty, is eighteen percent normal here? In Brazil, the service charge is usually ten percent, and it's already on the bill.", "Rafa"], ["S", "Eighteen is pretty normal now. It used to be less, but prices went up, and so did the tips.", "Marty"]], "words": 283, "kind": "story", "scene": "On Saturday night, Rafa goes to a restaurant on Granville Island with his friends Marty and Tanya.", "F": "ordering and answering the server's questions, prices, percentages, would/could/can, do/does/don't, did", "V": "server, \"Can I start you off with...?\", still or sparkling, tap water, special, side, \"How would you like it cooked?\", medium-rare, allergy, \"Is everything tasting okay?\", box (for leftovers), the bill, separate bills, tip, payment machine", "t": [[2.0, 3.0], [3.22, 5.72], [5.94, 7.94], [8.61, 10.38], [11.05, 11.72], [11.94, 13.17], [13.84, 15.17], [15.84, 17.67], [18.34, 19.73], [20.4, 24.13], [24.35, 25.69], [25.91, 28.82], [29.49, 30.53], [30.75, 32.74], [33.41, 34.3], [34.52, 35.63], [36.3, 38.33], [38.55, 39.76], [40.43, 43.48], [44.15, 45.54], [46.21, 48.3], [48.97, 49.97], [50.64, 51.92], [52.59, 53.92], [54.59, 55.4], [56.07, 60.5], [61.17, 62.56], [63.23, 65.51], [66.18, 68.32], [68.99, 70.37], [70.59, 71.83], [72.5, 74.17], [74.84, 75.75], [76.42, 77.81], [78.03, 79.5], [80.17, 81.13], [81.35, 82.8], [83.02, 83.83], [84.05, 84.82], [85.49, 86.28], [86.5, 87.67], [88.34, 89.62], [90.29, 91.38], [92.05, 93.95], [94.17, 98.76], [98.98, 100.02], [100.69, 102.68], [102.9, 107.7], [108.37, 110.05], [110.27, 113.51]], "R": [["You're at a restaurant.", "Server", "Can I start you off with something to drink?", "Just tap water for now, thanks."], ["The server asks about your steak.", "Server", "How would you like it cooked?", "Medium-rare, please. And I have a nut allergy. Is there anything with nuts?"]]}]}, {"part": 6, "title": "Health and Safety", "desc": "Clinics, emergencies, and staying safe in B.C.", "scripts": [{"num": 45, "title": "The Walk-In Clinic and the Pharmacy", "lines": [["P", "Good morning. Can I see your BC Services Card? Have you been here before?", "Receptionist"], ["S", "No, this is my first time. I got here at eight thirty, and there were already six people in line!", "Beatriz"], ["P", "It's always busy. Please fill out this form. The wait is about an hour.", "Receptionist"], ["P", "Beatriz? Come in. I'm Dr. Reid. Let me look in your throat and check your ears. It looks like strep throat. I'm going to do a quick swab.", "Dr. Reid"], ["P", "The test is positive. You need an antibiotic. Are you allergic to any medications?", "Dr. Reid"], ["S", "I'm allergic to penicillin.", "Beatriz"], ["P", "Good thing I asked. Then I'll give you a different antibiotic. Which pharmacy do you use?", "Dr. Reid"], ["S", "The one across the street.", "Beatriz"], ["P", "I'll send the prescription there.", "Dr. Reid"], ["S", "Hi, I'm Jason, the pharmacist. Can you confirm your date of birth?", "Jason"], ["S", "June 4th, nineteen eighty-eight.", "Beatriz"], ["S", "Have you taken this medication before?", "Jason"], ["S", "No, I haven't.", "Beatriz"], ["S", "Take one tablet twice a day, in the morning and in the evening, with food. Take it for ten days, and finish all of it, even if you feel better.", "Jason"], ["S", "Why do I need to finish it?", "Beatriz"], ["S", "If you stop early, the infection can come back.", "Jason"], ["S", "Does it have any side effects?", "Beatriz"], ["S", "Some people get an upset stomach. If you get a rash, or if you have trouble breathing, stop taking it and get help right away.", "Jason"], ["S", "Okay.", "Beatriz"], ["S", "There's a generic version and a brand-name version. The generic is cheaper and works the same way. Is the generic okay?", "Jason"], ["S", "Yes, that's fine.", "Beatriz"], ["S", "Do you have extended health benefits through your work?", "Jason"], ["S", "I do.", "Beatriz"], ["S", "Then your insurance covers eighty percent. You'll pay six dollars and forty cents. And by the way, in BC, pharmacists can prescribe medication for some minor problems.", "Jason"], ["S", "I didn't know that. Thank you. I'll finish all of it.", "Beatriz"]], "words": 296, "kind": "story", "scene": "Beatriz has had a sore throat and a fever for four days. She doesn't have a family doctor yet, so she goes to a walk-in clinic on Commercial Drive. It's first come, first served.", "F": "medical questions, instructions (twice a day, for ten days), dates of birth, prices, have, didn't, does, should", "V": "walk-in clinic, first come first served, family doctor, sore throat, swab, positive, antibiotic, prescription, pharmacist, generic, brand name, side effects, rash, extended health benefits, \"finish all of it\"", "t": [[2.0, 2.83], [3.05, 5.1], [5.32, 6.64], [7.31, 8.91], [9.13, 12.82], [13.49, 14.65], [14.87, 16.21], [16.43, 18.05], [18.72, 19.66], [19.88, 20.65], [20.87, 21.98], [22.2, 24.44], [24.66, 26.06], [26.28, 27.93], [28.6, 30.07], [30.29, 31.8], [32.02, 34.05], [34.72, 36.21], [36.88, 38.08], [38.3, 40.73], [40.95, 42.47], [43.14, 44.31], [44.98, 46.56], [47.23, 49.49], [49.71, 51.65], [52.32, 54.35], [55.02, 57.43], [58.1, 59.04], [59.71, 64.19], [64.41, 68.48], [69.15, 70.45], [71.12, 74.13], [74.8, 76.36], [77.03, 79.14], [79.36, 85.01], [85.68, 86.28], [86.95, 90.13], [90.35, 93.27], [93.49, 95.22], [95.89, 97.0], [97.67, 100.46], [101.13, 101.75], [102.42, 105.0], [105.22, 107.66], [107.88, 114.04], [114.71, 115.71], [115.93, 116.59], [116.81, 117.88]], "R": [["You're at a walk-in clinic.", "Receptionist", "What brings you in today?", "I've had a sore throat and a fever for four days."], ["The pharmacist asks about your medication.", "Pharmacist", "Would you like the generic or the brand name?", "The generic, please. Are there any side effects?"]]}, {"num": 46, "title": "Going to Emergency", "lines": [["P", "Call 8-1-1. A nurse can tell you if you should go to Emergency.", "Wife"], ["S", "HealthLink BC. Where is the pain? Are you vomiting?", "Nurse"], ["P", "In my lower back, on the right. I vomited once.", "Marcelo"], ["S", "With that kind of pain and vomiting, you should go to Emergency now.", "Nurse"], ["S", "I'm Sylvia, the triage nurse. Can I see your BC Services Card? What's your date of birth?", "Sylvia"], ["P", "March thirteenth, nineteen eighty-five.", "Marcelo"], ["S", "Thirteenth or thirtieth?", "Sylvia"], ["P", "Thirteenth. One-three.", "Marcelo"], ["S", "Your temperature is thirty-eight point two. That's a small fever. On a scale of one to ten, how bad is the pain?", "Sylvia"], ["P", "About seven. Sometimes a nine.", "Marcelo"], ["S", "Is it a sharp pain or a dull pain?", "Sylvia"], ["P", "Sharp. Like a knife.", "Marcelo"], ["S", "Do you have any allergies to medications?", "Sylvia"], ["P", "I'm allergic to penicillin.", "Marcelo"], ["S", "Please take a seat. We see the most serious cases first.", "Sylvia"], ["P", "Three hours and forty minutes. How are you holding up?", "Barry"], ["P", "Not great, Barry. Thanks for driving me.", "Marcelo"], ["S", "I'm Dr. Fraser. Does this hurt?", "Dr. Fraser"], ["P", "Yes! Right there.", "Marcelo"], ["S", "I'm going to order a blood test, a urine test, and an ultrasound.", "Dr. Fraser"], ["S", "You have a kidney stone. The good news is that it's small, only four millimetres. It should pass on its own.", "Dr. Fraser"], ["P", "Four millimetres? It feels like forty!", "Marcelo"], ["S", "This medicine will help with the pain. You're going to be discharged today. Here's a prescription for pain medication. Drink lots of water. If the pain gets worse, or if your fever goes above thirty-nine, come back right away.", "Dr. Fraser"], ["P", "Do I need to see another doctor?", "Marcelo"], ["S", "Yes. Follow up with your family doctor in one or two weeks.", "Dr. Fraser"], ["P", "I don't have a family doctor yet.", "Marcelo"], ["S", "Then call 8-1-1, and they'll help you.", "Dr. Fraser"], ["P", "It's nine thirty. Let's get you home. How are you feeling?", "Barry"], ["P", "Tired. But I learned a lot of new English words tonight.", "Marcelo"]], "words": 293, "kind": "story", "scene": "At two o'clock in the morning, Marcelo wakes up with a terrible pain in his lower back, on the right side. The pain comes in waves.", "F": "describing symptoms, pain scale, dates of birth, temperatures, times, 13/30, does, is, can", "V": "Emergency (the ER), HealthLink BC 8-1-1, triage nurse, BC Services Card, symptoms, sharp/dull pain, pain scale, temperature, blood pressure, allergies, medications, ultrasound, diagnosis, discharged, prescription, follow up, family doctor", "t": [[2.0, 3.26], [3.48, 6.42], [7.09, 8.33], [8.55, 9.6], [9.82, 10.82], [11.49, 13.07], [13.29, 14.37], [15.04, 18.65], [19.32, 21.15], [21.37, 23.49], [23.71, 25.07], [25.74, 27.68], [28.35, 29.74], [30.41, 31.07], [31.29, 32.06], [32.73, 34.88], [35.1, 36.41], [36.63, 39.31], [39.98, 40.88], [41.1, 42.1], [42.77, 44.69], [45.36, 45.94], [46.16, 46.97], [47.64, 49.77], [50.44, 51.89], [52.56, 53.76], [53.98, 55.96], [56.63, 58.57], [58.79, 60.29], [60.96, 61.96], [62.18, 63.33], [64.0, 65.24], [65.46, 66.33], [67.0, 67.56], [67.78, 68.48], [69.15, 72.71], [73.38, 74.62], [74.84, 77.66], [77.88, 79.09], [79.76, 80.66], [80.88, 82.01], [82.68, 84.47], [84.69, 86.38], [86.6, 88.75], [88.97, 90.23], [90.45, 95.04], [95.71, 97.35], [98.02, 98.62], [98.84, 101.61], [102.28, 103.99], [104.66, 106.75], [107.42, 108.83], [109.05, 110.41], [110.63, 112.04], [112.71, 113.35], [113.57, 116.11]], "R": [["A triage nurse asks about your pain.", "Nurse", "On a scale of one to ten, how bad is the pain?", "About an eight. It's a sharp pain on my right side, and it comes in waves."], ["The nurse asks about allergies.", "Nurse", "Do you have any allergies?", "Yes, I'm allergic to penicillin."]]}, {"num": 47, "title": "Calling 911", "lines": [["P", "Mr. Walsh! Are you okay? Mr. Walsh?", "Luana"], ["S", "911, what's your emergency? Do you need police, fire, or ambulance?", "Operator"], ["P", "Ambulance, please. My neighbour fell down the stairs.", "Luana"], ["S", "I'm connecting you to the ambulance dispatcher. Stay on the line.", "Operator"], ["P", "Ambulance. What's your emergency, please?", "Dispatcher"], ["P", "My neighbour fell down the stairs. He isn't answering me.", "Luana"], ["P", "What's the address of the emergency?", "Dispatcher"], ["P", "It's three four one five East Thirteenth Avenue.", "Luana"], ["P", "Sorry, East Thirteenth or East Thirtieth?", "Dispatcher"], ["P", "Thirteenth. One-three.", "Luana"], ["P", "What's the nearest cross street?", "Dispatcher"], ["P", "Knight Street.", "Luana"], ["P", "Is it an apartment building?", "Dispatcher"], ["P", "Yes. He's in the hallway on the second floor, near suite two fourteen.", "Luana"], ["P", "Two fourteen or two forty?", "Dispatcher"], ["P", "Two fourteen. One-four.", "Luana"], ["P", "And what's the phone number you're calling from?", "Dispatcher"], ["P", "Six oh four, five five five, forty-seven eighteen.", "Luana"], ["P", "Okay. Help is on the way. How old is he?", "Dispatcher"], ["P", "About eighty.", "Luana"], ["P", "Is he conscious?", "Dispatcher"], ["P", "His eyes are closed. Wait, he opened his eyes. He's looking at me.", "Luana"], ["P", "Good. Is he breathing normally?", "Dispatcher"], ["P", "Yes, I think so.", "Luana"], ["P", "Is he bleeding?", "Dispatcher"], ["P", "There's a little blood on his head. Not much.", "Luana"], ["P", "Don't move him. He may have hurt his neck or his back. Do you have a clean towel?", "Dispatcher"], ["P", "I can get one from my apartment.", "Luana"], ["P", "Press it gently on the cut. Don't lift his head.", "Dispatcher"], ["S", "I missed the last step.", "Mr. Walsh"], ["P", "Is the front door of the building locked?", "Dispatcher"], ["P", "It is. Visitors have to use the buzzer.", "Luana"], ["P", "Can someone go down and open the door for the paramedics?", "Dispatcher"], ["P", "My husband can. He's running down now.", "Luana"], ["P", "I can hear the sirens.", "Luana"], ["P", "We'll take it from here. You did everything right.", "Paramedic"], ["S", "Hi, I'm Ruth, Mr. Walsh's daughter. He broke his wrist, but he's going to be okay. Thank you for calling so quickly.", "Ruth"], ["P", "I was so nervous. I didn't know if I could understand them.", "Luana"], ["S", "Well, you did.", "Ruth"]], "words": 297, "kind": "story", "scene": "On Sunday afternoon, Luana hears a loud noise in the hallway of her building. Her neighbour, Mr. Walsh, who is about eighty, is lying at the bottom of the stairs.", "F": "answering questions under pressure, addresses and phone numbers (13/30, 14/40), is/isn't, was, did/didn't, can", "V": "emergency, police, fire, ambulance, dispatcher, paramedics, address, cross street, suite, buzzer, conscious, breathing, bleeding, stay on the line", "t": [[2.0, 2.83], [3.05, 3.86], [4.08, 4.94], [5.61, 7.57], [7.79, 10.05], [10.72, 11.85], [12.07, 13.65], [14.32, 16.96], [17.18, 18.23], [18.9, 19.97], [20.19, 22.04], [22.71, 24.29], [24.51, 25.79], [26.46, 28.51], [29.18, 31.78], [32.45, 35.01], [35.68, 36.43], [36.65, 37.37], [38.04, 39.73], [40.4, 41.25], [41.92, 43.67], [44.34, 44.88], [45.1, 48.51], [49.18, 51.12], [51.79, 52.75], [52.97, 53.67], [54.34, 56.67], [57.34, 60.75], [61.42, 62.34], [62.56, 63.9], [64.12, 65.47], [66.14, 66.99], [67.66, 68.88], [69.55, 70.7], [70.92, 72.69], [72.91, 73.89], [74.56, 75.27], [75.49, 77.02], [77.69, 78.89], [79.56, 80.88], [81.55, 83.08], [83.3, 84.05], [84.72, 85.81], [86.03, 88.27], [88.49, 90.22], [90.89, 92.62], [93.29, 95.03], [95.25, 96.6], [97.27, 98.51], [99.18, 101.35], [102.02, 102.66], [102.88, 104.72], [105.39, 108.8], [109.47, 110.52], [110.74, 112.04], [112.71, 114.01], [114.68, 115.83], [116.05, 117.27], [117.94, 120.22], [120.44, 122.93], [123.15, 124.9], [125.57, 126.66], [126.88, 128.8], [129.47, 130.43]], "R": [["You call 911.", "Operator", "911, do you need police, fire, or ambulance?", "Ambulance, please. My neighbour fell down the stairs."], ["The dispatcher asks about your neighbour.", "Dispatcher", "Is he conscious and breathing?", "Yes, he's conscious and breathing, but he can't get up. He's bleeding a little."]]}, {"num": 48, "title": "Earthquake Ready", "lines": [["P", "This is a drill. Drop, cover, and hold on.", "Speaker"], ["S", "Bev, what do I do?", "André"], ["P", "Copy me. Under the desk.", "Bev"], ["P", "The drill is over.", "Speaker"], ["P", "Every October, BC has a big earthquake drill called the ShakeOut. Vancouver is in an earthquake zone. Scientists say a big one could happen someday, so everyone should be ready.", "Bev"], ["S", "What should I do in a real earthquake?", "André"], ["P", "Drop to the ground. Take cover under a strong table or desk. Hold on until the shaking stops. Don't run outside, because things can fall from buildings.", "Bev"], ["S", "What about standing in a doorway? In movies, people do that.", "André"], ["P", "That's an old idea. It isn't safer. Get under a table.", "Bev"], ["S", "Luísa, we need an emergency kit. Bev says after a big earthquake, we might need to take care of ourselves for at least seventy-two hours.", "André"], ["S", "Seventy-two hours? That's three days.", "Luísa"], ["S", "Right. Stores might be closed, and there might be no power or water.", "André"], ["S", "Okay, let's make a list. Water, food, a flashlight, extra batteries, a first aid kit, medications, a battery radio, cash, warm clothes, and copies of our passports.", "Luísa"], ["S", "Good list.", "André"], ["S", "How much water?", "Luísa"], ["S", "Four litres per person per day. There are four of us, so that's sixteen litres a day. For three days, that's forty-eight litres.", "André"], ["S", "That's a lot of water.", "Luísa"], ["S", "It is. But it's important. We can keep it all in a big plastic box in the hall closet.", "André"], ["S", "And we need a family plan. If we're not together when it happens, where do we meet?", "Luísa"], ["S", "At the kids' school. And we need a contact outside BC, in case phone lines here are busy.", "André"], ["S", "Your cousin in Toronto.", "Luísa"], ["S", "Okay, kids, let's practise. Earthquake!", "André"], ["S", "Good job! Under the kitchen table, holding the legs.", "Luísa"], ["P", "Dad, what if the earthquake happens during dinner?", "Daughter"], ["S", "Then take your plate with you. But hold on to the table first.", "André"]], "words": 306, "kind": "story", "scene": "It's October. At ten fifteen, André's office has an earthquake drill.", "F": "instructions (drop, cover, hold on), numbers (72 hours, 4 litres), should, don't, didn't", "V": "earthquake, drill, ShakeOut, Drop, Cover, and Hold On, emergency kit, supplies, 72 hours, flashlight, batteries, first aid kit, meeting place, out-of-province contact, gas leak, aftershock", "t": [[2.0, 3.24], [3.46, 5.21], [5.88, 6.94], [7.61, 8.42], [8.64, 9.63], [10.3, 11.58], [12.25, 16.28], [16.5, 18.61], [18.83, 22.67], [23.34, 25.17], [25.84, 27.02], [27.24, 29.58], [29.8, 31.72], [31.94, 34.99], [35.66, 37.2], [37.42, 38.87], [39.54, 40.74], [40.96, 42.02], [42.24, 43.37], [44.04, 45.98], [46.2, 52.14], [52.81, 53.89], [54.11, 55.05], [55.72, 56.28], [56.5, 59.91], [60.58, 62.14], [62.36, 71.87], [72.54, 73.29], [73.96, 74.88], [75.55, 77.25], [77.47, 80.1], [80.32, 82.41], [83.08, 84.25], [84.92, 85.58], [85.8, 86.87], [87.09, 90.54], [91.21, 92.62], [92.84, 95.51], [96.18, 97.16], [97.38, 101.92], [102.59, 104.02], [104.69, 106.23], [106.45, 107.18], [107.85, 108.59], [108.81, 111.14], [111.81, 114.11], [114.78, 116.13], [116.35, 118.07]], "R": [["There's an earthquake drill at work.", "Coworker", "What do we do in an earthquake?", "Drop, cover, and hold on. Get under a desk and hold on to it."], ["A friend asks about your emergency kit.", "Friend", "Do you have an emergency kit at home?", "Yes, with water, food, a flashlight, and batteries for seventy-two hours."]]}, {"num": 49, "title": "Hiking Safety on the North Shore", "lines": [["P", "Did you bring the ten essentials?", "Kevin"], ["S", "I think so. Tell me the list again.", "Tiago"], ["P", "A flashlight or headlamp, extra food and water, extra clothes, a map, something to start a fire, a first aid kit, an emergency blanket, a knife, sunscreen, and a whistle.", "Kevin"], ["S", "For a short hike?", "Tiago"], ["P", "Yes. North Shore Rescue saves hundreds of people every year. Most of them thought it would be a short hike. Did you tell someone where we're going?", "Kevin"], ["S", "No, I didn't.", "Tiago"], ["P", "Always leave a trip plan with someone. Tell them where you're going, which trail, and what time you'll be back. If you don't come back, they call for help.", "Kevin"], ["S", "Okay, I'm texting Priscila now. \"Mount Seymour, main trail, back by four.\"", "Tiago"], ["S", "That sign says \"Bear country.\" Are there really bears here?", "Tiago"], ["P", "There are. Black bears. Usually they don't want to meet you. Make noise when you walk, so they hear you coming. Talk, sing, or clap your hands.", "Kevin"], ["S", "And if we see one?", "Tiago"], ["P", "Don't run. Stay calm, talk in a low voice, and back away slowly. That's why I carry bear spray.", "Kevin"], ["S", "Kevin. Look. On the other side of the valley.", "Tiago"], ["P", "I see it. It's eating berries. It isn't looking at us. Let's keep talking and keep moving.", "Kevin"], ["S", "My heart is pounding.", "Tiago"], ["S", "The view of Vancouver is incredible. Can we stay longer?", "Tiago"], ["P", "It's one thirty. In October, the sun sets around six thirty, but it gets dark earlier in the forest. We should start going down.", "Kevin"], ["S", "That's early.", "Tiago"], ["P", "That's what everyone says. The trail is harder going down, and if someone gets hurt, it takes much longer. And there's almost no cell service up here.", "Kevin"], ["S", "Three forty-five, and we're back at the car. I'm texting Priscila. \"Back safely.\"", "Tiago"], ["P", "Good. Did you see any bears?", "Priscila"], ["S", "Just one. We backed away slowly, just like the rules say.", "Tiago"]], "words": 303, "kind": "story", "scene": "One Saturday in October, Kevin, who loves hiking, invites his friend Tiago to hike on Mount Seymour. They meet at the trailhead at nine.", "F": "advice and warnings (should/shouldn't, don't, make sure), times, distances, did/didn't, will", "V": "trail, trailhead, trip plan, the ten essentials, flashlight, headlamp, map, extra layers, cell service, get lost, search and rescue, bear, bear spray, make noise, back away slowly, sunset", "t": [[2.0, 3.88], [4.55, 5.38], [5.6, 6.75], [7.42, 19.09], [19.76, 20.74], [21.41, 22.12], [22.34, 25.79], [26.01, 28.57], [28.79, 30.69], [31.36, 32.26], [32.93, 35.1], [35.32, 39.03], [39.25, 41.71], [42.38, 44.26], [44.48, 46.78], [47.45, 49.05], [49.27, 50.49], [51.16, 52.05], [52.27, 53.38], [53.6, 55.78], [56.0, 58.83], [59.05, 60.89], [61.56, 62.54], [63.21, 64.26], [64.48, 67.8], [68.02, 70.05], [70.72, 71.32], [71.54, 72.07], [72.29, 73.68], [74.35, 75.41], [75.63, 77.11], [77.33, 78.95], [79.17, 81.15], [81.82, 82.97], [83.64, 85.52], [85.74, 86.87], [87.54, 88.84], [89.06, 94.59], [94.81, 96.51], [97.18, 97.95], [98.62, 100.37], [100.59, 105.75], [105.97, 108.41], [109.08, 111.1], [111.32, 112.56], [112.78, 113.74], [114.41, 114.94], [115.16, 116.38], [117.05, 117.82], [118.04, 120.51]], "R": [["A friend invites you on a hike.", "Friend", "Do you have the ten essentials?", "I think so. I have a map, a headlamp, extra layers, and water. Do I need bear spray?"], ["You tell your partner about your hike.", "Partner", "Where are you hiking, and when will you be back?", "We're hiking on Mount Seymour. I'll be back by five. Here's our trip plan."]]}]}, {"part": 7, "title": "Family, School, and Community", "desc": "Daycare, school, neighbours, and holidays.", "scripts": [{"num": 50, "title": "Finding a Daycare", "lines": [["P", "Start early. The waitlists in Vancouver are very long. Did you call anyone yet?", "Nicole"], ["S", "I called three daycares today. The first one, on Victoria Drive, didn't have any spaces for kids under three. The second one didn't answer. I left a message, but they didn't call me back. Now I'm calling the third one.", "Marina"], ["P", "Sunshine Daycare, this is Barb. How can I help you?", "Barb"], ["S", "Hi. I'm looking for a space for my son. He's eighteen months old.", "Marina"], ["P", "Okay. When do you need care?", "Barb"], ["S", "From March 1st.", "Marina"], ["P", "Hmm. We have a waitlist for the toddler room. Right now, it's about fourteen months.", "Barb"], ["S", "Sorry, fourteen or forty?", "Marina"], ["P", "Fourteen. One-four.", "Barb"], ["S", "That's too long for me. I need care in March.", "Marina"], ["P", "I understand. But you should still put his name on the list. Sometimes families move, and a space opens up.", "Barb"], ["S", "Does it cost anything to join the list?", "Marina"], ["P", "It doesn't. It's free.", "Barb"], ["S", "And how much is the daycare per month?", "Marina"], ["P", "We're a ten-dollar-a-day centre, so it's about two hundred and twenty dollars a month for full time.", "Barb"], ["S", "That's great. What are your hours?", "Marina"], ["P", "We're open from seven thirty to five thirty, Monday to Friday. Please don't be late at pick-up time. If you're late, there's a fee of one dollar per minute.", "Barb"], ["S", "What do I need to register him?", "Marina"], ["P", "His birth certificate, his immunization record, and the names of two emergency contacts.", "Barb"], ["S", "Does he need to bring lunch?", "Marina"], ["P", "No, he doesn't. We provide lunch and two snacks. But please bring diapers, a change of clothes, and a water bottle.", "Barb"], ["S", "Thank you so much, Barb. You have my phone number and my email.", "Marina"], ["P", "You're welcome. Good luck, and call some other centres too.", "Barb"], ["P", "Hi, it's Barb from Sunshine Daycare. You're lucky. A family just told us they're moving to Calgary. Can you visit on Thursday at ten?", "Barb"], ["S", "I can! Thank you! I don't think I'll sleep tonight. I'm too excited.", "Marina"]], "words": 316, "kind": "story", "scene": "Marina's son, Leo, is eighteen months old, and she starts a new job in March. Her friend Nicole has warned her to start looking for a daycare early.", "F": "phone calls, waitlists, 14/40, fees, hours, dates, does/doesn't, can, -ed", "V": "", "t": [[2.0, 2.92], [3.14, 5.27], [5.49, 6.92], [7.59, 9.21], [9.43, 14.27], [14.49, 16.01], [16.23, 18.77], [18.99, 20.57], [21.24, 23.2], [23.42, 24.63], [25.3, 25.9], [26.12, 27.87], [28.09, 29.39], [30.06, 30.81], [31.03, 32.16], [32.83, 33.83], [34.5, 35.1], [35.32, 37.39], [37.61, 39.55], [40.22, 41.97], [42.64, 43.47], [43.69, 44.55], [45.22, 46.41], [46.63, 47.8], [48.47, 49.54], [49.76, 51.79], [52.01, 54.93], [55.6, 57.67], [58.34, 59.17], [59.39, 60.24], [60.91, 62.77], [63.44, 68.43], [69.1, 69.91], [70.13, 71.22], [71.89, 75.52], [75.74, 77.64], [77.86, 80.44], [81.11, 82.69], [83.36, 88.82], [89.49, 90.83], [91.5, 92.61], [92.83, 94.58], [94.8, 98.3], [98.97, 100.33], [100.55, 102.79], [103.46, 104.38], [104.6, 106.84], [107.51, 109.77], [109.99, 110.85], [111.07, 113.8], [114.02, 115.74], [116.41, 117.05], [117.27, 117.96], [118.18, 119.71], [119.93, 120.96]], "R": [["You're visiting a daycare.", "Daycare manager", "Do you have any questions?", "Yes. What are your hours? And is there a waitlist?"], ["A friend gives you advice.", "Friend", "Start looking for a daycare early. The waitlists are long.", "Thanks. I'll call a few this week."]]}, {"num": 51, "title": "Registering for Kindergarten", "lines": [["P", "In British Columbia, children start kindergarten in the year they turn five? So she'll only be four on her first day?", "Carla"], ["S", "That's right. My son was four too. Your catchment school is Cedar Park Elementary, on East 22nd Avenue. It's about ten minutes from you.", "Stan"], ["P", "Good morning. How can I help you?", "Mrs. Clark"], ["P", "I'd like to register my daughter for kindergarten.", "Carla"], ["P", "Wonderful. Do you live in our catchment area?", "Mrs. Clark"], ["P", "I think so. We live on Knight Street, near 25th Avenue.", "Carla"], ["P", "Yes, you're in our catchment. Did you bring your documents?", "Mrs. Clark"], ["P", "I did. What do you need?", "Carla"], ["P", "Proof of her age, like a birth certificate or a passport. Proof of your address, like your lease or a BC Hydro bill. Your immigration documents, because you're new to Canada. And her immunization record, if you have it.", "Mrs. Clark"], ["P", "Here they are.", "Carla"], ["P", "This lease is fine, and her passport is fine. But this immunization record is in Portuguese.", "Mrs. Clark"], ["P", "Is that a problem?", "Carla"], ["P", "It isn't a big problem. You can take it to a public health unit, and a nurse will review it for you. Does Chloe have any allergies?", "Mrs. Clark"], ["P", "She doesn't. But she doesn't speak much English yet.", "Carla"], ["P", "Don't worry. Many of our kindergarten students are learning English. We have an ELL teacher, an English Language Learner teacher, who works with them.", "Mrs. Clark"], ["P", "What time does school start?", "Carla"], ["P", "The bell rings at eight fifty-five, and school finishes at three. But the first two weeks are gradual entry.", "Mrs. Clark"], ["P", "Gradual entry? What's that?", "Carla"], ["P", "The kindergarten students come for short days at first, so they can get used to school. The teacher will send you a schedule in August.", "Mrs. Clark"], ["P", "Can I stay with her on the first day?", "Carla"], ["P", "You can stay for a little while. Most parents stay for about twenty minutes.", "Mrs. Clark"], ["S", "Mom! Am I going to school?", "Chloe"], ["P", "You are. In September.", "Carla"], ["S", "Yay! Can I go tomorrow?", "Chloe"]], "words": 308, "kind": "story", "scene": "Carla's daughter, Chloe, turns five in October, so this September she'll start kindergarten. Carla's neighbour, Stan, explains how it works.", "F": "school office vocabulary (catchment, proof of address, immunization record, gradual entry), ages and dates, did, does/doesn't, is/isn't, can", "V": "", "t": [[2.0, 6.46], [6.68, 9.07], [9.74, 10.76], [10.98, 12.54], [12.76, 17.77], [17.99, 19.85], [20.52, 21.41], [21.63, 22.85], [23.52, 26.34], [27.01, 27.84], [28.06, 29.74], [30.41, 31.33], [31.55, 34.45], [35.12, 36.66], [36.88, 38.37], [39.04, 39.7], [39.92, 40.97], [41.64, 44.82], [45.04, 48.32], [48.54, 51.61], [51.83, 54.31], [54.98, 55.83], [56.5, 59.04], [59.26, 62.16], [62.83, 63.94], [64.61, 66.08], [66.3, 70.19], [70.41, 72.07], [72.74, 73.53], [73.75, 75.82], [76.49, 77.32], [77.54, 80.38], [80.6, 85.19], [85.86, 87.37], [88.04, 91.54], [91.76, 94.11], [94.78, 95.95], [96.17, 96.98], [97.65, 102.07], [102.29, 104.59], [105.26, 107.18], [107.85, 109.47], [109.69, 111.87], [112.54, 113.16], [113.38, 114.53], [115.2, 115.88], [116.1, 117.04], [117.71, 118.31], [118.53, 119.68]], "R": [["You're registering your child for kindergarten.", "School secretary", "How can I help you?", "Hi, I'd like to register my daughter for kindergarten. She turns five in October."], ["The secretary asks for documents.", "School secretary", "Do you have proof of address?", "Yes, I have our rental agreement and a utility bill."]]}, {"num": 52, "title": "A New Student in Grade Four", "lines": [["P", "Will he be in grade four here, or grade three?", "Julia"], ["S", "In BC, students are placed by age. Ben is nine, so he'll be in grade four.", "Mr. Morrison"], ["P", "Does he need to take a test?", "Julia"], ["S", "He doesn't need a test to register. But our ELL teacher will meet him in his first week to check his English. Then she'll decide how much support he needs.", "Mr. Morrison"], ["P", "Who will his teacher be?", "Julia"], ["S", "Mrs. Hughes. There are twenty-four students in her class. She's been at this school for thirteen years.", "Mr. Morrison"], ["P", "Thirteen or thirty?", "Julia"], ["S", "Thirteen. She isn't that old!", "Mr. Morrison"], ["P", "Is there homework?", "Julia"], ["S", "Not much in grade four. About twenty minutes of reading every night.", "Mr. Morrison"], ["P", "Does the school have a cafeteria?", "Julia"], ["S", "We don't, but we have a hot lunch program on Wednesdays. It costs five dollars. On the other days, students bring their own lunch. They eat in the classroom, and then they go outside to play.", "Mr. Morrison"], ["P", "Outside? Even when it rains?", "Julia"], ["S", "Even when it rains. This is Vancouver. Please buy him a good raincoat and some rain boots.", "Mr. Morrison"], ["P", "I work until five thirty. Is there care after school?", "Julia"], ["S", "There's a program in our gym from three to six, but it has a waitlist. Here's the number: six oh four, five five five, thirty-one sixteen.", "Mr. Morrison"], ["P", "Thirty-one sixty?", "Julia"], ["S", "Sixteen. Three-one-one-six.", "Mr. Morrison"], ["P", "What will he need for class?", "Julia"], ["S", "Mrs. Hughes will send home a supply list: pencils, markers, a ruler, and some notebooks. Sometimes she'll also send home permission forms for field trips. Please sign them and send them back the next day.", "Mr. Morrison"], ["P", "Ben! How was it? Did you make any friends?", "Julia"], ["P", "I did. His name is Tyler. He doesn't speak Portuguese, and I don't speak much English. But we both like soccer.", "Ben"], ["P", "What did you do at recess?", "Julia"], ["P", "We played soccer in the rain. Mom, look at my shoes. Can I have rain boots?", "Ben"]], "words": 305, "kind": "story", "scene": "Julia and her son, Ben, arrived in Vancouver on January 10th. In Brazil, Ben was in fourth grade. Eight days later, Julia meets the principal, Mr. Morrison.", "F": "elementary school vocabulary (principal, placement, ELL support, recess, hot lunch, permission forms, after-school care), phone numbers, 13/30, 16/60, will, does/doesn't, did", "V": "", "t": [[2.0, 4.65], [5.32, 8.11], [8.33, 10.91], [11.58, 13.2], [13.87, 15.9], [16.12, 20.41], [20.63, 23.34], [24.01, 25.33], [26.0, 27.13], [27.35, 29.68], [29.9, 32.26], [32.93, 34.15], [34.82, 35.72], [35.94, 37.39], [38.06, 39.06], [39.73, 41.39], [41.61, 44.11], [44.78, 46.63], [47.3, 50.5], [50.72, 52.41], [52.63, 55.51], [55.73, 59.27], [59.94, 60.69], [60.91, 62.06], [62.73, 64.29], [64.51, 65.89], [66.11, 69.34], [70.01, 71.63], [71.85, 73.25], [73.92, 78.04], [78.26, 82.91], [83.58, 84.8], [85.47, 86.45], [86.67, 88.14], [88.81, 90.2], [90.87, 97.01], [97.23, 101.26], [101.48, 104.45], [105.12, 105.7], [105.92, 106.77], [106.99, 108.31], [108.98, 109.69], [109.91, 111.14], [111.36, 114.63], [114.85, 116.3], [116.97, 118.4], [119.07, 120.58], [120.8, 122.15], [122.37, 123.65]], "R": [["You meet your child's new principal.", "Principal", "Welcome! Does Ben speak much English?", "A little. He studied English in Brazil, but he's still learning. Is there extra support?"], ["The principal asks about your child.", "Principal", "What does he enjoy doing?", "He loves soccer and drawing. He's a little shy at first."]]}, {"num": 53, "title": "The Parent-Teacher Conference", "lines": [["P", "Thanks for coming. Ben is doing really well. Let's look at his report card together.", "Mrs. Hughes"], ["S", "There are a lot of words here I don't understand.", "Julia"], ["P", "In BC, we don't use letter grades until grade ten. For Ben's grade, we use a proficiency scale. There are four levels: Emerging, Developing, Proficient, and Extending.", "Mrs. Hughes"], ["S", "What do they mean?", "Julia"], ["P", "Emerging means the student is just starting to understand. Developing means he understands some parts. Proficient means he understands everything we expect. And Extending means he goes beyond that.", "Mrs. Hughes"], ["S", "Where is Ben?", "Julia"], ["P", "In math, he's Extending. He's one of the strongest students in the class.", "Mrs. Hughes"], ["S", "In Brazil, he loved math too.", "Julia"], ["P", "In reading and writing, he's Developing. That's completely normal for a student who arrived in January. His English is improving every week.", "Mrs. Hughes"], ["S", "Does he get extra help?", "Julia"], ["P", "He does. He sees our ELL teacher three times a week. She says he's working very hard.", "Mrs. Hughes"], ["S", "What about his behaviour? Does he participate in class?", "Julia"], ["P", "He's quiet in big group discussions, but in small groups he talks a lot. And he's very kind. Last week, he helped a new student from Mexico find the washroom and the library.", "Mrs. Hughes"], ["S", "That's good to hear.", "Julia"], ["P", "I have one goal for Ben this term. I'd like him to read more at home, in English. Twenty minutes every night.", "Mrs. Hughes"], ["S", "Can he read in Portuguese too?", "Julia"], ["P", "Absolutely. Reading in Portuguese helps him too. But try to add some English books. The school library has a lot of easy chapter books. He can borrow three at a time.", "Mrs. Hughes"], ["S", "Is there anything else I should do at home?", "Julia"], ["P", "Ask him about his day in English sometimes. And don't worry about his mistakes. He's doing great. Oh, it's four o'clock. The next parent is waiting.", "Mrs. Hughes"], ["S", "Thank you so much, Mrs. Hughes.", "Julia"], ["S", "Ben, Mrs. Hughes says you're Extending in math.", "Julia"], ["P", "What does Extending mean?", "Ben"], ["S", "It means you're a superstar.", "Julia"]], "words": 314, "kind": "story", "scene": "In November, Julia signs up for a fifteen-minute parent-teacher conference with Ben's teacher, Mrs. Hughes, on Wednesday at three forty-five.", "F": "report card language, didn't, does, is, can, should, will", "V": "parent-teacher conference, report card, proficiency scale (Emerging, Developing, Proficient, Extending), strengths, goals, reading level, participate, homework, ELL support, \"at home, you could...\"", "t": [[2.0, 3.11], [3.33, 4.89], [5.11, 7.18], [7.85, 10.28], [10.95, 14.11], [14.33, 16.95], [17.17, 21.29], [21.96, 22.96], [23.63, 26.68], [26.9, 29.44], [29.66, 32.84], [33.06, 35.25], [35.92, 36.82], [37.49, 38.98], [39.2, 41.47], [42.14, 43.93], [44.6, 46.86], [47.08, 50.49], [50.71, 52.8], [53.47, 54.86], [55.53, 56.38], [56.6, 59.31], [59.53, 61.37], [62.04, 63.4], [63.62, 65.31], [65.98, 70.2], [70.42, 71.7], [71.92, 76.7], [77.37, 78.46], [79.13, 81.05], [81.27, 83.74], [83.96, 85.43], [86.1, 87.92], [88.59, 89.55], [89.77, 91.86], [92.08, 93.91], [94.13, 97.14], [97.36, 99.07], [99.74, 101.94], [102.61, 104.8], [105.02, 106.84], [107.06, 108.23], [108.45, 109.77], [109.99, 111.46], [112.13, 113.84], [114.51, 117.07], [117.74, 119.13], [119.8, 121.29]], "R": [["You're at a parent-teacher conference.", "Teacher", "Ben is doing well in math. His reading is still developing.", "Thank you. What can we do at home to help with his reading?"], ["The teacher asks if you have questions.", "Teacher", "Any other questions?", "Yes. How is he getting along with the other kids?"]]}, {"num": 54, "title": "Other Parents at School Pickup", "lines": [["P", "Hi! I don't think we've met. Which one is yours?", "Tracy"], ["S", "My son, Ben. He's in grade four, in Mrs. Hughes's class.", "Julia"], ["P", "No way! My daughter, Olivia, is in that class too. I'm Tracy.", "Tracy"], ["S", "Nice to meet you, Tracy. I'm Julia.", "Julia"], ["P", "Is this your first year at this school?", "Tracy"], ["S", "Yes. We moved here from Brazil in January.", "Julia"], ["P", "Oh, wow. How's Ben finding it?", "Tracy"], ["S", "He's doing well. He's made a few friends, and he loves recess, even in the rain.", "Julia"], ["P", "Ha! They all love recess. How long have you been in Vancouver?", "Tracy"], ["S", "About nine months. And you?", "Julia"], ["P", "I grew up in Burnaby, so my whole life, basically. If you ever have questions about anything, just ask me.", "Tracy"], ["P", "Mom! This is Olivia. She sits next to me.", "Ben"], ["P", "That's my daughter!", "Tracy"], ["P", "Olivia talks about Ben all the time. He's teaching her some Portuguese.", "Tracy"], ["S", "Really? What did he teach you, Olivia?", "Julia"], ["S", "Obrigada!", "Olivia"], ["P", "We should get the kids together sometime. Maybe a playdate on the weekend?", "Tracy"], ["S", "Ben would love that.", "Julia"], ["P", "Let's exchange numbers. I'll text you. Also, are you signing Ben up for soccer this spring? A lot of kids from the class play on the same team.", "Tracy"], ["S", "I didn't know about that. When is registration?", "Julia"], ["P", "It opens in February. I'll send you the link. And I'll add you to the class parents' group chat. It's where we share everything: field trips, lost jackets, birthday parties.", "Tracy"], ["S", "Thank you so much, Tracy.", "Julia"], ["P", "That was so nice. The kids built a whole fort in your living room, and we drank coffee for two hours. Same time next month? Our place.", "Tracy"], ["P", "Yes!", "Ben"], ["S", "Yes!", "Julia"]], "words": 264, "kind": "story", "scene": "For two weeks, Julia has waited alone for Ben outside his school at three o'clock. Today, a woman standing next to her smiles.", "F": "getting to know other parents, questions with which/how long/did, can, should, will, -ed", "V": "pickup, drop-off, \"Which one is yours?\", \"How long have you been at this school?\", \"Is this your first year?\", playdate, \"We should get the kids together,\" \"Let's exchange numbers,\" group chat, \"Are you signing him up for soccer?\"", "t": [[2.0, 2.62], [2.84, 4.12], [4.34, 5.51], [6.18, 7.16], [7.38, 9.96], [10.63, 11.42], [11.64, 13.93], [14.15, 15.06], [15.73, 17.27], [17.49, 18.43], [19.1, 20.91], [21.58, 22.18], [22.4, 24.75], [25.42, 26.23], [26.45, 27.77], [28.44, 29.46], [29.68, 33.48], [34.15, 34.75], [34.97, 36.25], [36.47, 38.11], [38.78, 39.95], [40.17, 40.9], [41.57, 44.47], [44.69, 47.63], [48.3, 48.92], [49.14, 50.23], [50.45, 51.67], [52.34, 53.34], [54.01, 56.08], [56.3, 58.13], [58.8, 59.49], [59.71, 61.35], [62.02, 62.92], [63.59, 65.48], [65.7, 67.35], [68.02, 69.08], [69.75, 71.18], [71.4, 72.41], [72.63, 75.38], [75.6, 78.22], [78.89, 80.13], [80.35, 81.82], [82.49, 83.88], [84.1, 85.23], [85.45, 87.79], [88.01, 92.3], [92.97, 94.49], [95.16, 96.22], [96.44, 100.84], [101.06, 102.49], [102.71, 103.54], [104.21, 104.79], [105.46, 106.05]], "R": [["Another parent talks to you at pickup.", "Parent", "Which one is yours?", "The boy in the red jacket. That's Ben. Which one is yours?"], ["The parent suggests a playdate.", "Parent", "We should get the kids together sometime.", "That would be great! Is Saturday afternoon good for you?"]]}, {"num": 55, "title": "Neighbours in the Elevator", "lines": [["P", "Joan, what do people talk about in an elevator? This morning, I didn't say anything, and the ride felt very long.", "Aline"], ["S", "Keep it simple. The weather, the dog, the building. Just a sentence or two. It's not a long conversation.", "Joan"], ["P", "Nice day, isn't it?", "Aline"], ["P", "It is! Finally, some sun.", "Eileen"], ["P", "Are you going to yoga?", "Aline"], ["P", "I am. Did you just move in? I haven't seen you before.", "Eileen"], ["P", "Yes, we moved in on Saturday. We're in seven oh four.", "Aline"], ["P", "Oh, welcome to the building! I'm Eileen. I'm in six twelve.", "Eileen"], ["P", "Nice to meet you, Eileen.", "Aline"], ["P", "Let me know if you need anything. Have a good one!", "Eileen"], ["P", "You too!", "Aline"], ["P", "Hello again. What's your dog's name?", "Aline"], ["S", "This is Buster. He's twelve, but he still thinks he's a puppy.", "Walt"], ["P", "He's very cute.", "Aline"], ["S", "Thank you. I'm Walt. I've lived here for twenty years. Did you figure out the recycling yet? It's a bit confusing.", "Walt"], ["P", "Not really. Where does the glass go?", "Aline"], ["S", "Glass has its own bin, and never put plastic bags in the recycling. The manager gets very upset.", "Walt"], ["P", "Ha! Thank you. Nobody told me that.", "Aline"], ["P", "Hi! A package came for you, but it was left at my door by mistake.", "Eileen"], ["P", "Oh, thank you so much!", "Aline"], ["P", "No problem. By the way, we're having a small get-together on the rooftop on Saturday. A few neighbours. Do you want to come?", "Eileen"], ["P", "We'd love to. I'll bring pão de queijo.", "Aline"], ["P", "Joan, you were right. By the end of the evening, I knew six neighbours. It starts with just one sentence.", "Aline"]], "words": 251, "kind": "story", "scene": "Aline and her family have moved into an apartment building in Burnaby. They don't know any of their neighbours. After a silent elevator ride, Aline asks her friend Joan for advice.", "F": "short friendly exchanges, question tags (\"isn't it?\"), did/didn't, is/isn't, can, will, -ed", "V": "\"Nice day, isn't it?\", \"Did you just move in?\", \"Which unit are you in?\", \"Welcome to the building,\" \"Let me know if you need anything,\" recycling, package, parcel room, \"Have a good one\"", "t": [[2.0, 4.75], [4.97, 8.83], [9.5, 10.53], [10.75, 12.41], [12.63, 14.06], [14.28, 15.99], [16.66, 17.68], [18.35, 19.06], [19.28, 20.45], [21.12, 22.36], [23.03, 23.75], [23.97, 25.17], [25.39, 26.75], [27.42, 29.34], [29.56, 30.73], [31.4, 32.98], [33.2, 34.1], [34.32, 35.58], [36.25, 37.55], [38.22, 39.9], [40.12, 41.11], [41.78, 42.42], [43.09, 43.96], [44.18, 45.4], [46.07, 47.26], [47.48, 49.87], [50.54, 51.54], [52.21, 53.13], [53.35, 54.37], [54.59, 56.45], [56.67, 58.83], [59.05, 60.56], [61.23, 61.98], [62.2, 63.5], [64.17, 68.71], [68.93, 70.94], [71.61, 72.16], [72.38, 73.04], [73.26, 74.44], [75.11, 75.73], [75.95, 79.55], [80.22, 81.67], [82.34, 83.3], [83.52, 87.34], [87.56, 88.56], [88.78, 89.81], [90.48, 91.37], [91.59, 93.0], [93.67, 94.91], [95.13, 97.65], [97.87, 99.7]], "R": [["A neighbour talks to you in the elevator.", "Neighbour", "Did you just move in?", "Yes, we moved in last week. We're in unit 504."], ["The neighbour offers help.", "Neighbour", "Let me know if you need anything.", "Thank you, that's very kind. Where do we put the recycling?"]]}, {"num": 56, "title": "Thanksgiving Dinner", "lines": [["P", "Thanksgiving? I thought that was in November.", "André"], ["S", "That's American Thanksgiving. Canadian Thanksgiving is the second Monday in October. It's a long weekend. Most families have dinner on Sunday or Monday.", "Heather"], ["P", "What should we bring?", "André"], ["S", "You don't have to bring anything. But if you want, you could bring a dessert or a drink.", "Heather"], ["S", "Come in, come in! Happy Thanksgiving!", "Heather"], ["P", "Happy Thanksgiving! The house smells amazing. We brought brigadeiros, small Brazilian chocolate sweets.", "André"], ["S", "The kids are already eating them, and dinner hasn't even started!", "Heather"], ["P", "Dinner will be ready at five. The turkey has been in the oven since eleven this morning.", "Dave"], ["P", "Since eleven?", "André"], ["P", "It's a very big turkey. Nine kilos.", "Dave"], ["P", "Turkey, stuffing, mashed potatoes, gravy, green beans, and this red sauce. What's this?", "André"], ["S", "Cranberry sauce. You eat it with the turkey. It's sweet and a little sour.", "Grandma"], ["P", "It's strange, but good.", "André"], ["S", "In our family, we go around the table and everyone says one thing they're thankful for. Dad, you go first.", "Heather"], ["P", "I'm thankful that my family is healthy.", "Grandpa"], ["S", "I'm thankful for no school tomorrow!", "Emma"], ["S", "Ha! André, your turn.", "Heather"], ["P", "I'm thankful that we moved to Canada, and that we met people like you. A year ago, we didn't know anyone here. Today, we're at a family dinner.", "André"], ["S", "We're thankful you're here too.", "Heather"], ["P", "And now, pumpkin pie with whipped cream.", "Dave"], ["P", "I've never tried it. It's soft and sweet, with cinnamon. I'll have a second piece, please.", "André"], ["S", "Here, take this container. Leftovers. You'll have turkey sandwiches all week.", "Heather"], ["P", "In the car, the kids asked if we can have Thanksgiving every year.", "Luísa"], ["P", "We can. Next year, maybe we'll host.", "André"]], "words": 263, "kind": "story", "scene": "In October, André's coworker Heather invites his family to her house for Thanksgiving dinner.", "F": "holiday traditions, dates (the second Monday in October), was/were, didn't, would, -ed, thankful for", "V": "Thanksgiving, long weekend, host, guest, turkey, stuffing, mashed potatoes, gravy, cranberry sauce, pumpkin pie, leftovers, \"What are you thankful for?\", bring a dish", "t": [[2.0, 2.79], [3.01, 4.37], [5.04, 6.6], [6.82, 10.09], [10.31, 11.54], [11.76, 14.32], [14.99, 15.93], [16.6, 18.05], [18.27, 20.96], [21.63, 22.72], [22.94, 24.18], [24.85, 25.96], [26.18, 27.52], [27.74, 30.94], [31.61, 34.96], [35.63, 37.4], [37.62, 41.03], [41.7, 42.6], [43.27, 44.95], [45.17, 46.39], [47.06, 51.45], [51.67, 52.42], [53.09, 54.18], [54.4, 55.83], [56.05, 57.65], [58.32, 59.45], [60.12, 64.83], [65.05, 66.33], [67.0, 69.09], [69.76, 71.75], [72.42, 73.06], [73.28, 74.39], [75.06, 78.88], [79.1, 81.02], [81.24, 82.67], [83.34, 84.81], [85.48, 88.02], [88.69, 89.77], [89.99, 91.66], [91.88, 93.44], [94.11, 95.73], [95.95, 96.91], [97.13, 99.09], [99.76, 103.39], [104.06, 104.74], [104.96, 106.37]], "R": [["A coworker invites you to Thanksgiving dinner.", "Coworker", "Would you like to come for Thanksgiving dinner?", "We'd love to, thank you! Can we bring something?"], ["The host asks a question at dinner.", "Host", "What are you thankful for this year?", "I'm thankful for my family, and for new friends like you."]]}]}, {"part": 8, "title": "Small Talk and Canadian Culture", "desc": "The conversations and unwritten rules nobody explains.", "scripts": [{"num": 57, "title": "\"How Are You?\" Isn't a Real Question", "lines": [["P", "So, how was your first day?", "Doug"], ["S", "A little embarrassing. This morning, I went to a Tim Hortons for breakfast. The man at the counter smiled and said, \"Hi, how are you?\"", "Rodrigo"], ["P", "And what did you say?", "Doug"], ["S", "I answered honestly. I said I was okay, but very tired. I told him I arrived from Brazil yesterday, and I didn't sleep well because of the time difference, and my hotel room is very noisy.", "Rodrigo"], ["P", "Oh no! What did he do?", "Doug"], ["S", "He was still smiling, but he looked confused. And the people behind me were waiting. He said, \"Oh, uh, sorry to hear that. What can I get for you?\"", "Rodrigo"], ["P", "In Canada, \"How are you?\" is usually just a greeting. It's like saying hello. People don't expect a real answer, especially strangers.", "Doug"], ["S", "So what should I say?", "Rodrigo"], ["P", "Just say, \"Good, thanks. How are you?\" or \"Not bad, you?\" That's it.", "Doug"], ["S", "Even if I'm not good?", "Rodrigo"], ["P", "Even if you're not good. With cashiers, bus drivers, people in the elevator, it's just a friendly ritual. You can also say, \"Can't complain.\" Or if you're having a hard week, \"Hanging in there.\" That's honest, but still short.", "Doug"], ["S", "What about \"How's it going?\" and \"What's up?\"", "Rodrigo"], ["P", "Same thing. For \"What's up?\", you can just say, \"Not much. You?\"", "Doug"], ["S", "And when people say, \"Have a good one\"?", "Rodrigo"], ["P", "Just say, \"You too,\" or \"Thanks, you too.\"", "Doug"], ["S", "Anything else?", "Rodrigo"], ["P", "If someone says, \"We should get coffee sometime,\" it might not be a real invitation. If they give you a day and a time, then it's real.", "Doug"], ["S", "That's confusing.", "Rodrigo"], ["P", "I know. But with close friends and family, \"How are you?\" can be a real question. If a friend looks at you and says, \"How are you, really?\", then they want the true answer.", "Doug"], ["S", "Okay. Can we practise? You're the cashier.", "Rodrigo"], ["P", "Hi, how are you?", "Doug"], ["S", "Good, thanks. How are you?", "Rodrigo"], ["P", "Not bad! What can I get for you?", "Doug"], ["S", "A medium coffee, please.", "Rodrigo"], ["P", "Here you go. Have a good one!", "Doug"], ["S", "Thanks, you too!", "Rodrigo"], ["P", "Perfect. Five seconds. You sound more Canadian already.", "Doug"]], "words": 338, "kind": "story", "scene": "Rodrigo arrived in Vancouver yesterday. Tonight, he's having coffee with his Canadian friend, Doug.", "F": "automatic greetings and replies, didn't, is, -ed", "V": "\"How are you?\", \"How's it going?\", \"What's up?\", \"Good, thanks. You?\", \"Not bad,\" \"Can't complain,\" \"Hanging in there,\" \"Have a good one,\" \"Take care,\" \"We should get coffee sometime,\" \"How are you really?\"", "t": [[2.0, 3.83], [4.5, 5.64], [5.86, 8.74], [8.96, 12.2], [12.87, 14.21], [14.88, 16.06], [16.28, 18.37], [18.59, 26.69], [27.36, 28.34], [28.56, 29.72], [30.39, 32.75], [32.97, 34.89], [35.11, 36.99], [37.21, 38.41], [39.08, 40.97], [41.19, 43.18], [43.4, 45.04], [45.26, 49.02], [49.69, 50.84], [51.51, 53.09], [53.31, 54.46], [54.68, 56.19], [56.41, 57.33], [58.0, 59.17], [59.84, 61.42], [61.64, 66.81], [67.03, 69.35], [69.57, 72.62], [72.84, 74.72], [75.39, 76.73], [76.95, 77.85], [78.52, 79.54], [79.76, 81.9], [82.12, 82.82], [83.49, 85.43], [86.1, 88.6], [89.27, 90.16], [90.83, 96.29], [96.51, 99.57], [100.24, 101.39], [102.06, 103.0], [103.22, 106.07], [106.29, 108.02], [108.24, 109.91], [110.58, 111.28], [111.5, 112.57], [112.79, 113.75], [114.42, 115.76], [116.43, 117.31], [117.53, 118.34], [119.01, 120.03], [120.25, 121.7], [122.37, 123.8], [124.47, 125.52], [125.74, 126.87], [127.54, 128.56], [129.23, 130.11], [130.33, 131.48], [131.7, 133.98]], "R": [["Someone greets you at a coffee shop.", "Friend", "Hey! How's it going?", "Good, thanks! You?"], ["A neighbour says goodbye.", "Neighbour", "Have a good one!", "You too! Take care."]]}, {"num": 58, "title": "Small Talk in the Office Kitchen", "lines": [["P", "Hey! How was your weekend?", "Tom"], ["S", "It was good, thanks. How was yours?", "Paula"], ["P", "Not bad. I went up to Whistler with my kids. We did some hiking.", "Tom"], ["S", "Nice! Was it busy?", "Paula"], ["P", "Super busy. Did you do anything fun?", "Tom"], ["S", "We walked around Stanley Park on Saturday. On Sunday, it rained, so we stayed home and watched a movie.", "Paula"], ["P", "Classic Vancouver weekend.", "Tom"], ["P", "Morning, guys. Did anyone watch the Canucks game last night?", "Linda"], ["P", "I did. They won in overtime.", "Tom"], ["S", "I didn't watch it. I don't really understand hockey yet.", "Paula"], ["P", "That's okay. Neither does my husband, and he was born here.", "Linda"], ["S", "Morning. Cold one today, isn't it?", "Kevin"], ["S", "It is. My car was covered in frost.", "Paula"], ["S", "They say it might snow on Thursday.", "Kevin"], ["S", "Snow? Really?", "Paula"], ["S", "Maybe. But this is Vancouver. It'll probably just rain.", "Kevin"], ["S", "Linda, Karen put a sign-up sheet on the fridge. \"Holiday Potluck, Friday, December 18th, at noon. Please bring one dish to share!\" What's a potluck?", "Paula"], ["P", "Everyone brings some food, and we all share it.", "Linda"], ["S", "What should I bring?", "Paula"], ["P", "Bring something from Brazil! People love that.", "Linda"], ["S", "Okay. I'll write \"pão de queijo, cheese bread.\"", "Paula"], ["P", "Paula, these are amazing. I think I ate six. You have to bring these every year. Can you send me the recipe?", "Greg"], ["S", "I can. They disappeared in ten minutes!", "Paula"], ["S", "Have a good one.", "Kevin"], ["S", "You too. See you Monday.", "Paula"], ["S", "Small talk still isn't easy for me. But now, I actually enjoy it.", "Paula"]], "words": 232, "kind": "story", "scene": "Every morning, Paula makes coffee in the office kitchen, and every morning, someone starts a conversation. It's Monday, and Tom comes in while she's waiting for the coffee machine.", "F": "small talk, weekend plans, weather, sports, did/didn't, do/does, was, -ed, question tags", "V": "small talk, \"How was your weekend?\", \"Not bad,\" potluck, sign-up sheet, the Canucks, overtime, \"Have a good one\"", "t": [[2.0, 2.58], [2.8, 3.91], [4.58, 5.71], [5.93, 6.97], [7.64, 8.41], [8.63, 10.4], [10.62, 11.79], [12.46, 13.08], [13.3, 14.2], [14.87, 15.81], [16.03, 17.39], [18.06, 20.6], [20.82, 24.36], [25.03, 26.55], [27.22, 28.26], [28.48, 30.85], [31.52, 32.22], [32.44, 33.68], [34.35, 35.44], [35.66, 37.71], [38.38, 39.32], [39.54, 42.03], [42.7, 43.38], [43.6, 44.95], [45.62, 46.32], [46.54, 48.27], [48.94, 50.63], [51.3, 51.89], [52.11, 52.8], [53.47, 54.11], [54.33, 55.56], [55.78, 57.17], [57.84, 60.44], [60.66, 64.23], [64.45, 66.17], [66.39, 67.4], [68.07, 70.56], [71.23, 72.23], [72.9, 74.33], [74.55, 75.66], [76.33, 77.04], [77.26, 79.48], [80.15, 81.62], [81.84, 83.44], [83.66, 85.64], [85.86, 87.7], [88.37, 89.07], [89.29, 90.95], [91.62, 92.48], [93.15, 93.94], [94.16, 95.12], [95.79, 97.94], [98.16, 99.98]], "R": [["A coworker talks to you in the kitchen.", "Coworker", "Morning! How was your weekend?", "Not bad, thanks! I went to Stanley Park. How was yours?"], ["Your coworker tells you about a potluck.", "Coworker", "We're having a potluck on Friday. There's a sign-up sheet.", "Sounds fun! I'll bring a Brazilian dessert."]]}, {"num": 59, "title": "The First Two Minutes of a Meeting", "lines": [["P", "Morning, everyone! How's your week going?", "Scott"], ["S", "Busy, but good. How about yours?", "Paula"], ["P", "Can't complain. It snowed here yesterday, so I spent an hour shovelling my driveway.", "Scott"], ["S", "Snow already? It's only October!", "Paula"], ["P", "Welcome to Calgary! What's the weather like there?", "Scott"], ["P", "Rainy, of course.", "Linda"], ["S", "Sorry I'm late! My kid couldn't find his shoes.", "Heather"], ["P", "No problem. We were just talking about the snow.", "Scott"], ["S", "Oh, don't get me started.", "Heather"], ["P", "Heather, how was your trip to Banff last weekend?", "Linda"], ["S", "It was beautiful. We did a lot of hiking, and we saw two elk right next to the road.", "Heather"], ["S", "Lucky! Any plans for this weekend?", "Paula"], ["S", "Nothing big. We're just going to relax. It's a long weekend, isn't it?", "Heather"], ["P", "It is. Monday is Thanksgiving.", "Linda"], ["P", "Paula, are you doing anything for Thanksgiving?", "Scott"], ["S", "Our friend invited us to her family dinner. It'll be our first Canadian Thanksgiving.", "Paula"], ["P", "Oh, that's great. Make sure you try the pumpkin pie.", "Scott"], ["S", "Everyone keeps telling me that!", "Paula"], ["P", "Linda, did you catch the Canucks game on Wednesday?", "Scott"], ["P", "I did! What a finish.", "Linda"], ["S", "We can talk about that later. I don't want to cry before the meeting starts.", "Heather"], ["P", "Okay, let's get started. First item on the agenda: the testing schedule.", "Linda"], ["P", "Nice job with the small talk, Paula. You sounded like a local.", "Linda"], ["S", "Thanks. I practised. I had three questions ready before the call.", "Paula"]], "words": 217, "kind": "story", "scene": "Paula's weekly video meeting with the Calgary team starts at nine on Friday. In her first meeting, she started talking about the project right away, and there was a strange silence. This time, she's ready.", "F": "small talk before business, weekend and holiday plans, did/didn't, will, -ed, question tags", "V": "\"How's your week going?\", \"Busy, but good,\" \"Can't complain,\" \"Any plans for the weekend?\", long weekend, \"Did you catch the game?\", \"How was your trip?\", \"Okay, let's get started,\" \"Let's dive in\"", "t": [[2.0, 2.98], [3.2, 4.35], [5.02, 6.03], [6.25, 7.36], [8.03, 8.92], [9.14, 13.13], [13.8, 14.8], [15.02, 16.3], [16.97, 18.13], [18.35, 19.54], [20.21, 21.38], [22.05, 23.1], [23.32, 24.98], [25.65, 26.59], [26.81, 28.5], [29.17, 30.64], [31.31, 33.83], [34.5, 35.52], [35.74, 39.28], [39.95, 40.61], [40.83, 42.45], [43.12, 44.06], [44.28, 45.71], [45.93, 47.55], [48.22, 49.06], [49.28, 50.64], [51.31, 53.7], [54.37, 56.93], [57.15, 59.43], [60.1, 61.02], [61.24, 62.99], [63.66, 65.32], [65.99, 68.6], [69.27, 70.01], [70.23, 71.17], [71.84, 73.38], [73.6, 75.88], [76.55, 78.15], [78.37, 81.31], [81.98, 84.01], [84.23, 85.72], [86.39, 86.99], [87.21, 88.17], [88.39, 90.89]], "R": [["A video meeting is starting.", "Client", "Hi, everyone. How's your week going?", "Busy, but good! How about yours?"], ["Someone asks about your weekend.", "Coworker", "Any plans for the long weekend?", "Nothing big. Maybe a hike if the weather's nice. What about you?"]]}, {"num": 60, "title": "Safe Topics and Unsafe Topics", "lines": [["P", "Karen! Welcome back! You gained a little weight. You look healthy!", "Paula"], ["S", "Oh... thanks. I have to go.", "Karen"], ["P", "I just bought a new car.", "Tom"], ["P", "Nice! How much do you make here?", "Paula"], ["P", "Um, I'd rather not say.", "Tom"], ["S", "Paula, can I talk to you for a minute? I heard what happened with Karen and Tom. Please don't worry. They know you didn't mean anything bad. But in Canada, some topics are sensitive, especially at work.", "Linda"], ["P", "Like what?", "Paula"], ["S", "Weight is a big one. Never comment on someone's weight or body, even if you mean it nicely. In Brazil, that could be a friendly thing to say, but not here. Also, don't ask how much people earn. Salary is private here.", "Linda"], ["P", "What else?", "Paula"], ["S", "It's better not to ask people how old they are, or why they don't have kids, or why they aren't married. And be careful with religion and politics. Many people don't discuss them with coworkers.", "Linda"], ["P", "So what can I talk about?", "Paula"], ["S", "Lots of things! The weather, weekends, food, travel, sports, pets, movies, and TV shows. And compliments are great if they're about things people choose, like \"I love your jacket\" or \"Great presentation.\"", "Linda"], ["P", "I feel terrible about Karen.", "Paula"], ["S", "You could just apologize. Keep it simple.", "Linda"], ["P", "Karen, I'm sorry about this morning. In Brazil, what I said is normal, but I know it isn't here. I didn't mean to be rude.", "Paula"], ["S", "Thanks for saying that. No offence taken. I know you were just being friendly.", "Karen"], ["P", "Tom, sorry about the salary question. I'm still learning the rules.", "Paula"], ["P", "Don't worry about it. Honestly, it's kind of funny. My mom asks me that every week.", "Tom"], ["P", "Good morning, Karen. Great scarf.", "Paula"], ["S", "Thank you! My sister made it.", "Karen"]], "words": 280, "kind": "story", "scene": "It's Paula's second month at work. Her coworker Karen has just come back from a three-week vacation.", "F": "polite and impolite questions, what not to say, didn't, would, can", "V": "safe topics (weather, weekends, food, travel, sports, pets), sensitive topics (salary, age, weight, religion, politics), \"That's a bit personal,\" \"I'd rather not say,\" compliment, awkward, \"No offence taken\"", "t": [[2.0, 2.62], [2.84, 3.76], [3.98, 5.19], [5.41, 6.41], [7.08, 7.68], [7.9, 8.63], [8.85, 9.87], [10.54, 11.89], [12.56, 13.17], [13.39, 14.82], [15.49, 16.79], [17.46, 19.34], [19.56, 21.55], [21.77, 22.94], [23.16, 24.91], [25.13, 28.84], [29.51, 30.32], [30.99, 32.25], [32.47, 36.44], [36.66, 39.94], [40.16, 42.38], [42.6, 44.05], [44.72, 45.47], [46.14, 51.73], [51.95, 54.42], [54.64, 57.05], [57.72, 59.2], [59.87, 60.91], [61.13, 65.78], [66.0, 72.51], [73.18, 74.82], [75.49, 77.05], [77.27, 78.29], [78.96, 80.93], [81.15, 84.43], [84.65, 86.06], [86.73, 88.05], [88.27, 89.49], [89.71, 91.5], [92.17, 94.32], [94.54, 96.06], [96.73, 97.84], [98.06, 99.55], [99.77, 101.56], [102.23, 103.36], [103.58, 104.57], [105.24, 106.05], [106.27, 107.5]], "R": [["A coworker asks something too personal.", "Coworker", "So, how much do you make?", "Ha, that's a bit personal. But I really like the job!"], ["A coworker asks about your vacation.", "Coworker", "I just got back from Mexico. Have you been?", "No, not yet, but I'd love to go. How was it?"]]}, {"num": 61, "title": "The Unwritten Rules", "lines": [["P", "Hey, what are you girls doing tonight?", "Rafa"], ["S", "We're women, actually. But we're going for dinner.", "Megan"], ["P", "Yeah, the girls and I are going out for drinks tonight. See you there.", "Karen"], ["P", "Tom, I'm confused. In Brazil, we say \"meninas\" all the time, and nobody gets upset. Why can Karen say \"girls,\" but I can't?", "Rafa"], ["S", "It's an unwritten rule. Women can call their friends \"the girls.\" But when a man calls grown women \"girls,\" especially at work, it can sound like he doesn't see them as equals. Like they're children. It sounds condescending.", "Tom"], ["P", "So what should I say?", "Rafa"], ["S", "Say \"everyone,\" or \"folks,\" or just use their names. \"Hey, what are you all doing tonight?\" That's totally fine.", "Tom"], ["P", "Are there other rules like this?", "Rafa"], ["S", "Lots. We don't write them down, but everyone knows them. At work, don't talk about politics or religion. Keep your personal space. About an arm's length. When you meet someone at work, shake hands. Don't kiss them on the cheek.", "Tom"], ["P", "Oh no. I kissed the client on the cheek last week.", "Rafa"], ["S", "I know. I saw her face.", "Tom"], ["P", "What else?", "Rafa"], ["S", "In meetings, don't interrupt. Wait until the person finishes. If you start talking at the same time, say, \"Sorry, go ahead.\"", "Tom"], ["P", "In Brazil, interrupting shows we're interested.", "Rafa"], ["S", "Here, it feels like you're not listening. And be on time, even for social things. If dinner is at seven, arrive at seven, not seven thirty. And always line up. Never cut in line.", "Tom"], ["P", "Megan, I'm sorry about earlier. I didn't know \"girls\" sounded that way in English.", "Rafa"], ["S", "Thanks. I could tell you didn't mean anything by it. Have a good weekend.", "Megan"], ["P", "On the bus, I wrote it all in my notebook. Say \"everyone.\" Shake hands. Don't interrupt. Be on time. Line up. No politics.", "Rafa"], ["S", "Anything else?", "Tom"], ["P", "One more line. \"Lesson learned.\"", "Rafa"]], "words": 298, "kind": "story", "scene": "On Friday afternoon, Rafa walks past three of his coworkers, Megan, Karen, and Heather. He wants to be friendly.", "F": "what you can and can't say, should, didn't, doesn't, would, can/can't", "V": "unwritten rules, \"girls\" vs. \"women,\" \"everyone,\" \"folks,\" condescending, personal space, handshake, interrupt, \"Sorry, go ahead,\" on time, line up, politics, religion, \"Lesson learned\"", "t": [[2.0, 3.79], [4.46, 5.85], [6.07, 7.35], [8.02, 10.92], [11.14, 12.04], [12.71, 13.86], [14.08, 17.92], [18.14, 20.31], [20.98, 22.2], [22.42, 24.4], [24.62, 31.22], [31.44, 32.57], [32.79, 34.15], [34.82, 35.91], [36.58, 39.5], [39.72, 41.39], [41.61, 42.76], [43.43, 44.92], [45.59, 46.21], [46.43, 48.91], [49.13, 51.83], [52.05, 53.44], [53.66, 54.88], [55.1, 57.12], [57.34, 58.75], [59.42, 60.08], [60.3, 62.42], [63.09, 63.77], [63.99, 65.05], [65.72, 66.41], [67.08, 68.53], [68.75, 70.52], [70.74, 74.22], [74.89, 77.3], [77.97, 79.91], [80.13, 82.54], [82.76, 86.24], [86.46, 87.54], [87.76, 88.92], [89.59, 91.19], [91.41, 93.8], [94.47, 95.06], [95.28, 97.31], [97.53, 98.68], [99.35, 101.42], [101.64, 102.62], [102.84, 103.7], [103.92, 104.81], [105.03, 105.88], [106.1, 106.79], [107.01, 107.99], [108.66, 109.55], [110.22, 111.12], [111.34, 112.32]], "R": [["You want to greet a group of women coworkers.", "Coworker", "Hi!", "Hi, everyone! How's it going?"], ["You accidentally interrupt someone.", "Coworker", "…and I think we should…", "Oh, sorry, go ahead."]]}, {"num": 62, "title": "The Grey Winter", "lines": [["P", "Are you okay? You look a little down.", "Joan"], ["S", "I'm fine. Actually, I'm not. I'm homesick. I miss my mom. I miss the beach. I miss the sun. I used to live in Fortaleza, where the sun shines almost every day. I'm not used to this.", "Aline"], ["P", "Come in and have a cup of tea.", "Joan"], ["S", "My mom calls every Sunday. Last week she said, \"You used to call me every day.\" I felt terrible.", "Aline"], ["P", "She misses you. And you miss her. The first winter is the hardest. I moved here from Ontario, and I still remember it.", "Joan"], ["S", "Do Canadians feel sad in the winter too?", "Aline"], ["P", "Some people feel really low in the dark months. Doctors call it seasonal affective disorder. If you feel sad for weeks and it doesn't get better, talk to your doctor. That's important.", "Joan"], ["S", "What do you do?", "Aline"], ["P", "Four things. First, I go outside every day around noon, even when it's raining. The daylight helps. Second, I use a light therapy lamp in the morning. My doctor suggested it. Third, vitamin D. Lots of people in Vancouver take it in the winter, because we get so little sun.", "Joan"], ["S", "Vitamin D? In Brazil, we get it from the beach.", "Aline"], ["P", "Ha! Not here. Ask your pharmacist how much is right for you. And fourth, I don't stay home alone. I sing in a choir on Tuesdays.", "Joan"], ["S", "In Brazil, I used to dance every weekend.", "Aline"], ["P", "Then dance here!", "Joan"], ["P", "Great class! I'm Kim. Are you coming next week?", "Kim"], ["S", "I am. I found this samba class on Commercial Drive, and I loved it.", "Aline"], ["S", "Filha, are you still sad?", "Mom"], ["S", "Sometimes, Mom. But I'm getting used to the rain. I have my samba class, my tea with Joan, and my twenty minutes of daylight.", "Aline"], ["S", "And me.", "Mom"], ["S", "And you, Mom. Always.", "Aline"]], "words": 294, "kind": "story", "scene": "It's November, and the rain in Vancouver hasn't stopped. It's dark when Aline leaves for work and almost dark when she comes home. Her neighbour Joan finds her sitting on the stairs.", "F": "used to / be used to / get used to, miss (I miss my mom vs. my mom misses me), feelings vocabulary, didn't, doesn't, should", "V": "homesick, vitamin D, \"I miss...\", used to, be used to, get used to, feel down, feel low, daylight, seasonal affective disorder, light therapy lamp, \"The first winter is the hardest,\" community", "t": [[2.0, 2.94], [3.16, 4.37], [5.04, 5.77], [5.99, 7.16], [7.38, 8.3], [8.52, 9.61], [9.83, 10.81], [11.03, 11.93], [12.15, 16.11], [16.33, 17.51], [18.18, 19.8], [20.47, 22.09], [22.31, 25.23], [25.45, 26.43], [27.1, 28.06], [28.28, 29.27], [29.49, 31.3], [31.52, 34.48], [35.15, 37.33], [38.0, 40.71], [40.93, 43.36], [43.58, 47.42], [47.64, 48.71], [49.38, 50.36], [51.03, 51.93], [52.15, 56.11], [56.33, 57.46], [57.68, 60.44], [60.66, 62.17], [62.39, 63.8], [64.02, 68.37], [69.04, 69.96], [70.18, 72.2], [72.87, 73.51], [73.73, 74.52], [74.74, 77.2], [77.42, 79.42], [79.64, 81.39], [82.06, 84.69], [85.36, 86.38], [87.05, 87.86], [88.08, 88.89], [89.11, 90.41], [91.08, 91.72], [91.94, 95.55], [96.22, 97.8], [98.47, 99.55], [99.77, 101.42], [101.64, 106.29], [106.96, 107.68], [108.35, 109.19], [109.41, 110.09]], "R": [["A neighbour sees you looking sad in winter.", "Neighbour", "Are you okay? You look a bit down.", "I'm feeling homesick. I miss the sun and my family."], ["Your neighbour gives advice.", "Neighbour", "Have you tried a light therapy lamp?", "No, I haven't. Does it really help? Where can I buy one?"]]}]}, {"part": 9, "title": "University and College", "desc": "Registration, assignments, professors, and group projects.", "scripts": [{"num": 63, "title": "Registering for Courses", "lines": [["P", "Hi, come in. Can I have your student number?", "Donna"], ["S", "It's three oh one, four five, eighteen sixty.", "Felipe"], ["P", "Okay. I see you're starting in the Faculty of Business in September. Most first-year students take five courses per term. Each course is three credits, so that's fifteen credits.", "Donna"], ["S", "Is five courses too many? I work part-time on weekends.", "Felipe"], ["P", "How many hours do you work?", "Donna"], ["S", "Twelve hours a week.", "Felipe"], ["P", "Then five is fine. Let's look at your required courses. You need Business one-oh-one, Economics one-oh-three, and a first-year writing course, English one-oh-five. Then you can choose two electives.", "Donna"], ["S", "What's an elective?", "Felipe"], ["P", "It's a course you choose because you're interested in it. It doesn't have to be in business.", "Donna"], ["S", "Can I take Psychology?", "Felipe"], ["P", "You can. Psychology one-oh-two doesn't have any prerequisites.", "Donna"], ["S", "Prerequisites?", "Felipe"], ["P", "Courses you need to pass before you take another course. For example, you can't take Economics two-oh-one until you pass Economics one-oh-three.", "Donna"], ["S",
