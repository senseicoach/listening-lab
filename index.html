park brake", "T": "On Tuesday, I arrived at ten thirty. At ten forty-five exactly, a tall man came out. \"Hi, I'm Dave. I'll be your examiner today. Can I see your licence?\" I gave it to him. \"Before we start, I'll check your vehicle. Please turn on your left signal. Now your right signal. Now step on the brake. Good, your brake lights work. Now sound the horn.\" I pressed the horn, and everyone in the parking lot looked at us. Dave got in the car. \"Here's how this works. I'll give you directions. If I don't say anything, follow the road. If you don't understand an instruction, just ask me. Pull out when you're ready.\" I checked my mirror, shoulder checked, and pulled out slowly. \"At the lights, turn right.\" I turned right onto Kingsway. \"Take the second left.\" I counted: one, two. I turned left onto a quiet street. \"We're entering a school zone. What's the speed limit here?\" \"Thirty kilometres an hour on school days, from eight to five.\" \"Correct.\" After the school zone, the speed limit went back up to fifty. \"When it's safe, change lanes to the left.\" I checked my mirror, signalled, shoulder checked, and changed lanes. \"Now I'd like you to parallel park behind that blue car.\" I did it slowly. I was a little far from the curb, but not too far. Next, we drove up a steep hill. \"Please park here, on the hill. Imagine there's a curb.\" I turned my wheels, put the car in park, and put on the park brake. \"Which way did you turn your wheels, and why?\" \"Away from the curb, because we're facing uphill. If the car rolls, it'll stop against the curb.\" \"Good.\" Then we drove back toward the office. My hands were wet on the steering wheel. There was a stop sign on the last corner. I stopped, looked left and right, and turned. Finally, Dave said, \"Pull into the parking lot and park in any empty stall.\" I parked and turned off the engine. Then he started writing on his clipboard. I didn't breathe.", "words": 349}, {"num": 29, "title": "The Result", "F": "feedback language, did/didn't, was, will, can, 12/20, dates and times", "V": "result, pass, fail, minor error, dangerous action, rolling stop, complete stop, retake, rebook, feedback, congratulations, temporary licence", "T": "Dave stopped writing and looked at me. \"Okay. I'll start with the good things. Your parallel parking was good, and your hill park was perfect. You shoulder checked every time you changed lanes, and you kept to the speed limit in the school zone. You made three minor errors. You were a little far from the curb when you parked, you braked a little late at one red light, and you didn't always signal early enough.\" \"Three minor errors isn't bad, right?\" \"No, it isn't. But at the stop sign on the last corner, you didn't make a complete stop. Your car was still moving. That's a rolling stop, and it's a dangerous action. I'm sorry, but that's a fail.\" \"A fail? But I stopped!\" \"You slowed down, but you didn't stop completely. In B.C., you have to stop behind the line and wait until the car stops moving. Then you can look and go.\" I couldn't believe it. Twenty years of driving, and I failed because of one stop sign. \"Can I take the test again?\" \"You can. You can rebook at the counter today. Practise your stops, and you'll be fine next time.\" Sherry booked my second test for Wednesday, December 2nd, at twelve twenty. \"Twelve twenty or twelve twelve?\" I asked. \"Twelve twenty. Two-zero.\" For two weeks, Vern made me practise stop signs. \"Stop. Count to three. Then look,\" he said again and again. On December 2nd, my examiner was a woman named Carol. The test was on different streets, but the instructions were the same: \"Turn left at the lights,\" \"Take the second right,\" \"Pull over when it's safe.\" At every stop sign, I stopped and counted in my head: one, two, three. When we returned, Carol looked at her clipboard. \"Two minor errors. No dangerous actions. Congratulations, you passed.\" \"I passed?\" \"You did. Go inside, and they'll take your photo. You'll get a temporary licence today, and your new licence will come in the mail.\" I walked inside smiling. I called Vern right away. \"Did you pass?\" he asked. \"I did,\" I said. \"And I stopped at every single stop sign.\"", "words": 356}, {"num": 30, "title": "Ron's Driving Tips", "F": "instructions and advice (should/shouldn't, don't, have to), can, does/doesn't, numbers (2/3 seconds, 5 metres), -ed", "V": "shoulder check, dooring, cyclist, bike lane, Dutch reach, blind spot, pull out, crosswalk, pedestrian, yield, flashing green light, four-way stop, following distance, fire hydrant, distracted driving", "T": "Bill's road test is next Friday, so on Saturday morning his friend Ron took him out to practise. They parked near Commercial Drive. \"Before we drive anywhere,\" Ron said, \"watch the bike lane.\" A cyclist rode past, very close to the parked cars. \"Now imagine you open your door without looking. What happens?\" \"The cyclist hits the door?\" \"Exactly. That's called dooring. People get seriously hurt. So before you open your door, you shoulder check. Every time. Here's a trick. Open the door with your right hand, not your left. It's called the Dutch reach. When you use your right hand, your body turns, and you have to look over your shoulder. Try it.\" Bill reached across with his right hand, turned, and looked back. \"I can see the whole bike lane.\" \"That's the point.\" Then Ron started the car. \"Before you pull out, check your mirror, signal, and shoulder check. The mirror doesn't show everything. There's a blind spot.\" At the next corner, Bill wanted to turn right. \"Wait,\" Ron said. \"Check the bike lane first. Cyclists go straight, and you're turning across their lane.\" Bill waited for two cyclists, then turned. \"Good. Now, see that crosswalk? If a pedestrian is waiting, you have to stop. Don't wave them across and don't honk. Just stop and wait.\" Later, they came to a light that was flashing green. \"What does that mean?\" Bill asked. \"A flashing green means pedestrians control it with a button. You can go, but be ready to stop if it turns yellow.\" At a four-way stop, Bill asked, \"Who goes first?\" \"The car that stopped first. If you stop at the same time, the car on the right goes first.\" \"What about following distance?\" \"Stay at least two seconds behind the car in front of you. In the rain, make it three or more. And one last tip. When you park, stay at least five metres from a fire hydrant. And put your phone away. Distracted driving is an expensive ticket.\" They parked, and Bill reached for the door with his left hand. Ron looked at him. \"Oops,\" Bill said. He switched to his right hand and shoulder checked. \"Better,\" Ron said. \"You'll be fine on Friday.\"", "words": 371}, {"num": 31, "title": "Buying Car Insurance", "F": "prices and payment plans, years of experience, did, does/doesn't, can, will, would", "V": "ICBC, Autoplan broker, basic insurance, optional coverage, collision, comprehensive, deductible, claim, driving experience, driver's record, discount, premium, monthly payments, policy", "T": "After I got my B.C. driver's licence, I bought a used car, a 2019 Toyota Corolla. Before I could drive it, I needed insurance. In B.C., you buy car insurance from ICBC, but you do it through an Autoplan broker. I went to a small insurance office on Kingsway. A man named Gary helped me. \"Hi. Is this your first time insuring a car in B.C.?\" \"Yes, it is.\" \"Okay. Everyone has to buy basic insurance. That's the minimum. Then you can add optional coverage.\" \"What does basic insurance cover?\" \"It covers injuries, and damage you cause to other people's cars or property. But it doesn't cover damage to your own car.\" \"What if I hit something and damage my own car?\" \"Then you need collision coverage. And comprehensive covers things like theft, fire, or a broken windshield.\" \"Should I get both?\" \"For a 2019 car, I'd recommend both. Now, the deductible. That's the amount you pay yourself if you make a claim. You can choose three hundred, five hundred, or one thousand dollars. A higher deductible means a lower price.\" \"I'll choose five hundred.\" \"Good choice. How many years have you been driving?\" \"Twenty years, in Brazil.\" \"Did you bring a letter from your insurance company or the driving authority in Brazil? It has to show your driving experience and your record.\" \"I did. It's translated too.\" Gary looked at it carefully. \"Perfect. With this letter, ICBC can recognize your experience, and you'll get a discount. Without it, you'd pay the price for a new driver.\" \"How much is the discount?\" \"It depends, but it can be a lot. For you, the total is about two thousand four hundred dollars a year.\" \"Two thousand four hundred? That's expensive.\" \"Vancouver is expensive. But you can pay monthly. That's about two hundred and five dollars a month, with a small fee.\" \"Monthly is better for me.\" \"Okay. Please sign here, here, and here. Your policy starts today at twelve noon.\" He gave me my papers and a small sticker for my licence plate. \"Put the sticker on your back plate before you drive away.\" \"Can I drive home now?\" \"You can. And drive carefully. If you don't have any claims this year, your price will go down next year.\"", "words": 378}]}, {"part": 4, "title": "Exploring Vancouver", "desc": "Tours, day trips, and a night at the hockey game.", "scripts": [{"num": 32, "title": "A Day on Granville Island", "F": "directions and places, prices, times, did/didn't, is, -ed, there is/there are", "V": "Public Market, vendor, stall, local, fresh, sample, Aquabus, False Creek, busker, mural, \"Watch out for the seagulls,\" under the bridge", "T": "When my mother visited from São Paulo in June, the first place I took her was Granville Island. \"Is it really an island?\" she asked. \"Not really. It's more like a small peninsula, under the Granville Bridge. But everyone calls it an island.\" We didn't drive, because parking is difficult on weekends. Instead, we took the Aquabus, a tiny boat that crosses False Creek. It only took five minutes. My mother loved it. \"It's like a toy boat!\" she said. Our first stop was the Public Market. It was full of people and colour. There were stalls with fresh fruit, vegetables, cheese, bread, fish, and flowers. \"Everything here is local,\" I explained. \"Many of the vendors are small farmers and bakers from B.C.\" At the cheese stall, the vendor offered us a sample. \"Would you like to try this one? It's from a farm in the Fraser Valley.\" My mother tried it and smiled. \"Delicious. Much better than the cheese at the supermarket.\" We bought cheese, bread, and fresh strawberries. \"What about lunch?\" she asked. We ordered fish and chips and sat outside on a bench near the water. \"Watch out for the seagulls,\" I warned her. \"They steal food.\" One minute later, a seagull flew down and took a french fry right out of her hand. She screamed, and then she laughed so hard she couldn't breathe. After lunch, we watched a busker playing guitar and singing. A small crowd gathered around him. My mother put a toonie in his guitar case. \"In Brazil, we have street musicians too,\" she said. \"But he's very good.\" Then I showed her my favourite surprise. We walked to the end of the island, where there are six giant concrete silos. They're painted with huge colourful people, like giants. \"Who painted them?\" she asked. \"Two artists from São Paulo. Twin brothers.\" \"From São Paulo? Really?\" She took about twenty photos. \"I'm sending these to everyone in the family.\" At four o'clock, we took the Aquabus back. My mother held the bag of strawberries on her lap. \"I didn't expect to find a piece of home here,\" she said. \"Neither did I,\" I said. \"The first time I saw those silos, I cried.\"", "words": 369}, {"num": 33, "title": "Biking the Stanley Park Seawall", "F": "a tour guide's instructions and facts, distances and numbers, can, will, didn't", "V": "bike rental, helmet, seawall, counter-clockwise, lane, pedestrians, totem poles, Brockton Point, Lions Gate Bridge, Siwash Rock, lookout, raccoon, \"Don't feed the wildlife\"", "T": "On Saturday morning, my friend Marla and I joined a bike tour of Stanley Park. We met our guide, Trevor, at a bike rental shop on Denman Street at ten o'clock. \"Good morning, everyone! Before we start, a few rules. Everyone has to wear a helmet. On the seawall, bikes go in one direction only, counter-clockwise. Stay in the bike lane, because the other lane is for pedestrians. And if you need to stop, pull over to the side first.\" We rode toward the park. \"Stanley Park is over four hundred hectares,\" Trevor explained. \"That's bigger than Central Park in New York. The seawall goes all the way around it, about nine kilometres.\" Our first stop was Brockton Point, where there are several tall totem poles. \"These totem poles were carved by First Nations artists,\" Trevor said. \"Each one tells a story about families, animals, and history. Please don't touch them, but take as many photos as you like.\" Next, we rode under the Lions Gate Bridge. It was huge, and the cars above us sounded like thunder. \"The bridge opened in 1938,\" Trevor said. \"It connects downtown Vancouver to the North Shore.\" A little later, we stopped at a big rock standing in the water, all alone. \"This is Siwash Rock,\" Trevor said. \"It's been here for thousands of years, and there are many First Nations stories about it.\" Then we pushed our bikes up a hill to Prospect Point. From the lookout, we could see the ocean, the mountains, and huge ships waiting to enter the harbour. We took a break at the café. While we were eating, a raccoon came very close to our table. A little boy started to throw it a piece of his muffin. \"Please don't feed the wildlife,\" Trevor said kindly. \"It's bad for the animals, and raccoons can bite.\" After the break, we rode past Third Beach and Second Beach, where people were swimming and playing volleyball. We returned to the rental shop at one o'clock. My legs were tired, but I was smiling. \"How was it?\" Trevor asked me. \"Amazing,\" I said. \"I've lived here for a year, and I didn't know the city was this beautiful.\"", "words": 366}, {"num": 34, "title": "Lynn Canyon", "F": "safety warnings, heights and distances, don't, can, did, -ed", "V": "suspension bridge, canyon, trail, swimming hole, rapids, cliff jumping, dangerous, \"Stay on the trail,\" \"Keep an eye on the kids,\" \"It's free\"", "T": "My neighbour Trish had a day off on Tuesday, so she offered to take my family to Lynn Canyon in North Vancouver. \"Everyone goes to the Capilano Suspension Bridge,\" she said. \"It's beautiful, but it's expensive. Lynn Canyon has a suspension bridge too, and it's free.\" We drove across the Second Narrows Bridge and parked near the entrance. As soon as we walked into the park, the air felt cooler. There were enormous trees all around us, covered in green moss. \"Some of these trees are hundreds of years old,\" Trish said. Then we came to the suspension bridge. It was narrow, and it moved a little when people walked on it. \"How high is it?\" my son asked. \"About fifty metres above the water,\" Trish said. My daughter held my hand very tightly. \"Mom, I don't want to go.\" \"It's safe,\" Trish told her. \"Thousands of people cross it every day. Just hold the side and don't look down if you're scared.\" We walked across slowly. In the middle, I looked down. The river was far below us, rushing over the rocks. It was beautiful and a little scary. On the other side, we followed a trail through the forest to a place called the Thirty Foot Pool. It's a natural swimming hole with clear green water. \"Can we swim?\" my son asked. \"You can go in near the edge, where it's shallow,\" Trish said. \"But be careful. The water is very cold, even in summer, and the current can be strong.\" Then she pointed to a sign: \"Danger. No cliff jumping.\" \"Some young people jump into the water from the cliffs,\" Trish said quietly. \"Every few years, someone dies here. The water is deeper and colder than it looks, and there are rocks under the surface.\" My son looked at the cliffs, then at me. \"I'll just put my feet in,\" he said. \"Good choice,\" I said. After an hour, we walked back and had lunch at the small café near the entrance. \"Did you like it?\" Trish asked the kids. \"The bridge was scary, but fun,\" my daughter said. \"Can we come back next weekend?\" I looked at Trish. \"Now I understand why you love this place.\"", "words": 370}, {"num": 35, "title": "A Day Trip to Whistler", "F": "highway travel, times and distances, heights, did, was/were, will, can/can't, -ed", "V": "Sea to Sky Highway, winter tires, lookout, waterfall, gondola, Peak 2 Peak, village, Olympic rings, Winter Olympics, ski season, \"Keep your eyes on the road\"", "T": "In October, my coworker Mike invited my husband and me on a day trip to Whistler. \"You can't live in Vancouver and not see Whistler,\" he said. We left at eight in the morning. \"It's about two hours by car,\" Mike explained, \"on the Sea to Sky Highway. It's one of the most beautiful drives in the world.\" \"Is it dangerous in winter?\" my husband asked. \"It can be. From October 1st to April 30th, you need winter tires on this highway. It's the law.\" Soon we were driving between the ocean and the mountains. \"Keep your eyes on the road, Mike,\" I joked, because I couldn't stop looking. After about forty-five minutes, we stopped at Shannon Falls, a waterfall near Squamish. \"It's over three hundred metres high,\" Mike said. \"Taller than most buildings in the world.\" We arrived in Whistler at ten thirty. The village was full of shops, restaurants, and people walking. There were no cars in the centre. \"Whistler hosted events for the 2010 Winter Olympics,\" Mike said. He pointed to the giant Olympic rings. \"Everyone takes a photo here.\" So we did. Then we took the gondola up Whistler Mountain. At the top, it was much colder, and there was already some snow. \"Now for the best part,\" Mike said. \"The Peak 2 Peak Gondola. It goes from Whistler Mountain to Blackcomb Mountain.\" The gondola moved slowly across the valley. Below us, there was nothing but trees and air, very far down. \"How high are we?\" I asked. \"At the highest point, more than four hundred metres above the ground.\" \"Please don't tell me that,\" my husband said. After we came down, we had lunch at a pub in the village. \"When does the ski season start?\" I asked. \"Usually in late November. It goes until April, sometimes May.\" \"I've never skied in my life,\" I said. \"Then this winter, you'll learn,\" Mike said. \"I'll teach you.\" On the drive home, the sun was setting over the ocean. My husband fell asleep in the back seat. \"Thank you for today,\" I said. \"It was one of the best days since we moved to Canada.\"", "words": 358}, {"num": 36, "title": "A Night at the Hockey Game", "F": "Canadian words (toque, washroom, loonie, toonie, double-double, eh), numbers (prices, periods, scores), was, can", "V": "the Canucks, Rogers Arena, period, intermission, goal, overtime, toque, loonie, toonie, double-double, washroom, \"eh\"", "T": "My coworker Tom had two extra tickets to the Canucks game, so he invited me and my son. \"Dress warmly,\" he said. \"Bring a toque.\" \"What's a toque?\" \"It's a winter hat. The kind with no brim.\" I borrowed one from my neighbour. We met Tom at Stadium–Chinatown SkyTrain Station at six fifteen, and walked two minutes to Rogers Arena. Outside, a man was selling programs. \"Seven dollars,\" he said. I gave him a ten-dollar bill, and he gave me back two coins, a big gold one and a two-colour one. \"What are these?\" my son asked. \"The gold one is a loonie. It's one dollar. It has a bird on it, a loon,\" Tom explained. \"The two-colour one is a toonie. It's two dollars.\" \"Loonie and toonie?\" my son said. \"That's funny.\" \"Canadians are funny, eh?\" Tom said. \"Why do you say 'eh' at the end?\" I asked. He laughed. \"I don't know. We just do. It's like 'right?' or 'don't you think?'\" Before we found our seats, Tom stopped at a coffee counter. \"I'll have a double-double, please.\" \"What's a double-double?\" \"Coffee with two creams and two sugars. It's very Canadian.\" Our seats were high up, but we could see everything. The game started at seven. \"A hockey game has three periods,\" Tom explained. \"Each period is twenty minutes. Between periods, there's an intermission. That's when everyone goes to the washroom and buys food.\" In the first period, the other team scored. The arena was quiet. In the second period, the Canucks scored twice. Everyone jumped up and shouted. My son was screaming louder than anyone. During the second intermission, I asked Tom, \"Where's the washroom?\" \"Down the stairs, on the left. But hurry. The lines are long.\" In the third period, the other team scored again. It was two to two. \"If it's tied at the end, they play overtime,\" Tom said. With forty seconds left in overtime, a Canucks player shot the puck, and it went into the net. Three to two! The whole arena exploded. On the SkyTrain home, my son wore his new Canucks toque. \"Can we go again, Dad?\" \"We'll see,\" I said. \"Tickets aren't cheap, eh?\" Tom laughed. \"You're already talking like a Canadian.\"", "words": 372}]}, {"part": 5, "title": "Shopping and Food", "desc": "Groceries, stores, malls, and eating out.", "scripts": [{"num": 37, "title": "Where Do You Buy Groceries?", "F": "comparing stores and prices, cheaper/more expensive, do, did, should, can", "V": "grocery store, Save-On-Foods, Safeway, Superstore, No Frills, T&T, Costco, membership, points card, rewards, flyer, on sale, bulk, price match, \"bag your own groceries\"", "T": "In our first month in Vancouver, we spent a lot of money on groceries. One day, I asked my neighbour Joan, \"Where do you buy your groceries? Everything is so expensive.\" She laughed. \"It depends what I need. Every store is a little different.\" \"What's the difference?\" \"Save-On-Foods and Safeway are the big regular supermarkets. They're clean, they have everything, and there's one in almost every neighbourhood. There's a Safeway near Commercial–Broadway Station. But they aren't the cheapest.\" \"Do they have points cards?\" \"They do. Save-On-Foods has More Rewards, and Safeway uses Scene+. You collect points, and later you get money off your groceries. It's free to sign up, so you should do it.\" \"Where's cheaper?\" \"Superstore and No Frills. They're owned by the same company, and they use the PC Optimum points card. No Frills is very basic. You bag your own groceries, and the store isn't fancy. But the prices are lower.\" \"Why is it called No Frills?\" \"'Frills' means extra, fancy things. So 'no frills' means just the basics.\" \"What about T&T? I see it everywhere.\" \"T&T is an Asian supermarket. It's great for fresh fish, vegetables, sauces, and noodles. And the bakery is amazing.\" Then Joan asked, \"Do you have a Costco membership?\" \"No. What's Costco?\" \"It's a huge warehouse store. You pay for a membership every year, and you buy everything in bulk. Big boxes, big bags, big bottles.\" \"Is it worth it?\" \"For a family with kids, usually yes. Toilet paper, coffee, rice, and meat are much cheaper. But be careful. You'll go in for milk and come out with a new TV.\" I laughed. \"One more tip,\" Joan said. \"Every Thursday, the stores publish their flyers online, with the week's sales. Check them before you shop. Some stores will even price match. If another store has something cheaper, show them the flyer, and they'll give you the same price.\" That weekend, I checked the flyers, made a list, and went to No Frills. I brought my own bags and packed everything myself. At the checkout, my total was sixty dollars less than usual. When I got home, my husband looked at the receipt. \"What happened? Did you forget half the list?\" \"No,\" I said. \"I just shopped like a Canadian.\"", "words": 377}, {"num": 38, "title": "Grocery Shopping", "F": "pounds and kilograms, prices, cents, \"a dozen,\" taxes, do/does/don't, is, can, -ed", "V": "per pound, per kilogram, produce, on sale, a dozen, pop, bottle deposit, bottle depot, reusable bags, self-checkout, points card, receipt, tap, insert", "T": "On Saturday morning, I went grocery shopping with my neighbour, Joan. She wanted to show me some Canadian shopping tricks. We started in the produce section. I picked up some bananas. The sign said: \"79 cents per pound.\" \"Per pound?\" I said. \"I thought Canada used kilograms.\" \"It does,\" Joan said. \"Look at the small numbers under the big ones. One dollar and seventy-four cents per kilogram. Stores show the price per pound in big letters because it looks cheaper.\" Next, we went to the meat section. The chicken breasts were on sale for six ninety-nine a pound. Then I needed eggs. \"Get a dozen,\" Joan said. \"That's twelve.\" At the drinks aisle, I picked up a bottle of pop. \"Pop?\" I asked. \"In Brazil, we say 'refrigerante.'\" \"In B.C., we say pop,\" Joan said. \"But look at the price tag. See the word 'deposit'? You pay ten cents extra for the bottle. When you return the empty bottle to a bottle depot, you get your ten cents back.\" At the checkout, there was a long line, so Joan took me to the self-checkout. \"Scan each item here. For bananas and vegetables, type the code on the sticker, or search on the screen.\" I scanned everything carefully. The screen asked: \"Did you bring your own bags?\" \"I didn't,\" I said. \"Then you'll pay for each paper bag. In Vancouver, stores have to charge for bags. Next time, bring reusable bags.\" Then the screen asked: \"Do you have a points card?\" \"I don't have one.\" \"You can sign up for free. You get points, and after a while, you get free groceries,\" Joan said. My total was forty-two dollars and sixty cents. \"Why did it add tax on the pop and the chips, but not on the chicken or the eggs?\" \"Basic groceries don't have tax,\" Joan explained. \"But things like pop, chips, and candy do.\" The machine said: \"Tap, insert, or swipe.\" I tapped my card. \"Would you like your receipt?\" \"Yes, please.\" Walking home, I looked at my receipt. \"Canadian shopping is complicated,\" I said. \"Pounds, kilos, deposits, bags, taxes.\" Joan laughed. \"You did great. Next week, you can teach me something about Brazilian food.\"", "words": 366}, {"num": 39, "title": "Meat and Vegetables for a Brazilian Barbecue", "F": "food vocabulary, weights (kilos and pounds, grams), quantities (a bunch, a head, a bag), can, do/don't", "V": "butcher counter, cut, top sirloin cap, flank steak, ribs, ground beef (lean, extra lean), chicken thighs, boneless, skinless, sausage, marinade; bell peppers, zucchini, eggplant, green onions, cilantro, parsley, romaine lettuce, Roma tomatoes, corn on the cob, cassava, sweet potatoes, a bunch, a head, a bag, organic, B.C. grown", "T": "For my birthday, I invited six coworkers to a Brazilian barbecue, a churrasco, at our apartment. On Friday, my husband and I made the shopping list. \"The meat is the most important part,\" he said. \"First, picanha.\" \"What's picanha in English?\" We asked our friend Mike, who loves cooking. \"Ask the butcher for top sirloin cap,\" he said. \"They don't always have it in the display, so ask at the counter.\" On Saturday morning, we went to the butcher counter at the supermarket. \"Hi, can I help you?\" the butcher asked. \"Yes, do you have top sirloin cap?\" \"We do. How much would you like?\" \"About two kilos, please. And can you leave the fat on? Don't trim it.\" \"Sure. Most people ask me to cut it off.\" \"What else?\" \"One kilo of flank steak and some pork ribs. And chicken thighs, please. Boneless and skinless, about a kilo and a half.\" \"And sausage?\" my husband whispered. \"Oh, and eight sausages. Do you have something similar to Portuguese sausage?\" \"We have chorizo. That's close.\" \"Perfect.\" My husband also wanted ground beef. \"Lean or extra lean?\" the butcher asked. \"What's the difference?\" \"Extra lean has less fat. For meatballs or burgers, lean is fine.\" \"Lean, please. Five hundred grams.\" Next, we went to the produce section. I read the list. \"Two red bell peppers and two green ones. Two zucchini. One eggplant. A bunch of green onions and a bunch of parsley.\" \"Not cilantro?\" \"Cilantro too. Some people hate it, so I'll put it on the side.\" \"What about the salad?\" \"A head of romaine lettuce and six Roma tomatoes. And one red onion.\" \"Corn on the cob?\" \"Yes! Six ears. They're B.C. grown, and they're on sale.\" Then I looked for cassava, for mandioca frita. \"I can't find it,\" I said. An employee helped us. \"Cassava? Sometimes it's called yuca. Check the Asian and Latin section, near the end of the aisle.\" We found it, and two sweet potatoes too. On Sunday, the barbecue was a big success. Mike ate four pieces of picanha. \"What's this cut called again?\" he asked. \"In Brazil, picanha,\" I said. \"Here, top sirloin cap. But just remember to tell the butcher not to cut off the fat.\"", "words": 373}, {"num": 40, "title": "The Cleaning Supplies List", "F": "household vocabulary, quantities and packages (a roll, a pack of 12, a bottle, a box), do/don't, should, need/don't need", "V": "dish soap, dishwasher pods, laundry detergent, fabric softener, dryer sheets, bleach, all-purpose cleaner, glass cleaner, toilet bowl cleaner, sponges, scrub brush, rubber gloves, mop, bucket, broom, dustpan, paper towels, toilet paper, garbage bags, aluminum foil, plastic wrap, freezer bags, light bulbs, batteries, unit price", "T": "On Sunday morning, my husband and I made a shopping list for our new apartment. \"Okay,\" I said. \"Let's start with the kitchen. We need dish soap.\" \"In Brazil, we call it 'detergente,'\" my husband said. \"But I asked at the store last week, and they showed me laundry detergent. Here, detergent is usually for clothes.\" \"So, dish soap for washing by hand, and dishwasher pods for the dishwasher. Do we have a dishwasher?\" \"We do. We've never used it.\" \"Then pods. What else?\" \"Sponges, a scrub brush, and rubber gloves. And paper towels.\" \"Now the laundry. We need laundry detergent, fabric softener, and dryer sheets.\" \"What are dryer sheets?\" \"You put one in the dryer with your clothes. It makes them soft, and they don't stick together.\" \"And bleach,\" my husband added. \"Yes, but be careful with bleach. My coworker told me never to mix it with other cleaners. It can make dangerous gas.\" \"Okay. Bathroom?\" \"Toilet bowl cleaner, glass cleaner for the mirror, and an all-purpose cleaner for everything else.\" \"What about the floors?\" he asked. \"In Brazil, I always used a squeegee and a cloth.\" \"Here, most people use a mop and a bucket. And a broom and a dustpan.\" \"Don't forget toilet paper.\" \"Never! And garbage bags, the big ones for the kitchen and small ones for the bathroom.\" \"Aluminum foil, plastic wrap, and freezer bags for leftovers. Oh, and light bulbs. The one in the hallway burned out. And batteries for the smoke detector.\" We went to Superstore that afternoon. The cleaning aisle was huge. There were at least twenty kinds of dish soap. \"Which one should we buy?\" my husband asked. \"Look at the small numbers on the shelf tag,\" I said. \"That's the unit price. It tells you how much it costs per hundred millilitres. The bigger bottle is usually cheaper per millilitre.\" The toilet paper came in packs of six, twelve, or twenty-four rolls. \"Twenty-four,\" my husband said. At the checkout, the total was one hundred and thirty-eight dollars. \"That's a lot for soap,\" my husband said. \"It's a lot of soap,\" I said. At home, he put everything away. Then he held up the mop. \"Okay,\" he said. \"Show me how this works.\"", "words": 372}, {"num": 41, "title": "London Drugs and the Dollar Store", "F": "asking where things are, prices, \"up to five dollars,\" do, can, did/didn't, is", "V": "aisle, \"Excuse me, where can I find...?\", pharmacy, electronics, photo printing, household items, school supplies, party supplies, \"Everything's under five dollars,\" receipt, return policy, exchange", "T": "When my daughter started school, she needed a lot of supplies. My coworker Tara gave me some advice. \"Go to London Drugs for the important things, and the dollar store for the cheap things.\" \"London Drugs? Is it from London?\" \"No,\" she laughed. \"It's a B.C. company. It started in Vancouver. It's a pharmacy, but they sell everything: electronics, cameras, makeup, snacks, household things. You can even print photos there.\" On Saturday, I went to the London Drugs downtown. I asked an employee for help. \"Excuse me, where can I find school supplies?\" \"Aisle seven, near the back,\" he said. \"Backpacks are in aisle eight.\" I found a good backpack for my daughter and a calculator for my son. I also needed a new phone charger. \"Where's the electronics section?\" I asked. \"Upstairs. Take the escalator.\" While I was there, I printed some family photos to send to my mother in Brazil. At the checkout, the cashier asked, \"Do you have a London Drugs account? You can collect points.\" \"Not yet.\" \"It's free. Want me to sign you up?\" \"Sure, why not.\" Next, I walked to a Dollarama, one of the dollar stores. \"Why is it called a dollar store,\" I asked my daughter, \"if things cost more than one dollar?\" She pointed at a sign: \"Everything up to five dollars.\" \"Before, everything was one dollar,\" I told her. \"Now it's one to five.\" The store was full of useful things: pencils, notebooks, glue, scissors, gift bags, party decorations, kitchen tools, and cleaning supplies. My daughter filled the basket with markers and notebooks. At the checkout, I noticed the prices didn't include tax. \"Why is the total higher than the prices on the shelf?\" I asked the cashier. \"Tax is added at the register,\" she explained. \"On most things, it's twelve percent, five percent federal and seven percent provincial.\" \"In Brazil, the tax is already in the price.\" \"A lot of newcomers say that,\" she said. As we left, she added, \"Check everything before you go. We don't take returns.\" At home, my daughter showed my husband everything we bought. \"How much did all this cost?\" he asked. \"Less than fifty dollars,\" I said. \"London Drugs for the important things, and the dollar store for everything else.\"", "words": 377}, {"num": 42, "title": "A Trip to Canadian Tire", "F": "finding products and asking for help, seasonal items, prices, do, didn't, should, will, -ed", "V": "Canadian Tire, automotive, tools, hardware, camping, sporting goods, seasonal, snow brush, ice scraper, windshield washer fluid, winter tires, installation, Triangle Rewards, \"Canadian Tire money\"", "T": "In our first November in Vancouver, my car's windshield was covered in frost one morning. I didn't have anything to clean it, so I used my credit card. My neighbour Glen saw me and laughed. \"You need a trip to Canadian Tire,\" he said. \"What's Canadian Tire? A tire store?\" \"It sells tires, but it sells almost everything else too. Car stuff, tools, camping gear, sports equipment, kitchen things, Christmas decorations. It's a Canadian classic.\" On Saturday, Glen came with me. The store was huge. \"Okay,\" Glen said. \"First, the automotive section. You need a snow brush and an ice scraper.\" We found a long brush with a scraper on the end for fifteen dollars. \"You also need windshield washer fluid for winter. Make sure it says 'minus forty.' The summer kind can freeze.\" \"Minus forty? It never gets that cold in Vancouver.\" \"No, but in the mountains, it can.\" Then Glen asked, \"Do you have winter tires?\" \"No. Do I need them?\" \"Not in the city, usually. But if you drive on the highway to Whistler or into the mountains after October 1st, you need them. You can buy them here, and they'll install them in the garage.\" I asked an employee at the automotive counter. \"How much are winter tires for a Toyota Corolla?\" \"About six hundred to eight hundred dollars for four tires, plus installation. We're pretty busy this time of year, so you should book an appointment. The next opening is in two weeks.\" \"Two weeks? Everyone had the same idea.\" \"Every November,\" he laughed. Before we left, Glen took me to the seasonal aisle. There were Christmas lights, fake trees, and snow shovels. \"You'll want one of these too, just in case,\" he said, holding up a shovel. At the checkout, the cashier asked, \"Do you have a Triangle Rewards card?\" \"No, what's that?\" Glen smiled. \"When I was a kid, Canadian Tire gave you 'Canadian Tire money,' little paper coupons that looked like real money. My dad kept a big jar of it. Now it's a card.\" I signed up. The next morning, there was frost again. I cleaned my windshield in two minutes with my new brush. Glen waved from his window and gave me a thumbs up.", "words": 375}, {"num": 43, "title": "Furnishing an Apartment at IKEA", "F": "following signs and instructions, aisle and bin numbers, prices, didn't, can, should, will, -ed", "V": "showroom, arrows, shortcut, marketplace, self-serve furniture area, aisle, bin, flat-pack, assembly, Allen key, instructions, delivery, return policy, supervised play area", "T": "When we moved into our first unfurnished apartment, we had almost nothing: two suitcases, a mattress, and four plates. \"Go to IKEA,\" my coworker Crystal said. \"There's one in Coquitlam and one in Richmond. You'll find everything there. But go on a weekday if you can. Weekends are crazy.\" We went on Wednesday morning. At the entrance, there was a supervised play area for kids. \"Can our son stay here while we shop?\" I asked. \"He can stay for up to one hour,\" the employee said. \"He needs to be tall enough. Let me measure him.\" He was just tall enough. \"Follow the arrows on the floor,\" Crystal had told us. \"The showroom goes in a big circle. If you want to skip a section, look for the shortcuts.\" The showroom had real rooms: living rooms, kitchens, bedrooms. When we found a sofa we liked, I looked at the tag. It showed the price, and something else: \"Aisle 24, Bin 17.\" \"What does that mean?\" my husband asked. \"Write it down,\" I said. \"Crystal told me. You don't take the furniture here. You find it downstairs in boxes.\" We also chose a bed, a dining table, four chairs, and a bookshelf, and I wrote down every aisle and bin number. At noon, we picked up our son and ate Swedish meatballs in the restaurant. After lunch, we went downstairs to the marketplace and bought lamps, towels, and kitchen things. The self-serve furniture area was like a giant warehouse. We found Aisle 24, Bin 17. The sofa was in three flat boxes. \"These boxes are too big for our car,\" my husband said. \"We can arrange delivery,\" an employee told us. \"There's a fee, and it'll arrive in three to five days.\" \"And do you assemble it?\" \"We have an assembly service for an extra cost, or you can do it yourself. Every box has instructions and an Allen key.\" We decided to build it ourselves. It took us two full weekends. At one point, we had four screws left over and no idea where they came from. My husband sat on the sofa carefully. It didn't fall. \"I think we're fine,\" he said.", "words": 363}, {"num": 44, "title": "Ordering at a Restaurant", "F": "ordering and answering the server's questions, prices, percentages, would/could/can, do/does/don't, did", "V": "server, \"Can I start you off with...?\", still or sparkling, tap water, special, side, \"How would you like it cooked?\", medium-rare, allergy, \"Is everything tasting okay?\", box (for leftovers), the bill, separate bills, tip, payment machine", "T": "On Saturday night, I went to a restaurant on Granville Island with my friends Marty and Tanya. Our server came to the table. \"Hi, folks! I'm Megan, and I'll be taking care of you tonight. Can I start you off with something to drink?\" \"Could I get a glass of water, please?\" I asked. \"Sure. Still or sparkling?\" \"Just tap water, please.\" Tanya ordered a glass of white wine, and Marty ordered a local beer. \"Today's special is the wild salmon with rice and vegetables,\" Megan said. \"It's thirty-two dollars.\" When she came back with the drinks, she asked, \"Are you ready to order, or do you need a few more minutes?\" \"I think we're ready,\" Marty said. \"Could we start with the calamari to share?\" \"Of course. And for your mains?\" \"I'll have the salmon special, please,\" Tanya said. \"Does it come with a salad?\" \"It doesn't, but you can add a side salad for five dollars.\" \"I'd like the burger, please,\" Marty said. \"Would you like fries or salad with that?\" \"Fries, please.\" \"I'll have the steak, please,\" I said. \"How would you like it cooked?\" \"Medium-rare.\" \"For your side, you can have mashed potatoes, fries, or seasonal vegetables.\" \"Mashed potatoes, please.\" \"Do you have any allergies I should know about?\" \"I don't, but Tanya is allergic to nuts.\" \"Thanks for letting me know. I'll tell the kitchen.\" Later, Megan came back. \"Is everything tasting okay?\" \"It's delicious,\" Tanya said. When we finished, there was still half of my steak on my plate. \"Can I get a box for this?\" I asked. \"Absolutely. Can I get you anything else? Dessert? Coffee?\" \"No, thanks. Just the bill, please.\" \"Together or separate?\" \"Separate, please,\" Tanya said. Megan brought the payment machine. My bill was fifty-one dollars and twenty cents. On the machine, I saw the tip options: eighteen percent, twenty percent, twenty-two percent, or \"custom.\" I chose eighteen percent and tapped my card. Outside, I asked Marty, \"Is eighteen percent normal here? In Brazil, the service charge is usually ten percent, and it's already on the bill.\" \"Eighteen is pretty normal now,\" Marty said. \"It used to be less, but prices went up, and so did the tips.\"", "words": 368}]}, {"part": 6, "title": "Health and Safety", "desc": "Clinics, emergencies, and staying safe in B.C.", "scripts": [{"num": 45, "title": "The Walk-In Clinic and the Pharmacy", "F": "medical questions, instructions (twice a day, for ten days), dates of birth, prices, have, didn't, does, should", "V": "walk-in clinic, first come first served, family doctor, sore throat, swab, positive, antibiotic, prescription, pharmacist, generic, brand name, side effects, rash, extended health benefits, \"finish all of it\"", "T": "I had a sore throat and a fever for four days. I didn't have a family doctor yet, so I went to a walk-in clinic on Commercial Drive. The sign on the door said: \"Opens at 9 a.m. First come, first served.\" I arrived at eight thirty, and six people were already in line. At the front desk, the receptionist asked for my BC Services Card. \"Have you been here before?\" \"No, this is my first time.\" \"Please fill out this form. The wait is about an hour.\" After an hour and ten minutes, the doctor called my name. Dr. Reid looked in my throat and checked my ears. \"It looks like strep throat. I'm going to do a quick swab.\" Ten minutes later, she came back. \"The test is positive. You need an antibiotic. Are you allergic to any medications?\" \"I'm allergic to penicillin.\" \"Good thing I asked. Then I'll give you a different antibiotic. Which pharmacy do you use?\" \"The one across the street.\" \"I'll send the prescription there.\" At the pharmacy, the pharmacist, Jason, called me to the counter. \"Can you confirm your date of birth?\" \"June 4th, 1988.\" \"Have you taken this medication before?\" \"No, I haven't.\" \"Take one tablet twice a day, in the morning and in the evening, with food. Take it for ten days, and finish all of it, even if you feel better.\" \"Why do I need to finish it?\" \"If you stop early, the infection can come back.\" \"Does it have any side effects?\" \"Some people get an upset stomach. If you get a rash, or if you have trouble breathing, stop taking it and get help right away.\" \"Okay.\" \"There's a generic version and a brand-name version. The generic is cheaper and works the same way. Is the generic okay?\" \"Yes, that's fine.\" \"Do you have extended health benefits through your work?\" \"I do.\" \"Then your insurance covers eighty percent. You'll pay six dollars and forty cents.\" I tapped my card. Jason added, \"By the way, in B.C., pharmacists can prescribe medication for some minor problems.\" \"I didn't know that.\" Three days later, I felt much better. But I remembered what Jason said, and I finished all of it.", "words": 369}, {"num": 46, "title": "Going to Emergency", "F": "describing symptoms, pain scale, dates of birth, temperatures, times, 13/30, does, is, can", "V": "Emergency (the ER), HealthLink BC 8-1-1, triage nurse, BC Services Card, symptoms, sharp/dull pain, pain scale, temperature, blood pressure, allergies, medications, ultrasound, diagnosis, discharged, prescription, follow up, family doctor", "T": "At two o'clock in the morning, I woke up with a terrible pain in my lower back, on the right side. The pain came in waves. My wife said, \"Call 8-1-1. A nurse can tell you if you should go to Emergency.\" I called HealthLink BC at 8-1-1. The nurse asked me a lot of questions. \"Where is the pain? Are you vomiting?\" \"I vomited once,\" I said. \"With that kind of pain and vomiting, you should go to Emergency now.\" My neighbour, Barry, drove me to Vancouver General Hospital. First, I went to the triage desk. The triage nurse, Sylvia, asked for my BC Services Card. \"What's your date of birth?\" \"March thirteenth, nineteen eighty-five.\" \"Thirteenth or thirtieth?\" \"Thirteenth. One-three.\" She checked my temperature and my blood pressure. \"Your temperature is thirty-eight point two. That's a small fever. On a scale of one to ten, how bad is the pain?\" \"About seven. Sometimes a nine.\" \"Is it a sharp pain or a dull pain?\" \"Sharp. Like a knife.\" \"Do you have any allergies to medications?\" \"I'm allergic to penicillin.\" \"Please take a seat. We see the most serious cases first.\" I waited for three hours and forty minutes. Finally, the doctor, Dr. Fraser, pressed on my back. \"Does this hurt?\" \"Yes! Right there.\" \"I'm going to order a blood test, a urine test, and an ultrasound.\" Two hours later, she came back with the results. \"You have a kidney stone. The good news is that it's small, only four millimetres. It should pass on its own.\" \"Four millimetres? It feels like forty!\" She gave me some medicine for the pain, and after thirty minutes, I felt much better. \"You're going to be discharged today. Here's a prescription for pain medication. Drink lots of water. If the pain gets worse, or if your fever goes above thirty-nine, come back right away.\" \"Do I need to see another doctor?\" \"Yes. Follow up with your family doctor in one or two weeks.\" \"I don't have a family doctor yet.\" \"Then call 8-1-1, and they'll help you.\" Barry drove me home at nine thirty. \"How are you feeling?\" he asked. \"Tired,\" I said. \"But I learned a lot of new English words tonight.\"", "words": 370}, {"num": 47, "title": "Calling 911", "F": "answering questions under pressure, addresses and phone numbers (13/30, 14/40), is/isn't, was, did/didn't, can", "V": "emergency, police, fire, ambulance, dispatcher, paramedics, address, cross street, suite, buzzer, conscious, breathing, bleeding, stay on the line", "T": "On Sunday afternoon, I heard a loud noise in the hallway of my building. I opened my door, and my neighbour, Mr. Walsh, was lying at the bottom of the stairs. He's about eighty years old. \"Mr. Walsh! Are you okay?\" He didn't answer. I took out my phone and called 911. \"911, what's your emergency? Do you need police, fire, or ambulance?\" \"Ambulance, please. My neighbour fell down the stairs.\" \"I'm connecting you to the ambulance dispatcher. Stay on the line.\" A few seconds later, a man answered. \"Ambulance. What's your emergency, please?\" \"My neighbour fell down the stairs. He isn't answering me.\" \"What's the address of the emergency?\" \"It's three four one five East Thirteenth Avenue.\" \"Sorry, East Thirteenth or East Thirtieth?\" \"Thirteenth. One-three.\" \"What's the nearest cross street?\" \"Knight Street.\" \"Is it an apartment building?\" \"Yes. He's in the hallway on the second floor, near suite two fourteen.\" \"Two fourteen or two forty?\" \"Two fourteen. One-four.\" \"And what's the phone number you're calling from?\" \"Six oh four, five five five, forty-seven eighteen.\" \"Okay. Help is on the way. How old is he?\" \"About eighty.\" \"Is he conscious?\" \"His eyes are closed. Wait, he opened his eyes. He's looking at me.\" \"Good. Is he breathing normally?\" \"Yes, I think so.\" \"Is he bleeding?\" \"There's a little blood on his head. Not much.\" \"Don't move him. He may have hurt his neck or his back. Do you have a clean towel?\" \"I can get one from my apartment.\" \"Press it gently on the cut. Don't lift his head.\" Mr. Walsh said quietly, \"I missed the last step.\" \"Is the front door of the building locked?\" the dispatcher asked. \"It is. Visitors have to use the buzzer.\" \"Can someone go down and open the door for the paramedics?\" \"My husband can.\" My husband ran downstairs. About seven minutes later, I heard the sirens. Two paramedics came up the stairs with a stretcher. \"You did everything right,\" one of them told me. That evening, Mr. Walsh's daughter, Ruth, knocked on my door. \"He broke his wrist, but he's going to be okay. Thank you for calling so quickly.\" \"I was so nervous,\" I said. \"I didn't know if I could understand them.\" Ruth smiled. \"Well, you did.\"", "words": 376}, {"num": 48, "title": "Earthquake Ready", "F": "instructions (drop, cover, hold on), numbers (72 hours, 4 litres), should, don't, didn't", "V": "earthquake, drill, ShakeOut, Drop, Cover, and Hold On, emergency kit, supplies, 72 hours, flashlight, batteries, first aid kit, meeting place, out-of-province contact, gas leak, aftershock", "T": "In October, our office had an earthquake drill. At ten fifteen, a voice came on the speakers: \"This is a drill. Drop, cover, and hold on.\" Everyone got under their desks. I didn't know what to do, so I copied Bev. After a minute, the voice said, \"The drill is over.\" Afterward, Bev explained. \"Every October, B.C. has a big earthquake drill called the ShakeOut. Vancouver is in an earthquake zone. Scientists say a big one could happen someday, so everyone should be ready.\" \"What should I do in a real earthquake?\" \"Drop to the ground. Take cover under a strong table or desk. Hold on until the shaking stops. Don't run outside, because things can fall from buildings.\" \"What about standing in a doorway? In movies, people do that.\" \"That's an old idea. It isn't safer. Get under a table.\" That weekend, I talked to my wife. \"We need an emergency kit,\" I said. \"Bev says after a big earthquake, we might need to take care of ourselves for at least seventy-two hours.\" \"Seventy-two hours? That's three days.\" \"Right. Stores might be closed, and there might be no power or water.\" We made a list together: water, food, a flashlight, extra batteries, a first aid kit, medications, a battery radio, cash, warm clothes, and copies of our passports. \"How much water?\" my wife asked. \"Four litres per person per day. There are four of us, so that's sixteen litres a day. For three days, that's forty-eight litres.\" \"That's a lot of water.\" \"It is. But it's important.\" We bought everything at a store on Kingsway and put it in a big plastic box in the hall closet. Then we made a family plan. \"If we're not together when it happens, where do we meet?\" \"At the kids' school,\" my wife said. \"And we need a contact outside B.C., in case phone lines here are busy.\" We chose my cousin in Toronto. That night, we practised with the kids. \"Earthquake!\" I shouted. They dropped under the kitchen table and held on to the legs. \"Good job,\" I said. My daughter looked up. \"Dad, what if the earthquake happens during dinner?\" \"Then take your plate with you,\" I joked. \"But hold on to the table first.\"", "words": 375}, {"num": 49, "title": "Hiking Safety on the North Shore", "F": "advice and warnings (should/shouldn't, don't, make sure), times, distances, did/didn't, will", "V": "trail, trailhead, trip plan, the ten essentials, flashlight, headlamp, map, extra layers, cell service, get lost, search and rescue, bear, bear spray, make noise, back away slowly, sunset", "T": "My friend Kevin loves hiking, so one Saturday in October he invited me to hike on Mount Seymour. The night before, he sent me a message: \"We'll start at the trailhead at nine. Bring the ten essentials.\" I wrote back, \"What are the ten essentials?\" He sent me a list: a flashlight or headlamp, extra food and water, extra clothes, a map, something to start a fire, a first aid kit, an emergency blanket, a knife, sunscreen, and a whistle. \"For a short hike?\" \"Yes. North Shore Rescue saves hundreds of people every year. Most of them thought it would be a short hike.\" In the morning, Kevin asked, \"Did you tell someone where we're going?\" \"No, I didn't.\" \"Always leave a trip plan with someone. Tell them where you're going, which trail, and what time you'll be back. If you don't come back, they call for help.\" I sent a message to my wife: \"Mount Seymour, main trail, back by four.\" On the trail, Kevin stopped at a sign. \"Bear country,\" it said. \"Are there really bears here?\" I asked. \"There are. Black bears. Usually they don't want to meet you. Make noise when you walk, so they hear you coming. Talk, sing, or clap your hands.\" \"And if we see one?\" \"Don't run. Stay calm, talk in a low voice, and back away slowly. That's why I carry bear spray.\" About an hour later, we saw a bear, far away on the other side of a small valley. It was eating berries and didn't look at us. My heart was pounding. \"Let's keep talking and keep moving,\" Kevin said. At the top, the view of Vancouver was incredible. I wanted to stay longer, but Kevin checked the time. \"It's one thirty. In October, the sun sets around six thirty, but it gets dark earlier in the forest. We should start going down.\" \"That's early.\" \"That's what everyone says. The trail is harder going down, and if someone gets hurt, it takes much longer. And there's almost no cell service up here.\" We got back to the car at three forty-five. I texted my wife: \"Back safely.\" She answered, \"Good. Did you see any bears?\" \"Just one,\" I wrote. \"We backed away slowly, just like the rules say.\"", "words": 379}]}, {"part": 7, "title": "Family, School, and Community", "desc": "Daycare, school, neighbours, and holidays.", "scripts": [{"num": 50, "title": "Finding a Daycare", "F": "phone calls, waitlists, 14/40, fees, hours, dates, does/doesn't, can, -ed", "V": "", "T": "My son, Leo, is eighteen months old, and I start a new job in March. So last week, I started looking for a daycare. My friend Nicole warned me, \"Start early. The waitlists in Vancouver are very long.\" I called three daycares on Monday. The first one, on Victoria Drive, didn't have any spaces for kids under three. The second one didn't answer the phone. I left a message, but they didn't call me back. The third one was Sunshine Daycare, on East 14th Avenue. A woman named Barb answered. \"Sunshine Daycare, this is Barb. How can I help you?\" \"Hi. I'm looking for a space for my son. He's eighteen months old.\" \"Okay. When do you need care?\" \"From March 1st.\" \"Hmm. We have a waitlist for the toddler room. Right now, it's about fourteen months.\" \"Sorry, fourteen or forty?\" \"Fourteen. One-four.\" \"That's too long for me. I need care in March.\" \"I understand. But you should still put his name on the list. Sometimes families move, and a space opens up.\" \"Does it cost anything to join the list?\" \"It doesn't. It's free.\" \"And how much is the daycare per month?\" \"We're a ten-dollar-a-day centre, so it's about two hundred and twenty dollars a month for full time.\" \"That's great. What are your hours?\" \"We're open from seven thirty to five thirty, Monday to Friday. Please don't be late at pick-up time. If you're late, there's a fee of one dollar per minute.\" \"What do I need to register him?\" \"His birth certificate, his immunization record, and the names of two emergency contacts.\" \"Does he need to bring lunch?\" \"No, he doesn't. We provide lunch and two snacks. But please bring diapers, a change of clothes, and a water bottle.\" I gave her my phone number and my email. \"Thank you so much, Barb.\" \"You're welcome. Good luck, and call some other centres too.\" That night, my phone rang. It was Barb. \"You're lucky,\" she said. \"A family just told us they're moving to Calgary. Can you visit on Thursday at ten?\" \"I can!\" I said. I didn't sleep much that night. I was too excited.", "words": 358}, {"num": 51, "title": "Registering for Kindergarten", "F": "school office vocabulary (catchment, proof of address, immunization record, gradual entry), ages and dates, did, does/doesn't, is/isn't, can", "V": "", "T": "My daughter, Chloe, turns five in October, so this September she'll start kindergarten. In British Columbia, children start kindergarten in the year they turn five. That surprised me. \"She'll only be four on her first day?\" I asked my neighbour, Stan. \"That's right,\" he said. \"My son was four too.\" Our catchment school is Cedar Park Elementary, on East 22nd Avenue, about ten minutes from our apartment. I went to the school office on a Tuesday morning. The secretary, Mrs. Clark, smiled. \"Good morning. How can I help you?\" \"I'd like to register my daughter for kindergarten.\" \"Wonderful. Do you live in our catchment area?\" \"I think so. We live on Knight Street, near 25th Avenue.\" \"Yes, you're in our catchment. Did you bring your documents?\" \"I did. What do you need?\" \"Proof of her age, like a birth certificate or a passport. Proof of your address, like your lease or a BC Hydro bill. Your immigration documents, because you're new to Canada. And her immunization record, if you have it.\" I handed her the papers, and she checked them one by one. \"This lease is fine, and her passport is fine. But this immunization record is in Portuguese.\" \"Is that a problem?\" \"It isn't a big problem. You can take it to a public health unit, and a nurse will review it for you.\" She gave me a form. \"Does Chloe have any allergies?\" \"She doesn't. But she doesn't speak much English yet.\" \"Don't worry. Many of our kindergarten students are learning English. We have an ELL teacher, an English Language Learner teacher, who works with them.\" \"What time does school start?\" \"The bell rings at eight fifty-five, and school finishes at three. But the first two weeks are gradual entry.\" \"Gradual entry? What's that?\" \"The kindergarten students come for short days at first, so they can get used to school. The teacher will send you a schedule in August.\" \"Can I stay with her on the first day?\" \"You can stay for a little while. Most parents stay for about twenty minutes.\" I thanked Mrs. Clark and walked home. Chloe was waiting at the window. \"Am I going to school?\" she asked. \"You are,\" I said. \"In September.\" She jumped up and down. \"Can I go tomorrow?\"", "words": 379}, {"num": 52, "title": "A New Student in Grade Four", "F": "elementary school vocabulary (principal, placement, ELL support, recess, hot lunch, permission forms, after-school care), phone numbers, 13/30, 16/60, will, does/doesn't, did", "V": "", "T": "We arrived in Vancouver on January 10th, and my son, Ben, started school eight days later. In Brazil, he was in fourth grade, so I was worried. \"Will he be in grade four here, or grade three?\" I asked. The principal, Mr. Morrison, explained, \"In B.C., students are placed by age. Ben is nine, so he'll be in grade four.\" \"Does he need to take a test?\" \"He doesn't need a test to register. But our ELL teacher will meet him in his first week to check his English. Then she'll decide how much support he needs.\" \"Who will his teacher be?\" \"Mrs. Hughes. There are twenty-four students in her class. She's been at this school for thirteen years.\" \"Thirteen or thirty?\" \"Thirteen. She isn't that old!\" Mr. Morrison laughed. \"Is there homework?\" \"Not much in grade four. About twenty minutes of reading every night.\" \"Does the school have a cafeteria?\" \"We don't, but we have a hot lunch program on Wednesdays. It costs five dollars. On the other days, students bring their own lunch. They eat in the classroom, and then they go outside to play.\" \"Outside? Even when it rains?\" \"Even when it rains. This is Vancouver. Please buy him a good raincoat and some rain boots.\" \"I work until five thirty. Is there care after school?\" \"There's a program in our gym from three to six, but it has a waitlist. Here's the number: six oh four, five five five, thirty-one sixteen.\" \"Thirty-one sixty?\" \"Sixteen. Three-one-one-six.\" \"What will he need for class?\" \"Mrs. Hughes will send home a supply list: pencils, markers, a ruler, and some notebooks. Sometimes she'll also send home permission forms for field trips. Please sign them and send them back the next day.\" On Ben's first day, he was very quiet in the morning. When I picked him up at three, I asked, \"How was it? Did you make any friends?\" \"I did,\" he said. \"His name is Tyler. He doesn't speak Portuguese, and I don't speak much English. But we both like soccer.\" \"What did you do at recess?\" \"We played soccer in the rain.\" He looked at his wet shoes. \"Mom, can I have rain boots?\"", "words": 365}, {"num": 53, "title": "The Parent-Teacher Conference", "F": "report card language, didn't, does, is, can, should, will", "V": "parent-teacher conference, report card, proficiency scale (Emerging, Developing, Proficient, Extending), strengths, goals, reading level, participate, homework, ELL support, \"at home, you could...\"", "T": "In November, I got an email from my son Ben's teacher, Mrs. Hughes. \"Parent-teacher conferences are next week. Please sign up for a fifteen-minute time slot.\" I chose Wednesday at three forty-five. When I arrived, Mrs. Hughes shook my hand. \"Thanks for coming. Ben is doing really well. Let's look at his report card together.\" She showed me a page with a lot of words I didn't understand. \"In B.C., we don't use letter grades until grade ten. For Ben's grade, we use a proficiency scale. There are four levels: Emerging, Developing, Proficient, and Extending.\" \"What do they mean?\" \"Emerging means the student is just starting to understand. Developing means he understands some parts. Proficient means he understands everything we expect. And Extending means he goes beyond that.\" \"Where is Ben?\" \"In math, he's Extending. He's one of the strongest students in the class.\" I smiled. \"In Brazil, he loved math too.\" \"In reading and writing, he's Developing. That's completely normal for a student who arrived in January. His English is improving every week.\" \"Does he get extra help?\" \"He does. He sees our ELL teacher three times a week. She says he's working very hard.\" \"What about his behaviour? Does he participate in class?\" \"He's quiet in big group discussions, but in small groups he talks a lot. And he's very kind. Last week, he helped a new student from Mexico find the washroom and the library.\" \"That's good to hear.\" \"I have one goal for Ben this term. I'd like him to read more at home, in English. Twenty minutes every night.\" \"Can he read in Portuguese too?\" \"Absolutely. Reading in Portuguese helps him too. But try to add some English books. The school library has a lot of easy chapter books. He can borrow three at a time.\" \"Is there anything else I should do at home?\" \"Ask him about his day in English sometimes. And don't worry about his mistakes. He's doing great.\" At four o'clock, the next parent was waiting at the door. I thanked Mrs. Hughes and went home. At dinner, I said to Ben, in English, \"Mrs. Hughes says you're Extending in math.\" He looked up proudly. \"What does Extending mean?\" \"It means you're a superstar,\" I said.", "words": 375}, {"num": 54, "title": "Other Parents at School Pickup", "F": "getting to know other parents, questions with which/how long/did, can, should, will, -ed", "V": "pickup, drop-off, \"Which one is yours?\", \"How long have you been at this school?\", \"Is this your first year?\", playdate, \"We should get the kids together,\" \"Let's exchange numbers,\" group chat, \"Are you signing him up for soccer?\"", "T": "Every afternoon at three o'clock, I wait for my son outside his school. For the first two weeks, I stood alone and looked at my phone. All the other parents were talking and laughing. One day, a woman standing next to me smiled and said, \"Hi! I don't think we've met. Which one is yours?\" \"My son, Ben. He's in grade four, in Mrs. Hughes's class.\" \"No way! My daughter, Olivia, is in that class too. I'm Tracy.\" \"Nice to meet you, Tracy.\" \"Is this your first year at this school?\" \"Yes. We moved here from Brazil in January.\" \"Oh, wow. How's Ben finding it?\" \"He's doing well. He's made a few friends, and he loves recess, even in the rain.\" Tracy laughed. \"They all love recess. How long have you been in Vancouver?\" \"About nine months. And you?\" \"I grew up in Burnaby, so my whole life, basically. If you ever have questions about anything, just ask me.\" Then the bell rang, and the kids ran out. Ben came out with a girl with red hair. \"Mom! This is Olivia. She sits next to me.\" \"That's my daughter!\" Tracy said. The kids looked at each other and laughed. \"Olivia talks about Ben all the time,\" Tracy said. \"He's teaching her some Portuguese.\" \"Really? What did he teach you, Olivia?\" Olivia smiled. \"Obrigada!\" Tracy looked at me. \"We should get the kids together sometime. Maybe a playdate on the weekend?\" \"Ben would love that.\" \"Let's exchange numbers. I'll text you.\" I gave her my phone number. \"Also, are you signing Ben up for soccer this spring? A lot of kids from the class play on the same team.\" \"I didn't know about that. When is registration?\" \"It opens in February. I'll send you the link. And I'll add you to the class parents' group chat. It's where we share everything: field trips, lost jackets, birthday parties.\" \"Thank you so much, Tracy.\" On Saturday, Olivia came to our house for a playdate. The kids built a fort in the living room, and Tracy and I drank coffee in the kitchen for two hours. When she left, she said, \"Same time next month? Our place.\" Ben and I both said yes.", "words": 369}, {"num": 55, "title": "Neighbours in the Elevator", "F": "short friendly exchanges, question tags (\"isn't it?\"), did/didn't, is/isn't, can, will, -ed", "V": "\"Nice day, isn't it?\", \"Did you just move in?\", \"Which unit are you in?\", \"Welcome to the building,\" \"Let me know if you need anything,\" recycling, package, parcel room, \"Have a good one\"", "T": "When we moved into our new apartment building in Burnaby, I didn't know any of our neighbours. In Brazil, I knew everyone on my street. On our second day, I got into the elevator with an older man and his dog. I didn't know what to say, so I didn't say anything. The ride felt very long. That evening, I asked my friend Joan, \"What do people talk about in an elevator?\" \"Keep it simple,\" she said. \"The weather, the dog, the building. Just a sentence or two. It's not a long conversation.\" The next morning, I got into the elevator with a woman carrying a yoga mat. I took a breath. \"Nice day, isn't it?\" \"It is! Finally, some sun.\" \"Are you going to yoga?\" \"I am. Did you just move in? I haven't seen you before.\" \"Yes, we moved in on Saturday. We're in 704.\" \"Oh, welcome to the building! I'm Eileen. I'm in 612.\" \"Nice to meet you, Eileen.\" The elevator stopped at the lobby. \"Let me know if you need anything,\" she said. \"Have a good one!\" \"You too!\" Later that week, I was taking our recycling down to the basement. The older man with the dog was there too. \"Hello again,\" I said. \"What's your dog's name?\" \"This is Buster. He's twelve, but he still thinks he's a puppy.\" \"He's very cute.\" \"Thank you. I'm Walt. I've lived here for twenty years. Did you figure out the recycling yet? It's a bit confusing.\" \"Not really. Where does the glass go?\" \"Glass has its own bin, and never put plastic bags in the recycling. The manager gets very upset.\" I laughed. \"Thank you. Nobody told me that.\" A week later, there was a knock on my door. It was Eileen. \"Hi! A package came for you, but it was left at my door by mistake.\" \"Oh, thank you so much!\" \"No problem. By the way, we're having a small get-together on the rooftop on Saturday. A few neighbours. Do you want to come?\" \"We'd love to.\" On Saturday, I brought pão de queijo. Walt and Buster were there too. By the end of the evening, I knew six neighbours. Joan was right. It starts with just one sentence.", "words": 372}, {"num": 56, "title": "Thanksgiving Dinner", "F": "holiday traditions, dates (the second Monday in October), was/were, didn't, would, -ed, thankful for", "V": "Thanksgiving, long weekend, host, guest, turkey, stuffing, mashed potatoes, gravy, cranberry sauce, pumpkin pie, leftovers, \"What are you thankful for?\", bring a dish", "T": "In October, my coworker Heather invited my family to her house for Thanksgiving dinner. \"Thanksgiving?\" I said. \"I thought that was in November.\" \"That's American Thanksgiving,\" she laughed. \"Canadian Thanksgiving is the second Monday in October. It's a long weekend. Most families have dinner on Sunday or Monday.\" \"What should we bring?\" \"You don't have to bring anything. But if you want, you could bring a dessert or a drink.\" On Sunday afternoon, we arrived at Heather's house in North Vancouver at four o'clock. The house smelled amazing. There were about twelve people: Heather's husband, Dave, their two kids, Heather's parents, her sister, Robin, and some neighbours. We brought brigadeiros, small Brazilian chocolate sweets. Heather's kids loved them before dinner even started. \"Dinner will be ready at five,\" Dave said. \"The turkey has been in the oven since eleven this morning.\" \"Since eleven?\" my son asked. \"It's a very big turkey,\" Dave said. \"Nine kilos.\" At five o'clock, we all sat at a long table. There was turkey, stuffing, mashed potatoes, gravy, green beans, and a red sauce I didn't know. \"What's this?\" I asked Heather's mother. \"Cranberry sauce. You eat it with the turkey. It's sweet and a little sour.\" I tried it. It was strange, but good. Before we ate, Heather said, \"In our family, we go around the table and everyone says one thing they're thankful for.\" Her father went first. \"I'm thankful that my family is healthy.\" Her son said, \"I'm thankful for no school tomorrow.\" Everyone laughed. When it was my turn, I was a little nervous. \"I'm thankful that we moved to Canada, and that we met people like you. A year ago, we didn't know anyone here. Today, we're at a family dinner.\" Heather smiled. \"We're thankful you're here too.\" After dinner, Dave brought out the pumpkin pie with whipped cream. I had never tried it. It was soft and sweet, with cinnamon. I ate two pieces. At eight o'clock, as we were leaving, Heather gave us a big container. \"Leftovers,\" she said. \"You'll have turkey sandwiches all week.\" In the car, my daughter asked, \"Can we have Thanksgiving every year?\" \"We can,\" I said. \"Next year, maybe we'll host.\"", "words": 367}]}, {"part": 8, "title": "Small Talk and Canadian Culture", "desc": "The conversations and unwritten rules nobody explains.", "scripts": [{"num": 57, "title": "\"How Are You?\" Isn't a Real Question", "F": "automatic greetings and replies, didn't, is, -ed", "V": "\"How are you?\", \"How's it going?\", \"What's up?\", \"Good, thanks. You?\", \"Not bad,\" \"Can't complain,\" \"Hanging in there,\" \"Have a good one,\" \"Take care,\" \"We should get coffee sometime,\" \"How are you really?\"", "T": "On my first morning in Vancouver, I went to a Tim Hortons for breakfast. There was a long line. When it was my turn, the young man at the counter smiled and said, \"Hi, how are you?\" I thought it was a real question, so I answered honestly. \"I'm okay, but I'm very tired. I arrived from Brazil yesterday, and I didn't sleep well because of the time difference, and my hotel room is very noisy...\" He was still smiling, but I could see he was confused. Behind me, people were waiting. \"Oh, uh, sorry to hear that,\" he said. \"What can I get for you?\" That evening, I told my friend Doug the story. He laughed so hard he almost dropped his coffee. \"In Canada, 'How are you?' is usually just a greeting. It's like saying hello. People don't expect a real answer, especially strangers.\" \"So what should I say?\" \"Just say 'Good, thanks. How are you?' or 'Not bad, you?' That's it.\" \"Even if I'm not good?\" \"Even if you're not good. With cashiers, bus drivers, people in the elevator, it's just a friendly ritual. You can also say 'Can't complain.' Or if you're having a hard week, 'Hanging in there.' That's honest, but still short.\" \"What about 'How's it going?' and 'What's up?'\" \"Same thing. For 'What's up?', you can just say 'Not much. You?'\" \"And when people say 'Have a good one'?\" \"Just say 'You too' or 'Thanks, you too.'\" \"Anything else?\" \"If someone says, 'We should get coffee sometime,' it might not be a real invitation. If they give you a day and a time, then it's real.\" \"That's confusing.\" \"I know. But with close friends and family, 'How are you?' can be a real question. If a friend looks at you and says, 'How are you, really?', then they want the true answer.\" The next morning, I went back to the same Tim Hortons. The same young man was at the counter. \"Hi, how are you?\" \"Good, thanks. How are you?\" \"Not bad! What can I get for you?\" \"A medium coffee, please.\" It took five seconds. When I left, he said, \"Have a good one!\" \"Thanks, you too!\" I said. Outside, I smiled. I felt a little more Canadian.", "words": 376}, {"num": 58, "title": "Small Talk in the Office Kitchen", "F": "small talk, weekend plans, weather, sports, did/didn't, do/does, was, -ed, question tags", "V": "small talk, \"How was your weekend?\", \"Not bad,\" potluck, sign-up sheet, the Canucks, overtime, \"Have a good one\"", "T": "Every morning, I make coffee in the office kitchen, and every morning, someone starts a conversation. At first, small talk was harder for me than meetings. In meetings, I know the topic. In the kitchen, anything can happen. On Monday, Tom came in while I was waiting for the coffee machine. \"Hey! How was your weekend?\" \"It was good, thanks. How was yours?\" \"Not bad. I went up to Whistler with my kids. We did some hiking.\" \"Nice! Was it busy?\" \"Super busy. Did you do anything fun?\" \"We walked around Stanley Park on Saturday. On Sunday, it rained, so we stayed home and watched a movie.\" \"Classic Vancouver weekend,\" Tom said, and we both laughed. Then Linda walked in. \"Morning, guys. Did anyone watch the Canucks game last night?\" \"I did,\" Tom said. \"They won in overtime.\" \"I didn't watch it,\" I said. \"I don't really understand hockey yet.\" \"That's okay,\" Linda said. \"Neither does my husband, and he was born here.\" A few minutes later, Kevin from IT came in. \"Morning. Cold one today, isn't it?\" \"It is,\" I said. \"My car was covered in frost.\" \"They say it might snow on Thursday.\" \"Snow? Really?\" \"Maybe. But this is Vancouver. It'll probably just rain.\" On Wednesday, Karen from HR put a sign-up sheet on the fridge: \"Holiday Potluck, Friday, December 18th, 12:00 p.m. Please bring one dish to share!\" \"What's a potluck?\" I asked Linda. \"Everyone brings some food, and we all share it.\" \"What should I bring?\" \"Bring something from Brazil! People love that.\" I wrote my name on the sheet: \"Pão de queijo, cheese bread.\" On the day of the potluck, my pão de queijo disappeared in ten minutes. Greg ate six. \"You have to bring these every year,\" he said. \"Can you send me the recipe?\" \"I can,\" I said. That afternoon, Kevin was in the elevator. \"Have a good one,\" he said. \"You too,\" I said. \"See you Monday.\" Small talk still isn't easy for me. But now, I actually enjoy it.", "words": 338}, {"num": 59, "title": "The First Two Minutes of a Meeting", "F": "small talk before business, weekend and holiday plans, did/didn't, will, -ed, question tags", "V": "\"How's your week going?\", \"Busy, but good,\" \"Can't complain,\" \"Any plans for the weekend?\", long weekend, \"Did you catch the game?\", \"How was your trip?\", \"Okay, let's get started,\" \"Let's dive in\"", "T": "Our weekly meeting with the Calgary team always starts at nine on Friday. But the first two minutes are never about work. At the beginning, I didn't understand this. In my first meeting, I said \"Good morning\" and started talking about the project right away. There was a short, strange silence. Later, Linda explained. \"Canadians like a little small talk first. Just a minute or two. It's how we warm up.\" So this Friday, I was ready. At nine o'clock, Scott joined the call from Calgary. \"Morning, everyone! How's your week going?\" \"Busy, but good,\" I said. \"How about yours?\" \"Can't complain. It snowed here yesterday, so I spent an hour shovelling my driveway.\" \"Snow already? It's only October!\" \"Welcome to Calgary,\" he laughed. \"What's the weather like there?\" \"Rainy, of course,\" Linda said. Then Heather joined. \"Sorry I'm late! My kid couldn't find his shoes.\" \"No problem. We were just talking about the snow,\" Scott said. \"Oh, don't get me started,\" Heather said. Linda turned to Heather. \"How was your trip to Banff last weekend?\" \"It was beautiful. We did a lot of hiking, and we saw two elk right next to the road.\" \"Lucky! Any plans for this weekend?\" I asked. \"Nothing big. We're just going to relax. It's a long weekend, isn't it?\" \"It is. Monday is Thanksgiving,\" Linda said. \"Are you doing anything for Thanksgiving?\" Scott asked me. \"Our friend invited us to her family dinner. It'll be our first Canadian Thanksgiving.\" \"Oh, that's great. Make sure you try the pumpkin pie.\" \"Everyone keeps telling me that,\" I said, and they laughed. Then Scott asked Linda, \"Did you catch the Canucks game on Wednesday?\" \"I did! What a finish.\" \"We can talk about that later,\" Heather joked. \"I don't want to cry before the meeting starts.\" Linda smiled and looked at her notes. \"Okay, let's get started. First item on the agenda: the testing schedule.\" And just like that, we were talking about work. After the meeting, Linda sent me a message. \"Nice job with the small talk. You sounded like a local.\" I wrote back, \"I practised. I had three questions ready before the call.\"", "words": 360}, {"num": 60, "title": "Safe Topics and Unsafe Topics", "F": "polite and impolite questions, what not to say, didn't, would, can", "V": "safe topics (weather, weekends, food, travel, sports, pets), sensitive topics (salary, age, weight, religion, politics), \"That's a bit personal,\" \"I'd rather not say,\" compliment, awkward, \"No offence taken\"", "T": "In my second month at work, I made two big small-talk mistakes on the same day. In the morning, I saw my coworker Karen in the kitchen. She had been on vacation for three weeks. \"Karen! Welcome back! You gained a little weight. You look healthy!\" In Brazil, that could be a friendly thing to say. Karen's smile disappeared. \"Oh... thanks,\" she said, and she left the kitchen quick
