<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Lab | Ron Taylor Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#201b14; --graphite:#2b2d30; --graphite-2:#3a3d41; --silver:#a9b0b8; --mist:#e2e5e8;
  --paper:#ecedef; --white:#ffffff; --harbour:#1f5f63; --harbour-soft:#dcebea;
  --missed:#f6d9a8; --missed-ink:#6b4200; --extra:#b3261e;
  /* depth scale: shallow water to deep, used for level 1/2/3 */
  --shoal:#3f8b8e; --shoal-soft:#e4efee; --deep:#12384a; --deep-soft:#dde6ea;
  --rule:#d8dadd; --muted:#5b6168;
  --lv:var(--harbour); --lv-soft:var(--harbour-soft);
  /* one hue per part of the book */
  --p1:#1f5f63; --p2:#2c4a7c; --p3:#4a5f8c; --p4:#366245; --p5:#7a5a12;
  --p6:#8c3a34; --p7:#73304f; --p8:#493670; --p9:#54611f; --p10:#7f5118;
  --p11:#33566e; --p12:#60401f; --p13:#72283f;
  --part:var(--harbour);
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--harbour);outline-offset:2px}
a{color:var(--harbour)}

[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)}
[data-part="13"]{--part:var(--p13)}
.wash{background:var(--white);background:color-mix(in srgb, var(--part) 6%, #fff)}

.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--graphite);color:var(--mist);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:26px 24px 18px;border-bottom:1px solid var(--graphite-2)}
.brand h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;color:var(--white);letter-spacing:.01em}
.brand p{font-size:13px;color:var(--silver);margin-top:8px}
.search{padding:14px 24px;border-bottom:1px solid var(--graphite-2)}
.search input{width:100%;background:var(--graphite-2);border:1px solid #4a4d52;border-radius:6px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#9aa1a8}
nav{overflow-y:auto;flex:1;padding:8px 0 24px}
.part{margin-top:14px}
.part h2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--white);padding:4px 24px 6px}
.part ol{list-style:none}
.part button{display:grid;grid-template-columns:34px 1fr;gap:6px;width:100%;text-align:left;background:none;border:0;color:var(--mist);padding:6px 24px;font-size:14px;cursor:pointer;line-height:1.35}
.part button span:first-child{color:var(--silver);font-variant-numeric:lining-nums tabular-nums}
.part button:hover{background:var(--graphite-2)}
.part button[aria-current="true"]{background:var(--part);color:var(--white)}
.part button[aria-current="true"] span:first-child{color:rgba(255,255,255,.72)}
.home-link{display:block;width:calc(100% - 48px);margin:14px 24px 0;background:none;border:1px solid #4a4d52;color:var(--mist);border-radius:6px;padding:8px 12px;text-align:left;cursor:pointer;font-size:14px}
.home-link:hover{border-color:var(--silver)}
.empty{padding:16px 24px;color:var(--silver);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:760px;margin:0 auto;padding:48px 32px 80px}

.about h2{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.05;margin-bottom:18px;color:#1c2430}
.about p{margin-bottom:14px;max-width:66ch}
/* the small words get the same amber as a missed word in round 4 */
.about>p i{font-style:italic;background-image:linear-gradient(to bottom,transparent 58%,var(--missed) 58%,var(--missed) 94%,transparent 94%)}
.notice{background:var(--white);border:1px solid var(--rule);border-left:3px solid var(--silver);padding:18px 20px;margin:24px 0;border-radius:0 6px 6px 0}
.notice h3{font-size:16px;margin-bottom:8px}
.notice p{font-size:15px;color:var(--muted)}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:22px}
.parts-grid button{display:flex;flex-direction:column;justify-content:flex-start;background:var(--white);border:1px solid var(--mist);border-radius:6px;padding:14px;text-align:left;cursor:pointer}
.parts-grid button:hover{border-color:var(--silver)}
.parts-grid strong{display:block;font-family:var(--serif);font-size:20px;line-height:1.15;margin-bottom:4px}
.parts-grid span{font-size:13px;color:#5b6168}

.partname{font-size:14px;color:var(--part)}
.story h2{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.08;margin:6px 0 10px;color:var(--part)}
.meta{font-size:14px;color:var(--muted);margin-bottom:22px}
.guide{background:var(--white);background:color-mix(in srgb, var(--part) 5%, #fff);border:1px solid var(--rule);border-left:3px solid var(--part);border-radius:0 8px 8px 0;padding:16px 18px;margin-bottom:22px;font-size:15px}
.guide p+p{margin-top:8px}
.guide b{font-weight:600;color:var(--part)}

.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.btn{background:var(--part);color:var(--white);border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{filter:brightness(.88)}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb, var(--part) 7%, #fff)}
.btn.accent{background:var(--ink);background:color-mix(in srgb, var(--part) 55%, #17202a)}
.btn.accent:hover{filter:brightness(1.15)}
.player label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.player select{border:1px solid var(--rule);border-radius:6px;padding:7px 8px;background:var(--white);max-width:220px}
.recording audio{width:100%;margin-bottom:10px}
.recording .player{margin-bottom:4px}
.voice-note{font-size:13px;color:var(--muted);margin-bottom:22px}

.text{font-size:19px;line-height:1.75;background:var(--white);border-radius:8px;padding:26px 28px;border:1px solid var(--rule)}
.text.hidden-text{display:none}
.masked{background:var(--white);border:1px dashed var(--silver);border-radius:8px;padding:26px 28px;color:var(--muted);font-size:15px}

.practice{margin-top:30px}
.practice h3{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:6px}
.practice p.hint{font-size:15px;color:#5b6168;margin-bottom:12px}
textarea{width:100%;min-height:200px;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea:focus{border-color:var(--harbour)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.result{margin-top:22px;background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--part);border-radius:0 0 8px 8px;padding:20px 22px}
.score{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.smalls b{font-weight:600}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:21px;font-weight:600;color:#1c2430}
.pager button:hover span{color:var(--harbour)}



details.part{margin-top:4px}
details.part summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 24px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary::before{content:"+";font-family:var(--sans);font-weight:400;color:var(--silver);width:14px;flex:none}
details.part[open] summary::before{content:"–"}
details.part summary span{flex:1}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--silver)}
details.part summary:hover{background:var(--graphite-2)}
.lib-label{font-size:12.5px;color:var(--silver);padding:18px 24px 4px;border-top:1px solid var(--graphite-2);margin-top:10px}
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0 30px}
.paths button{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--part);border-radius:0 0 8px 8px;padding:16px;cursor:pointer}
.paths button:hover{background:color-mix(in srgb, var(--part) 7%, #fff)}
.paths strong{font-family:var(--serif);font-size:21px;line-height:1.15;color:var(--part)}
.paths .pd{font-size:14px;color:var(--muted)}
.paths .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto}

.toc{columns:2 300px;column-gap:28px;margin:12px 0 30px}
.toc section{break-inside:avoid;margin-bottom:20px}
.toc h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:34px 1fr;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink)}
.toc button span{color:var(--part);font-variant-numeric:lining-nums tabular-nums}
.toc button:hover{color:var(--part)}

/* six rounds, as a sequence */
.spine{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);margin:20px 0 30px;border-top:1px solid var(--rule)}
.spine li{padding:10px 14px 0 0;position:relative}
.spine li::before{content:"";position:absolute;top:-1px;left:0;width:26px;height:3px;background:var(--harbour)}
.spine b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--harbour);line-height:1.1}
.spine span{font-size:13.5px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
@media (max-width:700px){.spine{grid-template-columns:repeat(2,1fr);border-top:0}.spine li{border-top:1px solid var(--rule)}}
.pilot-nav{margin:14px 0 4px}
.pilot-nav h2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--white);padding:4px 24px 2px}
.pilot-nav p{font-size:12.5px;color:var(--silver);padding:0 24px 6px}
.startlist{list-style:none;margin:14px 0 8px;border:1px solid var(--rule);border-radius:8px;background:var(--white);overflow:hidden}
.startlist li+li{border-top:1px solid var(--rule)}
.startlist li[data-lv="1"]{--lv:var(--shoal);--lv-soft:var(--shoal-soft)}
.startlist li[data-lv="2"]{--lv:var(--harbour);--lv-soft:var(--harbour-soft)}
.startlist li[data-lv="3"]{--lv:var(--deep);--lv-soft:var(--deep-soft)}
.startlist button{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer}
.startlist button:hover{background:var(--lv-soft)}
.startlist .n{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:5px;background:var(--lv);color:var(--white);font-family:var(--serif);font-size:17px;font-weight:600}
.startlist .t{font-weight:600;color:#1c2430}
.startlist .w{display:block;font-size:13px;color:var(--muted);font-weight:400}
.startlist .lv{font-size:12.5px;color:var(--lv);font-weight:600;white-space:nowrap}
.about h3.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:34px 0 4px;color:#1c2430}
@media (max-width:700px){
  .startlist button{grid-template-columns:44px 1fr}
  .startlist .lv{grid-column:2;white-space:normal;margin-top:4px}
}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;list-style:none;margin:0 0 20px}
.rounds button{width:100%;background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--mist);border-radius:0 0 6px 6px;padding:9px 6px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted)}
.rounds button:hover{border-top-color:var(--part)}
.rounds button b{display:block;font-family:var(--serif);font-size:22px;color:var(--silver);font-weight:600}
.rounds button.done{border-top-color:var(--part);background:var(--white);background:color-mix(in srgb, var(--part) 6%, #fff)}
.rounds button.done b{color:var(--part)}
.rounds button[aria-current="step"]{background:var(--part);border-color:var(--part);border-top-color:rgba(0,0,0,.35);color:rgba(255,255,255,.82)}
.rounds button[aria-current="step"] b{color:var(--white)}
.panel{background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--part);border-radius:0 0 8px 8px;padding:22px 24px}
.panel h3{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15px;color:var(--muted);margin-bottom:16px;max-width:62ch}
.panel .text{border:0;padding:0;margin-top:18px}
.sentence{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px;font-size:14px;color:var(--muted)}
.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--part)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:6px;padding:9px 12px;background:var(--white)}
.field input:focus{border-color:var(--part)}
textarea.short{min-height:90px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chips span{background:var(--white);background:color-mix(in srgb, var(--part) 10%, #fff);color:var(--part);border:1px solid color-mix(in srgb, var(--part) 25%, #fff);border-radius:999px;padding:4px 10px;font-size:14px}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}

.quiz{margin:18px 0 6px;padding:16px 18px;border:1px solid var(--rule);border-left:3px solid var(--part);border-radius:0 8px 8px 0;background:var(--paper);background:color-mix(in srgb, var(--part) 5%, #f7f7f8)}
.quiz h4{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:8px;color:var(--part)}
.q{border:0;margin:0 0 12px}
.q legend{font-weight:600;font-size:15.5px;margin-bottom:6px}
.opt{display:flex;gap:8px;align-items:baseline;padding:5px 2px;font-size:15px;cursor:pointer}
.opt input{accent-color:var(--part)}
.mk{font-size:12.5px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px}
.mk.ok{background:var(--harbour-soft);color:#123c3f}
.mk.no{background:#f8d7d4;color:#7a1d15}
.qscore{margin-top:10px;font-weight:600}
@media (max-width:900px){.rounds{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}}

@media (max-width: 900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--graphite);color:var(--white);padding:10px 16px}
  .topbar button{background:var(--graphite-2);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:22px;font-weight:600}
  .wrap{padding:28px 18px 60px}
  .story h2,.about h2{font-size:34px}
  .text{font-size:18px;padding:20px}
}
@media (prefers-reduced-motion: reduce){aside{transition:none}}
@media print{
  aside,.topbar,.player,.voice-note,.practice,.pager{display:none!important}
  .shell{display:block}.text{border:0;padding:0}.text.hidden-text{display:block}
}
/* Standard-height numerals everywhere (Cormorant Garamond defaults to old-style figures, where 1 looks like I) */
*{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.part button span:first-child,.toc button span{font-feature-settings:"lnum" 1,"tnum" 1}
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar" aria-label="Stories">
    <div class="brand">
      <h1>Listening Lab</h1>
      <p>Ron Taylor&nbsp; Masterclass</p>
    </div>
    <div class="search">
      <label for="q" class="sr" style="position:absolute;left:-9999px">Search stories</label>
      <input id="q" type="search" placeholder="Search titles and topics">
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="topbar"><button id="menuBtn" aria-controls="sidebar" aria-expanded="false">Stories</button><strong>Listening Lab</strong></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<script>
const BOOK = [{"part": 1, "title": "Words You Know but Don't Hear", "desc": "Short stories built around the small words Brazilians often miss when listening.", "scripts": [{"num": 1, "title": "The Neighbour", "F": "do/does/did, don't/doesn't/didn't, emphatic \"I did\"", "V": "", "T": "Ann and Tom are having coffee on Ann's balcony. \"Do you know Doug?\" Tom asks. \"I do. He's my neighbour. He lives in 4B, across the hall.\" \"Where does he work?\" \"He works at Vancouver General Hospital. He's a nurse. But he doesn't work on weekends.\" \"Did he start there this year?\" \"No, he didn't. He started three years ago, in June.\" \"Was he a nurse before that?\" \"No, he wasn't. He was a cook, but he didn't like the hours.\" \"Does he like the hospital?\" \"He does. He says the people are friendly, but the hours are long.\" \"Do they pay well?\" \"I don't know. He didn't tell me.\" \"Didn't you ask him?\" \"I did ask him! He just laughed and changed the subject.\" \"Does his wife work there too?\" \"Karen? No, she doesn't. She teaches grade three at a school on Oak Street.\" \"Does she like it?\" \"She does. She loves the kids.\" \"Do they have kids?\" \"They don't have kids, but they have a big dog. His name is Bear.\" \"Does Bear bark a lot?\" Tom asks. \"He doesn't bark much. But he did bark all night last Saturday.\" \"Why? What happened?\" \"Doug and Karen went to a wedding in Victoria, and they didn't come home until Sunday. Bear was alone, and he wasn't happy.\" \"Did you hear him?\" \"Did I hear him? The whole building heard him!\" \"Did anyone complain?\" Tom asks. \"Mrs. Porter did. She lives in 4A. She called the manager at two in the morning.\" \"What did the manager do?\" \"He called Doug, but Doug didn't answer his phone.\" \"Didn't anyone have a key?\" \"No, nobody did. Doug doesn't give his key to anyone.\" \"So what happened on Sunday?\" \"Doug and Karen came home, and Mrs. Porter was waiting for them in the hallway. She was very angry.\" \"Did Doug apologize?\" \"He did. He apologized, and he bought her flowers.\" \"Does she like him now?\" Ann laughs. \"She does. Now she walks Bear every afternoon.\"", "words": 332}, {"num": 2, "title": "The Phone Call", "F": "is/isn't, was/wasn't, can/can't, will/won't", "V": "", "T": "Tomorrow is Tim's first day at his new job, and he's nervous. He's a mechanic, and the job is at a car repair shop on Kingsway. \"Is the shop far?\" his wife, Jenny, asks. \"It isn't far. I can walk there in fifteen minutes.\" \"Is the pay good?\" \"It is. It's better than my last job.\" \"Does it have benefits?\" \"It does. Dental and medical, after three months.\" Yesterday, Tim visited the shop to pick up his uniform. His manager, Linda, wasn't there, but her assistant, Tony, was. \"Linda isn't here today,\" Tony said. \"She was at a meeting this morning, and now she's at the dentist. But she'll call you tonight about your schedule.\" \"What time will she call?\" \"I'm not sure. Maybe around eight.\" Tim went home and waited. Eight o'clock came, and she didn't call. Eight thirty, nothing. \"Maybe she won't call,\" Tim said. \"Maybe she forgot.\" \"She will call,\" Jenny said. \"Relax.\" \"I can't relax. What if the job isn't mine anymore?\" \"Tim, it is your job. They gave you a uniform!\" At nine o'clock, the phone rang. Tim jumped. It was Linda. \"Hi, Tim. Sorry I'm so late. It was a crazy day. Can you talk now?\" \"I can, yes.\" \"Great. Can you start at eight tomorrow, not nine? We're very busy this week.\" \"I can,\" Tim said. \"Is that a problem?\" \"No, it isn't. That's fine.\" \"Good. One more thing. You won't work on Saturdays this month, but you will work Saturdays in December. Is that okay?\" \"That's okay. It wasn't a problem at my last job either.\" \"Good. Can you bring your own tools?\" \"I can. I have all my tools in the car.\" \"Perfect. See you at eight. Don't be late. The boss is always here at seven thirty.\" \"Who's the boss?\" Tim asked. Linda laughed. \"My husband. He's never late, and he won't let you forget it.\" Tim hung up and smiled at Jenny. \"Well?\" she asked. \"Was it good news?\" \"It was,\" Tim said. \"I can't wait.\"", "words": 337}, {"num": 3, "title": "Ann's Saturday", "F": "-ed endings in all three sounds: /t/, /d/, /ɪd/", "V": "", "T": "Last Saturday, Ann woke up early. She looked outside, and it was raining, so she decided to clean her apartment. First, she washed the dishes and cleaned the kitchen. Then she vacuumed the floor, dusted the shelves, and folded the laundry. She finished at eleven o'clock. She was tired, but she wanted to go out. The rain stopped a little after twelve, so she decided to go shopping. She walked to a store on Robson Street and looked for a new jacket. She needed a warm one for the winter. She tried on three jackets. The first one was too big, and the second one was too expensive. She liked the third one, a blue one with a hood. She looked at the price tag and was surprised. It was only forty dollars. \"Is this on sale?\" she asked the cashier. \"It is,\" he answered. \"Everything is half price today.\" She paid for the jacket, thanked the cashier, and walked back home. On the way, she stopped at a bakery and ordered a hot chocolate. She sat by the window and watched the people on the street. A dog walked past in a little raincoat, and she laughed. When she arrived home, she cooked dinner. She baked some chicken and boiled some potatoes. After dinner, she called her mother in Halifax, and they talked for an hour. Her mother asked about her week. Ann explained that she worked late on Wednesday and that her boss invited her to lunch on Friday. \"He invited you to lunch? That's nice,\" her mother said. \"It was,\" Ann replied. \"He wanted to talk about a new project. He asked me to lead it.\" \"Did you accept?\" \"Of course I accepted!\" \"That's wonderful! Oh, have you started your piano lessons?\" Ann laughed. \"I started last month, Mom. I've already learned three songs.\" \"Play one for me!\" So Ann played a short song over the phone. When she finished, her mother clapped. \"I loved it,\" she said. Ann smiled. It was a good Saturday.", "words": 338}, {"num": 4, "title": "The Party", "F": "than/then, their/there/they're, your/you're, its/it's, were/where, weather/whether", "V": "", "T": "\"Where were you last night?\" Sarah asked. \"I called you three times.\" \"I was at home,\" Beth said. \"I went to bed early, so I didn't hear my phone. Where were you?\" \"We were at Wayne and Colleen's party. It's their new apartment in Kitsilano. They're very happy there.\" \"Is it near the beach?\" \"Yes, it's ten minutes from Kits Beach.\" \"Is it bigger than their old place?\" \"Much bigger. It has two bedrooms and a big kitchen. And there's a view of the mountains from their balcony.\" \"Were there many people?\" \"About twenty. Brent and Shauna were there, and Curtis came too. First, we had dinner. Then we played games. Then Wayne showed us his new guitar.\" \"Can he play it?\" \"Not really. But he thinks he can. He played three songs, and they all sounded the same.\" Beth laughed. \"Was their cat there?\" \"Yes. Its name is Max. It's very friendly. It sat on my lap all night.\" \"You're lucky. I stayed home because of the weather.\" \"The weather wasn't that bad!\" \"It was raining, and it was cold. I didn't know whether it was going to snow.\" \"It didn't snow. It rained a little, then it stopped.\" \"Well, I wasn't sure. You know I don't like driving in the snow.\" \"You could take the bus. There's a bus stop on Fourth Avenue, right in front of their building.\" \"I didn't know that. Where exactly is their building?\" \"It's on the corner of Fourth and Vine. There's a bakery next to it.\" \"Oh, I know that bakery. Their cinnamon buns are amazing.\" \"They're the best in Vancouver. Colleen bought a dozen for the party, and they were gone in ten minutes.\" \"Now I'm really sad I didn't go.\" \"Well, your friends missed you, Beth. Everyone asked where you were. Next time, you're coming with us.\" \"Okay,\" Beth said. \"But only if there are cinnamon buns.\" \"Then I'll bring the cinnamon buns myself,\" Sarah said.", "words": 326}, {"num": 5, "title": "The Prize", "F": "work/walk, live/leave, ship/sheep, sheet/seat, three/tree, quite/quiet, price/prize, lose/loose, breath/breathe, accept/except", "V": "", "T": "Steve lives in a small house near Trout Lake. Every morning, he leaves at seven and walks to work. He could take the bus, but he likes the quiet streets. It's quite a long walk, about forty minutes, but he enjoys it. On the way, he passes three big trees. His daughter calls them \"the three trees.\" Today it was quite cold, and he could see his breath in the air. His shoes were loose, so he stopped to tie them. He didn't want to be late, because today was the day of the big meeting. At the office, the meeting room was full. There was only one free seat, next to the window. His boss, Carol, stood at the front. \"Every year, we give a prize to our best new employee. This year, the prize goes to... Steve!\" Everyone clapped. Carol handed Steve a sheet of paper. \"Read it out loud,\" she said. Steve read: \"A weekend trip to a farm on Vancouver Island. Travel by ship. All meals included.\" \"Sheep?\" someone asked at the back. \"No, ship,\" Carol said. \"S-H-I-P. The ferry.\" \"But there are sheep on the farm too,\" Steve said. \"I'll see the sheep from the ship!\" Everyone laughed. Everyone was happy for him, except Rick. Rick sat in the corner with his arms crossed. \"I hate to lose,\" he said. \"I started here the same month as Steve, and I never win anything.\" \"You live too far away, Rick,\" someone joked. \"You leave work early every day to catch your train.\" Steve accepted the prize and thanked Carol. Then he walked over to Rick. \"Breathe, Rick,\" he said. \"Take a deep breath. It's just a prize.\" \"What's the price of that trip?\" Rick asked. \"About five hundred dollars,\" Carol said. Rick sighed. \"Okay. Congratulations, Steve. I accept it. Next year, it's my turn.\" \"Next year,\" Steve said, \"I'll bring you a sweater, made from real sheep.\"", "words": 321}, {"num": 6, "title": "Questions, Questions", "F": "what/which, who, where/were, when/then, why/while, how", "V": "", "T": "My daughter, Emily, is six, and she's very curious. She started grade one last week, and now she asks me questions all day long. In the morning, she asks, \"Why is the sky grey?\" \"Because it's Vancouver,\" I tell her. \"When does winter end?\" \"In March.\" \"Which month is March?\" \"The third month.\" \"How many months are there?\" \"Twelve.\" On the way to school, we pass a house with a big garden. \"Who lives there?\" \"That's Hugh. He's our neighbour.\" \"Why does he have so many flowers?\" \"Because he loves gardening.\" \"What's gardening?\" \"Growing flowers and vegetables.\" \"Can we do gardening?\" \"Maybe in the spring.\" When I pick her up at three o'clock, she has more questions. \"Where were you this morning?\" \"I was at work.\" \"What do you do there?\" \"I help sick people at the hospital.\" \"How do you help them?\" \"I give them medicine.\" \"Which medicine?\" \"Many different kinds.\" \"Why do sick people need medicine?\" \"To get better.\" Yesterday, while I cooked dinner, she sat at the kitchen table with her homework. \"Mom, how do you say 'saudade' in English?\" I thought for a moment. \"There isn't one word. It's like missing someone very much.\" \"Who do you miss?\" \"I miss Grandma and Grandpa in Brazil.\" \"When will we see them?\" \"In July.\" \"Why not now?\" \"Because you have school.\" Then she asked me the big question. \"Which is better, English or Portuguese?\" I laughed. \"What did you say?\" She repeated it slowly. \"Which. Is. Better. English. Or. Portuguese?\" I thought about it. Then I said, \"Both. That's why we speak two languages at home.\" She nodded. \"Then why does Dad speak Portuguese when he's angry?\" I laughed so hard I almost burned the rice. \"Who told you that?\" \"Nobody. I heard him.\" \"When?\" \"When he lost his keys.\" I decided not to tell Dad about this conversation. Then she looked at the stove and asked her last question of the day. \"What's for dinner?\"", "words": 328}, {"num": 7, "title": "A New Family", "F": "a/an/the, he/she, him/her, they/them, we/us, have/has/had, could/would/should", "V": "", "T": "We met a new family at the park on Sunday. The father, Todd, is a nurse, and the mother, Bonnie, is an engineer. They have a son and a daughter, Kyle and Megan. He's six and she's eight. They moved to Vancouver from Calgary in August. My son is also six, and my daughter is eight, so the kids became friends in about five minutes. My son played soccer with him, and my daughter played on the swings with her. While the kids played, we talked. Bonnie asked, \"How long have you lived in Vancouver?\" \"For four years,\" I said. \"We had an apartment in Burnaby before, but now we have a house near here.\" \"We have a small apartment for now,\" she said. \"Todd has a new job at a hospital, and I had an interview last week. I should hear back soon.\" At the end of the day, they invited us to dinner. \"You should come on Friday,\" Bonnie said. \"We would love to,\" I said, \"but we couldn't find a babysitter for Friday.\" \"Bring the kids!\" Todd said. \"Ours will love playing with them.\" \"Are you sure? They're very loud.\" \"So are ours,\" he said. \"It'll be fine.\" My husband, Mike, has a meeting on Friday afternoon, but he said he could leave early. \"What should we bring?\" he asked me. I had an idea. \"We could bring a cake. The kids would love that.\" On Friday, we bought a chocolate cake at a bakery on Main Street. When we arrived, Bonnie opened the door. \"Come in! Dinner is almost ready.\" Todd made a big pot of chili, and it was delicious. After dinner, we ate the cake. Kyle had two pieces, and Megan had three. \"You shouldn't eat so much cake,\" Bonnie told her. \"But it's so good,\" Megan said. \"Could we have this cake every Friday?\" Everyone laughed. The kids were happy, and so were we.", "words": 321}, {"num": 8, "title": "My Friend Judy", "F": "make/do, say/tell, know/meet, remember/remind, learn/teach, job/work", "V": "", "T": "I met Judy three years ago in a yoga class at the community centre. I knew her name, but I didn't know her well. We only said hello. Then one day after class, she said, \"Do you want to get a coffee?\" We talked for two hours. Now she's my best friend. Last month, Judy got a new job at a bank downtown. She works from nine to five, Monday to Friday. She told me the work is hard, but she likes it. \"I have to make a lot of phone calls,\" she said, \"and I do a lot of paperwork.\" \"Do you like your boss?\" I asked. \"I do. She's very kind, and she's teaching me a lot.\" Yesterday, Judy called me. She said, \"Can you remind me to call my sister, Sue, tomorrow? It's her birthday.\" I said, \"Of course. I'll send you a message in the morning.\" But I forgot! I didn't remember until nine o'clock at night. I called Judy right away. \"Judy, I'm so sorry. I forgot to remind you about Sue!\" \"Don't worry,\" she said. \"I remembered. I called her at lunch.\" I felt terrible anyway. I don't remember everything, so today I made a list on my phone. Now I won't forget. Judy is also teaching me to cook, and I'm learning fast. Last week, she taught me how to make lasagna. Last night, I made dinner for her. I made the lasagna, a salad, and some garlic bread. She did the dishes. \"Did you really make this?\" she asked. \"I did. You taught me!\" \"Well, I didn't teach you to make garlic bread.\" \"No, I learned that from a video.\" She laughed. \"You're a good student.\" \"And you're a good teacher, Judy,\" I told her. \"You know what?\" she said. \"Next week, you should teach me something.\" \"What can I teach you?\" \"Portuguese,\" she said. \"I want to say something nice to your mother when I meet her.\"", "words": 326}, {"num": 9, "title": "Jeff's New Shift", "F": "contractions (he's = he is / he has, 'd = would / had, 'll), third-person -s", "V": "", "T": "My friend Jeff's been in Vancouver for a year. He's from Winnipeg. He's working at a hotel downtown now, on Burrard Street. He's worked there since March. He works at the front desk, and he checks guests in and out. He likes his job because he meets people from all over the world. He's learned a few words in Japanese, Korean, and Spanish. His wife, Pat, is a teacher, and she's looking for a job. She's taught in Manitoba for ten years, but she needs a British Columbia certificate to teach here. \"I'd apply today if I had my certificate,\" she says. \"I've sent all my documents, but it takes time.\" Pat's patient, but she's bored. Every morning, she walks to the library and reads. She's read twenty books since January. Jeff's boss, Gary, likes him. Gary says Jeff works hard and never complains. Last week, a guest from Japan wrote a review online. She said Jeff's the friendliest person she's ever met. Gary printed it and put it on the wall. Next week, Jeff'll start a new shift. He'll work from four in the afternoon until midnight. The pay's better, but the hours are harder. He's a little worried, but he'd like the extra money. He'll need a ride home, because the buses don't run often at that time. \"I'd drive myself,\" Jeff says, \"but Pat's using the car.\" \"Why don't you take a taxi?\" Pat asks. \"It's thirty dollars. That's too much every night.\" Then their neighbours, Bob and Joan, heard about the problem. Bob's retired, and he doesn't sleep much. He's always watching hockey until one in the morning. \"We'll drive you,\" said Joan. \"Bob's up late anyway.\" \"Are you sure?\" Jeff asked. \"I'd pay you for gas.\" \"You won't pay us anything,\" Joan said. \"That's what friends are for.\" \"Well, then I'll bring you something from the hotel,\" Jeff said. \"They've got the best chocolate cake in the city.\" Bob smiled. \"Now that's a deal.\"", "words": 329}, {"num": 10, "title": "Make or Do? At the Office", "F": "make vs. do (in Portuguese, both are \"fazer\"), did, -ed", "V": "make a mistake, make a decision, make a phone call, make an appointment, make progress, make sure, make an effort, make a difference, make money; do research, do business, do a favour, do your best, do well, do a good job, do overtime", "T": "In my first month at the office, I made a lot of mistakes with \"make\" and \"do.\" In Portuguese, we use one verb for both: \"fazer.\" In English, you have to choose. On Monday morning, Greg asked me, \"Did you do the research for the Pacific Foods report?\" \"Yes, I made it on Friday,\" I said. Linda looked at me and smiled. Later, she came to my desk. \"Can I tell you something small? We say 'do research,' not 'make research.'\" \"Oh no. How do I know which one to use?\" \"There's a simple idea. 'Make' is usually for creating something new. 'Do' is usually for tasks, activities, and work. But honestly, you also have to memorize some of them.\" She took a sticky note and wrote two lists. Under \"make,\" she wrote: make a mistake, make a decision, make a phone call, make an appointment, make progress, make money. Under \"do,\" she wrote: do research, do business, do a favour, do your best, do a good job, do overtime. That afternoon, I practised. I made a phone call to a client, and I made an appointment for Thursday. Then Tom asked me, \"Can you do me a favour? Can you check these numbers before I send them? I want to make sure they're correct.\" \"Of course,\" I said. I found one small error. \"You made a mistake in row twelve.\" \"Thanks! You saved me.\" On Friday, Greg called me into his office. \"I want to tell you that you're doing a great job. You've made a lot of progress this month.\" \"Thank you. I'm making an effort, especially with my English.\" \"It shows. And your work on the Pacific Foods account made a big difference. They've decided to do more business with us next year.\" \"That's great news.\" \"One more thing. We'll need to do some overtime next week. Can you stay late on Tuesday and Wednesday?\" \"No problem. I'll do my best.\" When I went back to my desk, Linda asked, \"How was the meeting?\" \"Good,\" I said. \"He said I'm doing well, and I made a lot of progress.\" She looked at my sticky note and laughed. \"Every verb was correct.\" \"I know,\" I said. \"I checked the note before I answered.\"", "words": 375}, {"num": 11, "title": "Make or Do? At Home", "F": "make vs. do in everyday life, have to, doesn't, did/didn't, can", "V": "make the bed, make breakfast, make dinner, make a mess, make noise, make friends, make a list, make fun of; do the dishes, do the laundry, do homework, do the shopping, do exercise, do your hair, do nothing", "T": "Every Saturday morning in our house, we have a family meeting to divide the chores. My kids like to practise their English, so we do the meeting in English. This Saturday, my daughter, Sophie, wrote a list on the fridge. \"Okay, everyone,\" she said. \"First, who's going to make breakfast?\" \"I'll make breakfast,\" my husband said. \"Pancakes.\" \"Yes!\" my son shouted. \"Next, who's going to do the dishes after breakfast?\" Nobody answered. \"Dad made breakfast, so he doesn't have to do the dishes,\" Sophie said. \"Lucas, you do the dishes.\" \"Why me?\" \"Because you didn't do them last week.\" My son made a face, but he agreed. \"Next, Mom, can you do the laundry?\" \"I can,\" I said. \"But everyone has to make their own bed first.\" \"Do I have to make my bed on Saturdays?\" my son asked. \"Yes. Every day.\" \"Okay. What else?\" \"We need to do the shopping. Who's going to make the shopping list?\" \"I'll make the list,\" my husband said, \"and I'll do the shopping this afternoon.\" After breakfast, my son did the dishes, and he made a big mess. There was water all over the floor. \"Lucas, you made a mess!\" Sophie said. \"At least I did them!\" Then Sophie went to her room to do her homework. She had a science project, and she was making a model of a volcano. It also made a mess. In the afternoon, I did some exercise at the community centre. When I came home, Sophie was doing her hair in front of the mirror. \"Where are you going?\" I asked. \"To Megan's birthday party. I made a card for her.\" \"That's nice. You've made a lot of friends here.\" \"I have. And nobody makes fun of my accent anymore.\" That evening, my husband made dinner, and I did nothing at all. I sat on the couch and read a book. \"Mom, you're doing nothing,\" my son said. \"That's right,\" I said. \"I did the laundry this morning. Now it's my turn to relax.\" He looked at the list on the fridge. \"Can I do nothing next Saturday?\" \"You can,\" I said, \"after you make your bed and do the dishes.\"", "words": 364}, {"num": 12, "title": "Asking for Advice", "F": "at/in, advice/advise (the /s/ and /z/ sounds), affect/effect, who/whom, what/that, would/wouldn't, could/couldn't, should/shouldn't, -ed", "V": "position, apply, application, cover letter, \"To whom it may concern,\" confident, \"If I were you...\"", "T": "Last Monday, Greg announced that the company was looking for a new team lead. I wanted to apply, but I wasn't sure I was ready. On Tuesday, I looked for Linda. I asked Tom, \"Is Linda at the office today?\" \"She's at the office, but she isn't in her office. She's in the meeting room on the third floor.\" I waited until she finished, then I asked, \"Linda, could I ask for your advice about something?\" \"Of course. What is it?\" \"I'm thinking about applying for the team lead position.\" \"That's great! I'd advise you to apply. What's stopping you?\" \"I'm worried my English will affect my chances.\" \"I don't think it will. People notice your work, and your work has had a big effect on this team.\" \"What did you say? Sorry, the printer was loud.\" \"I said that your work has had a big effect on the team.\" \"That's what I thought you said. Thank you.\" \"Would you apply, if you were me?\" \"I would. If I were you, I wouldn't wait. The deadline is Friday.\" \"Would you apply for it?\" \"No, I wouldn't. I don't want to manage people.\" That evening, I started my cover letter. My first line was \"To whom it may concern.\" The next morning, I showed it to Linda. \"Don't write 'To whom it may concern,'\" she said. \"You know who it's for. Write 'Dear Greg.'\" \"When should I use 'whom'?\" \"In very formal writing. In conversation, most people just say 'who.' 'Who did you work with?' is normal. 'With whom did you work?' sounds very formal.\" She read the rest of my letter. \"This is good, but you shouldn't say 'I think I could maybe be a good leader.' It sounds like you aren't sure. Say 'I am confident I can lead this team.'\" \"In Brazil, that would sound arrogant.\" \"Here, it sounds confident. That's what Greg wants to see.\" I changed the sentence. I couldn't believe the difference. On Friday morning, I submitted my application. At four o'clock, Greg stopped at my desk. \"I got your application. I'm glad you applied. Can we meet on Tuesday at ten?\" \"Of course,\" I said. After he left, Linda smiled at me. \"Good advice?\" \"Great advice,\" I said. \"Thank you for advising me.\"", "words": 379}, {"num": 13, "title": "The Plan", "F": "Portuguese translation traps: I'm 42 years old (not \"I have\"), currently/actually (atualmente), take a course, attend (not \"assist\"), summary/résumé (resumo), library/bookstore (livraria), make a decision, I'm not sure (not \"I have doubt\"), sensitive (not \"sensible\"), relatives/parents (parentes/pais), realize/achieve (realizar), intend (not \"pretend\")", "V": "", "T": "I'm forty-two years old, and I'm currently living in Burnaby with my wife and our two kids. Actually, I'm from São Paulo, but I've lived here since 2023. In Brazil, I was an accountant for fifteen years. Here, I work at a warehouse, but I intend to work as an accountant again. So this year, I'm taking a course in Canadian accounting at a community college. I attend classes on Tuesday and Thursday nights, from six to nine. I'm tired, but I'm learning a lot. Last week, I attended a meeting with my teacher, Mrs. Thompson, because I had a question about my essay. \"Your ideas are good,\" she said, \"but you should add more examples. And your summary at the end is too long.\" \"Can I make my résumé shorter?\" I asked. She smiled. \"You mean your summary. A CV is the document you use to apply for a job.\" \"Oh, right. In Portuguese, 'resumo' means summary.\" I'm sensitive to criticism, so I felt a little embarrassed. But Mrs. Thompson was very kind. \"Everyone makes that mistake,\" she said. \"I have a doubt about the next assignment,\" I said. She smiled again. \"You mean you have a question. Of course. Ask me anything.\" After the meeting, I went to the library to study. Then I went to a bookstore on Kingsway to buy a new dictionary. On the bus home, I made a decision: next time, I'll ask for help earlier. I won't wait until the last week. My relatives in Brazil always ask me, \"When are you coming back?\" My aunts, my uncles, my cousins, everyone asks. I'm not sure. My parents want me to come home, and I miss them a lot. But my kids are happy here. They speak English better than I do! Last month, I finally realized something: this is our home now. And someday, when I pass my exams, I'll achieve my dream of working as an accountant in Canada. I intend to stay.", "words": 331}]}, {"part": 2, "title": "Immigration and Settling In", "desc": "From Express Entry to citizenship, and the paperwork of the first year.", "scripts": [{"num": 14, "title": "Express Entry: From Profile to Invitation", "F": "immigration numbers (scores, points, days, years), didn't, does, have to, will, can", "V": "Express Entry, profile, pool, Comprehensive Ranking System (CRS), points, draw, Invitation to Apply (ITA), language test (CELPIP/IELTS), Educational Credential Assessment (ECA), work experience, NOC code, Provincial Nominee Program (BC PNP), job offer", "T": "When my husband and I decided to immigrate to Canada, we didn't understand anything about the system. A friend in Vancouver, Karen, explained it to us on a video call. \"Most skilled workers apply through Express Entry,\" she said. \"First, you create an online profile. Then you go into a pool with thousands of other people.\" \"A pool?\" \"It's like a big list. Everyone in the pool gets a score. It's called the CRS score, the Comprehensive Ranking System. The maximum is twelve hundred points.\" \"How do we get points?\" \"Age, education, language, and work experience. Younger people get more points. And language is very important. You'll need to take an English test, like CELPIP or IELTS.\" \"What about my university degree from Brazil?\" \"You'll need an Educational Credential Assessment, an ECA. An organization checks your degree and says what it's equal to in Canada.\" \"And my work experience?\" \"You'll need to find your NOC code. It's the Canadian code for your job. For example, a civil engineer has a specific code.\" My husband took the CELPIP test first. His score was good, but mine was higher. \"Your English score gives us more points,\" he said. \"So you should be the main applicant.\" When our profile was finished, our CRS score was four hundred and sixty-eight. \"Is that enough?\" I asked Karen. \"It depends. Every few weeks, the government has a draw. They invite the people with the highest scores. Sometimes the cut-off is lower, sometimes it's higher.\" \"What happens if we don't get invited?\" \"You can improve your score. Retake the language test, or learn some French. Or try a provincial program, like the BC PNP. Some of their programs need a job offer. If B.C. nominates you, you get six hundred extra points.\" \"Six hundred? That's huge.\" \"It is. That almost guarantees an invitation.\" For three months, we checked the draws every week. Our score wasn't high enough. Then I found a job offer from a company in Surrey, and I applied to the BC PNP. Five months later, I was nominated. Two weeks after that, I opened my email and screamed. \"Invitation to Apply,\" it said. \"What does that mean?\" my son asked. \"It means we're going to Canada,\" I said.", "words": 374}, {"num": 15, "title": "After the Invitation: Documents, Biometrics, and Medical Exams", "F": "deadlines and dates, lists of documents, have to, did, doesn't, won't, -ed", "V": "Invitation to Apply (ITA), deadline, submit, police certificate, proof of funds, biometrics (fingerprints and photo), medical exam, panel physician, acknowledgement of receipt (AOR), processing time, background check, Confirmation of Permanent Residence (COPR), permanent resident visa", "T": "After we got our Invitation to Apply, Karen warned us, \"Now the real work begins. You have sixty days to submit your full application. Don't wait until the last week.\" We made a list of every document we needed: passports, birth certificates, our marriage certificate, my ECA, our language test results, reference letters from our employers, and police certificates. \"Police certificates?\" my husband asked. \"From where?\" \"From every country you lived in for six months or more since you were eighteen,\" Karen said. \"For you, that's Brazil and Portugal.\" \"Portugal? That was ten years ago.\" \"It doesn't matter. You lived there for a year, so you need one.\" It took three weeks to get the certificate from Portugal. We also needed proof of funds, bank letters showing we had enough money to support our family in Canada. We submitted everything on day fifty-two. Two days later, we got an email: \"Acknowledgement of Receipt.\" \"That means they received it,\" Karen said. \"Now you wait.\" A few weeks later, we got a biometrics instruction letter. \"We have to give our fingerprints and a photo,\" my husband said. \"The letter says we have thirty days.\" We booked an appointment at a visa application centre in São Paulo. It took about fifteen minutes each. Even my son had to do it, because he was over fourteen. Next came the medical exams. We couldn't go to our own doctor. We had to see a panel physician, a doctor approved by the Canadian government. The doctor checked our blood pressure, our hearing and our eyes, and did a chest X-ray and a blood test. \"The results go directly to Canada,\" the nurse said. \"You won't see them.\" Then we waited. We checked our online account every morning. The processing time said six months. After four months, nothing had changed. I was worried. \"Is something wrong?\" I asked Karen. \"Probably not. They're doing background checks. It takes time.\" Finally, one morning in May, there was a new message in our account. It said, \"Confirmation of Permanent Residence.\" I read it three times. Then I called my husband at work. \"Did we get it?\" he asked. \"We did,\" I said. \"We're permanent residents. Well, almost. First, we have to land.\"", "words": 372}, {"num": 16, "title": "Landing in Canada", "F": "questions from an immigration officer, do, is, will/won't, dates, dollar amounts", "V": "port of entry, landing, Canada Border Services Agency (CBSA) officer, Confirmation of Permanent Residence (COPR), permanent resident visa, declare, goods to follow, mailing address, PR card, \"Welcome to Canada\"", "T": "We landed at Vancouver International Airport on July 15th at six in the morning. We were tired, but too excited to sleep. On the plane, I filled out our declaration on the app. After we got off the plane, we followed the signs to immigration. The line for new permanent residents was on the left. After forty minutes, a CBSA officer called us. \"Good morning. Can I see your passports and your Confirmation of Permanent Residence documents?\" I gave her everything. She looked at the passports and typed on her computer. \"Is this your first time in Canada?\" \"No, we visited Vancouver two years ago, as tourists.\" \"And where will you live?\" \"In Surrey. I have a job there. We're staying with a friend for the first month.\" \"What's your friend's address?\" I gave her Karen's address. \"Your PR cards will be mailed to that address. They usually take a few weeks. Make sure your friend knows to watch for them.\" \"Okay.\" \"Are you bringing more than ten thousand dollars in cash with you?\" \"No. We have about two thousand in cash. The rest is in our bank account.\" \"Do you have goods to follow? Things you're shipping from Brazil that will arrive later?\" \"Yes. We're shipping twelve boxes. They'll arrive in September.\" \"Then you need to list them on this form now. Write down everything that's coming. When the boxes arrive, you won't pay duty on them, as long as they're on this list.\" I spent ten minutes writing the list: clothes, books, kitchen things, my husband's tools, and the kids' toys. The officer stamped the form and gave us a copy. \"Keep this copy. You'll need it when your boxes arrive.\" Then she asked my husband and me to sign our COPR documents. She checked the signatures and stamped them. She smiled and looked at our kids. \"Congratulations. You're now permanent residents of Canada. Welcome to Canada.\" \"Thank you so much,\" I said. My voice was shaking. My son whispered, \"That's it? We're Canadian now?\" \"Not Canadian citizens yet,\" I said. \"Permanent residents. Citizenship comes later.\" We walked out into the arrivals area. Karen was waiting for us with a sign that said, \"Welcome home!\" I hugged her and cried.", "words": 372}, {"num": 17, "title": "First Week in Vancouver", "F": "to/for, to/too, for/since, in/on/at, by/until, from/since", "V": "", "T": "Hi. I'm from Recife, in the northeast of Brazil, and I've lived in Vancouver since January. I came here to study English, and my husband came too. We live in a small apartment on Fraser Street. On Monday, I went to the bank at nine o'clock in the morning. I needed to open an account for my new part-time job. The woman at the desk, Helen, was very friendly. \"How long have you been in Canada?\" she asked. \"For three weeks. I arrived on January 5th.\" \"Welcome! Do you have a letter from your employer?\" I didn't. \"No problem,\" Helen said. \"You can bring it by Friday. We're open until five.\" She gave me a form to fill out. She also asked, \"Do you want a credit card too?\" \"Not today, thanks. Maybe next month.\" I stayed at the bank until ten thirty. Then I walked to a café on Main Street. I bought a coffee for my husband and a sandwich for me. I sent him a message: \"I'm at the café. Do you want to meet me here?\" He wrote back: \"I want to come too, but I'm at the phone store on Broadway. I'll be here until eleven.\" So I waited for him. He arrived at eleven fifteen. \"Did you get a phone plan?\" I asked. \"I did. It's forty dollars a month. I got one for you too.\" \"Thank you! Did you get the internet for the apartment too?\" \"Not yet. They can't install it until next Tuesday.\" He's been in Canada for two months. He came in December, before me, but he doesn't like the cold. \"It was minus five this morning,\" he said. \"In Recife, it's thirty degrees right now.\" I laughed. \"You've complained about the weather since the day you arrived.\" \"That's because it's been cold since the day I arrived.\" I told him, \"Wait until February. It rains every day too.\" He looked at me and said, \"Then I'm going back to Brazil for February.\"", "words": 333}, {"num": 18, "title": "Getting a Social Insurance Number", "F": "government office language, nine-digit numbers, dates, does/doesn't, do/don't, didn't, is, should/shouldn't", "V": "Service Canada, Social Insurance Number (SIN), permanent resident card, work permit, take a number, application, maiden name, confidential, expiry date, Canada Revenue Agency (CRA), file your taxes, benefits", "T": "In my first week in Canada, my friend Irene told me, \"Before you do anything else, get your SIN.\" \"What's a SIN?\" \"Your Social Insurance Number. You need it to work in Canada, to get paid, and to file your taxes.\" So on Tuesday, I went to a Service Canada office with my wife. At the door, a man gave us a number, B-27. \"Please have a seat. We'll call your number.\" After thirty-five minutes, the screen showed \"B-27, Counter 4.\" The woman at the counter was friendly. \"Good morning. Is this your first SIN?\" \"Yes, it is.\" \"Can I see your permanent resident card and your passport?\" I gave them to her. \"Thank you. What's your mother's maiden name?\" \"Maiden name?\" \"Her last name before she was married.\" \"Oh, okay. Silva.\" \"And your father's full name?\" I answered all her questions. She typed for a few minutes. Then she printed a letter. \"Here's your Social Insurance Number. It's nine digits long. Please keep this letter in a safe place at home.\" \"Should I carry it in my wallet?\" \"No, you shouldn't. Your SIN is confidential. Only give it to your employer, your bank, and the government. If someone else asks for it, like a store or a landlord, you don't have to give it to them.\" \"Does it cost anything?\" \"It doesn't. It's free.\" Next, it was my wife's turn. She's on a work permit while her PR application is processing, so her SIN was different. \"Your SIN starts with a nine,\" the woman told her. \"That's for people who are in Canada temporarily. It has an expiry date, the same date as your work permit. When you renew your permit, you'll need to update your SIN too.\" Before we left, the woman gave us one more piece of advice. \"Every year, you need to file your taxes by April 30th. Even if you didn't work much, you should still file. You might get benefits, like the Canada child benefit if you have kids.\" \"We have two kids.\" \"Then definitely file. It can make a big difference.\" Outside, my wife looked at her letter. \"Nine digits,\" she said. \"I'll never remember it.\" \"You don't have to remember it,\" I said. \"You just have to keep it safe.\"", "words": 378}, {"num": 19, "title": "Apartment Hunting", "F": "13/30, 14/40, 16/60, rent and prices, phone numbers, dates, does/doesn't, \"hydro\"", "V": "", "T": "Last month, Lisa and her husband, Brian, looked for a new apartment. They wanted two bedrooms near a SkyTrain station, and their budget was two thousand five hundred dollars a month. The first apartment was on Main Street, near 16th Avenue. The rent was two thousand one hundred and fifty dollars, but it was on the fourth floor, and the building didn't have an elevator. \"Does the rent include hydro?\" Brian asked. \"No, it doesn't,\" said the landlord, Mr. Grant. \"Hydro is about sixty dollars a month. Internet is extra too.\" The second apartment was on Cambie Street, near 41st Avenue. It was bigger and brighter, and it was close to the Canada Line, but the rent was two thousand nine hundred. \"That's too much for us,\" Lisa said. \"Is the price negotiable?\" Brian asked. \"I'm afraid it isn't.\" The third apartment was on Fraser Street, near 30th Avenue. On the phone, Lisa wasn't sure what the manager said. \"Sorry, is that thirteenth or thirtieth?\" \"Thirtieth. Three-zero.\" The rent was two thousand four hundred and forty dollars. It had a small balcony, and the bus stop was right outside. \"Does it have laundry?\" Lisa asked. \"It does. There's a washer and dryer in the unit.\" \"When is it available?\" Brian asked. \"On the first of March,\" said the manager, Helen. \"You need to pay a deposit of half a month's rent. That's twelve hundred and twenty dollars.\" \"Can we see the lease first?\" Lisa asked. \"You can. I'll send it to you tonight. What's your phone number?\" \"It's six oh four, five five five, eighteen seventy.\" Helen repeated it. \"Six oh four, five five five, one eight seven zero?\" \"That's right.\" That night, Helen called. \"Did you read the lease? Did you decide?\" \"We did,\" Brian said. \"We'll take it.\" They signed the lease on February 14th, Valentine's Day. \"This is the best gift you've ever given me,\" Lisa joked. \"I didn't give it to you,\" Brian said. \"We're paying for it together.\"", "words": 333}, {"num": 20, "title": "Asking the Landlord for a Repair", "F": "reporting a problem in writing, temperatures, times, is/isn't, was, did/didn't, have to, can, will", "V": "landlord, tenant, suite, repair, emergency repair, heat, thermostat, boiler, leak, faucet, in writing, notice, Residential Tenancy Branch", "T": "In January, the heat in our apartment stopped working. It was minus two degrees outside, and inside it was only fourteen degrees. My kids were wearing their jackets at dinner. At seven p.m., I texted my landlord, Mr. Grant. \"Hi Mr. Grant, this is your tenant in suite 304. The heat isn't working. It's only 14 degrees in the apartment. Could you please send someone to fix it as soon as possible? Thank you.\" He didn't answer. At ten p.m., I still didn't have an answer. I knocked on my neighbour Doug's door. \"Did he answer you?\" Doug asked. \"Not yet.\" \"In B.C., no heat is an emergency repair. The landlord has to fix it quickly. It's good that you texted him. Always put everything in writing, and keep a copy. Take a photo of the thermostat too.\" \"What if he doesn't fix it?\" \"Then you can contact the Residential Tenancy Branch. They help tenants and landlords with problems. But most landlords fix it fast.\" We borrowed two small heaters from Doug and slept in our warmest clothes. At seven thirty the next morning, Mr. Grant called. \"I'm so sorry. I didn't see your message until this morning. I'll send a repair person between ten and twelve. Will someone be home?\" \"Yes, I'll be home.\" At eleven fifteen, a repairman named Tony arrived. He checked the thermostat and then went down to the basement. After forty minutes, he came back. \"It was the boiler. A part broke. I replaced it, so the heat should come back in about an hour.\" By one o'clock, the apartment was warm again. I told Tony about another problem. \"The kitchen faucet is leaking too. It isn't an emergency, but it's getting worse.\" \"I'll tell Mr. Grant. For a regular repair like that, he has to give you twenty-four hours' written notice before someone enters your apartment.\" That evening, Mr. Grant sent an email. \"Tony will come on Thursday at 2 p.m. to fix the kitchen faucet. Please let me know if that time doesn't work.\" On Thursday, Tony fixed the faucet in twenty minutes. That night, I sent Mr. Grant a short message: \"Thank you for fixing everything so quickly.\" Doug was right. When you put it in writing, things get done.", "words": 378}, {"num": 21, "title": "Building Credit from Zero", "F": "numbers (credit scores, limits, percentages), dates, do/don't, did, should/shouldn't, will", "V": "credit history, credit score, credit card, secured card, deposit, credit limit, balance, pay in full, interest, due date, credit bureau, apply, approved, declined", "T": "Six months after we moved to Vancouver, we tried to rent a bigger apartment. The property manager, Mrs. Lambert, asked for permission to check our credit. Two days later, she called. \"I'm sorry, but you don't have a credit history in Canada. We can't approve your application without a larger deposit.\" \"But we always paid our bills in Brazil,\" I said. \"I believe you. But Canadian credit bureaus don't see anything from Brazil. Here, you're starting from zero.\" That week, I went to my bank to talk to an advisor named Martin. \"How do I build a credit history?\" I asked. \"The easiest way is a credit card,\" he said. \"Because you're new, we'll start with a secured card. You give the bank a deposit, for example five hundred dollars, and that becomes your credit limit.\" \"So it's my own money?\" \"Yes, but you use the card like a normal credit card. Every month, you pay the bill. When you pay on time, it builds your credit score.\" \"What's a good credit score?\" \"In Canada, scores go from three hundred to nine hundred. Above seven hundred is good. Right now, you don't have a score at all.\" \"What should I do, and what shouldn't I do?\" \"First, pay the full balance every month, not just the minimum. If you don't pay in full, you'll pay about twenty percent interest. Second, never miss a due date. Set up automatic payments. Third, don't use more than thirty percent of your limit. With a five-hundred-dollar limit, try to keep your balance under one hundred and fifty dollars.\" \"Only a hundred and fifty? That isn't much.\" \"Use it for small things, like groceries or your phone bill. Then pay it off.\" \"How long will it take?\" \"If you do everything right, you'll have a decent score in about a year. Then you can apply for a regular card and get your deposit back.\" I opened the secured card that day. Every month, I paid for my phone bill with it, and every month, the payment went out automatically. A year later, I checked my score online. It was seven hundred and twelve. I called Martin. \"Did it work?\" he asked. \"It did,\" I said. \"And this time, Mrs. Lambert approved our application.\"", "words": 378}, {"num": 22, "title": "Calling Customer Service", "F": "automated phone menus, account numbers, prices, months, didn't, can, will", "V": "customer service, \"press 1,\" hold, wait time, account number, verify, promotional price, bill, loyalty department, cancel, contract, cancellation fee, \"Is there anything else I can help you with?\"", "T": "When I opened my internet bill this month, I couldn't believe it. The price went up from sixty-five dollars to ninety-five dollars. I didn't change anything, so I called customer service. A recorded voice answered. \"Thank you for calling Pacific Connect. For English, press 1. Pour le service en français, appuyez sur le 2.\" I pressed 1. \"Please enter your account number, followed by the pound key.\" I found my account number on my bill and typed it. \"For billing, press 1. For technical support, press 2. To cancel your service, press 3.\" I pressed 1 for billing. \"Your call is important to us. Your estimated wait time is twenty-three minutes.\" I put my phone on speaker and made a coffee. After twenty-six minutes, a person answered. \"Thanks for calling Pacific Connect. My name is Brad. To verify your account, can I get the address on the account and the last four digits of your phone number?\" I gave him the information. \"Thank you. How can I help you today?\" \"My bill went up thirty dollars this month, and I didn't change anything.\" \"Let me take a look. Okay, I see what happened. When you signed up, you got a promotional price for twelve months. That promotion ended last month, so now you're paying the regular price.\" \"Nobody told me that.\" \"Can you do anything?\" \"Let me transfer you to our loyalty department.\" I waited again, this time for eight minutes. Then a woman answered. \"Hi, this is Sandra from the loyalty team. I understand you're unhappy with your bill.\" \"I am. To be honest, I'm thinking about cancelling and switching to another company.\" \"I'd hate to lose you. I can offer you seventy dollars a month for the next twenty-four months, with the same speed.\" \"Is there a contract? Is there a cancellation fee?\" \"No contract, and no cancellation fee.\" \"Okay. That works. Can you send that to me in writing?\" \"Of course. You'll get a confirmation email in a few minutes. Is there anything else I can help you with today?\" \"No, that's all. Thank you.\" Five minutes later, the email arrived. My friend Darren told me later, \"Always call when the promotion ends. And always say the word 'cancel.' It works every time.\"", "words": 376}, {"num": 23, "title": "Filing Your Taxes", "F": "dates and deadlines, dollar amounts, did/didn't, do/don't, have to, should, will, -ed", "V": "Canada Revenue Agency (CRA), file your taxes, tax return, deadline, T4 slip, income, tax deducted, refund, owe, direct deposit, free tax clinic, volunteer, date of entry, notice of assessment, CRA My Account, benefits, scam", "T": "It was our first tax season in Canada, and I was confused. My neighbour Doug explained the basics. \"Everyone files a tax return every year. The deadline is April 30th. If you file late and you owe money, you'll pay a penalty.\" \"What do I need?\" \"Your T4 slip. Your employer sends it by the end of February. It shows how much you earned and how much tax they already deducted from your pay.\" \"Should I pay an accountant?\" \"Try a free tax clinic first. Volunteers do it for free for families with lower or moderate income.\" I booked an appointment at a community centre for Saturday, March 14th, at ten a.m. The volunteer's name was Wendy. \"Welcome! Is this your first time filing in Canada?\" \"Yes, it is. We arrived last June.\" \"Did you bring your T4 slips, your SIN letters, and your immigration documents?\" \"I did.\" \"Great. What was your date of entry into Canada?\" \"June 10th.\" \"As a newcomer, you only report your world income from the date you arrived. Did you earn any money in Brazil after June 10th?\" \"No, we didn't.\" She looked at my T4. \"Your income was forty-eight thousand five hundred dollars, and your employer deducted six thousand two hundred and thirty dollars in tax.\" She typed for about twenty minutes. Then she smiled. \"Good news. You'll get a refund of about eight hundred and forty dollars. And because you have two kids, you'll also get the Canada child benefit every month.\" \"When will I get the money?\" \"I'll file it online today. With direct deposit, you'll usually get your refund in about two weeks. Later, you'll receive a notice of assessment from the CRA. Keep it. And register for CRA My Account online.\" Before I left, Wendy gave me a warning. \"If someone calls and says they're from the CRA and you'll be arrested if you don't pay right away, hang up. It's a scam. The CRA will never ask you to pay with gift cards.\" Twelve days later, the refund was in my bank account. I called Doug. \"It worked!\" \"Told you,\" he said. \"Now keep all your papers in one folder. You'll do it again next year.\"", "words": 367}, {"num": 24, "title": "Renewing a PR Card", "F": "the residency obligation (730 days in 5 years), expiry dates, did, have to, can, should", "V": "PR card, expiry date, renew, residency obligation, physically present, travel history, permanent resident travel document (PRTD), status, lose your status, citizenship", "T": "On Saturday, my friend Gord looked worried. \"My PR card expires next month,\" he said. \"I have to renew it, but I'm not sure I can.\" \"Why not?\" \"You know my father was sick last year. I spent a lot of time in Brazil.\" \"How much time?\" \"About eleven months last year, and three months this year.\" We called my neighbour, Lorna, who works for an immigration consultant. \"Hi Gord,\" she said on speaker. \"First of all, don't panic. Your PR card isn't your status. Even if your card expires, you're still a permanent resident. The card is just proof.\" \"Okay. That's a relief.\" \"But there's something called the residency obligation. To keep your PR status, you have to be physically present in Canada for at least seven hundred and thirty days in every five-year period. That's two years out of five.\" \"So I can be outside Canada for three years?\" \"In total, yes. When you apply to renew your card, you list all your trips. Do you have your travel history?\" \"I have the stamps in my passport, and my plane tickets.\" \"Good. Let's count. When did you become a permanent resident?\" \"Four years ago, in August.\" \"And how many days were you outside Canada in those four years?\" Gord counted in his notebook. \"About four hundred and sixty days.\" Lorna did the math. \"Four years is about fourteen hundred and sixty days. Minus four hundred and sixty, that's about one thousand days in Canada. You're well over seven hundred and thirty. You're fine.\" Gord smiled for the first time. \"Apply to renew your card online. It takes a few months, so apply now.\" \"What if I need to travel to Brazil before the new card arrives?\" \"Then be careful. If you fly back to Canada without a valid PR card, the airline might not let you board. You'd need a permanent resident travel document, a PRTD, from outside Canada.\" \"Then I'll wait here until the new card arrives.\" \"Good plan. And Gord, you've been here almost three years in total. Soon, you might be able to apply for citizenship. Then you won't need a PR card at all.\" After the call, Gord said, \"That's the best news I've had all year.\"", "words": 373}, {"num": 25, "title": "Preparing for the Citizenship Test", "F": "numbers (days, years, questions, percentages), dates, do, did/didn't, have to, will", "V": "citizenship, eligible, permanent resident, physical presence, days in Canada, application, language requirement, citizenship test, study guide (\"Discover Canada\"), head of state, Parliament, Senate, House of Commons, Confederation, Remembrance Day", "T": "Five years after we arrived in Canada, my wife and I decided to apply for citizenship. My friend Curtis, who became a citizen a few years ago, helped us check if we were eligible. \"First, you have to be a permanent resident,\" he said. \"Second, you have to be physically present in Canada for at least one thousand and ninety-five days in the last five years. That's three years.\" \"We didn't leave Canada very much,\" my wife said. \"Only for two trips to Brazil.\" \"Then you'll need to count those days carefully. The application asks for every trip.\" \"Do we have to take a test?\" \"If you're between eighteen and fifty-four, yes. You also have to show your English is good enough. But your English is fine.\" We sent our application online. A few months later, we got an email inviting us to take the citizenship test. \"The test has twenty questions,\" Curtis explained. \"You have forty-five minutes, and you need fifteen correct answers to pass. It's online.\" \"What kind of questions?\" \"Everything is in a free study guide called 'Discover Canada.' History, government, geography, rights and responsibilities.\" Every night after dinner, my wife and I quizzed each other. \"Who is Canada's head of state?\" \"The King. King Charles the Third.\" \"What are the three parts of Parliament?\" \"The King, the Senate, and the House of Commons.\" \"When did Confederation happen?\" \"In 1867.\" \"How many provinces and territories are there?\" \"Ten provinces and three territories.\" \"What happens on November 11th?\" \"Remembrance Day. We remember the Canadians who served and died in wars.\" My son also helped. He's twelve, and he learned a lot of this at school. \"Dad, what's the capital of Canada?\" \"Ottawa. Easy.\" \"What's the capital of Nunavut?\" I didn't know. \"Iqaluit,\" he said, smiling. On the day of the test, I was nervous. I logged in at nine o'clock. The questions were similar to the study guide, and I finished in twenty minutes. At the end, the screen showed my score: nineteen out of twenty. My wife got twenty out of twenty. \"Show-off,\" I said. She laughed. \"I studied harder than you did.\"", "words": 356}]}, {"part": 3, "title": "Getting Around", "desc": "SkyTrain, directions, and getting a B.C. driver's licence.", "scripts": [{"num": 26, "title": "The Wrong Building", "F": "Vancouver streets and SkyTrain, directions, times, addresses (ten fifteen / ten fifty), does, -ed", "V": "", "T": "On Tuesday, Mark had a job interview downtown. He'd only been in Vancouver for three weeks, so he didn't know the city well. He lives on Commercial Drive, near Broadway. The interview was at ten fifteen, so he left home at nine. He walked to Commercial–Broadway Station and took the Expo Line toward Waterfront. The train was crowded, and he couldn't find a seat. He got off at Granville Station, but then he turned the wrong way. He walked south on Granville Street, past Robson, before he realized his mistake. He stopped a woman and asked, \"Excuse me, does this street go to Georgia?\" \"It does,\" she said, \"but you're walking the wrong way. Georgia is behind you. Go back past Robson, then turn left on Georgia.\" \"Thanks so much,\" Mark said. \"Is it far?\" \"No, it isn't. It's about five minutes.\" Mark checked his watch. It was nine fifty. He started to feel nervous. He hurried back up Granville and turned left on West Georgia. The address on his email was ten fifty West Georgia. He found a tall building, walked in, and pressed the button for the elevator. A security guard named Rod stopped him. \"Can I help you?\" \"Yes, I have an interview on the twelfth floor.\" Rod looked at the email. \"This is ten fifteen West Georgia. You want ten fifty. One-zero-five-zero. It's across the street.\" \"Ten fifteen?\" Mark laughed. \"That's the time of my interview!\" Rod laughed too. \"Well, you've got twenty minutes. You'll be fine.\" Mark crossed the street and arrived at ten twelve, three minutes early. The interview went well. They asked about his experience, and he answered every question. After it finished, he wanted to celebrate, so he walked down Robson Street to Denman, and then down to English Bay. He bought a coffee, sat on a bench, and watched the ships. Then he called his wife. \"Did you get lost?\" she asked. \"I didn't get lost,\" Mark said. \"Well, not for long.\"", "words": 331}, {"num": 27, "title": "Booking the Road Test", "F": "90/19, 40/14, dates and times, do/does/doesn't, did/didn't, can/can't", "V": "ICBC, licence, resident, knowledge test, road test, translation, book a test, available, insured, vehicle, signals, horn, shoulder check", "T": "I've been driving since I was eighteen. In Brazil, I drove every day for twenty years. So when I moved to Vancouver, I thought, \"Driving here will be easy.\" I was wrong. My neighbour, Vern, explained the rules to me. \"You can drive with your Brazilian licence for ninety days after you become a resident,\" he said. \"After that, you need a B.C. licence.\" \"Ninety or nineteen?\" \"Ninety. Nine-zero. About three months.\" \"Do I need to take a test?\" \"You do. You need to pass the knowledge test first, and then the road test.\" So on Monday, I went to the ICBC driver licensing office on Kingsway. I took a number and waited for forty minutes. Finally, a woman called, \"Number fifty-three?\" \"That's me.\" \"Hi, I'm Sherry. How can I help you today?\" \"I'd like to get a B.C. driver's licence. I have a licence from Brazil.\" \"Did you bring your licence and an official translation?\" \"I did. And my passport and my permanent resident card.\" She checked everything. \"Great. First, you'll take the knowledge test on the computer. There are fifty questions. You need forty correct answers to pass.\" \"Forty? So I can make ten mistakes?\" \"That's right. Ten, not more.\" I took the test and got forty-four. Sherry smiled. \"Congratulations. Now let's book your road test. The next available date is Tuesday, November 17th, at ten forty-five.\" \"Ten forty-five is fine.\" \"Please arrive fifteen minutes early. You need to bring your own vehicle, and it must be insured and in good condition. Before the test, the examiner will check the lights, the signals, and the horn. If something doesn't work, you can't take the test.\" \"Does the examiner speak slowly?\" She laughed. \"Not always. If you don't understand, ask him to repeat it.\" That weekend, Vern took me driving to practise. After ten minutes, he stopped me. \"You didn't shoulder check.\" \"I checked my mirror.\" \"The mirror isn't enough. Before you change lanes or pull out, turn your head and look over your shoulder. That's the number one reason people fail here.\" I practised for two more weeks. By the end, Vern said I was ready. I wasn't so sure.", "words": 362}, {"num": 28, "title": "The Road Test", "F": "the examiner's instructions: left/right, second, speed limits (30/50), turn, pull over, park, can, will", "V": "examiner, brake lights, turn signal, pull out, follow the road, lane, intersection, traffic lights, school zone, speed limit, parallel park, curb, hill park,
