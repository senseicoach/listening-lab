"I see.", "Felipe"], ["P", "Be careful with times. Business one-oh-one has three sections. Section A is Mondays and Wednesdays at eight thirty. Section B is Tuesdays and Thursdays at ten thirty. Section C is Tuesdays and Thursdays at two thirty.", "Donna"], ["S", "Two thirty or two thirteen?", "Felipe"], ["P", "Ha! Two thirty in the afternoon. Also, some courses have a lecture and a tutorial. You need to register for both, and they can't overlap.", "Donna"], ["S", "What happens if a course is full?", "Felipe"], ["P", "You can join the waitlist. Many students drop courses in the first two weeks. But the last day to add a course is September 18th.", "Donna"], ["S", "And when do I pay tuition?", "Felipe"], ["P", "Tuition is due by September 4th. You can pay online through the student portal. And don't forget your student card. With it, you'll get a U-Pass for the bus and SkyTrain.", "Donna"], ["P", "Hi Felipe, it's Donna. How did registration go on Thursday?", "Donna"], ["S", "I clicked \"Register\" at nine o'clock exactly. Four courses worked. One course was full, so I joined the waitlist. I'm number fourteen.", "Felipe"], ["P", "Fourteen or forty?", "Donna"], ["S", "Fourteen, not forty. I still have a chance.", "Felipe"]], "words": 330, "kind": "story", "scene": "Felipe's registration date is Thursday at nine in the morning, and he doesn't know which courses to choose. He has an appointment with an academic advisor, Donna.", "F": "student numbers, course codes (one-oh-one), credits, times (2:30/2:13), dates, 14/40, can/can't, doesn't, didn't", "V": "academic advisor, registration date, student number, faculty, full-time, credits, required course, elective, prerequisite, section, lecture, tutorial, overlap, waitlist, drop, add deadline, tuition, student portal, student card, U-Pass", "t": [[2.0, 2.98], [3.2, 4.67], [5.34, 7.84], [8.51, 9.26], [9.48, 12.65], [12.87, 15.78], [16.0, 19.0], [19.67, 21.17], [21.39, 23.01], [23.68, 25.17], [25.84, 26.99], [27.66, 28.88], [29.1, 31.04], [31.26, 37.28], [37.5, 39.27], [39.94, 41.03], [41.7, 44.26], [44.48, 46.05], [46.72, 48.22], [48.89, 49.68], [49.9, 53.08], [53.75, 54.77], [55.44, 58.3], [58.52, 63.83], [64.5, 65.25], [65.92, 67.28], [67.5, 69.49], [69.71, 72.59], [72.81, 75.88], [76.1, 79.11], [79.78, 81.33], [82.0, 82.64], [82.86, 84.46], [84.68, 87.69], [87.91, 90.81], [91.48, 93.13], [93.8, 95.27], [95.49, 98.11], [98.33, 101.32], [101.99, 103.42], [104.09, 106.26], [106.48, 108.7], [108.92, 110.59], [110.81, 113.75], [114.42, 116.17], [116.39, 118.5], [119.17, 121.73], [121.95, 123.13], [123.35, 125.88], [126.1, 127.3], [127.97, 129.29], [129.96, 131.24], [131.46, 132.68]], "R": [["You meet with an academic advisor.", "Advisor", "Which courses are you thinking about?", "I need two required courses and one elective. Is there a prerequisite for this one?"], ["Two of your classes are at the same time.", "Advisor", "These two sections overlap.", "Oh. Is there another section of the lecture, maybe in the afternoon?"]]}, {"num": 64, "title": "First Day on Campus", "lines": [["P", "Excuse me, where's the Buchanan Building?", "Felipe"], ["S", "Walk straight down Main Mall, and turn left at the clock tower.", "Student"], ["P", "Thanks!", "Felipe"], ["P", "Nine twenty. Now, is it Room two thirteen or two thirty? Two thirty, not two thirteen.", "Felipe"], ["P", "Hi. Is this Business Communication?", "Felipe"], ["P", "It is. I'm Kyle. Is this your first class?", "Kyle"], ["P", "Yes. Is it obvious?", "Felipe"], ["P", "A little. You looked lost. I was lost too, last year.", "Kyle"], ["P", "You took this course last year?", "Felipe"], ["P", "I did. And I failed it. I didn't do the readings. Don't make my mistake.", "Kyle"], ["S", "Good morning, everyone. Can you all hear me at the back?", "Dr. Walsh"], ["P", "We can't!", "Voice at the back"], ["S", "How about now?", "Dr. Walsh"], ["P", "Yes!", "Voice at the back"], ["S", "Good. I'm Dr. Susan Walsh. Welcome to Business Communication. This course is thirteen weeks long. We meet on Mondays and Wednesdays from nine thirty to eleven. Please don't be late. The door closes at nine forty.", "Dr. Walsh"], ["P", "She's serious about that. Last year, she locked out six people on the first day.", "Kyle"], ["P", "Kyle, where do you usually eat lunch?", "Felipe"], ["P", "At the Nest. It's the student building. Do you want to come?", "Kyle"], ["P", "Sure. My first day isn't so bad after all.", "Felipe"]], "words": 181, "kind": "story", "scene": "It's Felipe's first day at UBC. He took the ninety-nine B-Line from Commercial Drive and stood for forty minutes. His first class is Business Communication at nine thirty, but the campus is huge.", "F": "university setting, room numbers (213/230), times, where, can/can't, is, did/didn't", "V": "", "t": [[2.0, 4.13], [4.8, 8.6], [9.27, 9.87], [10.54, 11.5], [11.72, 14.13], [14.35, 16.01], [16.68, 17.24], [17.46, 19.14], [19.81, 20.47], [20.69, 21.44], [21.66, 22.9], [23.57, 24.14], [24.36, 25.32], [25.99, 26.63], [26.85, 27.75], [27.97, 29.31], [29.98, 31.56], [32.23, 32.85], [33.07, 34.01], [34.23, 35.45], [35.67, 36.86], [37.53, 38.96], [39.18, 40.63], [41.3, 42.0], [42.67, 43.74], [44.41, 45.01], [45.68, 46.25], [46.47, 47.99], [48.21, 50.17], [50.39, 52.23], [52.45, 55.84], [56.06, 57.21], [57.43, 59.16], [59.83, 61.04], [61.26, 64.08], [64.75, 66.67], [67.34, 68.09], [68.31, 69.52], [69.74, 70.75], [71.42, 72.01], [72.23, 74.41]], "R": [["It's your first day on a big campus.", "Student", "Are you lost?", "A little! Do you know where the Buchanan building is? My class starts at nine thirty."], ["A classmate starts a conversation.", "Classmate", "Is this your first year?", "Yes, it's my first day. I'm an international student from Brazil."]]}, {"num": 65, "title": "The Assignments", "lines": [["P", "Okay, everyone, let's talk about assignments. Please open the syllabus. I posted it on Canvas last night. Did everyone get it? If you didn't get it, check your student email.", "Dr. Walsh"], ["S", "How many assignments are there?", "Felipe"], ["P", "There are four assignments in this course. The first one is a short personal introduction, three hundred words. It's worth five percent of your final grade, and it's due by Friday, September 18th, at eleven fifty-nine at night. Not midnight. Eleven fifty-nine.", "Dr. Walsh"], ["P", "The second assignment is a formal business email. You'll write to a company and ask for information. It's worth fifteen percent, and it's due on October 2nd.", "Dr. Walsh"], ["P", "The third assignment is a group presentation. You'll work in groups of four, and each presentation is twelve minutes long. It's worth thirty percent. The presentations will be in November, in weeks ten and eleven.", "Dr. Walsh"], ["P", "The last assignment is a final report, fifteen hundred words. It's worth forty percent, and it's due on December 4th. The other ten percent is participation. That means you come to class, you ask questions, and you join the discussions.", "Dr. Walsh"], ["P", "Does the final report include references?", "Student"], ["P", "It does. Use APA style. The references don't count toward the fifteen hundred words.", "Dr. Walsh"], ["S", "Can we use AI?", "Student 2"], ["P", "Good question. You can use AI to check your grammar, but you can't use it to write your ideas. If you used AI, tell me how you used it in one sentence at the end.", "Dr. Walsh"], ["P", "What happens if we're late?", "Student"], ["P", "You lose ten percent per day. After three days, I won't accept it.", "Dr. Walsh"], ["S", "Do you give extensions?", "Felipe"], ["P", "I do, but only if you ask before the deadline, not after. My office hours are on Tuesdays from two to four, in Room four eighteen.", "Dr. Walsh"], ["P", "Four eighteen, not four eighty. Write it down.", "Kyle"], ["S", "Got it.", "Felipe"], ["P", "One more thing. For Wednesday, read Chapters 1 and 2. There'll be a short quiz.", "Dr. Walsh"], ["S", "Oh no.", "Student 2"], ["P", "I told you.", "Kyle"]], "words": 316, "kind": "story", "scene": "In Business Communication, Dr. Walsh goes through the assignments on the syllabus. Felipe sits next to Kyle.", "F": "a professor giving out assignments: percentages, due dates, word counts, 18/80, by, will/won't, can/can't, does", "V": "", "t": [[2.0, 4.65], [4.87, 6.25], [6.47, 8.56], [8.78, 9.98], [10.2, 12.54], [13.21, 14.66], [15.33, 17.25], [17.47, 21.34], [21.56, 28.36], [28.58, 29.56], [29.78, 31.06], [31.73, 34.53], [34.75, 37.33], [37.55, 40.81], [41.48, 43.89], [44.11, 48.02], [48.24, 49.69], [49.91, 53.49], [54.16, 57.9], [58.12, 61.23], [61.45, 63.75], [63.97, 68.24], [68.91, 71.66], [72.33, 73.06], [73.28, 74.64], [74.86, 78.04], [78.71, 79.8], [80.47, 81.41], [81.63, 86.04], [86.26, 90.06], [90.73, 92.37], [93.04, 94.69], [94.91, 96.93], [97.6, 98.91], [99.58, 102.86], [103.08, 107.2], [107.87, 109.34], [109.56, 110.37], [111.04, 111.74], [112.41, 113.37], [113.59, 115.77], [115.99, 117.25], [117.92, 118.64], [119.31, 120.19]], "R": [["Your professor explains the assignments.", "Classmate", "Did you understand the first assignment?", "Mostly. I'm not sure about the word count. Did she say fifteen hundred?"], ["You ask your professor a question.", "Professor", "Any questions about the syllabus?", "Yes. When is the first assignment due?"]]}, {"num": 66, "title": "Office Hours", "lines": [["P", "Come in. Have a seat. How can I help you?", "Dr. Walsh"], ["S", "I have a question about the business email assignment. I wrote a first draft, but I'm not sure it's formal enough.", "Felipe"], ["P", "Did you bring it?", "Dr. Walsh"], ["S", "I did. Here it is.", "Felipe"], ["P", "This is a good start. But you started with \"Hi.\" For a formal email, you should use \"Dear.\" And you wrote \"I want information.\" That sounds a little direct. You could say \"I would like to request information,\" or \"Could you please send me...\"", "Dr. Walsh"], ["S", "I didn't know that. In Portuguese, we're sometimes more direct.", "Felipe"], ["P", "That's very common. Many of my students from Brazil tell me the same thing.", "Dr. Walsh"], ["S", "What's the difference?", "Felipe"], ["P", "The second one sounds more polite. In Canada, polite is always safer.", "Dr. Walsh"], ["S", "Does the email need a subject line?", "Felipe"], ["P", "It does. Always. And keep it short, five to eight words.", "Dr. Walsh"], ["S", "How long should the email be?", "Felipe"], ["P", "Between a hundred and fifty and two hundred words. Don't write more than two hundred.", "Dr. Walsh"], ["S", "Can I send you a second draft by email?", "Felipe"], ["P", "No, you can't. I don't read drafts by email. But you can bring it next Tuesday.", "Dr. Walsh"], ["S", "Okay. One more question. Kyle said there's a quiz tomorrow. Does it count?", "Felipe"], ["P", "It doesn't count toward your grade. But I'll remember who did the reading.", "Dr. Walsh"], ["S", "Ha. Can you remind me how many pages?", "Felipe"], ["P", "Forty-three pages.", "Dr. Walsh"], ["S", "Forty-three or thirty-four?", "Felipe"], ["P", "Forty-three. Four, three.", "Dr. Walsh"], ["S", "Thank you. The next bus is at two forty. I'll start Chapter 1 while I wait. This time, I want to be ready.", "Felipe"]], "words": 252, "kind": "story", "scene": "On Tuesday at ten past two, Felipe knocks on the door of Room four eighteen for Dr. Walsh's office hours.", "F": "does/did/didn't, can/can't, could/would, say/tell, remember/remind, 34/43, polite English vs. direct Portuguese", "V": "", "t": [[2.0, 2.68], [2.9, 3.78], [4.0, 5.13], [5.8, 8.66], [8.88, 11.8], [12.47, 13.43], [14.1, 14.8], [15.02, 15.81], [16.48, 17.7], [17.92, 19.26], [19.48, 21.64], [21.86, 23.71], [23.93, 25.32], [25.54, 29.64], [30.31, 31.33], [31.55, 33.88], [34.55, 35.65], [35.87, 38.86], [39.53, 40.66], [41.33, 43.23], [43.45, 45.65], [46.32, 48.28], [48.95, 49.68], [49.9, 50.64], [50.86, 53.25], [53.92, 55.42], [56.09, 58.77], [58.99, 60.47], [61.14, 63.4], [64.07, 65.03], [65.25, 66.95], [67.17, 68.88], [69.55, 70.25], [70.47, 71.56], [71.78, 73.49], [73.71, 74.56], [75.23, 76.98], [77.2, 79.01], [79.68, 80.24], [80.46, 82.38], [83.05, 84.29], [84.96, 86.43], [87.1, 88.02], [88.24, 89.15], [89.82, 90.59], [90.81, 92.54], [92.76, 94.59], [94.81, 96.33]], "R": [["You go to your professor's office hours.", "Professor", "Come in! How can I help?", "Hi, I had a question about my essay. Could you explain your comments on the thesis?"], ["Your professor gives you feedback.", "Professor", "Your ideas are good, but your paragraphs need more evidence.", "Thank you. Should I use more scholarly sources?"]]}, {"num": 67, "title": "UBC: The Argumentative Essay", "lines": [["P", "Good morning, everyone. Let's talk about your first major assignment. It's posted on Canvas, but I'll go through it now, so please listen carefully. This is an argumentative essay.", "Professor"], ["S", "What's the difference between an argumentative essay and a normal essay?", "Beatriz"], ["P", "You're not just describing something. You're making an argument, and you're supporting it with evidence. The topic is: \"Should Canadian cities limit short-term rentals like Airbnb?\" You can argue yes or no. What I care about is how well you defend your position.", "Professor"], ["P", "Where does the thesis go?", "Student"], ["P", "Your essay needs a clear thesis statement at the end of your introduction. One sentence. If I finish your first paragraph and I don't know what you're arguing, that's a problem.", "Professor"], ["S", "How long should it be?", "Beatriz"], ["P", "Between fifteen hundred and eighteen hundred words, not including your works cited page. Please don't go over two thousand words. I'll stop reading at two thousand.", "Professor"], ["P", "What format?", "Student"], ["P", "MLA format: double-spaced, twelve-point font, one-inch margins, and page numbers.", "Professor"], ["S", "How many sources do we need?", "Beatriz"], ["P", "At least four scholarly sources. That means peer-reviewed journal articles or academic books. Wikipedia isn't a scholarly source, and neither is a random blog.", "Professor"], ["P", "How much is it worth?", "Student"], ["P", "The essay is worth twenty-five percent of your final grade. Before that, you'll submit a one-page outline, worth five percent. The outline is due on Friday, October 16th, and the final essay is due on Friday, November 6th, at eleven fifty-nine at night. Submit it on Canvas. Everything goes through Turnitin, so make sure every idea from a source is cited.", "Professor"], ["S", "Can we use AI to help with research?", "Beatriz"], ["P", "You can use it to brainstorm, but you can't use it to write any part of your essay. If you did use AI, tell me how in a short note at the end.", "Professor"], ["P", "What if we need an extension?", "Student"], ["P", "Email me at least forty-eight hours before the deadline. Late essays lose five percent per day.", "Professor"], ["S", "Does the rubric count grammar?", "Beatriz"], ["P", "It does. Twenty percent of the grade is for clarity and style. If you're worried about your writing, book an appointment at the writing centre. It's free, and I strongly recommend it.", "Professor"], ["S", "I'm booking one today.", "Beatriz"]], "words": 362, "kind": "story", "scene": "Before today's lecture, Professor Grant explains the class's first major assignment. Beatriz and her classmates have questions.", "F": "essay requirements, word counts, percentages, dates, does, can/can't, did", "V": "argumentative essay, thesis statement, evidence, scholarly/peer-reviewed sources, works cited, MLA format, double-spaced, margins, rubric, outline, Turnitin, extension, writing centre", "t": [[2.0, 3.56], [3.78, 6.44], [6.66, 11.25], [11.47, 13.86], [14.53, 18.58], [19.25, 21.45], [21.67, 25.34], [25.56, 30.36], [30.58, 32.44], [32.66, 36.33], [37.0, 38.28], [38.95, 43.4], [43.62, 44.75], [44.97, 50.16], [50.83, 51.98], [52.65, 58.28], [58.5, 60.85], [61.07, 63.18], [63.85, 64.73], [65.4, 71.39], [72.06, 73.6], [74.27, 76.57], [76.79, 80.59], [80.81, 85.1], [85.77, 86.83], [87.5, 91.09], [91.31, 95.27], [95.49, 105.05], [105.27, 106.85], [107.07, 112.38], [113.05, 115.12], [115.79, 121.0], [121.22, 124.99], [125.66, 127.05], [127.72, 131.26], [131.48, 134.0], [134.67, 136.25], [136.92, 137.83], [138.05, 141.34], [141.56, 145.78], [146.0, 148.52], [149.19, 150.36]], "R": [["You ask about an essay assignment.", "Professor", "Any questions about the argumentative essay?", "Yes. How many scholarly sources do we need? And is the works cited page in the word count?"], ["A classmate asks about the format.", "Classmate", "What format do we use?", "MLA format, double-spaced, with one-inch margins."]]}, {"num": 68, "title": "BCIT: The Recommendation Report", "lines": [["P", "Morning, everyone. Let's go over your major project for this term. First of all, this is not an essay. In this program, you're writing for industry, not for a professor.", "Craig"], ["S", "What does that mean for our writing?", "Diego"], ["P", "Your reader is a busy manager who doesn't have time to read long paragraphs. So your writing must be clear, direct, and easy to scan. The project is a recommendation report.", "Craig"], ["P", "Is it a group project?", "Ana"], ["P", "It is. Each set will be divided into teams of three or four. Your team will work with a real client, a small business in the Lower Mainland, and recommend a solution to a problem they have.", "Craig"], ["S", "How long is the report?", "Diego"], ["P", "No more than twenty-five hundred words, not including the appendices. It must have these sections, in this order: a title page, an executive summary, an introduction, your findings, your recommendations, a conclusion, references in APA, and appendices.", "Craig"], ["P", "Can we use bullet points?", "Ana"], ["P", "You can use headings, subheadings, bullet points, and tables. In fact, I'd like you to.", "Craig"], ["P", "The executive summary is the most important page. Many managers only read the executive summary, so it has to stand alone. Keep it under two hundred and fifty words.", "Craig"], ["S", "What are the deadlines?", "Diego"], ["P", "Before the report, each team will submit a one-page proposal memo. It's worth ten percent, and it's due on Friday, October 9th, on the Learning Hub. The final report is worth thirty percent, and it's due on Friday, November 27th. After that, each team will give a fifteen-minute presentation to the client.", "Craig"], ["P", "And please name your file like this: team number, underscore, client name, underscore, report. For example, Team three, underscore, Coast Bakery, underscore, Report. Not \"final final version two.\"", "Craig"], ["P", "Ha! Does everyone on the team get the same mark?", "Ana"], ["P", "Not always. At the end, you'll complete a peer evaluation. If someone didn't do their share, it'll affect their mark.", "Craig"], ["S", "Can we contact the client directly?", "Diego"], ["P", "You can, but be professional. Use your BCIT email, not your personal email.", "Craig"], ["P", "What if the client doesn't answer?", "Ana"], ["P", "Wait three business days, then follow up. If they still don't answer, let me know.", "Craig"], ["S", "How strict is the word limit?", "Diego"], ["P", "Very strict. In industry, if you can't say it in twenty-five hundred words, you haven't thought about it enough.", "Craig"]], "words": 380, "kind": "story", "scene": "At BCIT, the instructor, Craig, explains the major project for this term to his set. Diego and Ana are in the class.", "F": "report structure, word limits, dates, file names, does/doesn't, can/can't, didn't", "V": "industry, recommendation report, client, Lower Mainland, set, executive summary, findings, recommendations, appendices, headings, subheadings, bullet points, proposal memo, Learning Hub, peer evaluation, business days, follow up", "t": [[2.0, 3.0], [3.22, 5.76], [5.98, 7.75], [7.97, 11.53], [12.2, 13.91], [14.58, 19.1], [19.32, 22.31], [22.53, 24.86], [25.53, 26.83], [27.5, 28.16], [28.38, 31.39], [31.61, 39.27], [39.94, 41.19], [41.86, 46.09], [46.31, 57.83], [58.5, 59.93], [60.6, 63.73], [63.95, 65.3], [65.97, 68.93], [69.15, 73.74], [73.96, 76.11], [76.78, 77.96], [78.63, 82.68], [82.9, 87.55], [87.77, 92.93], [93.15, 97.29], [97.96, 103.74], [103.96, 108.44], [108.66, 110.5], [111.17, 111.72], [111.94, 114.46], [115.13, 116.01], [116.23, 118.51], [118.73, 121.52], [122.19, 124.13], [124.8, 126.19], [126.41, 129.16], [129.83, 131.56], [132.23, 134.34], [134.56, 136.44], [137.11, 138.62], [139.29, 140.15], [140.37, 145.57]], "R": [["Your instructor explains a big project.", "Instructor", "Any questions about the recommendation report?", "Yes. Should the executive summary be one page?"], ["A classmate asks how to organize it.", "Classmate", "How should we organize the report?", "Findings first, then recommendations, with headings and bullet points."]]}, {"num": 69, "title": "The MBA Group Project", "lines": [["P", "Let's make sure we're all on the same page. The assignment is a case study. A Vancouver coffee company, Harbour Roasters, wants to open five new locations in Calgary. We have to decide if they should do it and write a recommendation.", "Sarah"], ["S", "What are the deliverables?", "Mike"], ["P", "A written report, three thousand words maximum, and a twenty-minute presentation. Together, they're worth forty percent of our final grade.", "Sarah"], ["P", "Forty or fourteen?", "Fernanda"], ["P", "Forty. Four-zero. It's a big one. The report is due on Friday, November 13th. So, how do we want to divide the work?", "Sarah"], ["S", "I can take the lead on the financials. I worked in banking for six years. I'll run the numbers. Their revenue grew from one point four million to four point one million in three years. That's impressive, but their profit margin is small.", "Mike"], ["S", "I'll do the market research on Calgary.", "Jason"], ["P", "I can write the executive summary and the recommendation. In Brazil, I managed marketing for a restaurant chain.", "Fernanda"], ["P", "Perfect. I'll build the slide deck and put everything together. Let's each write a draft of our section by next Wednesday.", "Sarah"], ["P", "Okay, it's Wednesday. Mike, Fernanda, and I have our drafts. Jason?", "Sarah"], ["S", "Sorry, guys. I had a big deadline at work.", "Jason"], ["P", "I understand you're busy, Jason. I'm just wondering if you could finish the research by Friday. We need it for the recommendation.", "Fernanda"], ["S", "Yeah, that's fair. I'll have it done by Friday.", "Jason"], ["P", "Thanks. Let's circle back on Friday. And let's schedule a dry run of the presentation for Monday at six.", "Sarah"], ["S", "Jason, this research is excellent. Rents in Calgary are thirty percent lower than in Vancouver.", "Mike"], ["S", "Thanks. Sorry again for being late.", "Jason"], ["P", "In Brazil, I would say, \"You have to do your part.\" Here, I asked politely, and it worked. On the peer evaluation, I gave everyone full marks. Even Jason. He was late once, but he didn't let us down.", "Fernanda"]], "words": 311, "kind": "story", "scene": "It's week five of Fernanda's MBA program. Her group, Sarah, Mike, Jason, and Fernanda, is having its first real meeting.", "F": "meeting language, dividing tasks, numbers (1.4/4.1 million, 14/40 percent), didn't, can, will, polite Canadian disagreement", "V": "case study, deliverable, recommendation, slide deck, executive summary, financials, run the numbers, profit margin, take the lead, draft, dry run, peer evaluation, \"circle back,\" \"on the same page\"", "t": [[2.0, 4.22], [4.44, 6.34], [6.56, 12.3], [12.52, 16.04], [16.71, 18.2], [18.87, 23.75], [23.97, 26.88], [27.55, 28.83], [29.5, 30.26], [30.48, 31.4], [31.62, 32.6], [32.82, 35.6], [35.82, 37.89], [38.56, 41.03], [41.25, 43.43], [43.65, 45.05], [45.27, 50.93], [51.15, 54.5], [55.17, 57.3], [57.97, 61.51], [61.73, 65.02], [65.69, 66.5], [66.72, 69.49], [69.71, 72.93], [73.6, 74.95], [75.17, 77.41], [77.63, 78.46], [79.13, 80.07], [80.29, 81.89], [82.56, 84.43], [84.65, 88.34], [88.56, 90.4], [91.07, 92.07], [92.29, 93.81], [94.48, 95.2], [95.42, 97.04], [97.26, 101.32], [101.99, 104.23], [104.45, 108.5], [109.17, 109.77], [109.99, 111.52], [112.19, 114.95], [115.17, 117.17], [117.39, 120.7], [120.92, 122.01], [122.23, 124.64]], "R": [["You're in a group project meeting.", "Group member", "Who wants to take the lead on the financials?", "I can take the lead on the financials. I'll run the numbers by Friday."], ["Your group plans a practice.", "Group member", "Should we do a dry run before the presentation?", "Yes, good idea. How about Thursday evening?"]]}]}, {"part": 10, "title": "Finding a Job", "desc": "The job search, from the first application to the first pay stub.", "scripts": [{"num": 70, "title": "Where to Look for a Job", "lines": [["P", "How's the job search going?", "Pam"], ["S", "Terrible. I apply online every day, and nobody calls me back. In Brazil, I found my last two jobs through friends. Here, I don't have any friends yet.", "Cláudia"], ["P", "Have you been to WorkBC?", "Pam"], ["S", "What's that?", "Cláudia"], ["P", "It's a government employment service. There's a WorkBC Centre in almost every neighbourhood. They help people find jobs, and it's free.", "Pam"], ["P", "Hi, I'm Sheila, an employment counsellor. Tell me about your background.", "Sheila"], ["S", "I was an accountant in Brazil for ten years.", "Cláudia"], ["P", "Okay. Where have you been looking for jobs?", "Sheila"], ["S", "Mostly Indeed.", "Cláudia"], ["P", "Indeed is good, but don't use only one website. Try LinkedIn, and also Job Bank. That's the Government of Canada's job site. And set up job alerts, so you get an email when a new job is posted.", "Sheila"], ["S", "How many applications should I send every day?", "Cláudia"], ["P", "Quality is more important than quantity. Three good applications are better than twenty fast ones.", "Sheila"], ["S", "But I sent sixty and got nothing.", "Cláudia"], ["P", "That's very common. Many jobs are never posted online. People call it the hidden job market. Employers often hire people they already know, or people someone recommended.", "Sheila"], ["S", "So how do I find those jobs?", "Cláudia"], ["P", "By meeting people. Networking events, volunteering, and informational interviews. We have a free workshop on networking next Tuesday.", "Sheila"], ["S", "Can I sign up?", "Cláudia"], ["P", "Of course. We also have workshops on resumes, LinkedIn profiles, and interviews. All free of charge. And your resume is two pages of job duties. Let's fix it together next week.", "Sheila"], ["S", "Thank you so much. I didn't know any of this existed.", "Cláudia"], ["P", "Most newcomers don't. That's why I love this job.", "Sheila"], ["P", "So? How was it?", "Pam"], ["S", "For the first time in weeks, I feel hopeful.", "Cláudia"]], "words": 279, "kind": "story", "scene": "Cláudia was an accountant in Brazil for ten years. After three weeks in Vancouver, she has sent sixty online applications and received zero answers. Her neighbour Pam notices she looks tired.", "F": "job search websites and services, numbers, do/don't, didn't, can, should, -ed", "V": "job board, job posting, Indeed, LinkedIn, Job Bank, WorkBC, employment counsellor, workshop, \"free of charge,\" apply online, job alert, hidden job market", "t": [[2.0, 3.54], [4.21, 4.93], [5.15, 8.56], [8.78, 12.07], [12.29, 14.15], [14.82, 16.33], [17.0, 17.81], [18.48, 20.36], [20.58, 23.61], [23.83, 26.13], [26.8, 29.28], [29.5, 30.95], [31.62, 34.18], [34.85, 35.59], [35.81, 37.48], [38.15, 39.3], [39.97, 42.94], [43.16, 45.4], [45.62, 47.86], [48.08, 52.15], [52.82, 55.49], [56.16, 58.38], [58.6, 61.69], [62.36, 64.32], [64.99, 66.19], [66.41, 68.67], [68.89, 70.96], [71.18, 75.78], [76.45, 78.35], [79.02, 80.18], [80.4, 84.04], [84.26, 86.97], [87.64, 88.62], [89.29, 90.19], [90.41, 94.72], [94.94, 96.2], [96.42, 99.23], [99.45, 101.12], [101.79, 102.9], [103.12, 104.95], [105.62, 106.94], [107.16, 108.76], [109.43, 110.05], [110.27, 111.15], [111.82, 114.19]], "R": [["A neighbour asks about your job search.", "Neighbour", "How's the job search going?", "Honestly, it's hard. I've sent sixty applications and heard nothing."], ["Your neighbour suggests WorkBC.", "Neighbour", "Have you tried WorkBC? It's free.", "No, I haven't. How do I make an appointment with a counsellor?"]]}, {"num": 71, "title": "\"Do You Have Canadian Experience?\"", "lines": [["P", "How can I get Canadian experience if nobody gives me a job without Canadian experience?", "Gustavo"], ["S", "It's the classic newcomer problem. Almost everyone hears it. First, let's understand what employers mean. Usually, they're not worried about your skills. They're worried about three things. Do you understand how Canadian workplaces communicate? Do you know the local rules and systems? And can they call a Canadian reference?", "Ron"], ["P", "So how do I show them that?", "Gustavo"], ["S", "There are a few ways to get your foot in the door. The first is volunteering. Many organizations need volunteers with professional skills, like marketing, accounting, or IT.", "Ron"], ["P", "Does volunteering really count as experience?", "Gustavo"], ["S", "It does, if it's related to your field. And you'll get a Canadian reference. That's very valuable.", "Ron"], ["P", "What else?", "Gustavo"], ["S", "Contract or temporary jobs. They're easier to get, because the company isn't making a long-term decision. Many contracts become permanent.", "Ron"], ["P", "I didn't apply for contract jobs. I thought they weren't good.", "Gustavo"], ["S", "In Canada, they're a very normal way to start. Third, bridging programs. Settlement agencies and colleges have programs for newcomers in specific fields. Some of them include a work placement.", "Ron"], ["P", "What about my resume?", "Gustavo"], ["S", "Focus on transferable skills. Leading a team, managing budgets, solving problems. Those skills are the same in Brazil and Canada. And mention international clients or projects. That's an advantage, not a weakness.", "Ron"], ["P", "Gustavo, you've done great work on our social media these three months. I'm happy to be your reference. And a friend of mine runs a marketing agency. They need someone for a six-month contract. Can I send her your resume?", "Lori"], ["P", "Of course!", "Gustavo"], ["S", "Welcome to the team, Gustavo. Lori told me you're excellent.", "Manager"], ["S", "So, how's the contract?", "Ron"], ["P", "Great. And now I understand. Canadian experience isn't really about experience. It's about trust.", "Gustavo"]], "words": 291, "kind": "story", "scene": "After his third interview, Gustavo got the same answer again: \"You're very qualified, but we're looking for someone with Canadian experience.\" The next morning, he has coffee with his friend Ron.", "F": "explaining a problem, didn't, does, can, have to, should, -ed", "V": "Canadian experience, qualified, overqualified, volunteer, contract, temporary position, bridging program, settlement agency, reference, \"foot in the door,\" transferable skills", "t": [[2.0, 7.87], [8.54, 10.78], [11.0, 12.72], [12.94, 15.5], [15.72, 18.56], [18.78, 20.64], [20.86, 24.25], [24.47, 26.82], [27.04, 29.36], [30.03, 31.46], [32.13, 34.78], [35.0, 36.77], [36.99, 44.05], [44.72, 47.28], [47.95, 50.25], [50.47, 52.39], [52.61, 54.15], [54.82, 55.52], [56.19, 58.35], [58.57, 63.26], [63.48, 65.66], [66.33, 68.27], [68.49, 69.66], [70.33, 73.38], [73.6, 75.35], [75.57, 80.88], [81.1, 83.26], [83.93, 85.19], [85.86, 87.97], [88.19, 91.69], [91.91, 94.77], [94.99, 98.25], [98.47, 100.69], [101.36, 105.28], [105.5, 107.13], [107.35, 110.05], [110.27, 112.58], [112.8, 114.31], [114.98, 115.77], [116.44, 118.3], [118.52, 120.01], [120.68, 122.28], [122.95, 123.55], [123.77, 125.05], [125.27, 128.26], [128.48, 129.48]], "R": [["An interviewer says you need Canadian experience.", "Interviewer", "You're very qualified, but we need someone with Canadian experience.", "I understand. Could I start with a contract or temporary position to get my foot in the door?"], ["A friend suggests volunteering.", "Friend", "Why don't you volunteer in your field?", "That's a good idea. It could give me Canadian experience and references."]]}, {"num": 72, "title": "Getting Your Credentials Recognized", "lines": [["P", "In Canada, engineering is a regulated profession. That means you need a licence to call yourself a professional engineer. In BC, the regulator is Engineers and Geoscientists BC, or EGBC.", "Brent"], ["S", "But I already have a licence in Brazil.", "Thiago"], ["P", "I know. But each province has its own rules. It's the same for nurses, doctors, teachers, and accountants. Even electricians and plumbers.", "Brent"], ["S", "So what do I have to do?", "Thiago"], ["P", "First, you apply to EGBC. They'll assess your degree and your work experience. They want to see your university transcripts, your course descriptions, and letters from your employers in Brazil.", "Brent"], ["S", "Do they need to be translated?", "Thiago"], ["P", "Yes, by a certified translator.", "Brent"], ["S", "What happens after they assess me?", "Thiago"], ["P", "Sometimes they ask you to take extra exams, if your degree is different from a Canadian degree. You'll also need to write a professional practice exam. It's about Canadian law, ethics, and safety.", "Brent"], ["S", "And my experience?", "Thiago"], ["P", "They don't require Canadian work experience anymore, but your experience has to meet Canadian standards. You describe your work, and engineers who know it confirm your skills.", "Brent"], ["S", "Can I work while I wait?", "Thiago"], ["P", "You can work in engineering before you're licensed. You just can't sign and approve drawings yourself. Many newcomers are registered as an engineer-in-training while they finish the process.", "Brent"], ["S", "How long does all this take?", "Thiago"], ["P", "It depends. For most people I know, between one and three years.", "Brent"], ["S", "That's a long time. But I'll send my application next week and order my transcripts from Brazil.", "Thiago"], ["P", "Thiago! How's the job?", "Brent"], ["S", "Good. I'm a project coordinator at an engineering company. It isn't my old job, but my manager is a professional engineer, and she's supporting my application.", "Thiago"], ["S", "Kids! Look at this email from EGBC. \"Congratulations. You are now registered as a Professional Engineer.\"", "Thiago"], ["P", "Dad! We made you a card. It says, \"Our dad, the Canadian engineer.\"", "Daughter"]], "words": 305, "kind": "story", "scene": "Thiago was a licensed civil engineer in Brazil for twelve years. He thought he could work as an engineer in Canada right away. At a networking event, he meets an engineer named Brent.", "F": "steps in a process, first/after that, years and months, have to, can/can't, does", "V": "regulated profession, licence, licensed, credential, assessment, regulator, Engineers and Geoscientists BC (EGBC), P.Eng., engineer-in-training, professional practice exam, work experience, supervisor, \"under the supervision of\"", "t": [[2.0, 5.65], [5.87, 10.2], [10.42, 15.86], [16.53, 18.58], [19.25, 20.19], [20.41, 22.71], [22.93, 26.6], [26.82, 28.85], [29.52, 30.77], [31.44, 33.11], [33.33, 36.46], [36.68, 43.66], [44.33, 45.84], [46.51, 48.61], [49.28, 50.92], [51.59, 57.6], [57.82, 61.05], [61.27, 64.27], [64.94, 66.05], [66.72, 73.25], [73.47, 77.74], [78.41, 79.67], [80.34, 83.09], [83.31, 86.19], [86.41, 91.49], [92.16, 93.52], [94.19, 95.28], [95.5, 98.87], [99.54, 100.58], [100.8, 105.11], [105.78, 106.79], [107.01, 108.39], [109.06, 109.58], [109.8, 112.8], [113.02, 119.36], [120.03, 120.63], [120.85, 122.34], [122.56, 123.75], [123.97, 126.77], [127.44, 127.99], [128.21, 129.28], [129.5, 131.63]], "R": [["You meet an engineer at a networking event.", "Engineer", "So, are you licensed here yet?", "Not yet. I've started my credential assessment with EGBC. How long did it take you?"], ["The engineer gives you advice.", "Engineer", "You could work as an engineer-in-training while you wait.", "That's great advice. Do you know companies that hire EITs?"]]}, {"num": 73, "title": "\"Do You Have Your Certificate?\"", "lines": [["P", "This office job says, \"Required: WHMIS. Asset: First Aid.\" Even a café job asked for FOODSAFE. I have two degrees. Why do they want certificates?", "Rodrigo"], ["S", "In Canada, a degree shows what you studied. A certificate shows you have a specific skill, and that you know the Canadian rules. Employers love them because they're quick to check.", "Stacey"], ["P", "What's WHMIS?", "Rodrigo"], ["S", "It's about hazardous materials at work, like chemicals and cleaning products. It's required in many workplaces. It's an online course, only a couple of hours.", "Stacey"], ["P", "And FOODSAFE?", "Rodrigo"], ["S", "That's for anyone who works with food in BC. If you want to serve alcohol, you also need Serving It Right.", "Stacey"], ["P", "What does \"asset\" mean in a job posting?", "Rodrigo"], ["S", "\"Required\" means you must have it. \"Asset\" means it's nice to have. It isn't required, but it helps you stand out.", "Stacey"], ["P", "Which certificates should I get?", "Rodrigo"], ["S", "It depends on your field. In construction or warehouses, people get forklift or traffic control certification. In IT, there are certifications from Microsoft and Amazon. In HR, there's the CPHR. For project management, the PMP is very well known.", "Stacey"], ["P", "I did my WHMIS course online on Sunday afternoon. It took two hours and cost less than fifty dollars.", "Rodrigo"], ["P", "Congratulations on finishing the two-day first aid course. Your certificate expires in three years. Don't forget to renew it.", "Instructor"], ["P", "I studied for the PMP every night for three months, and I passed on my first try.", "Rodrigo"], ["S", "I see you have your PMP and your first aid. That's great. Most applicants don't.", "Manager"], ["P", "Stacey, you were right. They noticed the certificates before they noticed my MBA.", "Rodrigo"], ["S", "Here, a piece of paper from a weekend course can open a door.", "Stacey"]], "words": 275, "kind": "story", "scene": "Rodrigo has a bachelor's degree in business and an MBA from Brazil. But almost every job posting in Vancouver asks for a certificate. He talks to his friend Stacey.", "F": "required vs. asset, costs, hours, years, do/does/don't, did, have to, can, -ed", "V": "degree, certificate, certification, required, asset, \"nice to have,\" WHMIS, first aid, FOODSAFE, Serving It Right, forklift certification, traffic control, PMP (Project Management Professional), CPHR, IT certifications, expire, renew, online course, \"Is it recognized in B.C.?\"", "t": [[2.0, 4.99], [5.21, 6.38], [6.6, 8.82], [9.04, 10.21], [10.43, 11.97], [12.64, 15.07], [15.29, 19.77], [19.99, 22.59], [23.26, 24.56], [25.23, 29.42], [29.64, 31.66], [31.88, 34.42], [35.09, 36.01], [36.68, 39.32], [39.54, 42.87], [43.54, 45.63], [46.3, 48.22], [48.44, 50.26], [50.48, 53.01], [53.68, 55.22], [55.89, 57.28], [57.5, 62.7], [62.92, 66.8], [67.02, 69.22], [69.44, 72.79], [73.46, 77.22], [77.44, 80.15], [80.82, 84.51], [84.73, 87.14], [87.36, 88.83], [89.5, 94.66], [95.33, 97.83], [98.05, 98.94], [99.16, 100.57], [101.24, 102.5], [102.72, 106.05], [106.72, 110.11]], "R": [["A friend asks about a job posting.", "Friend", "Does the job need a certificate?", "Yes, it asks for first aid and WHMIS. They're short courses, so I'll take them this month."], ["A manager asks about your certificates.", "Manager", "Do you have your FOODSAFE certificate?", "Not yet, but I'm booked for the course on Saturday."]]}, {"num": 74, "title": "Resume and Cover Letter Tips", "lines": [["P", "First, the photo. In Canada, you don't put a photo on your resume.", "Ron"], ["S", "Really? In Brazil, everyone does.", "Bruno"], ["P", "Here, employers don't want it. The same goes for your age, your date of birth, and your marital status. Take them all out. In BC, employers can't make hiring decisions based on age or marital status. It's against human rights law.", "Ron"], ["S", "What about my CPF number?", "Bruno"], ["P", "Take that out too. Just put your city, your phone number, your email, and your LinkedIn profile.", "Ron"], ["P", "Now your work experience. Your resume says, \"Responsible for managing projects.\" Canadian employers want accomplishments. Use action verbs and numbers. Did you save your company money?", "Ron"], ["S", "I did. I reduced costs on one project by about thirty percent.", "Bruno"], ["P", "Perfect. Write that: \"Reduced project costs by thirty percent.\" Start every line with a verb in the past tense: managed, increased, reduced, trained, led, developed.", "Ron"], ["S", "How long should my resume be?", "Bruno"], ["P", "Two pages maximum. And add your volunteer experience. Canadians value that.", "Ron"], ["S", "Should I change my resume for every job?", "Bruno"], ["P", "Yes. Many companies use an applicant tracking system, a computer program that reads your resume first. If it doesn't find the keywords from the job posting, a person never sees it.", "Ron"], ["P", "Did you send cover letters?", "Ron"], ["S", "No. In Brazil, we don't usually write them.", "Bruno"], ["P", "Here, you need one. One page, three or four short paragraphs. Find the hiring manager's name. In the first paragraph, say which job you're applying for. In the second, explain how your experience matches the job. In the third, say why you want to work there.", "Ron"], ["S", "That's a lot of work.", "Bruno"], ["P", "It is. But ten good applications are better than a hundred bad ones.", "Ron"], ["S", "Ron, it's Bruno. I rewrote my resume that night, and two weeks later, I got my first interview!", "Bruno"], ["P", "Great news. Now let's get you ready for it.", "Ron"]], "words": 304, "kind": "story", "scene": "Bruno was an engineer in Brazil for twelve years. In Vancouver, he applied for twenty jobs in one month and didn't get a single interview. At a coffee shop, he meets Ron, who helps newcomers with their resumes.", "F": "-ed action verbs (managed, increased, reduced, trained, created, developed, led), don't/doesn't, should, can't, did/didn't, numbers and percentages", "V": "resume, cover letter, job posting, hiring manager, tailor, keywords, applicant tracking system, accomplishments, action verbs, volunteer experience, human rights, discrimination", "t": [[2.0, 3.32], [3.54, 6.66], [7.33, 7.97], [8.19, 9.66], [10.33, 12.19], [12.41, 16.93], [17.15, 18.51], [18.73, 24.58], [24.8, 26.78], [27.45, 29.07], [29.74, 31.15], [31.37, 35.92], [36.59, 38.36], [38.58, 42.37], [42.59, 45.15], [45.37, 47.44], [47.66, 49.69], [50.36, 50.98], [51.2, 54.55], [55.22, 56.09], [56.31, 59.66], [59.88, 66.58], [67.25, 68.91], [69.58, 71.23], [71.45, 73.73], [73.95, 75.68], [76.35, 78.87], [79.54, 80.24], [80.46, 86.94], [87.16, 91.79], [92.46, 94.3], [94.97, 95.52], [95.74, 97.81], [98.48, 99.89], [100.11, 102.78], [103.0, 105.0], [105.22, 108.74], [108.96, 112.76], [112.98, 115.41], [116.08, 117.17], [117.84, 118.74], [118.96, 122.8], [123.47, 124.55], [124.77, 129.42], [130.09, 131.12], [131.34, 133.32]], "R": [["Someone gives you resume advice.", "Advisor", "Tailor your resume for each job posting.", "Okay. Should I use the keywords from the posting?"], ["The advisor asks about your experience.", "Advisor", "What's your biggest accomplishment?", "I managed a team of eight engineers and finished a big project two months early."]]}, {"num": 75, "title": "The Informational Interview", "lines": [["P", "This week, I want you to ask three people for an informational interview.", "Sheila"], ["S", "What's an informational interview?", "Juliana"], ["P", "It's a short conversation with someone who works in your field. You ask them questions about their job, their company, and their industry. It's not a job interview. You're not asking for a job. You're asking for advice.", "Sheila"], ["S", "Why would a stranger talk to me?", "Juliana"], ["P", "Many Canadians are happy to help, if you're polite and keep it short.", "Sheila"], ["S", "I found an HR manager on LinkedIn and wrote her a message. \"Hi Jill, I'm a human resources professional who recently moved to Vancouver from Brazil. I'd love to learn more about HR in the tech industry. Would you be open to a twenty-minute coffee chat sometime in the next few weeks? Thank you for your time.\"", "Juliana"], ["P", "Perfect. Did she reply?", "Sheila"], ["S", "She did! Thursday at four, at the café on the corner of Hastings and Richards.", "Juliana"], ["P", "Hi, you must be Juliana. Nice to meet you.", "Jill"], ["S", "Thank you so much for meeting me. How did you get into HR in tech?", "Juliana"], ["P", "By accident, really. I started in recruiting, and I loved it.", "Jill"], ["S", "What does a typical day look like for you?", "Juliana"], ["P", "Lots of meetings, and lots of people problems. That's the fun part.", "Jill"], ["S", "What skills are most important in your field right now?", "Juliana"], ["P", "One tip. In Canada, HR is very focused on employment law. Take a short course on BC employment standards. It'll help you a lot in interviews.", "Jill"], ["S", "That's very helpful. I don't want to take too much of your time. My last question: is there anyone else you'd recommend I talk to?", "Juliana"], ["P", "Actually, yes. My friend Stuart is an HR director at a big company downtown. I'll introduce you by email.", "Jill"], ["S", "That evening, I sent Jill a thank-you note. I told her I've already signed up for the employment law course.", "Juliana"], ["S", "Hi Juliana, it's Stuart. We have an opening on my team. It isn't posted yet. Would you like to apply?", "Stuart"], ["S", "Sheila was right. The hidden job market is real.", "Juliana"]], "words": 336, "kind": "story", "scene": "Juliana is an HR professional from Brazil. Her WorkBC counsellor, Sheila, gives her an assignment.", "F": "polite requests (would you be willing to, could I ask), questions about careers, did, does, can, -ed", "V": "informational interview, reach out, \"I'd love to learn more about...,\" \"Would you be open to a 20-minute coffee chat?\", career path, industry, advice, \"Is there anyone else you'd recommend I talk to?\", thank-you note", "t": [[2.0, 5.86], [6.53, 8.2], [8.87, 11.98], [12.2, 16.27], [16.49, 17.95], [18.17, 19.64], [19.86, 21.29], [21.96, 23.54], [24.21, 27.92], [28.59, 32.15], [32.37, 37.81], [38.03, 40.95], [41.17, 45.14], [45.36, 46.53], [47.2, 48.01], [48.23, 49.34], [50.01, 50.72], [50.94, 54.56], [55.23, 56.86], [57.08, 58.16], [58.83, 60.5], [60.72, 62.64], [63.31, 64.55], [64.77, 66.94], [67.61, 69.62], [70.29, 72.95], [73.17, 74.3], [74.97, 77.7], [78.37, 79.16], [79.38, 82.61], [82.83, 85.68], [85.9, 87.63], [88.3, 89.5], [89.72, 91.74], [91.96, 95.63], [96.3, 97.31], [97.53, 101.26], [101.48, 103.1], [103.77, 105.99], [106.21, 109.56], [110.23, 112.21], [112.43, 114.42], [114.64, 116.3], [116.52, 118.12], [118.79, 119.77], [119.99, 121.78]], "R": [["You're writing to someone for an informational interview.", "Contact", "Hi! How can I help you?", "Hi, I'm new to Vancouver and work in HR. Would you be open to a twenty-minute coffee chat?"], ["The coffee chat is ending.", "Contact", "Is there anything else I can help with?", "Is there anyone else you think I should talk to?"]]}, {"num": 76, "title": "Networking Night", "lines": [["P", "Look for a small group of two or three people, or someone standing alone. Walk over, smile, and introduce yourself. And ask follow-up questions. People love to talk about themselves.", "Ron"], ["S", "Hi, mind if I join you? I don't know anyone here.", "Beatriz"], ["P", "Neither do I. I'm Krista.", "Krista"], ["S", "Nice to meet you, Krista. What brings you here tonight?", "Beatriz"], ["P", "My company just moved to Vancouver from Calgary, so I'm trying to meet people. How about you?", "Krista"], ["S", "I moved here from Brazil last year. I'm a civil engineer, and I'm looking for my next job.", "Beatriz"], ["P", "Oh, nice! What kind of projects do you work on?", "Krista"], ["S", "Mostly bridges and roads. What do you do?", "Beatriz"], ["P", "I'm in environmental engineering. I work on water treatment projects.", "Krista"], ["S", "That's interesting. How did you get into that?", "Beatriz"], ["P", "I grew up on a farm in Alberta, and water was always a big problem there. So I guess it was natural.", "Krista"], ["S", "What's the biggest difference between working in Calgary and here?", "Beatriz"], ["P", "Honestly? The rain.", "Krista"], ["S", "Krista! I didn't know you'd be here.", "Brian"], ["P", "Brian! This is my new friend, Beatriz. She's a civil engineer from Brazil. Brian works for the city. You two should talk.", "Krista"], ["S", "Nice to meet you, Brian.", "Beatriz"], ["S", "Nice to meet you too. Actually, we're starting a new transit project, and the city is hiring engineers.", "Brian"], ["S", "Can I connect with you on LinkedIn?", "Beatriz"], ["S", "Of course. Here's my QR code.", "Brian"], ["S", "Well, it was great chatting with you both. I'll let you mingle. I'm going to grab something to drink.", "Beatriz"], ["P", "Great meeting you too!", "Krista"], ["S", "Ron! On the bus home, I checked my phone. Brian already sent me a message: \"Here's the link to the job posting I mentioned. Good luck!\"", "Beatriz"], ["P", "See? One conversation at a time.", "Ron"]], "words": 282, "kind": "story", "scene": "Beatriz, a civil engineer from Brazil, is at her first networking event, a meetup for engineers at a hotel on Burrard Street. She doesn't know anyone. Before the event, she calls her friend Ron for advice.", "F": "starting, continuing, and ending a conversation with a stranger, do, did/didn't, how/what questions, -ed", "V": "networking event, \"Mind if I join you?\", \"What brings you here?\", \"So, what do you do?\", \"How did you get into that?\", \"That's interesting. Tell me more,\" follow-up question, \"Can I connect with you on LinkedIn?\", \"It was great chatting with you,\" \"I'll let you mingle\"", "t": [[2.0, 6.5], [6.72, 9.2], [9.42, 11.44], [11.66, 13.9], [14.57, 16.24], [16.46, 17.72], [18.39, 19.41], [19.63, 20.55], [21.22, 22.6], [22.82, 24.21], [24.88, 29.19], [29.41, 30.45], [31.12, 32.98], [33.2, 36.38], [37.05, 37.97], [38.19, 40.0], [40.67, 42.23], [42.45, 43.43], [44.1, 46.13], [46.35, 48.37], [49.04, 50.0], [50.22, 51.52], [52.19, 56.37], [56.59, 58.11], [58.78, 62.0], [62.67, 63.52], [63.74, 64.55], [65.22, 65.89], [66.11, 67.36], [68.03, 68.82], [69.04, 70.94], [71.16, 73.13], [73.35, 74.84], [75.06, 76.19], [76.86, 78.2], [78.87, 80.05], [80.27, 85.05], [85.72, 87.55], [88.22, 88.95], [89.17, 90.42], [91.09, 93.08], [93.3, 94.3], [94.52, 96.44], [97.11, 98.37], [99.04, 99.59], [99.81, 101.86], [102.08, 106.88], [107.1, 107.83], [108.5, 109.2], [109.42, 111.32]], "R": [["You're at a networking event and don't know anyone.", "Engineer", "Hi! What brings you here?", "I'm a civil engineer, new to Vancouver. I'm hoping to meet people in the industry. Mind if I join you?"], ["Someone tells you about their job.", "Engineer", "I work on bridge projects for the city.", "That's interesting! How did you get into that?"]]}, {"num": 77, "title": "The Recruiter Phone Screen", "lines": [["P", "Hello?", "Renata"], ["S", "Hi, this is Jason Park. I'm a recruiter with Pacific Tech Solutions. You applied for our IT support analyst position. Is now a good time to talk for about fifteen minutes?", "Jason"], ["P", "Yes, now is fine. Just a second, I'm turning off the stove. Okay, I'm ready.", "Renata"], ["S", "Great. This is just a quick phone screen. I have a few questions, and then you can ask me anything. First, are you legally entitled to work in Canada?", "Jason"], ["P", "Yes, I'm a permanent resident.", "Renata"], ["S", "Perfect. Can you tell me a little about your experience?", "Jason"], ["P", "I worked in IT support for eight years in Brazil, mostly for a bank. I managed a team of four technicians, and I supported about six hundred users.", "Renata"], ["S", "Great. The role is hybrid, three days in the office downtown and two days from home. Does that work for you?", "Jason"], ["P", "Yes, that works.", "Renata"], ["S", "What's your availability? If we offered you the job, when could you start?", "Jason"], ["P", "I'm available right away.", "Renata"], ["S", "Good. What are your salary expectations?", "Jason"], ["P", "Based on my research, between sixty-five and seventy-five thousand dollars a year.", "Renata"], ["S", "Okay. That's within our range. Do you have any experience with Microsoft 365 and ticketing systems?", "Jason"], ["P", "Yes, I used both every day in my last job.", "Renata"], ["S", "Great. The next step is a video interview with the hiring manager, Linda. It'll be about forty-five minutes. Are you available this Friday at ten?", "Jason"], ["P", "Yes, I am.", "Renata"], ["S", "I'll send you a calendar invite with the link. Do you have any questions for me?", "Jason"], ["P", "Yes. What's the team like?", "Renata"], ["S", "It's a team of eight. They're friendly, and they work well together.", "Jason"], ["P", "And what does success look like in the first three months?", "Renata"], ["S", "That's a great question. I'll make sure Linda talks about that on Friday.", "Jason"], ["P", "Thank you, Jason. I'll look for your invite.", "Renata"], ["P", "You look happy. Who was on the phone?", "Paulo"], ["P", "A recruiter. I have a video interview on Friday!", "Renata"], ["P", "Already? You only applied last week.", "Paulo"], ["P", "In Canada, they call you when you least expect it. Always answer your phone. But my lunch is cold now.", "Renata"], ["P", "I don't think you care.", "Paulo"], ["P", "I don't!", "Renata"]], "words": 347, "kind": "story", "scene": "Renata is cooking lunch when her phone rings. It's a number she doesn't know.", "F": "quick answers on the phone, availability, numbers (salary range, notice period), are you/do you/can you questions, will", "V": "recruiter, phone screen, \"Is now a good time?\", legally entitled to work in Canada, work permit, permanent resident, availability, notice period, salary expectations, \"on-site,\" \"hybrid,\" next round, hiring manager", "t": [[2.0, 2.64], [3.31, 5.27], [5.49, 8.07], [8.29, 11.75], [11.97, 15.36], [16.03, 17.14], [17.36, 19.54], [19.76, 20.85], [21.52, 22.26], [22.48, 24.51], [24.73, 28.31], [28.53, 31.75], [32.42, 34.02], [34.69, 35.57], [35.79, 38.39], [39.06, 43.33], [43.55, 48.16], [48.83, 49.57], [49.79, 54.7], [54.92, 56.33], [57.0, 57.91], [58.58, 60.1], [60.32, 63.2], [63.87, 65.26], [65.93, 66.63], [66.85, 69.05], [69.72, 74.52], [75.19, 76.1], [76.32, 77.8], [78.02, 83.12], [83.79, 86.35], [87.02, 87.76], [87.98, 92.08], [92.3, 94.43], [94.65, 96.98], [97.65, 98.48], [99.15, 101.88], [102.1, 104.06], [104.73, 105.33], [105.55, 106.62], [107.29, 108.8], [109.02, 111.54], [112.21, 114.7], [115.37, 116.93], [117.15, 119.9], [120.57, 121.62], [121.84, 123.1], [123.77, 124.66], [124.88, 125.91], [126.58, 127.45], [127.67, 129.46], [130.13, 130.82], [131.04, 132.47], [133.14, 135.61], [135.83, 137.09], [137.31, 138.76], [139.43, 140.48], [141.15, 141.85]], "R": [["A recruiter calls you unexpectedly.", "Recruiter", "Hi, this is Jason from TalentWorks. Is now a good time?", "Actually, I'm in the middle of something. Could I call you back in thirty minutes?"], ["The recruiter asks about salary.", "Recruiter", "What are your salary expectations?", "Based on my research, I'm looking for between seventy and eighty thousand. Is that in your range?"]]}, {"num": 78, "title": "The Job Interview", "lines": [["P", "They'll ask behavioural questions. Questions that start with \"Tell me about a time when...\" Use the STAR method: Situation, Task, Action, Result.", "Ron"], ["S", "Hi, I'm Barbara Clark, the hiring manager. This is Mike Dawson from our engineering team. Thanks for coming in.", "Barbara"], ["P", "Thank you for having me.", "Bruno"], ["S", "So, to start, tell us a little about yourself.", "Barbara"], ["P", "I'm a civil engineer with twelve years of experience in Brazil. I managed construction projects for a large company in São Paulo, mostly roads and bridges. I moved to Vancouver last year, and I'm looking for a role where I can use my project management experience.", "Bruno"], ["S", "Why do you want to work here?", "Barbara"], ["P", "I read about your new bridge in Surrey. I worked on similar projects, and I'd like to contribute here.", "Bruno"], ["S", "Tell me about a time when a project was behind schedule. What did you do?", "Mike"], ["P", "In 2021, we were building a road, and heavy rain delayed us by three weeks. My task was to finish on time. I met with the team, changed the schedule, and added a second shift. As a result, we finished only two days late, and we stayed within budget.", "Bruno"], ["S", "What's your greatest weakness?", "Mike"], ["P", "My English isn't perfect yet, especially on the phone. So I'm taking a class, and I practise every day.", "Bruno"], ["S", "That's an honest answer. What are your salary expectations?", "Barbara"], ["P", "Based on my research, between eighty-five and ninety-five thousand dollars a year.", "Bruno"], ["S", "That's within our range. Do you have any questions for us?", "Barbara"], ["P", "What does a typical day look like in this role? And what's the next step in the hiring process?", "Bruno"], ["S", "About half on site, half in the office.", "Mike"], ["S", "And we'll make a decision by the end of next week.", "Barbara"], ["P", "Did you send a thank-you email?", "Ron"], ["P", "That same afternoon. A short one, to Barbara and Mike.", "Bruno"], ["S", "Hi Bruno, it's Barbara Clark. We'd like to offer you the position.", "Barbara"], ["P", "Thank you so much. I'm very happy to hear that.", "Bruno"], ["S", "Wonderful. I'll send you the offer letter by email today.", "Barbara"]], "words": 332, "kind": "story", "scene": "Two weeks after rewriting his resume, Bruno has an interview for a project engineer position in Richmond. Ron helped him prepare.", "F": "interview questions and answers, -ed verbs, did, do/does, would, salary numbers, years", "V": "hiring manager, \"Tell me about yourself,\" behavioural question, \"Tell me about a time when...,\" STAR method (Situation, Task, Action, Result), weakness, salary expectations, \"Do you have any questions for us?\", thank-you email, offer letter", "t": [[2.0, 4.09], [4.31, 7.62], [7.84, 11.85], [12.52, 15.25], [15.47, 18.14], [18.36, 19.68], [20.35, 21.59], [22.26, 24.75], [25.42, 29.11], [29.33, 35.41], [35.63, 42.07], [42.74, 44.17], [44.84, 46.66], [46.88, 50.16], [50.83, 54.12], [54.34, 55.32], [55.99, 60.77], [60.99, 62.67], [62.89, 66.52], [66.74, 70.69], [71.36, 72.76], [73.43, 76.36], [76.58, 79.27], [79.94, 81.28], [81.5, 83.33], [84.0, 88.78], [89.45, 90.73], [90.95, 92.7], [93.37, 95.63], [95.85, 98.05], [98.72, 100.77], [101.44, 104.08], [104.75, 106.7], [107.37, 108.56], [108.78, 110.55], [111.22, 113.23], [113.45, 115.15], [115.82, 116.78], [117.0, 118.47], [119.14, 119.98], [120.2, 122.65]], "R": [["An interviewer starts the interview.", "Interviewer", "Tell me about yourself.", "I'm a project engineer with twelve years of experience. In Brazil, I led projects in construction and infrastructure."], ["The interviewer asks a behavioural question.", "Interviewer", "Tell me about a time when you solved a problem.", "On one project, a supplier was late. I found a new supplier, and we finished on time."]]}, {"num": 79, "title": "Negotiating a Job Offer", "lines": [["P", "We'd like to offer you the project engineer position. The salary is eighty-five thousand dollars a year, with benefits and two weeks of vacation. We'd like you to start on March 2nd.", "Barbara"], ["S", "Thank you so much, Barbara. I'm very excited about this offer. Could you send it to me in writing? I'd like to review it, and I'll get back to you by Wednesday.", "Bruno"], ["P", "Of course. I'll email it this afternoon.", "Barbara"], ["S", "Ron, I almost said yes on the phone. But you told me never to accept on the phone. Is it normal to negotiate here?", "Bruno"], ["P", "It's normal. Most employers expect it. Just be polite and give a reason. What's the market salary for your role?", "Ron"], ["S", "Between eighty-five and ninety-five thousand.", "Bruno"], ["P", "So they offered the bottom of the range. You can ask for more. And ask about vacation too. Two weeks is the legal minimum after one year. Many companies give three.", "Ron"], ["S", "Hi Barbara, thank you again for the offer. I really want to join your team. I've reviewed the offer, and I'd like to discuss two things. First, based on my twelve years of experience and the market for this role, would there be any flexibility on the salary? I was hoping for ninety-two thousand.", "Bruno"], ["P", "I'll need to talk to our director. What's the second thing?", "Barbara"], ["S", "Would it be possible to have three weeks of vacation? My family is in Brazil, and it's a long trip.", "Bruno"], ["P", "That's a reasonable request. Let me get back to you this afternoon.", "Barbara"], ["P", "Good news. We can't do ninety-two, but we can offer eighty-nine thousand. And we can give you three weeks of vacation starting in your first year.", "Barbara"], ["S", "Thank you, Barbara. That sounds great. I'm happy to accept.", "Bruno"], ["P", "Wonderful. I'll send you an updated offer letter today. Please sign it and send it back.", "Barbara"], ["P", "Did they say yes?", "Ron"], ["S", "Almost. Four thousand dollars more, and an extra week of vacation. Just for asking politely.", "Bruno"]], "words": 319, "kind": "story", "scene": "On Monday, Barbara Clark calls Bruno with the job offer.", "F": "polite negotiation (would, could, is there any flexibility), salary and vacation numbers, did, can/can't, will", "V": "job offer, offer letter, salary, base salary, benefits, vacation, flexibility, counteroffer, start date, \"Let me get back to you,\" in writing, accept, decline", "t": [[2.0, 4.69], [4.91, 10.03], [10.25, 12.34], [13.01, 14.4], [14.62, 16.43], [16.65, 18.14], [18.36, 21.37], [22.04, 22.94], [23.16, 24.8], [25.47, 27.32], [27.54, 29.85], [30.07, 31.8], [32.47, 33.6], [33.82, 35.69], [35.91, 37.94], [38.16, 40.36], [41.03, 43.4], [44.07, 46.31], [46.53, 48.11], [48.33, 50.29], [50.51, 53.43], [53.65, 55.25], [55.92, 58.08], [58.3, 59.85], [60.07, 63.0], [63.22, 69.98], [70.2, 72.22], [72.89, 74.54], [74.76, 76.06], [76.73, 79.42], [79.64, 82.24], [82.91, 84.59], [84.81, 86.73], [87.4, 88.28], [88.5, 91.93], [92.15, 95.76], [96.43, 97.41], [97.63, 98.65], [98.87, 100.07], [100.74, 101.57], [101.79, 104.14], [104.36, 106.06], [106.73, 108.08], [108.75, 109.47], [109.69, 113.04], [113.26, 114.69]], "R": [["You get a job offer on the phone.", "Hiring manager", "We'd like to offer you the position.", "Thank you, that's great news! Could you send me the offer in writing?"], ["You want time to think.", "Hiring manager", "What do you think of the salary?", "Thank you. Let me get back to you by Friday."]]}, {"num": 80, "title": "Rejections and Following Up", "lines": [["P", "\"Thank you for your interest in the Marketing Coordinator position. After careful consideration, we've decided to move forward with other candidates. We'll keep your resume on file for future opportunities.\" It's my fourth rejection this month. It still hurts.", "Camila"], ["S", "I'm sorry. Now, you should reply. A short, professional reply. Thank them, and ask for feedback.", "Ron"], ["P", "Won't that look desperate?", "Camila"], ["S", "Not at all. It shows you're professional. And sometimes the person they chose doesn't work out, and they call the second choice.", "Ron"], ["P", "Okay. \"Dear Deb, thank you for letting me know, and thank you for the opportunity to interview with your team. If you have a moment, I'd really appreciate any feedback that could help me in future interviews. I hope our paths cross again. Best regards.\"", "Camila"], ["S", "Perfect.", "Ron"], ["P", "Thank you for your kind message. It was a very close decision. You were one of our top two candidates. The other candidate had more experience with Canadian social media tools. If you get some experience with those, you'd be a very strong candidate.", "Deb"], ["P", "Ron, that's the most useful feedback I've ever received. I signed up for a free online course this week.", "Camila"], ["S", "Good. And if a company doesn't answer at all, wait a week after the date they gave you. Then send a polite email: \"I'm writing to follow up on my interview on March 3rd. I'm still very interested in the position. Is there any update on the timeline?\"", "Ron"], ["P", "Hi Camila! The person we hired for the coordinator role has decided to move to Toronto. Are you still interested?", "Deb"], ["P", "Ron, I read it three times. Then I replied: \"Yes. Absolutely.\"", "Camila"]], "words": 269, "kind": "story", "scene": "Two weeks after her final interview for a marketing coordinator job, Camila gets an email with the subject \"Your application.\" She reads it to her friend Ron.", "F": "professional emails, polite follow-up, was, would, will, dates", "V": "rejection email, \"After careful consideration,\" \"We've decided to move forward with other candidates,\" \"We'll keep your resume on file,\" follow up, \"I'm writing to follow up on...,\" feedback, \"Thank you for the opportunity,\" resilience", "t": [[2.0, 6.1], [6.32, 11.22], [11.44, 14.88], [15.1, 17.12], [17.34, 18.33], [19.0, 20.13], [20.35, 21.92], [22.14, 24.13], [24.35, 26.38], [27.05, 28.35], [29.02, 30.23], [30.45, 32.1], [32.32, 37.41], [38.08, 38.79], [39.01, 44.77], [44.99, 50.64], [50.86, 52.53], [52.75, 53.81], [54.48, 55.36], [56.03, 57.69], [57.91, 59.47], [59.69, 61.59], [61.81, 66.22], [66.44, 70.11], [70.78, 74.07], [74.29, 76.95], [77.62, 78.33], [78.55, 83.31], [83.53, 88.97], [89.19, 91.81], [92.03, 94.21], [94.88, 95.79], [96.01, 100.49], [100.71, 102.01], [102.68, 104.35], [104.57, 106.17], [106.39, 107.41]], "R": [["You get a rejection email.", "Friend", "What did the email say?", "They said they decided to move forward with other candidates. But they'll keep my resume on file."], ["You write a follow-up.", "Friend", "What will you write back?", "\"Thank you for the opportunity. I'd love to be considered for future positions.\""]]}, {"num": 81, "title": "The Survival Job", "lines": [["P", "We need money now.", "Wife"], ["S", "I know. I got a job at a warehouse in Richmond, packing boxes. The night shift, from ten at night to six thirty in the morning.", "Marcelo"], ["P", "Hi, I'm Jeff. Grab the order, pack it, scan it, and put it on this belt. Try to do about eighty an hour.", "Jeff"], ["P", "It's four in the morning. Take a break. First job in Canada?", "Jeff"], ["S", "Yes. In Brazil, I was a dentist.", "Marcelo"], ["P", "No way. Me too, kind of. I was a pharmacist in the Philippines. I worked here for a year and a half while I did my exams. Now I work at a pharmacy three days a week, and here two nights, until I finish my last exam.", "Jeff"], ["S", "Does it get easier?", "Marcelo"], ["P", "The work doesn't get easier. But you get used to it. The important thing is to keep your eye on the goal. This is a survival job. It pays the bills. It's temporary.", "Jeff"], ["S", "Sometimes I feel embarrassed. Twenty years of studying and working, and now I'm packing boxes.", "Marcelo"], ["P", "Don't. Everyone in this lunchroom has a story. That guy over there was an engineer in Iran. She was a lawyer in Ukraine. Nobody here thinks less of you.", "Jeff"], ["S", "Thanks, Jeff. That helps.", "Marcelo"], ["P", "How are you managing everything?", "Wife"], ["S", "I made a schedule. I sleep in the morning, study from two to seven, spend time with you and the kids, and go to work at ten. On my days off, I study more.", "Marcelo"], ["P", "It's the hardest year of our lives.", "Wife"], ["S", "But it's a stepping stone. Not my career.", "Marcelo"], ["P", "Twenty months later, and look at you. To the new Canadian dentist!", "Jeff"], ["S", "Thank you for everything, Jeff. You helped me more than you know.", "Marcelo"], ["P", "Just remember us when we need a cleaning.", "Jeff"]], "words": 290, "kind": "story", "scene": "Four months after arriving in Canada, Marcelo and his wife's savings are almost gone. Marcelo was a dentist in Brazil, but he needs to pass several exams before he can work as a dentist here.", "F": "talking about difficult situations, was/wasn't, did, have to, will, -ed", "V": "survival job, shift, minimum wage, part-time, overqualified, \"pay the bills,\" \"It's temporary,\" stepping stone, schedule, \"keep your eye on the goal,\" career", "t": [[2.0, 3.09], [3.76, 4.44], [4.66, 8.12], [8.34, 11.6], [12.27, 13.21], [13.43, 16.33], [16.55, 18.13], [18.8, 19.87], [20.09, 20.92], [21.14, 22.4], [23.07, 23.64], [23.86, 25.42], [26.09, 26.79], [27.01, 27.97], [28.19, 30.14], [30.36, 33.41], [33.63, 39.17], [39.84, 40.87], [41.54, 42.92], [43.14, 44.3], [44.52, 47.14], [47.36, 48.75], [48.97, 50.01], [50.23, 51.19], [51.86, 53.4], [53.62, 57.52], [58.19, 58.75], [58.97, 60.93], [61.15, 63.41], [63.63, 65.02], [65.24, 66.88], [67.55, 68.47], [68.69, 69.45], [70.12, 71.81], [72.48, 73.61], [73.83, 79.76], [79.98, 81.71], [82.38, 84.28], [84.95, 86.31], [86.53, 87.54], [88.21, 90.02], [90.24, 91.71], [92.38, 93.96], [94.18, 95.61], [96.28, 98.31]], "R": [["A friend asks about your new job.", "Friend", "Are you working in your field?", "Not yet. I'm working in a café for now. It pays the bills while I study for my exams."], ["A manager asks about your schedule.", "Manager", "Can you work weekend shifts?", "Yes, I can work Saturdays and Sundays."]]}, {"num": 82, "title": "Your First Pay Stub", "lines": [["P", "Can you help me understand my pay stub? I think there's a mistake.", "Priscila"], ["S", "Sure. Let's look at it together. This is your pay period. You're paid biweekly, so every two weeks. This number is your gross pay. That's your full salary for the two weeks, before deductions.", "Lorraine"], ["P", "And this number at the bottom?", "Priscila"], ["S", "That's your net pay, what you actually receive after deductions.", "Lorraine"], ["P", "Why is the difference so big?", "Priscila"], ["S", "Let's go through them. First, income tax. There's federal tax, for the Government of Canada, and provincial tax, for BC. Together, they're the biggest deduction.", "Lorraine"], ["P", "Okay. And CPP?", "Priscila"], ["S", "That's the Canada Pension Plan. It's money for your retirement. You pay a percentage of your salary, and the company pays the same amount. When you retire, you'll get a monthly pension.", "Lorraine"], ["P", "And EI?", "Priscila"], ["S", "Employment Insurance. If you lose your job, or if you have a baby, EI can pay part of your salary for a while.", "Lorraine"], ["P", "So it's not lost money.", "Priscila"], ["S", "Exactly. It's protection. This last one is for your health and dental benefits. You pay a small part, and the company pays the rest.", "Lorraine"], ["P", "Why does this line say vacation pay?", "Priscila"], ["S", "That's for our hourly staff. In BC, hourly employees get at least four percent vacation pay. You're on a salary, so you get paid vacation days instead.", "Lorraine"], ["P", "And what if I work on a holiday?", "Priscila"], ["S", "If you work on a statutory holiday, like Canada Day, you get paid more, time and a half. And overtime is paid for anything over eight hours a day or forty hours a week.", "Lorraine"], ["P", "In Brazil, we have a thirteenth salary in December. Do you have that here?", "Priscila"], ["S", "Ha! No, sorry. No thirteenth salary in Canada.", "Lorraine"], ["P", "That's the saddest news of all.", "Priscila"], ["P", "Tiago, the money isn't gone. Part of it goes to our retirement, part to insurance, and part to taxes.", "Priscila"], ["P", "And when we file our taxes in April?", "Tiago"], ["P", "If we paid too much, we'll get some back.", "Priscila"], ["P", "Then I'll wait for April.", "Tiago"]], "words": 328, "kind": "story", "scene": "Two weeks after starting her new job, Priscila gets her first pay. She's excited, until she looks at her bank account. The next day, she goes to Lorraine in HR.", "F": "payroll numbers, percentages, does, why/what questions, -ed", "V": "pay stub, pay period, biweekly, gross pay, net pay, deductions, income tax (federal and provincial), CPP (Canada Pension Plan), EI (Employment Insurance), benefits, vacation pay, statutory holiday, overtime, direct deposit", "t": [[2.0, 4.26], [4.48, 5.78], [6.45, 7.11], [7.33, 8.7], [8.92, 10.35], [10.57, 12.83], [13.05, 14.69], [14.91, 17.94], [18.61, 20.08], [20.75, 24.25], [24.92, 26.57], [27.24, 28.43], [28.65, 30.14], [30.36, 34.76], [34.98, 36.92], [37.59, 38.29], [38.51, 39.58], [40.25, 41.94], [42.16, 43.78], [44.0, 47.99], [48.21, 50.64], [51.31, 51.97], [52.64, 54.05], [54.27, 59.28], [59.95, 61.38], [62.05, 62.97], [63.19, 64.21], [64.43, 67.35], [67.57, 70.37], [71.04, 73.28], [73.95, 75.44], [75.66, 79.76], [79.98, 83.24], [83.91, 85.73], [86.4, 91.6], [91.82, 96.64], [97.31, 100.09], [100.31, 101.46], [102.13, 102.77], [102.99, 103.97], [104.19, 106.15], [106.82, 108.44], [109.11, 110.76], [110.98, 115.5], [116.17, 118.09], [118.76, 120.85], [121.52, 122.8]], "R": [["You don't understand your pay stub.", "HR", "Do you have questions about your pay stub?", "Yes. Why is my net pay so much lower than my gross pay?"], ["HR explains the deductions.", "HR", "These are CPP, EI, and income tax deductions.", "I see. Thank you. So the CPP goes to my pension later?"]]}]}, {"part": 11, "title": "At the Office", "desc": "Everyday life at work.", "scripts": [{"num": 83, "title": "First Day at the Office", "lines": [["P", "Good morning! Can I help you?", "Receptionist"], ["S", "Hi, it's my first day. I'm here to see Karen in HR. I almost pressed forty in the elevator!", "Paula"], ["P", "Hi, welcome to the team! Let's start with your onboarding. It'll take about an hour. First, here's your key fob. It opens the front door and the elevator after six in the evening. Please don't lose it.", "Karen"], ["S", "I won't.", "Paula"], ["P", "And here's a folder with information about your benefits: dental, medical, and eye care. You're covered after three months.", "Karen"], ["S", "Does that mean I have a probation period?", "Paula"], ["P", "It does. It's three months. Don't worry. It's normal.", "Karen"], ["S", "When do we get paid?", "Paula"], ["P", "Every second Friday, by direct deposit. Please fill out this form with your bank information.", "Karen"], ["S", "Hi, I'm Kevin from IT. Your login is your first initial and your last name. Your temporary password is on this paper. You'll change it when you log in. It needs at least twelve characters.", "Kevin"], ["P", "Hey, welcome aboard. I'm Greg, your team lead. Did you find the office okay?", "Greg"], ["S", "I did. But I almost went to the fortieth floor.", "Paula"], ["P", "Ha! There is no fortieth floor. This building only has twenty-two. Here's your desk. Your phone extension is four one seven. The kitchen is at the end of the hall. There's free coffee, but please wash your mug. People get upset about that.", "Greg"], ["S", "Good to know.", "Paula"], ["P", "We have a team meeting every Monday at nine thirty. And on Fridays, we usually get lunch together.", "Greg"], ["P", "So, how was your first day?", "Greg"], ["S", "It was good. Three people from the team took me for sushi on Pender Street. But it was a lot of information.", "Paula"], ["P", "Don't worry. Nobody remembers everything on day one. If you have questions, just ask.", "Greg"]], "words": 285, "kind": "story", "scene": "It's Paula's first day at her new job. The office is on West Hastings Street, on the fourteenth floor. She arrives at eight forty-five.", "F": "14/40, extension numbers, times, did, does, can, will", "V": "reception, HR (human resources), onboarding, key fob, IT, login, password, benefits, probation period, extension, direct deposit, team lead", "t": [[2.0, 2.9], [3.12, 4.12], [4.79, 6.15], [6.37, 8.25], [8.47, 10.75], [11.42, 12.9], [13.12, 14.72], [14.94, 16.37], [16.59, 18.08], [18.3, 21.99], [22.21, 23.36], [24.03, 24.74], [25.41, 30.53], [30.75, 32.41], [33.08, 35.58], [36.25, 36.97], [37.19, 38.26], [38.48, 39.29], [39.51, 40.32], [40.99, 42.14], [42.81, 45.46], [45.68, 48.26], [48.93, 50.53], [50.75, 53.65], [53.87, 55.98], [56.2, 57.63], [57.85, 59.54], [60.21, 61.76], [61.98, 63.6], [63.82, 65.85], [66.52, 67.18], [67.4, 69.66], [70.33, 71.06], [71.28, 73.13], [73.35, 75.38], [75.6, 76.82], [77.04, 79.51], [79.73, 82.04], [82.26, 85.03], [85.25, 87.13], [87.8, 88.65], [89.32, 92.31], [92.53, 95.53], [96.2, 98.04], [98.71, 99.52], [99.74, 103.43], [103.65, 105.42], [106.09, 107.12], [107.34, 109.94], [110.16, 112.25]], "R": [["It's your first day at a new office.", "Receptionist", "Good morning! Can I help you?", "Good morning! It's my first day. I'm here to meet Karen from HR."], ["IT gives you your login.", "IT", "Here's your key fob and your login.", "Thanks! Do I need to change my password today?"]]}, {"num": 84, "title": "The Monday Team Meeting", "lines": [["P", "Morning, everyone. We've got a lot on the agenda, so let's get started. Quick updates first. Linda, how's the Harbour project?", "Greg"], ["S", "It's on track. We finished the design last week, and the client approved it on Friday.", "Linda"], ["P", "Great. Tom?", "Greg"], ["P", "The website project is a little behind schedule. The developer got sick, so we lost three days.", "Tom"], ["P", "Can you still finish by the thirtieth?", "Greg"], ["P", "I think so, but it'll be tight.", "Tom"], ["P", "Paula, how are you settling in?", "Greg"], ["S", "Good, thanks. I finished the training, and I started the report on last quarter's sales.", "Paula"], ["P", "Perfect. Speaking of sales, sales went up thirteen percent last quarter.", "Greg"], ["S", "Sorry, I didn't catch that. Was it thirteen or thirty?", "Paula"], ["P", "Thirteen. One-three. Thirty would be a miracle.", "Greg"], ["P", "Good question, though. It's important to get the numbers right. Now, the budget. We have twelve thousand dollars left for the rest of the year. That has to cover the conference in Toronto and the new software.", "Greg"], ["S", "Does that include flights?", "Linda"], ["P", "It does. So please book early.", "Greg"], ["P", "Who's going to Toronto?", "Tom"], ["P", "Linda and I. Tom, you'll stay here and finish the website. The client meeting with Pacific Foods is on Thursday at two. Linda, can you loop Paula in? I'd like her to take notes.", "Greg"], ["S", "Sure. I'll forward the email.", "Linda"], ["P", "So, action items. Tom will finish the website by the thirtieth. Linda will book the flights by Wednesday. And Paula will finish the sales report by Friday. Does that work for everyone?", "Greg"], ["P", "Works for me.", "Tom"], ["S", "Paula, that was a good question about the numbers. A lot of people don't ask, and then they make mistakes.", "Linda"], ["S", "In my last job, I didn't ask enough. Here, I will.", "Paula"]], "words": 275, "kind": "story", "scene": "At nine thirty on Monday, Greg's team meets in the small meeting room.", "F": "meeting language, asking someone to repeat, 13/30 percent, dates, didn't, does, will", "V": "agenda, update, deadline, on track, behind schedule, budget, follow up, loop someone in, \"Does that work for everyone?\", \"Sorry, I didn't catch that,\" action items", "t": [[2.0, 3.32], [3.54, 6.91], [7.13, 8.63], [8.85, 11.0], [11.67, 12.65], [12.87, 16.61], [17.28, 18.02], [18.24, 19.03], [19.7, 22.5], [22.72, 25.34], [26.01, 28.21], [28.88, 30.5], [31.17, 32.9], [33.57, 34.42], [34.64, 38.82], [39.49, 40.37], [40.59, 44.41], [45.08, 46.55], [46.77, 48.35], [49.02, 49.91], [50.13, 51.07], [51.29, 52.93], [53.6, 54.97],
