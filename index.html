ly. At lunch, I was eating with Tom. He told me he just bought a new car. \"Nice! How much do you make here?\" I asked. Tom looked surprised. \"Um, I'd rather not say.\" After lunch, Linda came to my desk. \"Can I talk to you for a minute?\" We went to a small meeting room. \"I heard what happened with Karen and Tom,\" she said gently. \"Please don't worry. They know you didn't mean anything bad. But in Canada, some topics are sensitive, especially at work.\" \"Like what?\" \"Weight is a big one. Never comment on someone's weight or body, even if you mean it nicely. Also, don't ask how much people earn. Salary is private here.\" \"What else?\" \"It's better not to ask people how old they are, or why they don't have kids, or why they aren't married. And be careful with religion and politics. Many people don't discuss them with coworkers.\" \"So what can I talk about?\" \"Lots of things! The weather, weekends, food, travel, sports, pets, movies, and TV shows. And compliments are great if they're about things people choose, like 'I love your jacket' or 'Great presentation.'\" \"I feel terrible about Karen.\" \"You could just apologize. Keep it simple.\" That afternoon, I found Karen at her desk. \"Karen, I'm sorry about this morning. In Brazil, what I said is normal, but I know it isn't here. I didn't mean to be rude.\" She smiled. \"Thanks for saying that. No offence taken. I know you were just being friendly.\" Then I went to Tom. \"Sorry about the salary question. I'm still learning the rules.\" \"Don't worry about it,\" Tom said. \"Honestly, it's kind of funny. My mom asks me that every week.\" The next morning, I saw Karen again. \"Great scarf,\" I said. \"Thank you!\" she said. \"My sister made it.\" That was much better.", "words": 378}, {"num": 61, "title": "The Unwritten Rules", "F": "what you can and can't say, should, didn't, doesn't, would, can/can't", "V": "unwritten rules, \"girls\" vs. \"women,\" \"everyone,\" \"folks,\" condescending, personal space, handshake, interrupt, \"Sorry, go ahead,\" on time, line up, politics, religion, \"Lesson learned\"", "T": "On Friday afternoon, I walked past three of my coworkers, Megan, Karen, and Heather. I wanted to be friendly, so I said, \"Hey, what are you girls doing tonight?\" They stopped talking. Megan looked at me and said, \"We're women, actually. But we're going for dinner.\" I went back to my desk, confused. In Brazil, we say \"meninas\" all the time, and nobody gets upset. A few minutes later, I heard Karen on the phone: \"Yeah, the girls and I are going out for drinks tonight.\" Now I was really confused. I asked Tom about it in the kitchen. \"Why can Karen say 'girls,' but I can't?\" \"It's an unwritten rule,\" Tom said. \"Women can call their friends 'the girls.' But when a man calls grown women 'girls,' especially at work, it can sound like he doesn't see them as equals. Like they're children. It sounds condescending.\" \"So what should I say?\" \"Say 'everyone,' or 'folks,' or just use their names. 'Hey, what are you all doing tonight?' That's totally fine.\" \"Are there other rules like this?\" \"Lots. We don't write them down, but everyone knows them. At work, don't talk about politics or religion. Keep your personal space. About an arm's length. When you meet someone at work, shake hands. Don't kiss them on the cheek.\" I felt my face get red. \"I kissed the client on the cheek last week.\" \"I know. I saw her face,\" Tom said, and we both laughed. \"In meetings, don't interrupt. Wait until the person finishes. If you start talking at the same time, say 'Sorry, go ahead.' Be on time, even for social things. If dinner is at seven, arrive at seven, not seven thirty. And always line up. Never cut in line.\" \"In Brazil, interrupting shows we're interested.\" \"Here, it feels like you're not listening.\" Before Megan left, I went to her desk. \"Megan, I'm sorry about earlier. I didn't know 'girls' sounded that way in English.\" She smiled warmly. \"Thanks. I could tell you didn't mean anything by it. Have a good weekend.\" On the bus home, I wrote in my notebook: \"Say 'everyone.' Shake hands. Don't interrupt. Be on time. Line up. No politics.\" Then I added one more line: \"Lesson learned.\"", "words": 373}, {"num": 62, "title": "The Grey Winter", "F": "used to / be used to / get used to, miss (I miss my mom vs. my mom misses me), feelings vocabulary, didn't, doesn't, should", "V": "homesick, vitamin D, \"I miss...\", used to, be used to, get used to, feel down, feel low, daylight, seasonal affective disorder, light therapy lamp, \"The first winter is the hardest,\" community", "T": "In November, the rain in Vancouver started, and it didn't stop. It was dark when I left for work, and almost dark when I came home. I used to live in Fortaleza, where the sun shines almost every day. I wasn't used to this. One afternoon, my neighbour Joan found me sitting on the stairs in our building. \"Are you okay?\" she asked. \"You look a little down.\" \"I'm fine,\" I said. \"Actually, I'm not. I'm homesick. I miss my mom. I miss the beach. I miss the sun.\" \"Come in and have a cup of tea,\" Joan said. In her kitchen, I said, \"My mom calls every Sunday. Last week she said, 'You used to call me every day.' I felt terrible.\" \"She misses you,\" Joan said. \"And you miss her. The first winter is the hardest. I moved here from Ontario, and I still remember it.\" \"Do Canadians feel sad in the winter too?\" \"Some people feel really low in the dark months. Doctors call it seasonal affective disorder. If you feel sad for weeks and it doesn't get better, talk to your doctor. That's important.\" \"What do you do?\" \"Four things. First, I go outside every day around noon, even when it's raining. The daylight helps. Second, I use a light therapy lamp in the morning. My doctor suggested it. Third, vitamin D. Lots of people in Vancouver take it in the winter, because we get so little sun.\" \"Vitamin D? In Brazil, we get it from the beach.\" Joan laughed. \"Not here. Ask your pharmacist how much is right for you. And fourth, I don't stay home alone. I sing in a choir on Tuesdays.\" \"In Brazil, I used to dance every weekend.\" \"Then dance here!\" That weekend, I found a samba class on Commercial Drive. At the end of the class, a woman named Kim smiled at me. \"Are you coming next week?\" \"I am,\" I said. It rained for most of December too. But slowly, I'm getting used to it. Now, when my mom calls on Sunday, she asks, \"Are you still sad?\" \"Sometimes,\" I tell her. \"But I have my samba class, my tea with Joan, and my twenty minutes of daylight.\" \"And me,\" she says. \"And you, Mom. Always.\"", "words": 377}]}, {"part": 9, "title": "University and College", "desc": "Registration, assignments, professors, and group projects.", "scripts": [{"num": 63, "title": "Registering for Courses", "F": "student numbers, course codes (one-oh-one), credits, times (2:30/2:13), dates, 14/40, can/can't, doesn't, didn't", "V": "academic advisor, registration date, student number, faculty, full-time, credits, required course, elective, prerequisite, section, lecture, tutorial, overlap, waitlist, drop, add deadline, tuition, student portal, student card, U-Pass", "T": "Last week, I had an appointment with an academic advisor at the university. My registration date was Thursday at nine a.m., and I was nervous. I didn't know which courses to choose. The advisor, Donna, invited me into her office. \"Hi, come in. Can I have your student number?\" \"It's three oh one, four five, eighteen sixty.\" She typed it into her computer. \"Okay. I see you're starting in the Faculty of Business in September. Most first-year students take five courses per term. Each course is three credits, so that's fifteen credits.\" \"Is five courses too many? I work part-time on weekends.\" \"How many hours do you work?\" \"Twelve hours a week.\" \"Then five is fine.\" She turned her screen toward me. \"Let's look at your required courses. You need Business one-oh-one, Economics one-oh-three, and a first-year writing course, English one-oh-five. Then you can choose two electives.\" \"What's an elective?\" \"It's a course you choose because you're interested in it. It doesn't have to be in business.\" \"Can I take Psychology?\" \"You can. Psychology one-oh-two doesn't have any prerequisites.\" \"Prerequisites?\" \"Courses you need to pass before you take another course. For example, you can't take Economics two-oh-one until you pass Economics one-oh-three.\" Then she looked at the schedule. \"Be careful with times. Business one-oh-one has three sections. Section A is Mondays and Wednesdays at eight thirty. Section B is Tuesdays and Thursdays at ten thirty. Section C is Tuesdays and Thursdays at two thirty.\" \"Two thirty or two thirteen?\" She laughed. \"Two thirty in the afternoon. Also, some courses have a lecture and a tutorial. You need to register for both, and they can't overlap.\" \"What happens if a course is full?\" \"You can join the waitlist. Many students drop courses in the first two weeks. But the last day to add a course is September 18th.\" \"And when do I pay tuition?\" \"Tuition is due by September 4th. You can pay online through the student portal. And don't forget your student card. With it, you'll get a U-Pass for the bus and SkyTrain.\" On Thursday at nine o'clock exactly, I clicked \"Register.\" Four courses worked. One course was full, so I joined the waitlist. I was number fourteen. Fourteen, not forty. I still had a chance.", "words": 377}, {"num": 64, "title": "First Day on Campus", "F": "university setting, room numbers (213/230), times, where, can/can't, is, did/didn't", "V": "", "T": "It was my first day at UBC, and I was nervous. My first class was Business Communication at nine thirty in the Buchanan Building. I took the 99 B-Line from Commercial Drive. The bus was full of students, and I stood for forty minutes. When I arrived on campus, I didn't know where to go. The campus is huge, and all the buildings looked the same to me. I checked the map on my phone, but it didn't help. I asked a student, \"Excuse me, where's the Buchanan Building?\" \"Walk straight down Main Mall,\" he said, \"and turn left at the clock tower.\" \"Thanks!\" I found the building at nine twenty. My schedule said Room 213. Or was it 230? I checked again. It was 230, not 213. I walked into Room 230, and it was almost full. I sat next to a guy named Kyle. \"Is this Business Communication?\" I asked. \"It is,\" he said. \"Is this your first class?\" \"Yes. Is it obvious?\" He laughed. \"A little. You looked lost. I was lost too, last year.\" \"You took this course last year?\" \"I did. And I failed it,\" he said. \"I didn't do the readings. Don't make my mistake.\" Then the professor walked in. Her name was Dr. Susan Walsh. She put her bag on the desk and said, \"Good morning, everyone. Can you all hear me at the back?\" A student at the back shouted, \"We can't!\" She smiled and turned on the microphone. \"How about now?\" \"Yes!\" \"Good. Welcome to Business Communication. This course is thirteen weeks long. We meet on Mondays and Wednesdays from nine thirty to eleven. Please don't be late. The door closes at nine forty.\" Kyle whispered, \"She's serious about that. Last year, she locked out six people on the first day.\" After class, I asked Kyle, \"Where do you usually eat lunch?\" \"At the Nest. It's the student building. Do you want to come?\" \"Sure,\" I said. My first day wasn't so bad after all.", "words": 334}, {"num": 65, "title": "The Assignments", "F": "a professor giving out assignments: percentages, due dates, word counts, 18/80, by, will/won't, can/can't, does", "V": "", "T": "\"Okay, everyone, let's talk about assignments,\" said Dr. Walsh. \"Please open the syllabus. I posted it on Canvas last night. Did everyone get it?\" A few students shook their heads. \"If you didn't get it, check your student email. There are four assignments in this course. The first one is a short personal introduction, three hundred words. It's worth five percent of your final grade, and it's due by Friday, September 18th, at eleven fifty-nine p.m. Not midnight. Eleven fifty-nine. The second assignment is a formal business email. You'll write to a company and ask for information. It's worth fifteen percent, and it's due on October 2nd. The third assignment is a group presentation. You'll work in groups of four, and each presentation is twelve minutes long. It's worth thirty percent. The presentations will be in November, in weeks ten and eleven. The last assignment is a final report, fifteen hundred words. It's worth forty percent, and it's due on December 4th. The other ten percent is participation. That means you come to class, you ask questions, and you join the discussions.\" A student raised his hand. \"Does the final report include references?\" \"It does. Use APA style. The references don't count toward the fifteen hundred words.\" Another student asked, \"Can we use AI?\" \"Good question. You can use AI to check your grammar, but you can't use it to write your ideas. If you used AI, tell me how you used it in one sentence at the end.\" \"What happens if we're late?\" \"You lose ten percent per day. After three days, I won't accept it.\" \"Do you give extensions?\" \"I do, but only if you ask before the deadline, not after. My office hours are on Tuesdays from two to four, in Room 418.\" Kyle whispered, \"Four eighteen, not four eighty.\" I wrote it in my notebook. \"One more thing,\" Dr. Walsh said. \"For Wednesday, read Chapters 1 and 2. There'll be a short quiz.\" Everyone groaned. Kyle looked at me. \"I told you,\" he said.", "words": 338}, {"num": 66, "title": "Office Hours", "F": "does/did/didn't, can/can't, could/would, say/tell, remember/remind, 34/43, polite English vs. direct Portuguese", "V": "", "T": "On Tuesday, I went to Dr. Walsh's office hours. I knocked on the door of Room 418 at ten past two. \"Come in,\" she said. \"Have a seat. How can I help you?\" \"I have a question about the business email assignment,\" I said. \"I wrote a first draft, but I'm not sure it's formal enough.\" \"Did you bring it?\" \"I did.\" I handed her the page, and she read it quietly. My heart was beating fast. I didn't want her to think my English was bad. \"This is a good start,\" she said. \"But you started with 'Hi.' For a formal email, you should use 'Dear.' And you wrote 'I want information.' That sounds a little direct. You could say 'I would like to request information,' or 'Could you please send me...'\" \"I didn't know that,\" I said. \"In Portuguese, we're sometimes more direct.\" \"That's very common,\" she said. \"Many of my students from Brazil tell me the same thing.\" \"What's the difference?\" I asked. \"The second one sounds more polite. In Canada, polite is always safer.\" Then I asked, \"Does the email need a subject line?\" \"It does. Always. And keep it short, five to eight words.\" \"How long should the email be?\" \"Between a hundred and fifty and two hundred words. Don't write more than two hundred.\" \"Can I send you a second draft by email?\" \"No, you can't. I don't read drafts by email. But you can bring it next Tuesday.\" \"Okay. One more question. Kyle said there's a quiz tomorrow. Does it count?\" She smiled. \"It doesn't count toward your grade. But I'll remember who did the reading.\" I laughed. \"Can you remind me how many pages?\" \"Forty-three pages.\" \"Forty-three or thirty-four?\" \"Forty-three. Four, three.\" I thanked her and walked to the bus stop on University Boulevard. It was two thirty. The next 99 B-Line was at two forty. While I waited, I opened my book and started Chapter 1. This time, I wanted to be ready.", "words": 332}, {"num": 67, "title": "UBC: The Argumentative Essay", "F": "essay requirements, word counts, percentages, dates, does, can/can't, did", "V": "argumentative essay, thesis statement, evidence, scholarly/peer-reviewed sources, works cited, MLA format, double-spaced, margins, rubric, outline, Turnitin, extension, writing centre", "T": "\"Good morning, everyone. Before we start today's lecture, let's talk about your first major assignment. It's posted on Canvas, but I'll go through it now, so please listen carefully. This is an argumentative essay. That means you're not just describing something. You're making an argument, and you're supporting it with evidence. The topic is: 'Should Canadian cities limit short-term rentals like Airbnb?' You can argue yes or no. What I care about is how well you defend your position. Your essay needs a clear thesis statement at the end of your introduction. One sentence. If I finish your first paragraph and I don't know what you're arguing, that's a problem. The essay should be between fifteen hundred and eighteen hundred words, not including your works cited page. Please don't go over two thousand words. I'll stop reading at two thousand. Use MLA format: double-spaced, twelve-point font, one-inch margins, and page numbers. You need at least four scholarly sources. That means peer-reviewed journal articles or academic books. Wikipedia isn't a scholarly source, and neither is a random blog. The essay is worth twenty-five percent of your final grade. Before that, you'll submit a one-page outline, worth five percent. The outline is due on Friday, October 16th, and the final essay is due on Friday, November 6th, at eleven fifty-nine p.m. Submit it on Canvas. Everything goes through Turnitin, so make sure every idea from a source is cited.\" A student raised her hand. \"Can we use AI to help with research?\" \"You can use it to brainstorm, but you can't use it to write any part of your essay. If you did use AI, tell me how in a short note at the end.\" \"What if we need an extension?\" \"Email me at least forty-eight hours before the deadline. Late essays lose five percent per day.\" \"Does the rubric count grammar?\" \"It does. Twenty percent of the grade is for clarity and style. If you're worried about your writing, book an appointment at the writing centre. It's free, and I strongly recommend it.\"", "words": 342}, {"num": 68, "title": "BCIT: The Recommendation Report", "F": "report structure, word limits, dates, file names, does/doesn't, can/can't, didn't", "V": "industry, recommendation report, client, Lower Mainland, set, executive summary, findings, recommendations, appendices, headings, subheadings, bullet points, proposal memo, Learning Hub, peer evaluation, business days, follow up", "T": "\"Morning, everyone. Let's go over your major project for this term. First of all, this is not an essay. In this program, you're writing for industry, not for a professor. Your reader is a busy manager who doesn't have time to read long paragraphs. So your writing must be clear, direct, and easy to scan. The project is a recommendation report. Each set will be divided into teams of three or four. Your team will work with a real client, a small business in the Lower Mainland, and recommend a solution to a problem they have. The report should be no more than twenty-five hundred words, not including the appendices. It must have these sections, in this order: a title page, an executive summary, an introduction, your findings, your recommendations, a conclusion, references in APA, and appendices. Use headings and subheadings. You can use bullet points and tables. In fact, I'd like you to. The executive summary is the most important page. Many managers only read the executive summary, so it has to stand alone. Keep it under two hundred and fifty words. Before the report, each team will submit a one-page proposal memo. It's worth ten percent, and it's due on Friday, October 9th, on the Learning Hub. The final report is worth thirty percent, and it's due on Friday, November 27th. After that, each team will give a fifteen-minute presentation to the client. Please name your file like this: team number, underscore, client name, underscore, report. For example, 'Team3_CoastBakery_Report.' Not 'final final version two.'\" Everyone laughed. A student asked, \"Does everyone on the team get the same mark?\" \"Not always. At the end, you'll complete a peer evaluation. If someone didn't do their share, it'll affect their mark.\" \"Can we contact the client directly?\" \"You can, but be professional. Use your BCIT email, not your personal email.\" \"What if the client doesn't answer?\" \"Wait three business days, then follow up. If they still don't answer, let me know.\" \"How strict is the word limit?\" \"Very strict. In industry, if you can't say it in twenty-five hundred words, you haven't thought about it enough.\"", "words": 355}, {"num": 69, "title": "The MBA Group Project", "F": "meeting language, dividing tasks, numbers (1.4/4.1 million, 14/40 percent), didn't, can, will, polite Canadian disagreement", "V": "case study, deliverable, recommendation, slide deck, executive summary, financials, run the numbers, profit margin, take the lead, draft, dry run, peer evaluation, \"circle back,\" \"on the same page\"", "T": "In week five of my MBA program, our group had our first real meeting. There were four of us: Sarah, Mike, Jason, and me. \"Let's make sure we're all on the same page,\" Sarah said. \"The assignment is a case study. A Vancouver coffee company, Harbour Roasters, wants to open five new locations in Calgary. We have to decide if they should do it and write a recommendation.\" \"What are the deliverables?\" Mike asked. \"A written report, three thousand words maximum, and a twenty-minute presentation. Together, they're worth forty percent of our final grade.\" \"Forty or fourteen?\" I asked. \"Forty. Four-zero. It's a big one. The report is due on Friday, November 13th. So, how do we want to divide the work?\" \"I can take the lead on the financials,\" Mike said. \"I worked in banking for six years. I'll run the numbers. Their revenue grew from one point four million to four point one million in three years. That's impressive, but their profit margin is small.\" \"I'll do the market research on Calgary,\" Jason said. \"I can write the executive summary and the recommendation,\" I said. \"In Brazil, I managed marketing for a restaurant chain.\" \"Perfect,\" Sarah said. \"I'll build the slide deck and put everything together. Let's each write a draft of our section by next Wednesday.\" The next Wednesday, we met again. Mike, Sarah, and I had finished our drafts. Jason hadn't. \"Sorry, guys,\" he said. \"I had a big deadline at work.\" There was a long silence. In Brazil, I would say, \"You have to do your part.\" But I've learned that Canadians say things more politely. So I said, \"I understand you're busy, Jason. I'm just wondering if you could finish the research by Friday. We need it for the recommendation.\" \"Yeah, that's fair,\" Jason said. \"I'll have it done by Friday.\" \"Thanks,\" Sarah said. \"Let's circle back on Friday. And let's schedule a dry run of the presentation for Monday at six.\" On Friday, Jason's research was in the shared document, and it was excellent. Rents in Calgary were thirty percent lower than in Vancouver. At the end of the term, we filled out peer evaluations. I gave everyone full marks, even Jason. He was late once, but he didn't let us down.", "words": 379}]}, {"part": 10, "title": "Finding a Job", "desc": "The job search, from the first application to the first pay stub.", "scripts": [{"num": 70, "title": "Where to Look for a Job", "F": "job search websites and services, numbers, do/don't, didn't, can, should, -ed", "V": "job board, job posting, Indeed, LinkedIn, Job Bank, WorkBC, employment counsellor, workshop, \"free of charge,\" apply online, job alert, hidden job market", "T": "When I arrived in Vancouver, I didn't know where to look for a job. In Brazil, I found my last two jobs through friends. Here, I didn't have any friends yet. So I spent hours every day on Indeed, applying for everything. After three weeks, I had sent sixty applications and received zero answers. My neighbour, Pam, noticed I looked tired. \"How's the job search going?\" she asked. \"Terrible. I apply online every day, and nobody calls me back.\" \"Have you been to WorkBC?\" \"What's that?\" \"It's a government employment service. There's a WorkBC Centre in almost every neighbourhood. They help people find jobs, and it's free.\" The next Monday, I went to the WorkBC Centre near Metrotown. A woman at the front desk gave me a form. After twenty minutes, an employment counsellor named Sheila called me. \"Tell me about your background,\" she said. \"I was an accountant in Brazil for ten years.\" \"Okay. Where have you been looking for jobs?\" \"Mostly Indeed.\" \"Indeed is good, but don't use only one website. Try LinkedIn, and also Job Bank. That's the Government of Canada's job site. And set up job alerts, so you get an email when a new job is posted.\" \"How many applications should I send every day?\" \"Quality is more important than quantity. Three good applications are better than twenty fast ones.\" \"But I sent sixty and got nothing.\" \"That's very common. Many jobs are never posted online. People call it the hidden job market. Employers often hire people they already know, or people someone recommended.\" \"So how do I find those jobs?\" \"By meeting people. Networking events, volunteering, and informational interviews. We have a free workshop on networking next Tuesday.\" \"Can I sign up?\" \"Of course. We also have workshops on resumes, LinkedIn profiles, and interviews. All free of charge.\" Before I left, Sheila looked at my resume. \"Your resume is two pages of job duties. Let's fix it together next week.\" \"Thank you so much,\" I said. \"I didn't know any of this existed.\" \"Most newcomers don't,\" she said. \"That's why I love this job.\" Walking to the SkyTrain, I felt something I hadn't felt in weeks. I felt hopeful.", "words": 365}, {"num": 71, "title": "\"Do You Have Canadian Experience?\"", "F": "explaining a problem, didn't, does, can, have to, should, -ed", "V": "Canadian experience, qualified, overqualified, volunteer, contract, temporary position, bridging program, settlement agency, reference, \"foot in the door,\" transferable skills", "T": "After my third interview, I got the same answer again. \"You're very qualified, but we're looking for someone with Canadian experience.\" On the bus home, I called my friend Ron. \"How can I get Canadian experience,\" I asked, \"if nobody gives me a job without Canadian experience?\" \"It's the classic newcomer problem,\" he said. \"Almost everyone hears it. Come over for coffee tomorrow, and we'll talk.\" The next morning, Ron made coffee and took out a notebook. \"First, let's understand what employers mean. Usually, they're not worried about your skills. They're worried about three things. Do you understand how Canadian workplaces communicate? Do you know the local rules and systems? And can they call a Canadian reference?\" \"So how do I show them that?\" \"There are a few ways to get your foot in the door. The first is volunteering. Many organizations need volunteers with professional skills, like marketing, accounting, or IT.\" \"Does volunteering really count as experience?\" \"It does, if it's related to your field. And you'll get a Canadian reference. That's very valuable.\" \"What else?\" \"Contract or temporary jobs. They're easier to get, because the company isn't making a long-term decision. Many contracts become permanent.\" \"I didn't apply for contract jobs. I thought they weren't good.\" \"In Canada, they're a very normal way to start. Third, bridging programs. Settlement agencies and colleges have programs for newcomers in specific fields. Some of them include a work placement.\" \"What about my resume?\" \"Focus on transferable skills. Leading a team, managing budgets, solving problems. Those skills are the same in Brazil and Canada. And mention international clients or projects. That's an advantage, not a weakness.\" That week, I found a volunteer position with a non-profit organization. They needed help with their social media marketing, four hours a week. Three months later, my supervisor there, Lori, gave me a great reference. Then she said, \"A friend of mine runs a marketing agency. They need someone for a six-month contract. Can I send her your resume?\" \"Of course!\" I said. I got the contract. At my first team meeting, my new manager said, \"Lori told me you're excellent.\" That's when I understood. Canadian experience wasn't really about experience. It was about trust.", "words": 369}, {"num": 72, "title": "Getting Your Credentials Recognized", "F": "steps in a process, first/after that, years and months, have to, can/can't, does", "V": "regulated profession, licence, licensed, credential, assessment, regulator, Engineers and Geoscientists BC (EGBC), P.Eng., engineer-in-training, professional practice exam, work experience, supervisor, \"under the supervision of\"", "T": "In Brazil, I was a licensed civil engineer for twelve years. So when I arrived in Canada, I thought I could work as an engineer right away. I was wrong. At a networking event, I met an engineer named Brent who explained it to me. \"In Canada, engineering is a regulated profession,\" he said. \"That means you need a licence to call yourself a professional engineer. In B.C., the regulator is Engineers and Geoscientists BC, or EGBC.\" \"But I already have a licence in Brazil.\" \"I know. But each province has its own rules. It's the same for nurses, doctors, teachers, and accountants. Even electricians and plumbers.\" \"So what do I have to do?\" \"First, you apply to EGBC. They'll assess your degree and your work experience. They want to see your university transcripts, your course descriptions, and letters from your employers in Brazil.\" \"Do they need to be translated?\" \"Yes, by a certified translator.\" \"What happens after they assess me?\" \"Sometimes they ask you to take extra exams, if your degree is different from a Canadian degree. You'll also need to write a professional practice exam. It's about Canadian law, ethics, and safety.\" \"And my experience?\" \"They don't require Canadian work experience anymore, but your experience has to meet Canadian standards. You describe your work, and engineers who know it confirm your skills.\" \"Can I work while I wait?\" Brent smiled. \"You can work in engineering before you're licensed. You just can't sign and approve drawings yourself. Many newcomers are registered as an engineer-in-training while they finish the process.\" \"How long does all this take?\" \"It depends. For most people I know, between one and three years.\" That night, I felt discouraged. But the next week, I sent my application to EGBC and ordered my transcripts from Brazil. Six months later, I got a job as a project coordinator at an engineering company. It wasn't my old job, but my manager was a P.Eng., and she agreed to support my application. Two years after I arrived in Canada, I received an email from EGBC. \"Congratulations,\" it said. \"You are now registered as a Professional Engineer.\" I printed the email and put it on the fridge. My kids made me a card that said, \"Our dad, the Canadian engineer.\"", "words": 379}, {"num": 73, "title": "\"Do You Have Your Certificate?\"", "F": "required vs. asset, costs, hours, years, do/does/don't, did, have to, can, -ed", "V": "degree, certificate, certification, required, asset, \"nice to have,\" WHMIS, first aid, FOODSAFE, Serving It Right, forklift certification, traffic control, PMP (Project Management Professional), CPHR, IT certifications, expire, renew, online course, \"Is it recognized in B.C.?\"", "T": "In Brazil, I have a bachelor's degree in business and an MBA. So when I started applying for jobs in Vancouver, I was surprised. Almost every job posting asked for a certificate. An office job said: \"Required: WHMIS. Asset: First Aid.\" Even a café job asked for FOODSAFE. \"I have two degrees,\" I said to my friend Stacey. \"Why do they want certificates?\" \"In Canada, a degree shows what you studied,\" she explained. \"A certificate shows you have a specific skill, and that you know the Canadian rules. Employers love them because they're quick to check.\" \"What's WHMIS?\" \"It's about hazardous materials at work, like chemicals and cleaning products. It's required in many workplaces. It's an online course, only a couple of hours.\" \"And FOODSAFE?\" \"That's for anyone who works with food in B.C. If you want to serve alcohol, you also need Serving It Right.\" \"What does 'asset' mean in a job posting?\" \"'Required' means you must have it. 'Asset' means it's nice to have. It isn't required, but it helps you stand out.\" \"Which certificates should I get?\" \"It depends on your field. In construction or warehouses, people get forklift or traffic control certification. In IT, there are certifications from Microsoft and Amazon. In HR, there's the CPHR. For project management, the PMP is very well known.\" That month, I did my WHMIS course online on a Sunday afternoon. It took two hours and cost less than fifty dollars. Then I signed up for a two-day first aid course on the weekend. \"Your certificate expires in three years,\" the instructor said. \"Don't forget to renew it.\" I added both certificates to my resume, in a new section called \"Certifications.\" I also started studying for the PMP. I studied every night for three months, and I passed on my first try. Two weeks later, I applied for a project coordinator job at a construction company. In the interview, the manager said, \"I see you have your PMP and your first aid. That's great. Most applicants don't.\" After the interview, I called Stacey. \"You were right. They noticed the certificates before they noticed my MBA.\" Stacey laughed. \"Here, a piece of paper from a weekend course can open a door.\"", "words": 370}, {"num": 74, "title": "Resume and Cover Letter Tips", "F": "-ed action verbs (managed, increased, reduced, trained, created, developed, led), don't/doesn't, should, can't, did/didn't, numbers and percentages", "V": "resume, cover letter, job posting, hiring manager, tailor, keywords, applicant tracking system, accomplishments, action verbs, volunteer experience, human rights, discrimination", "T": "When I moved to Vancouver, I applied for twenty jobs in one month. I didn't get a single interview. I was an engineer in Brazil for twelve years, so I didn't understand. Then my friend Dianne told me about Ron, who helps newcomers with their resumes. I met Ron at a coffee shop. He looked at my resume for thirty seconds. \"First, the photo. In Canada, you don't put a photo on your resume.\" \"Really? In Brazil, everyone does.\" \"Here, employers don't want it. The same goes for your age, your date of birth, and your marital status. Take them all out. In B.C., employers can't make hiring decisions based on age or marital status. It's against human rights law.\" \"What about my CPF number?\" \"Take that out too. Just put your city, your phone number, your email, and your LinkedIn profile.\" Then he looked at my work experience. \"Your resume says, 'Responsible for managing projects.' Canadian employers want accomplishments. Use action verbs and numbers. Did you save your company money?\" \"I did. I reduced costs on one project by about thirty percent.\" \"Perfect. Write that: 'Reduced project costs by thirty percent.' Start every line with a verb in the past tense: managed, increased, reduced, trained, led, developed.\" \"How long should my resume be?\" \"Two pages maximum. And add your volunteer experience. Canadians value that.\" \"Should I change my resume for every job?\" \"Yes. Many companies use an applicant tracking system, a computer program that reads your resume first. If it doesn't find the keywords from the job posting, a person never sees it.\" Then Ron asked, \"Did you send cover letters?\" \"No. In Brazil, we don't usually write them.\" \"Here, you need one. One page, three or four short paragraphs. Find the hiring manager's name. In the first paragraph, say which job you're applying for. In the second, explain how your experience matches the job. In the third, say why you want to work there.\" \"That's a lot of work.\" \"It is. But ten good applications are better than a hundred bad ones.\" That night, I rewrote my resume. Two weeks later, I sent Ron a message: \"I got my first interview!\" He wrote back: \"Now let's get you ready for it.\"", "words": 373}, {"num": 75, "title": "The Informational Interview", "F": "polite requests (would you be willing to, could I ask), questions about careers, did, does, can, -ed", "V": "informational interview, reach out, \"I'd love to learn more about...,\" \"Would you be open to a 20-minute coffee chat?\", career path, industry, advice, \"Is there anyone else you'd recommend I talk to?\", thank-you note", "T": "My WorkBC counsellor, Sheila, gave me an assignment. \"This week, I want you to ask three people for an informational interview.\" \"What's an informational interview?\" \"It's a short conversation with someone who works in your field. You ask them questions about their job, their company, and their industry. It's not a job interview. You're not asking for a job. You're asking for advice.\" \"Why would a stranger talk to me?\" \"Many Canadians are happy to help, if you're polite and keep it short.\" That night, I found an HR manager on LinkedIn. Her name was Jill, and she worked at a tech company in Vancouver. I wrote her a short message. \"Hi Jill, I'm a human resources professional who recently moved to Vancouver from Brazil. I'm very interested in your company's work, and I'd love to learn more about HR in the tech industry. Would you be open to a twenty-minute coffee chat sometime in the next few weeks? I'd be happy to meet near your office. Thank you for your time.\" Two days later, she replied. \"Sure! How about Thursday at four, at the café on the corner of Hastings and Richards?\" On Thursday, I arrived early with my questions ready. \"How did you get into HR in tech?\" \"What does a typical day look like for you?\" \"What skills are most important in your field right now?\" \"One tip,\" she said. \"In Canada, HR is very focused on employment law. Take a short course on B.C. employment standards. It'll help you a lot in interviews.\" \"That's very helpful. Thank you.\" After twenty minutes, I said, \"I don't want to take too much of your time. My last question: is there anyone else you'd recommend I talk to?\" \"Actually, yes. My friend Stuart is an HR director at a big company downtown. I'll introduce you by email.\" That evening, I sent Jill a thank-you note: \"Thank you so much for your time today. Your advice about the employment law course was very helpful. I've already signed up.\" The next week, I met Stuart. A month later, Stuart emailed me. \"We have an opening on my team. It isn't posted yet. Would you like to apply?\" Sheila was right. The hidden job market was real.", "words": 375}, {"num": 76, "title": "Networking Night", "F": "starting, continuing, and ending a conversation with a stranger, do, did/didn't, how/what questions, -ed", "V": "networking event, \"Mind if I join you?\", \"What brings you here?\", \"So, what do you do?\", \"How did you get into that?\", \"That's interesting. Tell me more,\" follow-up question, \"Can I connect with you on LinkedIn?\", \"It was great chatting with you,\" \"I'll let you mingle\"", "T": "Last Thursday, I went to my first networking event, a meetup for engineers at a hotel on Burrard Street. I didn't know anyone. Then I remembered Ron's advice: \"Look for a small group of two or three people, or someone standing alone. Walk over, smile, and introduce yourself.\" I saw a woman standing alone near the window. I walked over. \"Hi, mind if I join you? I don't know anyone here.\" She laughed. \"Neither do I. I'm Krista.\" \"Nice to meet you, Krista. What brings you here tonight?\" \"My company just moved to Vancouver from Calgary, so I'm trying to meet people. How about you?\" \"I moved here from Brazil last year. I'm a civil engineer, and I'm looking for my next job.\" \"Oh, nice! What kind of projects do you work on?\" \"Mostly bridges and roads. What do you do?\" \"I'm in environmental engineering. I work on water treatment projects.\" \"That's interesting. How did you get into that?\" \"I grew up on a farm in Alberta, and water was always a big problem there. So I guess it was natural.\" Ron had told me, \"Ask follow-up questions. People love to talk about themselves.\" So I asked, \"What's the biggest difference between working in Calgary and here?\" \"Honestly? The rain,\" she said, and we both laughed. We talked about her projects and about hiking. After about fifteen minutes, a man walked over. \"Krista! I didn't know you'd be here.\" \"Brian! This is my new friend. She's a civil engineer from Brazil.\" I shook Brian's hand. \"Nice to meet you.\" \"Brian works for the city,\" Krista said. \"You two should talk.\" Brian and I talked about a new transit project. He told me the city was hiring engineers. \"Can I connect with you on LinkedIn?\" I asked. \"Of course,\" he said. We scanned each other's QR codes. After a few more minutes, I remembered how Ron said to end a conversation. \"Well, it was great chatting with you both. I'll let you mingle. I'm going to grab something to drink.\" \"Great meeting you too!\" Krista said. On the bus home, I checked my phone. Brian had already sent me a message: \"Here's the link to the job posting I mentioned. Good luck!\"", "words": 371}, {"num": 77, "title": "The Recruiter Phone Screen", "F": "quick answers on the phone, availability, numbers (salary range, notice period), are you/do you/can you questions, will", "V": "recruiter, phone screen, \"Is now a good time?\", legally entitled to work in Canada, work permit, permanent resident, availability, notice period, salary expectations, \"on-site,\" \"hybrid,\" next round, hiring manager", "T": "On Tuesday at two o'clock, I was cooking lunch when my phone rang. It was a number I didn't know. \"Hello?\" \"Hi, this is Jason Park. I'm a recruiter with Pacific Tech Solutions. You applied for our IT support analyst position. Is now a good time to talk for about fifteen minutes?\" I turned off the stove. \"Yes, now is fine.\" \"Great. This is just a quick phone screen. I have a few questions, and then you can ask me anything.\" \"Okay.\" \"First, are you legally entitled to work in Canada?\" \"Yes, I'm a permanent resident.\" \"Perfect. Can you tell me a little about your experience?\" \"I worked in IT support for eight years in Brazil, mostly for a bank. I managed a team of four technicians, and I supported about six hundred users.\" \"Great. The role is hybrid, three days in the office downtown and two days from home. Does that work for you?\" \"Yes, that works.\" \"What's your availability? If we offered you the job, when could you start?\" \"I'm available right away.\" \"Good. What are your salary expectations?\" I remembered Ron's advice: give a range, based on research. \"Based on my research, between sixty-five and seventy-five thousand dollars a year.\" \"Okay. That's within our range.\" \"Do you have any experience with Microsoft 365 and ticketing systems?\" \"Yes, I used both every day in my last job.\" \"Great. The next step is a video interview with the hiring manager, Linda. It'll be about forty-five minutes. Are you available this Friday at ten?\" \"Yes, I am.\" \"I'll send you a calendar invite with the link. Do you have any questions for me?\" \"Yes. What's the team like?\" \"It's a team of eight. They're friendly, and they work well together.\" \"And what does success look like in the first three months?\" There was a short pause. \"That's a great question. I'll make sure Linda talks about that on Friday.\" After the call, I wrote down everything I remembered. Then I realized my lunch was cold. I didn't care. When my husband came home, I told him about the interview. \"Already? You only applied last week.\" \"In Canada, they call you when you least expect it,\" I said. \"Always answer your phone.\"", "words": 371}, {"num": 78, "title": "The Job Interview", "F": "interview questions and answers, -ed verbs, did, do/does, would, salary numbers, years", "V": "hiring manager, \"Tell me about yourself,\" behavioural question, \"Tell me about a time when...,\" STAR method (Situation, Task, Action, Result), weakness, salary expectations, \"Do you have any questions for us?\", thank-you email, offer letter", "T": "Two weeks after I rewrote my resume, I got an interview for a project engineer position in Richmond. Ron helped me prepare. \"They'll ask behavioural questions,\" he said. \"Questions that start with 'Tell me about a time when...' Use the STAR method: Situation, Task, Action, Result.\" At ten o'clock, a woman came out to the reception area. \"Hi, I'm Barbara Clark, the hiring manager. This is Mike Dawson from our engineering team. Thanks for coming in.\" We went into a small meeting room. \"So, to start, tell us a little about yourself.\" \"I'm a civil engineer with twelve years of experience in Brazil. I managed construction projects for a large company in São Paulo, mostly roads and bridges. I moved to Vancouver last year, and I'm looking for a role where I can use my project management experience.\" \"Why do you want to work here?\" \"I read about your new bridge in Surrey. I worked on similar projects, and I'd like to contribute here.\" Mike asked the next question. \"Tell me about a time when a project was behind schedule. What did you do?\" I used the STAR method. \"In 2021, we were building a road, and heavy rain delayed us by three weeks. My task was to finish on time. I met with the team, changed the schedule, and added a second shift. As a result, we finished only two days late, and we stayed within budget.\" \"What's your greatest weakness?\" \"My English isn't perfect yet, especially on the phone. So I'm taking a class, and I practise every day.\" \"That's an honest answer. What are your salary expectations?\" \"Based on my research, between eighty-five and ninety-five thousand dollars a year.\" \"That's within our range. Do you have any questions for us?\" \"What does a typical day look like in this role? And what's the next step in the hiring process?\" \"About half on site, half in the office. We'll make a decision by the end of next week.\" That afternoon, I sent a short thank-you email to Barbara and Mike. Eight days later, my phone rang. \"Hi, it's Barbara Clark. We'd like to offer you the position.\" \"Thank you so much. I'm very happy to accept.\" \"Wonderful. I'll send you the offer letter by email today.\"", "words": 378}, {"num": 79, "title": "Negotiating a Job Offer", "F": "polite negotiation (would, could, is there any flexibility), salary and vacation numbers, did, can/can't, will", "V": "job offer, offer letter, salary, base salary, benefits, vacation, flexibility, counteroffer, start date, \"Let me get back to you,\" in writing, accept, decline", "T": "On Monday, Barbara Clark called me with a job offer. \"We'd like to offer you the project engineer position. The salary is eighty-five thousand dollars a year, with benefits and two weeks of vacation. We'd like you to start on March 2nd.\" I was so excited I almost said yes immediately. But Ron had told me, \"Never accept on the phone. Say thank you, and ask for time.\" So I said, \"Thank you so much, Barbara. I'm very excited about this offer. Could you send it to me in writing? I'd like to review it, and I'll get back to you by Wednesday.\" \"Of course. I'll email it this afternoon.\" That evening, I called Ron. \"Is it normal to negotiate here?\" I asked. \"It's normal,\" he said. \"Most employers expect it. Just be polite and give a reason. What's the market salary for your role?\" \"Between eighty-five and ninety-five thousand.\" \"So they offered the bottom of the range. You can ask for more. And ask about vacation too. Two weeks is the legal minimum after one year. Many companies give three.\" On Wednesday morning, I called Barbara. \"Hi Barbara, thank you again for the offer. I really want to join your team. I've reviewed the offer, and I'd like to discuss two things. First, based on my twelve years of experience and the market for this role, would there be any flexibility on the salary? I was hoping for ninety-two thousand.\" There was a short silence. \"I'll need to talk to our director. What's the second thing?\" \"Would it be possible to have three weeks of vacation? My family is in Brazil, and it's a long trip.\" \"That's a reasonable request. Let me get back to you this afternoon.\" At three o'clock, she called. \"Good news. We can't do ninety-two, but we can offer eighty-nine thousand. And we can give you three weeks of vacation starting in your first year.\" \"Thank you, Barbara. That sounds great. I'm happy to accept.\" \"Wonderful. I'll send you an updated offer letter today. Please sign it and send it back.\" When I hung up, I called Ron. \"Did they say yes?\" he asked. \"Almost,\" I said. \"Four thousand dollars more, and an extra week of vacation. Just for asking politely.\"", "words": 376}, {"num": 80, "title": "Rejections and Following Up", "F": "professional emails, polite follow-up, was, would, will, dates", "V": "rejection email, \"After careful consideration,\" \"We've decided to move forward with other candidates,\" \"We'll keep your resume on file,\" follow up, \"I'm writing to follow up on...,\" feedback, \"Thank you for the opportunity,\" resilience", "T": "Two weeks after my final interview, I got an email. The subject was \"Your application.\" I knew what it said before I opened it. \"Thank you for your interest in the Marketing Coordinator position. After careful consideration, we've decided to move forward with other candidates. We'll keep your resume on file for future opportunities. We wish you all the best in your job search.\" I closed my laptop. It was my fourth rejection that month. It still hurt. That evening, I talked to my friend Ron. \"What should I do? Should I reply?\" \"Yes, you should. A short, professional reply. Thank them, and ask for feedback.\" \"Won't that look desperate?\" \"Not at all. It shows you're professional. And sometimes the person they chose doesn't work out, and they call the second choice.\" So I wrote a short email to the hiring manager, Deb. \"Dear Deb, thank you for letting me know, and thank you for the opportunity to interview with your team. I enjoyed learning about your work. If you have a moment, I'd really appreciate any feedback that could help me in future interviews. I hope our paths cross again. Best regards.\" Two days later, she replied. \"Thank you for your kind message. It was a very close decision. You were one of our top two candidates. The other candidate had more experience with Canadian social media tools. If you get some experience with those, you'd be a very strong candidate.\" That was the most useful feedback I'd received. I signed up for a free online course that same week. Ron also taught me how to follow up when a company doesn't answer at all. \"If it's been a week after the date they gave you, send a polite email: 'I'm writing to follow up on my interview on March 3rd. I'm still very interested in the position. Is there any update on the timeline?'\" A month later, I was studying for my course when my phone buzzed. It was an email from Deb. \"Hi! The person we hired for the coordinator role has decided to move to Toronto. Are you still interested?\" I read it three times. Then I replied: \"Yes. Absolutely.\"", "words": 364}, {"num": 81, "title": "The Survival Job", "F": "talking about difficult situations, was/wasn't, did, have to, will, -ed", "V": "survival job, shift, minimum wage, part-time, overqualified, \"pay the bills,\" \"It's temporary,\" stepping stone, schedule, \"keep your eye on the goal,\" career", "T": "Four months after we arrived in Canada, our savings were almost gone. I was a dentist in Brazil, but I couldn't work as a dentist here yet. I needed to pass several exams first, and that could take two years. \"We need money now,\" my wife said. The next week, I got a job at a warehouse in Richmond, packing boxes. I worked the night shift, from ten p.m. to six thirty a.m. On my first night, a coworker named Jeff showed me what to do. \"Grab the order, pack it, scan it, and put it on this belt. Try to do about eighty an hour.\" At four in the morning, my back hurt, and my hands were tired. I thought, \"Twenty years of studying and working, and now I'm packing boxes.\" Jeff sat down next to me. \"First job in Canada?\" he asked. \"Yes. In Brazil, I was a dentist.\" \"No way. Me too, kind of. I was a pharmacist in the Philippines. I worked here for a year and a half while I did my exams. Now I work at a pharmacy three days a week, and here two nights, until I finish my last exam.\" \"Does it get easier?\" \"The work doesn't get easier. But you get used to it. The important thing is to keep your eye on the goal. This is a survival job. It pays the bills. It's temporary.\" \"Sometimes I feel embarrassed.\" \"Don't. Everyone in this lunchroom has a story. That guy over there was an engineer in Iran. She was a lawyer in Ukraine. Nobody here thinks less of you.\" That changed how I felt. The job wasn't my career. It was a stepping stone. I made a schedule: I slept in the morning, studied from two to seven, spent time with my family, and went to work at ten. On my days off, I studied more. It was the hardest year of my life. Twenty months later, I passed my final exam. On my last night at the warehouse, Jeff brought a cake. \"To the new Canadian dentist,\" he said. Everyone clapped. \"Thank you for everything,\" I told him. \"You helped me more than you know.\" \"Just remember us,\" he said, \"when we need a cleaning.\"", "words": 375}, {"num": 82, "title": "Your First Pay Stub", "F": "payroll numbers, percentages, does, why/what questions, -ed", "V": "pay stub, pay period, biweekly, gross pay, net pay, deductions, income tax (federal and provincial), CPP (Canada Pension Plan), EI (Employment Insurance), benefits, vacation pay, statutory holiday, overtime, direct deposit", "T": "Two weeks after I started my new job, I got my first pay. I was excited, until I looked at my bank account. The next day, I asked Lorraine from HR. \"Can you help me understand my pay stub? I think there's a mistake.\" \"Sure. Let's look at it together.\" She pointed at the top. \"This is your pay period. You're paid biweekly, so every two weeks. This number is your gross pay. That's your full salary for the two weeks, before deductions.\" \"And this number at the bottom?\" \"That's your net pay, what you actually receive after deductions.\" \"Why is the difference so big?\" \"Let's go through them. First, income tax. There's federal tax, for the Government of Canada, and provincial tax, for B.C. Together, they're the biggest deduction.\" \"Okay. And CPP?\" \"That's the Canada Pension Plan. It's money for your retirement. You pay a percentage of your salary, and the company pays the same amount. When you retire, you'll get a monthly pension.\" \"And EI?\" \"Employment Insurance. If you lose your job, or if you have a baby, EI can pay part of your salary for a while.\" \"So it's not lost money.\" \"Exactly. It's protection. This last one is for your health and dental benefits. You pay a small part, and the company pays the rest.\" \"Why does this line say vacation pay?\" \"That's for our hourly staff. In B.C., hourly employees get at least four percent vacation pay. You're on a salary, so you get paid vacation days instead.\" \"And what if I work on a holiday?\" \"If you work on a statutory holiday, like Canada Day, you get paid more, time and a half. And overtime is paid for anything over eight hours a day or forty hours a week.\" \"In Brazil, we have a thirteenth salary in December. Do you have that here?\" Lorraine laughed. \"No, sorry. No thirteenth salary in Canada.\" \"That's the saddest news of all,\" I said. That night, I explained everything to my husband. \"So the money isn't gone,\" I said. \"Part of it goes to our retirement, part to insurance, and part to taxes.\" \"And when we file our taxes in April?\" \"If we paid too much, we'll get some back.\" He smiled. \"Then I'll wait for April.\"", "words": 379}]}, {"part": 11, "title": "At the Office", "desc": "Everyday life at work.", "scripts": [{"num": 83, "title": "First Day at the Office", "F": "14/40, extension numbers, times, did, does, can, will", "V": "reception, HR (human resources), onboarding, key fob, IT, login, password, benefits, probation period, extension, direct deposit, team lead", "T": "On my first day at my new job, I arrived at eight forty-five. The office is on West Hastings Street, on the fourteenth floor. In the elevator, I almost pressed forty. At reception, a woman smiled at me. \"Good morning! Can I help you?\" \"Hi, it's my first day. I'm here to see Karen in HR.\" A minute later, Karen came out. \"Hi, welcome to the team! Let's start with your onboarding. It'll take about an hour.\" First, she gave me a key fob. \"This opens the front door and the elevator after six p.m. Please don't lose it.\" Then she gave me a folder. \"Here's the information about your benefits: dental, medical, and eye care. You're covered after three months.\" \"Does that mean I have a probation period?\" \"It does. It's three months. Don't worry. It's normal.\" \"When do we get paid?\" \"Every second Friday, by direct deposit. Please fill out this form with your bank information.\" Next, she took me to IT. A guy named Kevin set up my laptop. \"Your login is your first initial and your last name. Your temporary password is on this paper. You'll change it when you log in. It needs at least twelve characters.\" Then Karen introduced me to my team lead, Greg. \"Hey, welcome aboard,\" Greg said. \"Did you find the office okay?\" \"I did. But I almost went to the fortieth floor.\" He laughed. \"There is no fortieth floor. This building only has twenty-two.\" He showed me my desk. \"Your phone extension is four one seven. The kitchen is at the end of the hall. There's free coffee, but please wash your mug. People get upset about that.\" \"Good to know.\" \"We have a team meeting every Monday at nine thirty. And on Fridays, we usually get lunch together.\" At noon, three people from my team invited me to lunch at a sushi place on Pender Street. At four thirty, Greg stopped by my desk. \"How was your first day?\" \"It was good. A lot of information.\" \"Don't worry. Nobody remembers everything on day one. If you have questions, just ask.\"", "words": 351}, {"num": 84, "title": "The Monday Team Meeting", "F": "meeting language, asking someone to repeat, 13/30 percent, dates, didn't, does, will", "V": "agenda, update, deadline, on track, behind schedule, budget, follow up, loop someone in, \"Does that work for everyone?\", \"Sorry, I didn't catch that,\" action items", "T": "At nine thirty on Monday, our team met in the small meeting room. Greg stood at the front. \"Morning, everyone. We've got a lot on the agenda, so let's get started. Quick updates first. Linda, how's the Harbour project?\" \"It's on track. We finished the design last week, and the client approved it on Friday.\" \"Great. Tom?\" \"The website project is a little behind schedule. The developer got sick, so we lost three days.\" \"Can you still finish by the thirtieth?\" \"I think so, but it'll be tight.\" Greg turned to me. \"And how are you settling in?\" \"Good, thanks. I finished the training, and I started the report on last quarter's sales.\" \"Perfect. Speaking of sales, sales went up thirteen percent last quarter.\" I wasn't sure what I heard. In the past, I was afraid to ask. But I decided to be brave. \"Sorry, I didn't catch that. Was it thirteen or thirty?\" \"Thirteen. One-three. Thirty would be a miracle.\" Everyone laughed, and I relaxed. \"Good question, though,\" Greg said. \"It's important to get the numbers right. Now, the budget. We have twelve thousand dollars left for the rest of the year. That has to cover the conference in Toronto and the new software.\" \"Does that include flights?\" Linda asked. \"It does. So please book early.\" \"Who's going to Toronto?\" Tom asked. \"Linda and I. Tom, you'll stay here and finish the website.\" \"The client meeting with Pacific Foods is on Thursday at two. Linda, can you loop our new team member in? I'd like her to take notes.\" \"Sure. I'll forward the email.\" \"So, action items. Tom will finish the website by the thirtieth. Linda will book the flights by Wednesday. And our new team member will finish the sales report by Friday. Does that work for everyone?\" Everyone nodded. After the meeting, Linda came to my desk. \"That was a good question about the numbers. A lot of people don't ask, and then they make mistakes.\" \"In my last job, I didn't ask enough,\" I said. \"Here, I will.\"", "words": 342}, {"num": 85, "title": "Calling in Sick", "F": "leaving a voicemail, days and dates, didn't, can, will/won't, should", "V": "call in sick, voicemail, sick day, paid sick days, doctor's note, cover (for someone), vacation request, work from home, feel better", "T": "On Tuesday morning, I woke up with a fever and a terrible sore throat. I could barely talk. It was seven fifteen. I had to tell my manager before nine. I called Greg, but he didn't answer, so I left a voicemail. \"Hi Greg, it's me. I'm sorry, but I'm sick today. I have a fever and a sore throat, so I won't be in. I'll check my email this afternoon if I can. I think Linda can cover the client call at ten. I sent her the notes yesterday. I'll let you know tomorrow morning how I'm feeling. Thanks.\" Then I sent Linda a text. \"Hi Linda, I'm sick today. Can you cover the Pacific Foods call at ten? The notes are in the shared folder.\" She answered five minutes later. \"No problem! Feel better. Drink lots of tea.\" At ten thirty, Greg called me back. \"Hey, I got your message. How are you feeling?\" \"Not great.\" \"Don't worry about work. Just rest. Linda's got the call.\" \"Thanks. Do I need a doctor's note?\" \"No. In B.C., employers can't ask for a doctor's note for short absences like this.\" \"Does this count as a sick day?\" \"Yes. After three months, you get five paid sick days a year. You aren't there yet, but don't worry. We'll pay you for today.\" I stayed in bed all day. On Wednesday, I felt a little better, but I still had a cough. I sent Greg an email. \"Good morning, Greg. I'm feeling better, but I still have a cough. Would it be okay if I worked from home today? I don't want to make anyone else sick.\" He answered right away. \"Of course. Thanks for thinking of the team.\" On Thursday, I went back to the office. Linda smiled at me. \"Welcome back! The call went fine. The client asked about you.\" \"Thanks for covering for me.\" \"Anytime.\" Before lunch, I opened the HR system and submitted a vacation request for the last two weeks of December. I wanted to visit my family in Brazil. That afternoon, I got an email: \"Your vacation request has been approved.\" I smiled. Being sick wasn't fun, but at least my week ended well.", "words": 368}, {"num": 86, "title": "Taking a Phone Message", "F": "spelling names, phone numbers, email addresses (at, dot, underscore, dash), dates, can/can't, will, did", "V": "take a message, \"May I ask who's calling?\", \"Could you spell that?\", \"Let me read that back,\" extension, return a call, urgent", "T": "On Wednesday afternoon, Greg's phone rang at his desk, but Greg was in a meeting. It rang again and again, so I picked it up. \"Good afternoon, Greg Walker's desk. How can I help you?\" \"Hi, this is Matthew Thornton from Pacific Foods. Is Greg available?\" \"I'm sorry, he's in a meeting right now. Can I take a message?\" \"Sure. Please ask him to call me back today.\" \"Of course. Could you spell your last name, please?\" \"T-H-O-R-N-T-O-N.\" \"Thank you. And what's the best number to reach you?\" \"Six oh four, five five five, twenty-nine fifty. Extension twelve.\" \"Let me read that back. Six oh four, five five five, two nine five zero, extension one two.\" \"That's right.\" \"May I ask what it's about?\" \"It's about the contract. We need to change the delivery date from the 18th to the 22nd. It's urgent.\" \"Does Greg have your email address?\" \"He does, but here it is, just in case. It's m underscore thornton at pacific dash foods dot c-a.\" \"M underscore thornton, at pacific, dash, foods, dot c-a?\" \"Exactly.\" \"Thank you, Mr. Thornton. I'll give Greg the message as soon as his meeting finishes.\" I wrote the message on a sticky note and put it on Greg's screen: \"Matthew Thornton, Pacific Foods. Call back today, urgent. 604-555-2950, ext. 12. Wants to change the delivery date from the 18th to the 22nd.\" At three fifteen, Greg came back. He read the note and looked at me. \"Did you take this message?\" \"I did. He said it was urgent.\" \"This is perfect. You got the number, the extension, and the reason. Most people just write 'Matt called.'\" He called Mr. Thornton back right away. Ten minutes later, he came to my desk. \"We can do the 22nd. That was a big order. Thanks for picking up my phone.\" \"No problem,\" I said. \"But I was nervous. Phone calls are harder than talking in person.\" \"Why?\" \"You can't see the person's face, and you can't see their mouth.\" Greg nodded. \"That makes sense. But you did great. And asking him to spell his name was smart. Thornton is a hard one.\"", "words": 357}, {"num": 87, "title": "Scheduling a Meeting Across Time Zones", "F": "time zones, times and days, can, does/doesn't, would/could", "V": "time zone, Pacific time, Eastern time, Atlantic time, calendar invite, available, \"Does that work for you?\", booked, \"Something came up,\" video call", "T": "On Monday, Greg asked me to organize a video call with our partners in Toronto and Halifax. \"We need one hour with all of them this week,\" he said. \"Can you find a time that works?\" \"Sure. What time zones are they in?\" \"Toronto is Eastern time. That's three hours ahead of us. Halifax is Atlantic time. That's four hours ahead.\" First, I sent an email to Sandra Mitchell in Toronto. \"Hi Sandra, I'm organizing a call with our team, your team, and the Halifax office. Are you available on Wednesday or Thursday afternoon?\" She answered twenty minutes later. \"Hi! Wednesday afternoon I'm booked. Thursday, I'm free from one to four, Eastern time.\" One to four in Toronto. That's ten to one in Vancouver. Then I emailed Brian Doyle in Halifax. \"Hi Brian, would Thursday work for a one-hour call?\" \"Thursday's good,\" he wrote. \"But I leave at four thirty, Atlantic time.\" Four thirty in Halifax is twelve thirty in Vancouver. So the call had to finish by twelve thirty our time. Greg had a meeting from ten to eleven on Thursday. So the call could be from eleven thirty to twelve thirty, Vancouver time. That's two thirty in Toronto and three thirty in Halifax. I checked it twice. Then I asked Greg. \"How about Thursday, eleven thirty to twelve thirty our time?\" \"Does that work for Halifax? Brian always leaves early.\" \"It does. It finishes at four thirty his time, right when he leaves.\" \"Nice work. Send the invite.\" On Wednesday, Sandra emailed again. \"So sorry! Something came up. Could we move the call to three o'clock Eastern?\" Three o'clock in Toronto is twelve o'clock in Vancouver. We would finish at one, but Brian leaves at twelve thirty our time. It didn't work. I wrote back, \"Unfortunately, three o'clock Eastern doesn't work for Halifax. Could you do two forty-five Eastern for forty-five minutes instead?\" \"Perfect,\" Sandra wrote. I updated the invite. On Thursday, the call started on time, with everyone there. After the call, Greg said, \"That was a tricky one. How did you do it?\" I showed him my notebook. It was full of times and arrows. \"Lots of math,\" I said.", "words": 364}, {"num": 88, "title": "The Email Mistake", "F": "apologizing and fixing a mistake, did/didn't, was, should have, -ed", "V": "attachment, recall an email, confidential, \"Please disregard,\" \"My apologies,\" take responsibility, heads-up, \"It happens\"", "T": "On Friday afternoon, I finished a price quote for a client, Coast Furniture. I attached the file, wrote a short email, and clicked \"Send.\" Then I looked at the screen, and my stomach dropped. I didn't send it to Coast Furniture. I sent it to Coast Flooring, a different client. And the file had our prices and discounts in it. It was confidential. I walked to Linda's desk. \"Linda, I made a big mistake.\" I explained what happened. She listened calmly. \"Okay. First, take a breath. When did you send it?\" \"About two minutes ago.\" \"Did you try to recall it? Sometimes you can recall a message if the person didn't open it yet.\" I went back to my desk and tried. A message appeared: \"Recall failed.\" \"It didn't work,\" I told her. \"Then you need to tell Greg right away. It's always better if he hears it from you first.\" I walked to Greg's office. My heart was beating fast. \"Greg, do you have a minute? I need to give you a heads-up about something.\" \"Sure. What's up?\" \"I sent the Coast Furniture price quote to the wrong client. I'm really sorry. I should have checked the address before I clicked 'Send.'\" Greg was quiet for a moment. Then he said, \"Okay. Thanks for telling me right away. Send a short email to Coast Flooring. Say the email was sent by mistake, and ask them to delete it. Keep it simple and polite.\" I wrote the email, and Greg checked it: \"Hello, I sent you an email a few minutes ago by mistake. It was meant for another client. Please disregard it and delete it. My apologies for the confusion.\" Twenty minutes later, they replied: \"No problem. Deleted. Have a great weekend!\" I felt so relieved. Then I sent the quote to Coast Furniture, and this time I checked the address three times. Before I left, Greg stopped by my desk. \"Don't worry too much about it. It happens to everyone. I once sent a salary spreadsheet to the whole company. The important thing is that you told me right away. You didn't hide it.\" On the bus home, I thought about it. It's okay to make a mistake, as long as you take responsibility and fix it.", "words": 379}, {"num": 89, "title": "The Three-Month Review", "F": "feedback language, does, will, -ed", "V": "performance review, probation, strengths, areas for improvement, feedback, goals, speak up, professional development, \"going forward\"", "T": "Three months after I started, Greg sent me a calendar invite: \"Three-Month Review, Thursday, 2:00 p.m.\" I was nervous all week. On Thursday, I knocked on the door at two o'clock exactly. \"Come in,\" Greg said. \"Don't look so worried. This is a good conversation.\" I sat down. \"As you know, your probation period ends this week. I'm happy to tell you that you passed. You're officially part of the team.\" I smiled. \"Thank you. That's a relief.\" \"Let's talk about how things are going. First, your strengths. Your sales report last month was excellent. The numbers were accurate, and the charts were very clear. The client asked who made it.\" \"Really?\" \"Really. Also, you're always on time, and you finish your work before the deadline. People notice that. Now, areas for improvement. In meetings, you don't speak up very often. You have good ideas. I've seen them in your emails. But in meetings, you're quiet.\" \"That's true. Sometimes I'm afraid my English isn't good enough.\" \"Your English is fine, and the team wants to hear from you. Going forward, I'd like you to share at least one idea in every Monday meeting. Does that sound fair?\" \"That sounds fair. I'll try.\" \"Second, your emails are sometimes very long. Busy people don't read long emails. Try to put the most important information in the first two lines.\" \"Okay. In Brazil, we usually start with more greetings and context.\" \"That's common. Here, people like it short and direct, but still polite.\" Then he opened a folder. \"Now, some good news. The company has a professional development budget. You can spend up to one thousand dollars a year on courses.\" \"Can I use it for an English course?\" \"You can. A business writing course would be perfect.\" \"What are my goals for the next three months?\" \"Three goals. Speak up in meetings, keep your emails shorter, and take the lead on one small project. Linda can mentor you.\" \"Thank you, Greg.\" \"Thank you. You've done a great job. We're glad you're here.\" I walked out smiling. Linda looked up from her desk. \"Well?\" \"I passed.\" \"I knew you would,\" she said.", "words": 359}, {"num": 90, "title": "Disagreeing with Your Manager", "F": "polite disagreement and receiving criticism, would/could, didn't, doesn't, was, dates", "V": "concern, \"I see your point, but...\", \"Could I suggest...?\", \"I'm not sure that...\", feedback, criticism, deadline, realistic, compromise, \"fair enough,\" \"Thanks for flagging that\"", "T": "On Tuesday, Greg called me into his office. \"I need the client report by Friday instead of next Wednesday,\" he said. \"The client moved their meeting.\" I felt my face get hot. The report had three sections, and I had only finished one. In Brazil, I might say, \"That's impossible.\" But in Canada, I've learned that people disagree more softly. So I took a breath. \"I see why you need it earlier. But I'm not sure Friday is realistic for the whole report. The data from the Toronto office isn't ready yet. They said it won't arrive until Thursday afternoon.\" Greg frowned. \"Hmm. I didn't know that.\" \"Could I suggest something? I could finish the first two sections by Friday. Those are the most important ones for the meeting. Then I'd send the full report on Tuesday.\" Greg thought about it. \"That's fair enough. Thanks for flagging that. Let's do it your way.\" I felt relieved. But the next week, Greg had some feedback for me. He came to my desk with the report. \"The report was good, and the client was happy. But I want to mention one thing. In the meeting on Friday, when the client asked about the budget, you said, 'That's wrong.' It was true, but it sounded a little harsh.\" My first reaction was to defend myself. In Portuguese, \"that's wrong\" isn't rude. But I stopped and listened. \"What would be better?\" I asked. \"Something like, 'I think those numbers might be from an older version. Let me double-check.' It says the same thing, but the client doesn't lose face.\" \"I understand. I didn't mean to be rude. In Brazil, we're more direct.\" \"Honestly, sometimes I wish we were. People here can be so indirect that nobody knows what was decided.\" He smiled. \"I know you didn't mean it. That's why I'm telling you. You're doing great work, and I want people to hear your ideas, not just your tone.\" \"Thanks for telling me, Greg. I'd rather know than not know.\" \"That's a great attitude.\" That evening, I wrote down some phrases in my notebook: \"I see your point, but...\", \"Could I suggest...?\", \"I might be wrong, but...\", and \"Let me double-check.\" The next time I disagreed with someone, I used one. It worked.", "words": 379}, {"num": 91, "title": "The Bad Video Call", "F": "video call language, didn't, can, is, was, times, could", "V": "\"You're on mute,\" \"Can you hear me?\", \"You're breaking up,\" \"You froze,\" \"Can you see my screen?\", share your screen, camera, connection, \"Let's take this offline,\" reschedule, \"I'll drop off and rejoin,\" chat", "T": "On Thursday at ten, I had my first video call with our clients in Calgary. I joined early and turned on my camera. At ten o'clock, Linda and two people from Calgary joined: Scott and Heather. \"Good morning, everyone,\" Linda said. \"Can everyone hear me?\" \"Yes,\" said Scott. Heather's mouth was moving, but there was no sound. \"Heather, I think you're on mute,\" Linda said. Heather clicked something. \"Sorry about that! Can you hear me now?\" \"Yes, loud and clear.\" Then it was my turn to present the project update. \"Okay, I'll share my screen. Can you see my screen?\" \"We can see it,\" Scott said. \"It's the first slide, right?\" \"Yes. So, as you can see, we finished the design phase on the fourteenth, and...\" \"Sorry, you're breaking up,\" Heather said. \"Can you repeat that?\" I moved closer to my router. \"Is that better?\" \"A little. You froze for a second.\" I started again. \"We finished the design phase on the fourteenth, and we're now in testing.\" Suddenly, my screen went black. My internet connection was gone. I restarted my router, but it took two minutes. When I rejoined, Linda was talking. \"Oh, you're back! We lost you.\" \"I'm so sorry. My connection dropped.\" \"No problem. It happens.\" Scott asked a question about the budget, but his audio was very quiet. \"Sorry, Scott, I didn't catch that. Could you say it again?\" \"I asked if the budget includes the testing phase.\" \"It does. Everything is included until the launch.\" Then Heather said, \"I have a question about the timeline, but it's a bit complicated. Maybe we should take this offline.\" \"Good idea,\" Linda said. \"Heather, can you send your question by email, and we'll set up a separate call?\" \"Sounds good.\" At ten fifty, Linda said, \"I think we covered everything. I'll send a summary in the chat and by email. Thanks, everyone.\" After the call, I sent Linda a message: \"Sorry about my internet. That was embarrassing.\" She wrote back, \"Don't worry. Everybody's internet fails sometimes. Next time, try using a cable instead of Wi-Fi. And keep your phone ready, so you can join by phone if your computer drops.\" I bought a network cable that afternoon.", "words": 369}]}, {"part": 12, "title": "On the Construction Site", "desc": "Safety, measurements, and site vocabulary.", "scripts": [{"num": 92, "title": "Safety Orientation on a Construction Site", "F": "rules and instructions (must, have to, don't, can't), times, 3 metres/10 feet, doesn't, did", "V": "site supervisor, orientation, PPE (personal protective equipment), hard hat, steel-toed boots, high-vis vest, safety glasses, fall protection, harness, WorkSafeBC, first aid attendant, muster point, toolbox talk, sign in/sign out, refuse unsafe work", "T": "On my first morning at the construction site in Burnaby, I arrived at six forty-five. The site supervisor, Doug, met me at the trailer. \"You're the new guy? Welcome. Before you do anything, we need to do your safety orientation.\" He gave me a clipboard. \"Every morning you sign in here, and every afternoon you sign out. If there's an emergency, we need to know who's on site.\" Then he pointed at my clothes. \"Hard hat, steel-toed boots, high-vis vest, and safety glasses. That's your PPE. You wear it all the time on site. No exceptions.\" We walked outside. The building had five floors, but only the first three had walls. \"Fall protection,\" Doug said. \"If you're working more than three metres high, that's about ten feet, you must wear a harness, and it must be tied off. Did you get fall protection training?\" \"I did, in Brazil.\" \"Okay, but you'll need to do our course too. It's on Thursday. Until then, you don't work above three metres.\" He pointed to a green sign near the gate. \"That's the muster point. If you hear three long horn blasts, stop what you're doing and walk here. Don't run. Don't go back for your tools.\" \"Who's the first aid attendant?\" \"Helen. She's in the blue trailer. If you get hurt, even a small cut, you report it to her. Every injury gets written down. That's the law with WorkSafeBC.\" Then Doug looked at me seriously. \"One more thing. In
