 B.C., you have the right to refuse unsafe work. If something doesn't look safe, you stop and tell me. You won't get in trouble. I'd rather lose ten minutes than lose a worker.\" \"Understood.\" \"Every morning at seven, we have a toolbox talk. It's a short safety meeting. Today's topic is ladders. Coffee break is at nine, lunch is at noon for thirty minutes, and we finish at three thirty. Any questions?\" \"Just one. Where's the washroom?\" He pointed at three blue boxes by the fence. \"Welcome to construction.\"", "words": 336}, {"num": 93, "title": "Feet, Inches, and the Wrong Delivery", "F": "imperial measurements, 14/40, 16 inches, fractions (a half, a quarter), did/didn't, was/wasn't, can, -ed", "V": "foreman, apprentice, two-by-four, stud, on centre, drywall, sheet, tape measure, drawings, delivery, order, invoice, \"heads up!\", near miss", "T": "On Tuesday, my foreman, Rick, gave me my first real job. \"We're framing the walls on the second floor today. Grab a tape measure.\" \"In metres?\" I asked. Rick laughed. \"Not on this site. The country uses metres, but construction uses feet and inches. You'll get used to it.\" He pointed at a pile of wood. \"Those are two-by-fours. Cut ten of them to eight feet, six and a half inches. Then we put the studs up, sixteen inches on centre.\" \"Sixteen inches on centre?\" \"The middle of one stud to the middle of the next stud is sixteen inches.\" I measured, marked, and cut the first board. Rick checked it. \"That's eight six and a quarter. You need a half.\" \"Sorry. The lines on the tape measure are very small.\" \"Everybody makes that mistake at first. The long line in the middle of the inch is a half. The shorter lines are quarters.\" I cut the next nine boards perfectly. At ten o'clock, a delivery truck arrived with drywall. The driver handed Rick the invoice. Rick read it and frowned. \"Forty sheets? We ordered fourteen.\" \"It says forty here,\" the driver said. Rick called Gary, who placed the order. \"Did you order fourteen or forty sheets of drywall?\" He listened, then laughed. \"He said fourteen. The supplier heard forty.\" The driver shrugged. \"I can take twenty-six back, but you'll need to call the office.\" Rick looked at me. \"See? Even Canadians confuse fourteen and forty.\" After lunch, we were carrying drywall inside when someone on the third floor shouted, \"Heads up!\" I looked up. A small piece of wood fell and landed about a metre away from me. Rick ran over. \"Are you okay?\" \"I'm okay. It didn't hit me.\" \"Good. That's a near miss. We have to report it, even if nobody got hurt.\" He called Doug, and they found the problem: a board wasn't tied down near the edge. The next morning, the toolbox talk was about falling objects. Doug said, \"Yesterday, we got lucky. Luck isn't a safety plan.\" When I got home, my wife asked, \"How was your day?\" \"I learned three things,\" I said. \"Half an inch, sixteen inches on centre, and when someone yells 'heads up,' you look up fast.\"", "words": 377}]}, {"part": 13, "title": "Business Meetings Around Vancouver", "desc": "Fictional meetings set at well-known Vancouver organizations.", "scripts": [{"num": 94, "title": "BC Hydro: The Storm Review Meeting", "F": "meeting language, numbers (customers, percentages, hours), did/didn't, was, will, should", "V": "agenda, outage, restore power, crews, call centre, wait time, outage map, vegetation management, lessons learned, \"What went well?\", \"What could we do better?\", action items, owner, deadline", "T": "On Monday morning, our team at BC Hydro met to review last week's windstorm. Our manager, Sandra, started the meeting at nine sharp. \"Thanks for coming, everyone. I know it was a long week. Today, we'll look at three things: what happened, what went well, and what we could do better.\" She showed a chart on the screen. \"At the peak of the storm, about one hundred and twenty thousand customers were without power. Within twenty-four hours, we restored power to ninety percent of them. The last customers got their power back after three days.\" \"Where were the biggest problems?\" I asked. I was the newest engineer on the team, but I had learned to speak up. \"Mostly the North Shore and the Fraser Valley,\" said Marnie, who manages the field crews. \"Trees fell on the lines. In some places, the roads were blocked, so our crews couldn't get there.\" \"What went well?\" Sandra asked. \"The crews did an amazing job,\" Marnie said. \"Some of them worked sixteen-hour shifts.\" \"And the outage map worked,\" said Blair from customer service. \"Over two million people checked it during the storm, and it didn't crash.\" \"What could we do better?\" Blair looked at his notes. \"The call centre. The average wait time was forty minutes. People were frustrated. Some of them waited over an hour.\" \"That's too long,\" Sandra said. \"What do you suggest?\" \"We could add a recorded message with the latest update, so people don't need to wait for an agent. And we could bring in extra staff before the storm, not after.\" \"Good idea. Marnie?\" \"Vegetation management. We need to trim more trees near the lines before winter, especially on the North Shore.\" Sandra nodded. \"Okay. Let's recap the action items. Blair will prepare a plan for extra call centre staff and the recorded message. Marnie will send me a list of the highest-risk areas for tree trimming. And our new engineer will analyze which lines failed most often.\" \"When do you need it?\" I asked. \"By the end of the month. Is that realistic?\" \"Yes, that works.\" \"Great. Any other business?\" Nobody said anything. \"Then let's wrap up. Thanks again, everyone. You kept the lights on.\"", "words": 367}, {"num": 95, "title": "Vancouver Coastal Health: Planning for Respiratory Season", "F": "healthcare meeting language, percentages, dates, will/won't, should, can/can't, do", "V": "respiratory season, flu, COVID-19, RSV, occupancy, admitted patients, beds, staffing, overtime, sick calls, surge plan, vaccine clinic, infection control, \"Can I add something?\", \"Let's circle back\"", "T": "In September, the nursing managers at Vancouver General Hospital met to plan for respiratory season. I'm a nurse on the medical unit, and my manager, Janet, asked me to join the meeting. \"Good afternoon, everyone,\" said Dr. Morrison, who led the meeting. \"Every year, from November to March, we see more patients with the flu, COVID, and RSV. Last year, our medical units were at one hundred and ten percent occupancy in January. That means we had more patients than beds.\" \"Where did the extra patients go?\" someone asked. \"Some stayed in Emergency for hours, waiting for a bed upstairs. Some were in hallways. We don't want that again.\" Janet raised her hand. \"Staffing is our biggest problem. Last January, sick calls went up by thirty percent, and nurses worked a lot of overtime. People are tired.\" \"What do you suggest?\" \"We should build a list of casual nurses now, not in December. And we should plan the holiday schedule early, so people know when they're working.\" \"Good. Can I add something?\" said Paul from infection control. \"Staff vaccination. Last year, only sixty percent of our staff got the flu vaccine. We'd like to reach seventy-five percent.\" \"How can we do that?\" \"We'll run vaccine clinics on every unit, on day and night shifts. Nurses won't have to go anywhere. We'll come to them.\" \"I like that,\" I said. \"On nights, it's hard to leave the unit.\" Dr. Morrison wrote on the whiteboard. \"What about the surge plan? If occupancy goes over one hundred percent, which beds can we open?\" \"There's an empty unit on the fifth floor,\" Janet said. \"But we can't open it without more staff.\" \"Let's circle back on that next week, after I talk to the director.\" At the end of the meeting, Dr. Morrison summarized. \"So, three things. Janet will start the casual nurse list. Paul will schedule the vaccine clinics, starting October 15th. And I'll confirm the surge plan by next Friday.\" As we walked out, Janet said to me, \"What did you think?\" \"It was very organized,\" I said. \"In Brazil, our meetings were longer, and we didn't always leave with a plan.\" She laughed. \"Trust me. Some of our meetings are like that too.\"", "words": 372}, {"num": 96, "title": "TransLink: Fixing a Crowded Bus Route", "F": "data and percentages, times, ridership numbers, did, does, will, could", "V": "route, ridership, peak hours, crowding, pass-ups, frequency, \"every eight minutes,\" service change, budget, survey, feedback, trade-off, \"What's the timeline?\", \"I'd like to push back a little\"", "T": "I work as a transit planner at TransLink. On Wednesday, our team met to talk about one of our busiest bus routes. Our manager, Neil, opened the meeting. \"We've received a lot of complaints about this route. Let's look at the data.\" I shared my screen. \"Ridership on this route has gone up twenty percent in the last year. During peak hours, from seven to nine in the morning, the buses are very crowded. We also had over three hundred pass-ups last month. A pass-up is when a bus is too full to pick up more passengers, so it drives past the stop. People have to wait for the next bus.\" \"And how often do the buses come right now?\" \"Every twelve minutes in the morning peak.\" Dana, from our customer team, added, \"We did a survey last month. Seventy percent of riders said crowding was their biggest problem. Many people said they were late for work or school.\" \"So what are our options?\" Neil asked. \"Option one,\" I said, \"we add more buses, so they come every eight minutes during peak hours. Option two, we use longer buses, the articulated ones, on this route.\" \"What does each option cost?\" \"Option one needs six more buses and drivers. Option two needs four longer buses, but we don't have any extra ones right now.\" Greg, from the operations team, spoke up. \"I'd like to push back a little on option one. We don't have enough drivers at the moment. We're still hiring.\" \"That's a good point,\" Neil said. \"Could we do option one partly? Maybe every ten minutes instead of eight?\" \"We could,\" Greg said. \"We'd need three more drivers, not six. That's possible.\" \"What's the timeline?\" \"The next service change is in April,\" I said. \"If we decide by the end of this month, we can include it.\" \"Okay. Let's go with every ten minutes for now. We'll review the data again after three months. If it isn't enough, we'll look at the longer buses.\" Dana smiled. \"The riders will be happy.\" After the meeting, Neil said to me, \"Great analysis. The pass-up data made a big difference.\" \"Thanks,\" I said. \"I ride that route every day. I've been passed up twice this month.\"", "words": 374}, {"num": 97, "title": "Vancouver Public Library: Programs for Newcomers", "F": "program planning, attendance numbers, days and times, can, will, should, -ed", "V": "branch, program, conversation circle, attendance, waitlist, volunteer, facilitator, collection, languages, library card, partner, settlement agency, promote, feedback", "T": "I work as a library assistant at a Vancouver Public Library branch. Once a month, our programs team meets to talk about what's working and what isn't. This month, the meeting was at the Central Library on West Georgia Street. Our supervisor, Maureen, started with good news. \"Our English conversation circles are more popular than ever. Attendance went up forty percent this year. Every Tuesday and Thursday evening, the rooms are full, and we have a waitlist.\" \"That's great,\" said Owen, who plans the children's programs. \"But what do we do with the waitlist?\" \"That's our first problem,\" Maureen said. \"We need more volunteer facilitators. Right now, we have twelve volunteers. We need at least twenty.\" \"Where can we find them?\" Owen asked. \"Maybe we could ask people who finished the conversation circles last year,\" I said. \"Some of them speak very good English now, and they understand how newcomers feel.\" Maureen smiled. \"I like that idea. Can you make a list of past participants?\" \"Sure.\" \"Second item: our collection,\" Maureen said. \"Many newcomers ask for books in their own languages. Right now, we have good collections in Chinese, Punjabi, and Spanish, but not much in Portuguese or Ukrainian.\" \"I've noticed that,\" I said. \"Every week, Brazilian families ask me for Portuguese books for their kids.\" \"Can you put together a list of popular Portuguese children's books? We have a small budget left this year.\" \"Of course. I'll send it to you by Friday.\" \"Third, promotion. A lot of newcomers don't know they can get a library card for free. And with a card, they can borrow books, use the computers, and even take online courses.\" \"Should we partner with settlement agencies?\" Owen asked. \"They meet new families every day.\" \"Yes. Let's contact three agencies and ask them to share our program information.\" \"What about feedback?\" someone asked. \"Do we know what people want?\" \"We'll do a short survey at the conversation circles next month,\" Maureen said. \"Five questions, in simple English.\" At the end of the meeting, Maureen thanked everyone. \"The library is often the first place newcomers feel welcome. Let's keep it that way.\" On my way out, I thought about my first month in Vancouver. The library was the first place where I made a Canadian friend.", "words": 380}, {"num": 98, "title": "TD Bank: The Monday Morning Huddle", "F": "short team meeting, customer numbers, percentages, appointments, did, should, will", "V": "branch, huddle, customer experience, survey score, appointments, new-to-Canada customers, chequing account, newcomer package, fraud, scam, red flags, \"Heads up,\" \"Shout-out,\" \"Let's have a great week\"", "T": "Every Monday at eight forty-five, before the branch opens, our team at the TD branch on Main Street has a ten-minute huddle. We stand in a circle near the tellers. Our branch manager, Janice, holds a coffee and a clipboard. \"Good morning, team! Let's start with a shout-out. Last week, our customer survey score was ninety-two percent. That's our best score this year. One customer wrote about Terry. She said he helped her father open his first account and explained everything slowly and patiently.\" Everyone clapped, and Terry's face went red. \"Next, appointments. This week, we have thirty-five appointments booked. Twelve of them are new-to-Canada customers. Many of them just arrived, so please take your time. Explain the newcomer package, the chequing account, and how to build credit.\" \"Do we have the information in other languages?\" I asked. I speak Portuguese, and many Brazilian customers ask for me. \"We do. There are brochures in several languages at the front desk. And if a customer speaks Portuguese, please send them to you if you're free.\" \"Of course.\" \"Now, an important heads-up about fraud,\" Janice said. \"Last week, two of our older customers almost sent money to scammers. In one case, someone called and said they were the customer's grandson. He said he was in jail and needed bail money right away.\" \"What should we do if we see something like that?\" asked Jason, one of the tellers. \"Watch for red flags. If an older customer wants to withdraw a large amount of cash, and they seem nervous or in a hurry, ask some gentle questions. 'Who is this money for? Did someone call you?' If you're worried, call me or the assistant manager.\" \"Should we stop the transaction?\" \"We can't always stop it. It's their money. But we can take time, explain the risk, and ask them to call their family first. Most people are grateful.\" \"Last thing,\" Janice said. \"Mortgage renewals. A lot of customers are renewing this year, and rates are different from five years ago. If a customer has questions, book them an appointment with Alison, our mortgage specialist.\" She looked at her watch. \"It's eight fifty-five. Okay, team, let's have a great week.\" At nine o'clock, Jason unlocked the doors, and the first customer walked in.", "words": 379}, {"num": 99, "title": "BMO: Applying for a Small Business Loan", "F": "business finance numbers, percentages, years, do, did, will, would, can/can't", "V": "small business loan, commercial banking, business plan, financial statements, revenue, profit, cash flow, collateral, interest rate, prime rate, term, monthly payments, approval, \"What's the next step?\"", "T": "My bakery on Commercial Drive has been open for three years. Every weekend, there's a line outside for our pão de queijo. So this year, my husband and I decided to open a second location in North Vancouver. We needed a loan. I booked a meeting with a commercial banker at BMO. His name was Greg Wilson. \"Tell me about the business,\" he said. \"We opened three years ago. We sell Brazilian baked goods, coffee, and lunch. In our first year, our revenue was two hundred and ten thousand dollars. Last year, it was four hundred and eighty thousand.\" \"That's great growth. And your profit?\" \"Last year, about sixty-five thousand after expenses.\" \"How much do you need for the new location?\" \"About one hundred and fifty thousand dollars. That includes the equipment, the renovation, and three months of rent.\" \"Okay. Did you bring your business plan and your financial statements?\" \"I did. Here are the statements for the last three years, and here's our plan for the new location.\" Greg read the documents carefully. \"This is a very good plan. Let me ask a few questions. What's your cash flow like in the winter? Some businesses slow down.\" \"January and February are slower, about twenty percent lower. But we plan for it. We always keep two months of expenses in our savings account.\" \"Good. Do you have any other debt?\" \"Just a small equipment loan. We'll finish paying it next year.\" \"And collateral? Something the bank can hold, in case the business can't pay.\" \"We own our condo. We have some equity in it.\" Greg nodded. \"Here's what I can probably offer, but it isn't final yet. A loan of one hundred and fifty thousand dollars, over a five-year term. The interest rate would be prime plus two percent. Your monthly payments would be around three thousand dollars.\" \"Three thousand a month. We can manage that.\" \"What's the next step?\" I asked. \"I'll send your application to our credit team. They'll review everything, and you'll have an answer in about two weeks.\" Twelve days later, Greg called. \"Congratulations. Your loan is approved.\" I called my husband right away. \"We're going to North Vancouver!\" I said. He was so happy, he gave free pão de queijo to every customer that afternoon.", "words": 380}, {"num": 100, "title": "City of Vancouver: The Bike Lane Consultation", "F": "public consultation results, percentages, survey numbers, dates, will, should", "V": "public consultation, survey, responses, residents, business owners, concerns, parking spaces, loading zone, safety data, compromise, recommendation, council report, \"on one hand... on the other hand\"", "T": "I work as a transportation planner for the City of Vancouver. This spring, the city proposed a new protected bike lane on a busy street in East Vancouver. Before city council makes a decision, we have to ask the public what they think. On Thursday, our project team met to review the results. Our project manager, Shelley, started. \"We received over four thousand survey responses. Thank you all for your hard work at the open houses. Now, let's look at what people said.\" I shared the results. \"Overall, fifty-eight percent of people support the bike lane. Twenty-nine percent are against it, and thirteen percent aren't sure.\" \"Who supports it?\" Shelley asked. \"Mostly residents who live nearby and people who ride bikes. Many parents said they want a safer route for their kids to get to school.\" \"And who is against it?\" \"Mostly business owners on the street. Their biggest concern is parking. The design removes about forty parking spaces.\" Garth, from our business outreach team, added, \"I talked to twenty business owners. The coffee shop owner told me forty percent of his customers drive. He's worried he'll lose business.\" \"On one hand, safety is our priority,\" Shelley said. \"Last year, there were eleven collisions involving cyclists on this street. On the other hand, we don't want to hurt local businesses. Is there a compromise?\" \"What if we keep some parking on the side streets?\" I suggested. \"And we could add two loading zones, so delivery trucks don't block the bike lane.\" \"That could work,\" Garth said. \"The business owners also asked for more time. They want to see the final design before council votes.\" \"Fair enough,\" Shelley said. \"Let's hold a meeting just for the businesses next month.\" \"What's the deadline for the council report?\" someone asked. \"We need to finish it by June 15th. Council will vote in July.\" \"Who's writing the summary of the survey results?\" Shelley asked. \"I will,\" I said. \"I'll have a draft by the end of next week.\" \"Perfect. Garth, can you organize the business meeting?\" \"Sure.\" After the meeting, Shelley said to me, \"You explained the data really clearly. Council will like that.\" \"Thank you,\" I said. \"I ride on that street every day, so I really want to get this one right.\"", "words": 380}]}];

const audioUrl = n => `${AUDIO_BASE}Story-${String(n).padStart(2, "0")}${AUDIO_EXT}`;
const audioCache = {};
function checkAudio(n) {
  if (n in audioCache) return Promise.resolve(audioCache[n]);
  return new Promise(res => {
    const a = new Audio();
    const done = ok => { audioCache[n] = ok; res(ok); };
    a.addEventListener("loadedmetadata", () => done(true), { once: true });
    a.addEventListener("error", () => done(false), { once: true });
    a.preload = "metadata"; a.src = audioUrl(n);
    setTimeout(() => { if (!(n in audioCache)) done(false); }, 4000);
  });
}

    $("#arate").value = ST.arate;
    $("#arate").onchange = e => { ST.arate = e.target.value; rec.playbackRate = +e.target.value; };
    $("#back10").onclick = () => { rec.currentTime = Math.max(0, rec.currentTime - 10); rec.play(); };
    return;
  }
  fillVoices();
  $("#rate").value = ST.rate; if (ST.voice !== "" && $("#voice").querySelector(`option[value="${ST.voice}"]`)) $("#voice").value = ST.voice;
  $("#rate").onchange = saveFields; $("#voice").onchange = saveFields;
  $("#play").onclick = () => speak(s.T);
  $("#stop").onclick = stopSpeech;
  if ($("#splay")) {
    const upd = () => $("#splay").textContent = `Play sentence ${ST.sent + 1} of ${ST.sents.length}`;
    $("#splay").onclick = () => speak(ST.sents[ST.sent]);
    $("#sprev").onclick = () => { ST.sent = Math.max(0, ST.sent - 1); upd(); speak(ST.sents[ST.sent]); };
    $("#snext").onclick = () => { ST.sent = Math.min(ST.sents.length - 1, ST.sent + 1); upd(); speak(ST.sents[ST.sent]); };
  }
}
function nextRow(k) {
  return `<div class="nextrow">${k > 0 ? `<button class="btn secondary" data-go="${k - 1}">Back to round ${k}</button>` : "<span></span>"}${k < 5 ? `<button class="btn" data-go="${k + 1}">Go to round ${k + 2}: ${ROUNDS[k + 1][0].toLowerCase()}</button>` : ""}</div>`;
}
function quizHTML(s) {
  const Q = QUESTIONS[s.title]; if (!Q) return "";
  const qs = Q.map((q, qi) => {
    const chosen = ST.quiz[qi];
    const opts = q[1].map((o, oi) => {
      let mark = "";
      if (ST.quizChecked && chosen === oi) mark = oi === q[2] ? `<span class="mk ok">Correct</span>` : `<span class="mk no">Not quite</span>`;
      else if (ST.quizChecked && oi === q[2] && chosen !== undefined) mark = `<span class="mk ok">Answer</span>`;
      return `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${chosen === oi ? "checked" : ""}> <span>${esc(o)}</span>${mark}</label>`;
    }).join("");
    return `<fieldset class="q"><legend>${qi + 1}. ${esc(q[0])}</legend>${opts}</fieldset>`;
  }).join("");
  let score = "";
  if (ST.quizChecked) {
    const right = Q.filter((q, qi) => ST.quiz[qi] === q[2]).length;
    score = `<p class="qscore">${right} of ${Q.length} correct. ${right === Q.length ? "You understood the story." : "Listen once more and try the others again."}</p>`;
  }
  return `<div class="quiz"><h4>Check your understanding</h4>${qs}<div class="actions"><button class="btn" id="checkq">Check my answers</button></div>${score}</div>`;
}
function wireQuiz(s) {
  const Q = QUESTIONS[s.title]; if (!Q) return;
  document.querySelectorAll('.quiz input[type=radio]').forEach(r => r.onchange = e => { ST.quiz[+e.target.name.slice(1)] = +e.target.value; ST.quizChecked = false; });
  $("#checkq").onclick = () => {
    if (Object.keys(ST.quiz).length < Q.length) { alert("Choose an answer for each question first."); return; }
    saveFields(); ST.quizChecked = true; renderPanel(s);
  };
}
function quizScore(s) {
  const Q = QUESTIONS[s.title]; if (!Q || !ST.quizChecked) return null;
  return `${Q.filter((q, qi) => ST.quiz[qi] === q[2]).length} of ${Q.length}`;
}
function renderPanel(s) {
  const k = ST.round, P = $("#panel");
  const answerBox = `<div class="field"><label for="answer">Your transcription</label><textarea id="answer" placeholder="Write exactly what you hear">${esc(ST.answer)}</textarea></div>`;
  if (k === 0) P.innerHTML = `<h3>Round 1: Listen for the story</h3>
    <p class="hint">Listen to the whole story once. Don't write anything yet. Just try to understand what happens.</p>${playerHTML(false)}
    ${quizHTML(s)}
    <div class="field"><label for="gist">What happened? Who are the people? Write one or two sentences in your own words.</label><textarea id="gist" class="short">${esc(ST.gist)}</textarea></div>${nextRow(k)}`;
  if (k === 1) P.innerHTML = `<h3>Round 2: Transcribe</h3>
    <p class="hint">Listen again and write exactly what you hear. Use the sentence buttons to replay one sentence at a time. If you can't hear a word, leave a space and keep going.</p>${playerHTML(true)}${answerBox}${nextRow(k)}`;
  if (k === 2) P.innerHTML = `<h3>Round 3: Listen again and fix</h3>
    <p class="hint">Play the whole story from the beginning. Follow your transcription and fix anything you're not sure about. Listen carefully for the small words.</p>${playerHTML(true)}${answerBox}${nextRow(k)}`;
  if (k === 3) P.innerHTML = `<h3>Round 4: Compare</h3>
    <p class="hint">Check your transcription against the story. Look at the words you missed. Were they small words? Words that were linked together? Words you didn't know?</p>
    ${answerBox}<div class="actions"><button class="btn accent" id="check">Check my transcription</button></div><div id="result"></div>${nextRow(k)}`;
  if (k === 4) P.innerHTML = `<h3>Round 5: Shadow</h3>
    <p class="hint">First, read the text while you listen. Then play it again and read aloud at the same time as the voice. Try to copy the rhythm, and notice which words are strong and which are weak.</p>${playerHTML(false)}<div class="text">${esc(s.T)}</div>${nextRow(k)}`;
  if (k === 5) {
    const words = (s.V || s.F).split(/,\s*/).slice(0, 12);
    P.innerHTML = `<h3>Round 6: Retell the story</h3>
    <p class="hint">Don't look at the text. Tell the story out loud in your own words, as if you were telling a friend. Try to use some of these words. Record yourself on your phone and listen to it, or send the recording to your teacher.</p>
    <div class="chips">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>
    ${ST.gist ? `<p class="hint" style="margin-top:14px">What you wrote in round 1: “${esc(ST.gist.trim())}” How much more do you understand now?</p>` : ""}${nextRow(k)}`;
  }
  if (k !== 3 && k !== 5) wirePlayer(s);
  if (k === 0) wireQuiz(s);
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if (k === 3) {
    $("#check").onclick = () => { saveFields(); check(s); };
    if (ST.result) showResult(s);
  }
}

/* speech */
let voices = [];
function fillVoices() {
  const sel = $("#voice"); if (!sel) return; const keep = sel.value;
  if (!("speechSynthesis" in window)) { sel.innerHTML = "<option>Not available</option>"; sel.disabled = true; if ($("#play")) $("#play").disabled = true; return; }
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const rank = v => (v.lang === "en-CA" ? 0 : v.lang === "en-US" ? 1 : 2);
  voices.sort((a, b) => rank(a) - rank(b));
  sel.innerHTML = voices.length ? voices.map((v, i) => `<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join("") : "<option value=\"\">Default</option>";
  if (ST && ST.voice !== "" && sel.querySelector(`option[value="${ST.voice}"]`)) sel.value = ST.voice; else if (keep && sel.querySelector(`option[value="${keep}"]`)) sel.value = keep;
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = fillVoices;
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const vs = $("#voice"), v = vs ? voices[+vs.value] : null; if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-CA";
  u.rate = $("#rate") ? +$("#rate").value : 0.85;
  speechSynthesis.speak(u);
}
function stopSpeech() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll("audio").forEach(a => { a.pause(); a.currentTime = 0; });
}

/* transcription check */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'éãçõáíóúâêô½]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
const NOT_ED = new Set("hundred need indeed speed bed red shed seed feed weed breed proceed succeed exceed sled wed fled bled led fed bred shred greed deed embed naked wicked sacred kindred".split(" "));
function check(s) {
  const FULL = tokens(s.T), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  // only compare against the part of the story the student could have reached
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach);
  const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  // find the last real match: drop isolated matches far after the previous one
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  let lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), ed = new Set(), other = [], extra = [], rest = [];
  ops.forEach(([k, x]) => {
    if (k === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (k === "same") rest.push(esc(A[x].raw));
    else if (k === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else {
      graded++;
      const w = A[x].n, isSmall = SMALL.has(w), isEd = /ed$/.test(w) && w.length > 4 && !NOT_ED.has(w);
      if (isSmall) small.set(w, (small.get(w) || 0) + 1); else if (isEd) ed.add(w); else other.push(w);
      out.push(`<mark class="${isSmall ? "small" : ""}">${esc(A[x].raw)}</mark>`);
    }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), ed: [...ed], other, extra };
  ST.done.add(3);
  showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the story yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor((R.matched / R.graded) * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any of the small words. Well done.</p>`}
    ${R.ed.length ? `<p class="smalls"><b>-ed words you missed:</b> ${R.ed.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="send">Email my results to Ron</button><button class="btn secondary" id="copy">Copy my results</button></div>
      <p>This opens your email app with your results already written. Nothing is sent until you press send. If your email app doesn't open, copy your results and paste them into an email to ${TEACHER_EMAIL}.</p>
      <p class="status" id="status" role="status"></p>
    </div>
  </div>`;
  $("#sname").oninput = e => ST.name = e.target.value;
  $("#send").onclick = () => { const t = resultText(s); location.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(`Listening Lab results: Story ${s.num}, ${s.title}`)}&body=${encodeURIComponent(t)}`; };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); $("#status").textContent = "Copied. Paste it into an email or a message to Ron."; }
    catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); $("#status").textContent = "Copied. Paste it into an email or a message to Ron."; }
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor((R.matched / R.graded) * 100);
  const cap = (arr, k) => arr.length > k ? arr.slice(0, k).join(", ") + ` (and ${arr.length - k} more)` : arr.join(", ") || "none";
  const lines = [
    "Listening Lab results",
    `Name: ${ST.name || "(not given)"}`,
    `Story: ${s.num}. ${s.title}`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`,
    ...(quizScore(s) ? [`Understanding questions (round 1): ${quizScore(s)} correct`] : []),
    "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `-ed words I missed: ${cap(R.ed, 20)}`,
    `Other words I missed: ${cap(R.other, 40)}`,
    `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`,
  ];
  if (ST.gist) lines.push("", `What I understood after the first listen: ${ST.gist.slice(0, 400)}`);
  return lines.join("\n");
}

/* routing */
function route() {
  const h = location.hash;
  if (h.startsWith("#story-")) renderStory(+h.slice(7)); else renderAbout();
  renderNav($("#q").value);
  closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-story],[data-home]"); if (!b) return;
  if (b.hasAttribute("data-home")) location.hash = "#about"; else location.hash = "#story-" + b.dataset.story;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
