4, 73.45], [74.12, 75.5], [76.17, 77.52], [77.74, 80.13], [80.8, 83.31], [83.53, 87.08], [87.75, 88.77], [89.44, 90.59], [90.81, 91.84], [92.51, 93.19], [93.41, 94.2], [94.87, 95.68], [95.9, 97.92], [98.59, 99.68], [99.9, 100.56], [100.78, 103.66], [104.33, 105.78], [106.0, 107.65]], "R": [["You're viewing an apartment.", "Landlord", "Any questions about the apartment?", "Yes. Are utilities included? And is it close to the SkyTrain?"], ["The landlord asks when you can move in.", "Landlord", "When are you looking to move in?", "We'd like to move in on the first of next month, if that's possible."]]}, {"num": 20, "title": "Asking the Landlord for a Repair", "lines": [["P", "Sorry to bother you so late, Doug. Our heat isn't working. It's only fourteen degrees inside. My kids were wearing their jackets at dinner.", "Patricia"], ["S", "Oh no. Did you tell Mr. Grant?", "Doug"], ["P", "I texted him at seven. I wrote, \"Hi Mr. Grant, this is your tenant in suite three oh four. The heat isn't working. It's only fourteen degrees in the apartment. Could you please send someone to fix it as soon as possible?\" But he didn't answer.", "Patricia"], ["S", "Good. In BC, no heat is an emergency repair. The landlord has to fix it quickly. Always put everything in writing, and keep a copy. Take a photo of the thermostat too.", "Doug"], ["P", "What if he doesn't fix it?", "Patricia"], ["S", "Then you can contact the Residential Tenancy Branch. They help tenants and landlords with problems. But most landlords fix it fast. Here, take these two heaters for tonight.", "Doug"], ["P", "Hello, it's Mr. Grant. I'm so sorry. I didn't see your message until this morning. I'll send a repair person between ten and twelve. Will someone be home?", "Mr. Grant"], ["P", "Yes, I'll be home.", "Patricia"], ["S", "Hi, I'm Tony. It was the boiler. A part broke. I replaced it, so the heat should come back in about an hour.", "Tony"], ["P", "Thank you! There's another problem too. The kitchen faucet is leaking. It isn't an emergency, but it's getting worse.", "Patricia"], ["S", "I'll tell Mr. Grant. For a regular repair like that, he has to give you twenty-four hours' written notice before someone enters your apartment.", "Tony"], ["P", "Doug, the heat's back! And Mr. Grant sent an email. Tony will come on Thursday at two to fix the faucet.", "Patricia"], ["S", "See? When you put it in writing, things get done.", "Doug"], ["P", "You were right. I just sent him a message: \"Thank you for fixing everything so quickly.\"", "Patricia"]], "words": 288, "kind": "story", "scene": "It's a January night. It's minus two degrees outside, and the heat in Patricia's apartment has stopped working. At ten o'clock, she knocks on her neighbour Doug's door.", "F": "reporting a problem in writing, temperatures, times, is/isn't, was, did/didn't, have to, can, will", "V": "landlord, tenant, suite, repair, emergency repair, heat, thermostat, boiler, leak, faucet, in writing, notice, Residential Tenancy Branch", "t": [[2.0, 3.98], [4.2, 5.53], [5.75, 7.67], [7.89, 10.17], [10.84, 11.82], [12.04, 13.68], [14.35, 15.78], [16.0, 20.31], [20.53, 21.73], [21.95, 24.27], [24.49, 27.63], [27.85, 29.0], [29.67, 30.37], [30.59, 33.79], [34.01, 36.3], [36.52, 39.78], [40.0, 42.16], [42.83, 44.08], [44.75, 48.0], [48.22, 50.84], [51.06, 53.3], [53.52, 55.8], [56.47, 57.8], [58.02, 59.06], [59.28, 61.59], [61.81, 64.54], [64.76, 65.95], [66.62, 67.84], [68.51, 69.47], [69.69, 70.6], [70.82, 71.7], [71.92, 75.14], [75.81, 76.49], [76.71, 78.08], [78.3, 79.88], [80.1, 82.64], [83.31, 84.48], [84.7, 91.5], [92.17, 93.45], [93.67, 95.32], [95.54, 98.48], [99.15, 99.85], [100.07, 102.72], [103.39, 104.14], [104.36, 108.13]], "R": [["You call your landlord about a problem.", "Landlord", "Hello, this is Mr. Grant.", "Hi, Mr. Grant. I'm in suite 305. The heat isn't working, and it's very cold. Can someone come tonight?"], ["The landlord says he's busy.", "Landlord", "I can't send anyone until next week.", "It's an emergency repair. It's minus two outside. Could you please send someone today? I'll send you an email too."]]}, {"num": 21, "title": "Building Credit from Zero", "lines": [["P", "I'm sorry, but you don't have a credit history in Canada. We can't approve your application without a larger deposit.", "Mrs. Lambert"], ["S", "But we always paid our bills in Brazil.", "Eduardo"], ["P", "I believe you. But Canadian credit bureaus don't see anything from Brazil. Here, you're starting from zero.", "Mrs. Lambert"], ["S", "Martin, how do I build a credit history?", "Eduardo"], ["P", "The easiest way is a credit card. Because you're new, we'll start with a secured card. You give the bank a deposit, for example five hundred dollars, and that becomes your credit limit.", "Martin"], ["S", "So it's my own money?", "Eduardo"], ["P", "Yes, but you use the card like a normal credit card. Every month, you pay the bill. When you pay on time, it builds your credit score.", "Martin"], ["S", "What's a good credit score?", "Eduardo"], ["P", "In Canada, scores go from three hundred to nine hundred. Above seven hundred is good. Right now, you don't have a score at all.", "Martin"], ["S", "What should I do, and what shouldn't I do?", "Eduardo"], ["P", "First, pay the full balance every month, not just the minimum. If you don't pay in full, you'll pay about twenty percent interest. Second, never miss a due date. Set up automatic payments. Third, don't use more than thirty percent of your limit. With a five-hundred-dollar limit, try to keep your balance under one hundred and fifty dollars.", "Martin"], ["S", "Only a hundred and fifty? That isn't much.", "Eduardo"], ["P", "Use it for small things, like groceries or your phone bill. Then pay it off.", "Martin"], ["S", "How long will it take?", "Eduardo"], ["P", "If you do everything right, you'll have a decent score in about a year. Then you can apply for a regular card and get your deposit back.", "Martin"], ["P", "Eduardo! It's been a year. Did it work?", "Martin"], ["S", "It did. I paid my phone bill with the card every month, and the payment went out automatically. I checked my score online. It's seven hundred and twelve.", "Eduardo"], ["P", "Excellent. And the apartment?", "Martin"], ["S", "This time, Mrs. Lambert approved our application.", "Eduardo"]], "words": 316, "kind": "story", "scene": "Six months after moving to Vancouver, Eduardo applied to rent a bigger apartment. The property manager, Mrs. Lambert, checked his credit.", "F": "numbers (credit scores, limits, percentages), dates, do/don't, did, should/shouldn't, will", "V": "credit history, credit score, credit card, secured card, deposit, credit limit, balance, pay in full, interest, due date, credit bureau, apply, approved, declined", "t": [[2.0, 4.99], [5.21, 8.58], [9.25, 11.53], [12.2, 13.2], [13.42, 16.84], [17.06, 18.68], [19.35, 21.67], [22.34, 24.67], [24.89, 27.96], [28.18, 34.22], [34.89, 36.04], [36.71, 39.99], [40.21, 41.99], [42.21, 45.36], [46.03, 47.31], [47.98, 51.52], [51.74, 53.54], [53.76, 56.15], [56.82, 58.91], [59.58, 63.35], [63.57, 67.39], [67.61, 69.45], [69.67, 71.54], [71.76, 74.77], [74.99, 80.71], [81.38, 82.79], [83.01, 83.99], [84.66, 88.37], [88.59, 89.81], [90.48, 91.54], [92.21, 96.33], [96.55, 100.65], [101.32, 102.42], [102.64, 103.9], [104.12, 105.13], [105.8, 106.48], [106.7, 111.58], [111.8, 113.3], [113.52, 115.1], [115.77, 116.73], [116.95, 118.29], [118.96, 121.95]], "R": [["You want to build credit.", "Bank employee", "How can I help you today?", "I'm new to Canada, and I don't have a credit history. Do you have a secured credit card?"], ["A friend asks how to build a good score.", "Friend", "How do you keep a good credit score?", "Pay your balance in full every month, and always pay before the due date."]]}, {"num": 22, "title": "Calling Customer Service", "lines": [["P", "Thank you for calling Pacific Connect. For English, press 1. For French, press 2.", "Recording"], ["P", "Please enter your account number, followed by the pound key. For billing, press 1. For technical support, press 2. To cancel your service, press 3.", "Recording"], ["P", "Your call is important to us. Your estimated wait time is twenty-three minutes.", "Recording"], ["S", "Thanks for calling Pacific Connect. My name is Brad. To verify your account, can I get the address on the account and the last four digits of your phone number?", "Brad"], ["P", "Sure. It's two forty-one Fraser Street, and the last four digits are eight three one five.", "Juliana"], ["S", "Thank you. How can I help you today?", "Brad"], ["P", "My bill went up thirty dollars this month, and I didn't change anything.", "Juliana"], ["S", "Let me take a look. Okay, I see what happened. When you signed up, you got a promotional price for twelve months. That promotion ended last month, so now you're paying the regular price.", "Brad"], ["P", "Nobody told me that. Can you do anything?", "Juliana"], ["S", "Let me transfer you to our loyalty department.", "Brad"], ["S", "Hi, this is Sandra from the loyalty team. I understand you're unhappy with your bill.", "Sandra"], ["P", "I am. To be honest, I'm thinking about cancelling and switching to another company.", "Juliana"], ["S", "I'd hate to lose you. I can offer you seventy dollars a month for the next twenty-four months, with the same speed.", "Sandra"], ["P", "Is there a contract? Is there a cancellation fee?", "Juliana"], ["S", "No contract, and no cancellation fee.", "Sandra"], ["P", "Okay. That works. Can you send that to me in writing?", "Juliana"], ["S", "Of course. You'll get a confirmation email in a few minutes. Is there anything else I can help you with today?", "Sandra"], ["P", "No, that's all. Thank you.", "Juliana"], ["P", "So they lowered it? Always call when the promotion ends. And always say the word \"cancel.\" It works every time.", "Darren"]], "words": 292, "kind": "story", "scene": "Juliana's internet bill went up from sixty-five dollars to ninety-five dollars, and she didn't change anything. She calls customer service.", "F": "automated phone menus, account numbers, prices, months, didn't, can, will", "V": "customer service, \"press 1,\" hold, wait time, account number, verify, promotional price, bill, loyalty department, cancel, contract, cancellation fee, \"Is there anything else I can help you with?\"", "t": [[2.0, 4.03], [4.25, 5.63], [5.85, 7.22], [7.89, 11.0], [11.22, 12.5], [12.72, 14.62], [14.84, 16.74], [17.41, 19.05], [19.27, 21.92], [22.59, 24.38], [24.6, 25.67], [25.89, 31.86], [32.53, 33.13], [33.35, 38.51], [39.18, 39.95], [40.17, 41.47], [42.14, 46.19], [46.86, 47.89], [48.11, 49.52], [49.74, 53.13], [53.35, 57.36], [58.03, 59.29], [59.51, 60.59], [61.26, 63.87], [64.54, 66.93], [67.15, 69.13], [69.8, 70.46], [70.68, 75.14], [75.81, 77.11], [77.33, 82.03], [82.7, 83.85], [84.07, 85.67], [86.34, 88.81], [89.48, 90.19], [90.41, 91.22], [91.44, 93.19], [93.86, 94.75], [94.97, 97.36], [97.58, 100.08], [100.75, 101.73], [101.95, 102.7], [103.37, 104.65], [104.87, 107.17], [107.39, 109.31], [109.53, 111.09]], "R": [["You call about a higher bill.", "Agent", "Thank you for calling. How can I help you?", "Hi, my bill went up from sixty-five to ninety-five dollars, and I didn't change anything. Can you explain why?"], ["The agent explains the promotion ended.", "Agent", "Your promotional price ended last month.", "I see. I've been a customer for two years. Is there anything you can do?"]]}, {"num": 23, "title": "Filing Your Taxes", "lines": [["P", "Everyone files a tax return every year. The deadline is April 30th. If you file late and you owe money, you'll pay a penalty.", "Doug"], ["S", "What do I need?", "Marcelo"], ["P", "Your T4 slip. Your employer sends it by the end of February. It shows how much you earned and how much tax they already deducted from your pay.", "Doug"], ["S", "Should I pay an accountant?", "Marcelo"], ["P", "Try a free tax clinic first. Volunteers do it for free for families with lower or moderate income.", "Doug"], ["P", "Welcome! I'm Wendy. Is this your first time filing in Canada?", "Wendy"], ["S", "Yes, it is. We arrived last June.", "Marcelo"], ["P", "Did you bring your T4 slips, your SIN letters, and your immigration documents?", "Wendy"], ["S", "I did.", "Marcelo"], ["P", "Great. What was your date of entry into Canada?", "Wendy"], ["S", "June 10th.", "Marcelo"], ["P", "As a newcomer, you only report your world income from the date you arrived. Did you earn any money in Brazil after June 10th?", "Wendy"], ["S", "No, we didn't.", "Marcelo"], ["P", "Okay. Your income was forty-eight thousand five hundred dollars, and your employer deducted six thousand two hundred and thirty dollars in tax. Give me a few minutes.", "Wendy"], ["P", "Good news. You'll get a refund of about eight hundred and forty dollars. And because you have two kids, you'll also get the Canada child benefit every month.", "Wendy"], ["S", "When will I get the money?", "Marcelo"], ["P", "I'll file it online today. With direct deposit, you'll usually get your refund in about two weeks. Later, you'll receive a notice of assessment from the CRA. Keep it. And register for CRA My Account online.", "Wendy"], ["S", "Thank you so much.", "Marcelo"], ["P", "One warning. If someone calls and says they're from the CRA and you'll be arrested if you don't pay right away, hang up. It's a scam. The CRA will never ask you to pay with gift cards.", "Wendy"], ["S", "Doug, it worked! Twelve days later, the refund was in my bank account.", "Marcelo"], ["P", "Told you. Now keep all your papers in one folder. You'll do it again next year.", "Doug"]], "words": 317, "kind": "story", "scene": "It's Marcelo's first tax season in Canada, and he's confused. His neighbour Doug explains the basics.", "F": "dates and deadlines, dollar amounts, did/didn't, do/don't, have to, should, will, -ed", "V": "Canada Revenue Agency (CRA), file your taxes, tax return, deadline, T4 slip, income, tax deducted, refund, owe, direct deposit, free tax clinic, volunteer, date of entry, notice of assessment, CRA My Account, benefits, scam", "t": [[2.0, 4.73], [4.95, 7.0], [7.22, 10.63], [11.3, 12.22], [12.89, 14.34], [14.56, 17.35], [17.57, 22.59], [23.26, 24.5], [25.17, 27.26], [27.48, 32.15], [32.82, 33.61], [33.83, 34.72], [34.94, 37.16], [37.83, 38.77], [38.99, 40.29], [40.96, 45.57], [46.24, 46.86], [47.53, 48.28], [48.5, 50.59], [51.26, 52.09], [52.76, 56.66], [56.88, 59.63], [60.3, 61.18], [61.85, 62.6], [62.82, 70.47], [70.69, 71.87], [72.54, 73.41], [73.63, 76.55], [76.77, 81.28], [81.95, 83.1], [83.77, 85.41], [85.63, 89.56], [89.78, 93.23], [93.45, 94.18], [94.4, 97.11], [97.78, 98.74], [99.41, 100.32], [100.54, 106.45], [106.67, 107.65], [107.87, 110.97], [111.64, 112.47], [112.69, 115.72], [116.39, 117.29], [117.51, 119.94], [120.16, 121.99]], "R": [["A friend asks about taxes.", "Neighbour", "Have you filed your taxes yet?", "Not yet. I'm waiting for my T4 slip. When is the deadline?"], ["Someone asks about your refund.", "Friend", "Are you getting a refund this year?", "I think so. I'll find out after I file. I chose direct deposit."]]}, {"num": 24, "title": "Renewing a PR Card", "lines": [["P", "I have to renew my PR card, but I'm not sure I can. My father was sick last year. I spent about eleven months in Brazil last year, and three months this year.", "Gord"], ["S", "Hi Gord. First of all, don't panic. Your PR card isn't your status. Even if your card expires, you're still a permanent resident. The card is just proof.", "Lorna"], ["P", "Okay. That's a relief.", "Gord"], ["S", "But there's something called the residency obligation. To keep your PR status, you have to be physically present in Canada for at least seven hundred and thirty days in every five-year period. That's two years out of five.", "Lorna"], ["P", "So he can be outside Canada for three years?", "Ana"], ["S", "In total, yes. When you apply to renew your card, you list all your trips. Gord, do you have your travel history?", "Lorna"], ["P", "I have the stamps in my passport, and my plane tickets.", "Gord"], ["S", "Good. Let's count. When did you become a permanent resident?", "Lorna"], ["P", "Four years ago, in August.", "Gord"], ["S", "And how many days were you outside Canada in those four years?", "Lorna"], ["P", "Let me check my notebook. About four hundred and sixty days.", "Gord"], ["S", "Four years is about fourteen hundred and sixty days. Minus four hundred and sixty, that's about one thousand days in Canada. You're well over seven hundred and thirty. You're fine.", "Lorna"], ["P", "See? You're smiling for the first time today.", "Ana"], ["S", "Apply to renew your card online. It takes a few months, so apply now.", "Lorna"], ["P", "What if I need to travel to Brazil before the new card arrives?", "Gord"], ["S", "Then be careful. If you fly back to Canada without a valid PR card, the airline might not let you board. You'd need a permanent resident travel document, a PRTD, from outside Canada.", "Lorna"], ["P", "Then I'll wait here until the new card arrives.", "Gord"], ["S", "Good plan. And Gord, you've been here almost three years in total. Soon, you might be able to apply for citizenship. Then you won't need a PR card at all.", "Lorna"], ["P", "That's the best news I've had all year.", "Gord"]], "words": 328, "kind": "story", "scene": "On Saturday, Ana's friend Gord looks worried. His PR card expires next month. Ana calls her neighbour Lorna, who works for an immigration consultant, and puts her on speaker.", "F": "the residency obligation (730 days in 5 years), expiry dates, did, have to, can, should", "V": "PR card, expiry date, renew, residency obligation, physically present, travel history, permanent resident travel document (PRTD), status, lose your status, citizenship", "t": [[2.0, 5.26], [5.48, 7.06], [7.28, 11.53], [12.2, 13.14], [13.36, 14.94], [15.16, 17.25], [17.47, 20.73], [20.95, 22.27], [22.94, 23.65], [23.87, 24.85], [25.52, 28.21], [28.43, 36.47], [36.69, 38.14], [38.81, 41.39], [42.06, 43.17], [43.39, 46.31], [46.53, 48.64], [49.31, 52.3], [52.97, 53.65], [53.87, 54.81], [55.03, 57.17], [57.84, 59.31], [59.98, 63.09], [63.76, 65.09], [65.31, 67.23], [67.9, 70.9], [71.12, 75.37], [75.59, 77.68], [77.9, 78.75], [79.42, 79.98], [80.2, 82.33], [83.0, 84.9], [85.12, 87.17], [87.84, 91.4], [92.07, 93.09], [93.31, 98.78], [99.0, 104.18], [104.85, 107.37], [108.04, 108.91], [109.13, 112.03], [112.25, 114.94], [115.16, 117.17], [117.84, 119.76]], "R": [["A friend asks about your PR card.", "Friend", "When does your PR card expire?", "Next year, in March. I'll renew it a few months before."], ["Someone asks about the renewal.", "Consultant", "Do you meet the residency obligation?", "Yes. I've been physically present in Canada for more than two years."]]}, {"num": 25, "title": "Preparing for the Citizenship Test", "lines": [["P", "First, you have to be a permanent resident. Second, you have to be physically present in Canada for at least one thousand and ninety-five days in the last five years. That's three years.", "Curtis"], ["S", "We didn't leave Canada very much. Only for two trips to Brazil.", "Luísa"], ["P", "Then you'll need to count those days carefully. The application asks for every trip.", "Curtis"], ["P", "Do we have to take a test?", "André"], ["P", "If you're between eighteen and fifty-four, yes. You also have to show your English is good enough. But your English is fine.", "Curtis"], ["S", "Curtis, we got an email. They invited us to take the citizenship test!", "Luísa"], ["P", "Great. The test has twenty questions. You have forty-five minutes, and you need fifteen correct answers to pass. It's online.", "Curtis"], ["P", "What kind of questions?", "André"], ["P", "Everything is in a free study guide called Discover Canada. History, government, geography, rights and responsibilities.", "Curtis"], ["S", "Okay, André. Who is Canada's head of state?", "Luísa"], ["P", "The King. King Charles the Third.", "André"], ["S", "What are the three parts of Parliament?", "Luísa"], ["P", "The King, the Senate, and the House of Commons.", "André"], ["S", "When did Confederation happen?", "Luísa"], ["P", "In 1867.", "André"], ["S", "How many provinces and territories are there?", "Luísa"], ["P", "Ten provinces and three territories.", "André"], ["S", "What happens on November 11th?", "Luísa"], ["P", "Remembrance Day. We remember the Canadians who served and died in wars.", "André"], ["S", "My turn! Dad, what's the capital of Canada?", "Pedro"], ["P", "Ottawa. Easy.", "André"], ["S", "What's the capital of Nunavut?", "Pedro"], ["P", "Hmm. I don't know.", "André"], ["S", "Iqaluit!", "Pedro"], ["P", "I finished in twenty minutes. Nineteen out of twenty!", "André"], ["S", "I got twenty out of twenty.", "Luísa"], ["P", "Show-off.", "André"], ["S", "I studied harder than you did.", "Luísa"]], "words": 248, "kind": "story", "scene": "Five years after arriving in Canada, André and his wife, Luísa, decide to apply for citizenship. Their friend Curtis became a citizen a few years ago.", "F": "numbers (days, years, questions, percentages), dates, do, did/didn't, have to, will", "V": "citizenship, eligible, permanent resident, physical presence, days in Canada, application, language requirement, citizenship test, study guide (\"Discover Canada\"), head of state, Parliament, Senate, House of Commons, Confederation, Remembrance Day", "t": [[2.0, 4.45], [4.67, 11.95], [12.17, 13.38], [14.05, 15.8], [16.02, 17.64], [18.31, 20.75], [20.97, 23.4], [24.07, 25.41], [26.08, 28.73], [28.95, 31.72], [31.94, 33.73], [34.4, 36.17], [36.39, 38.93], [39.6, 40.35], [40.57, 42.47], [42.69, 47.23], [47.45, 48.67], [49.34, 50.53], [51.2, 55.04], [55.26, 59.21], [59.88, 60.88], [61.1, 62.66], [63.33, 63.97], [64.19, 65.41], [66.08, 67.87], [68.54, 70.78], [71.45, 73.13], [73.8, 75.19], [75.86, 78.21], [78.88, 80.97], [81.64, 83.66], [84.33, 85.36], [85.58, 88.63], [89.3, 90.07], [90.29, 92.01], [92.68, 93.35], [93.57, 94.16], [94.83, 96.3], [96.97, 97.49], [97.71, 98.47], [99.14, 99.93], [100.6, 101.91], [102.13, 103.36], [104.03, 105.5], [106.17, 106.86], [107.53, 109.08]], "R": [["A friend asks about citizenship.", "Friend", "Are you going to apply for citizenship?", "Yes! I'm eligible this year. I'm studying for the test now."], ["Someone asks how you're studying.", "Friend", "How are you preparing for the test?", "I'm reading the Discover Canada study guide and doing practice tests online."]]}]}, {"part": 3, "title": "Getting Around", "desc": "SkyTrain, directions, and getting a B.C. driver's licence.", "scripts": [{"num": 26, "title": "The Wrong Building", "lines": [["P", "Excuse me, does this street go to Georgia?", "Mark"], ["S", "It does, but you're walking the wrong way. Georgia is behind you. Go back past Robson, then turn left on Georgia.", "Woman"], ["P", "Oh no. Thanks so much. Is it far?", "Mark"], ["S", "No, it isn't. It's about five minutes.", "Woman"], ["P", "It's nine fifty already. Thank you!", "Mark"], ["P", "Can I help you?", "Rod"], ["P", "Yes, I have an interview on the twelfth floor.", "Mark"], ["P", "Can I see the email? Hmm. This is ten fifteen West Georgia. You want ten fifty. One-zero-five-zero. It's across the street.", "Rod"], ["P", "Ten fifteen? Ha! That's the time of my interview!", "Mark"], ["P", "Well, you've got twenty minutes. You'll be fine.", "Rod"], ["S", "Hi! How did it go?", "Wife"], ["P", "Really well. They asked about my experience, and I answered every question. I arrived at ten twelve, three minutes early.", "Mark"], ["S", "Only three minutes early? What happened?", "Wife"], ["P", "I got off at Granville Station and turned the wrong way. Then I walked into the wrong building. The address was ten fifty, and I went to ten fifteen.", "Mark"], ["S", "Ten fifteen, like the time of your interview!", "Wife"], ["P", "Exactly. The security guard laughed too. Anyway, now I'm celebrating. I walked down Robson to Denman, then down to English Bay. I bought a coffee, and I'm sitting on a bench, watching the ships.", "Mark"], ["S", "So, did you get lost?", "Wife"], ["P", "I didn't get lost. Well, not for long.", "Mark"]], "words": 216, "kind": "story", "scene": "Mark has been in Vancouver for three weeks. His job interview downtown is at ten fifteen. He took the Expo Line from Commercial–Broadway to Granville Station, and now he's walking south on Granville Street.", "F": "Vancouver streets and SkyTrain, directions, times, addresses (ten fifteen / ten fifty), does, -ed", "V": "", "t": [[2.0, 4.37], [5.04, 6.96], [7.18, 8.71], [8.93, 11.81], [12.48, 13.15], [13.37, 14.22], [14.44, 15.23], [15.9, 16.88], [17.1, 18.49], [19.16, 20.54], [20.76, 21.47], [22.14, 23.12], [23.79, 25.94], [26.61, 27.83], [28.05, 28.58], [28.8, 30.76], [30.98, 32.22], [32.44, 33.89], [34.11, 35.33], [36.0, 36.92], [37.14, 37.65], [37.87, 39.36], [40.03, 41.42], [41.64, 42.51], [43.18, 43.78], [44.0, 44.96], [45.63, 46.42], [46.64, 50.07], [50.29, 52.53], [53.2, 54.48], [54.7, 55.54], [56.21, 59.11], [59.33, 60.99], [61.21, 64.16], [64.83, 67.28], [67.95, 68.72], [68.94, 70.54], [70.76, 72.29], [72.51, 75.8], [76.02, 79.15], [79.82, 81.06], [81.73, 82.73], [82.95, 84.0]], "R": [["You're lost downtown, and your interview is soon.", "Stranger", "You look lost. Can I help?", "Yes, please. I'm looking for 1055 West Georgia. Is it this way?"], ["You arrive at the wrong building.", "Receptionist", "Sorry, this isn't the right building.", "Oh no. Could you tell me how to get to the right one? My interview is in ten minutes."]]}, {"num": 27, "title": "Booking the Road Test", "lines": [["P", "You can drive with your Brazilian licence for ninety days after you become a resident. After that, you need a BC licence.", "Vern"], ["S", "Ninety or nineteen?", "Sérgio"], ["P", "Ninety. Nine-zero. About three months.", "Vern"], ["S", "Do I need to take a test?", "Sérgio"], ["P", "You do. You need to pass the knowledge test first, and then the road test.", "Vern"], ["P", "Number fifty-three?", "Sherry"], ["S", "That's me. Finally! I waited for forty minutes.", "Sérgio"], ["P", "Sorry about the wait. I'm Sherry. How can I help you today?", "Sherry"], ["S", "I'd like to get a BC driver's licence. I have a licence from Brazil.", "Sérgio"], ["P", "Did you bring your licence and an official translation?", "Sherry"], ["S", "I did. And my passport and my permanent resident card.", "Sérgio"], ["P", "Great. First, you'll take the knowledge test on the computer. There are fifty questions. You need forty correct answers to pass.", "Sherry"], ["S", "Forty? So I can make ten mistakes?", "Sérgio"], ["P", "That's right. Ten, not more.", "Sherry"], ["S", "I'm finished. I got forty-four.", "Sérgio"], ["P", "Congratulations. Now let's book your road test. The next available date is Tuesday, November 17th, at ten forty-five.", "Sherry"], ["S", "Ten forty-five is fine.", "Sérgio"], ["P", "Please arrive fifteen minutes early. You need to bring your own vehicle, and it must be insured and in good condition. Before the test, the examiner will check the lights, the signals, and the horn. If something doesn't work, you can't take the test.", "Sherry"], ["S", "Does the examiner speak slowly?", "Sérgio"], ["P", "Ha! Not always. If you don't understand, ask him to repeat it.", "Sherry"], ["P", "Stop here for a second. You didn't shoulder check.", "Vern"], ["S", "I checked my mirror.", "Sérgio"], ["P", "The mirror isn't enough. Before you change lanes or pull out, turn your head and look over your shoulder. That's the number one reason people fail here.", "Vern"], ["S", "Okay. Two more weeks of practice.", "Sérgio"], ["P", "After two weeks, I think you're ready.", "Vern"], ["S", "I'm not so sure.", "Sérgio"]], "words": 285, "kind": "story", "scene": "Sérgio drove every day in Brazil for twenty years. He thinks driving in Vancouver will be easy. His neighbour, Vern, explains the rules.", "F": "90/19, 40/14, dates and times, do/does/doesn't, did/didn't, can/can't", "V": "ICBC, licence, resident, knowledge test, road test, translation, book a test, available, insured, vehicle, signals, horn, shoulder check", "t": [[2.0, 7.85], [8.07, 10.52], [11.19, 12.38], [13.05, 13.93], [14.15, 15.24], [15.46, 16.82], [17.49, 18.92], [19.59, 20.47], [20.69, 24.46], [25.13, 26.3], [26.97, 27.83], [28.05, 28.77], [28.99, 30.47], [31.14, 32.42], [32.64, 33.47], [33.69, 35.1], [35.77, 38.13], [38.35, 39.97], [40.64, 43.59], [44.26, 44.96], [45.18, 48.02], [48.69, 49.44], [49.66, 52.43], [52.65, 54.08], [54.3, 56.48], [57.15, 57.83], [58.05, 59.54], [60.21, 61.06], [61.28, 62.35], [63.02, 63.92], [64.14, 65.27], [65.94, 67.15], [67.37, 69.06], [69.28, 73.99], [74.66, 76.2], [76.87, 78.73], [78.95, 83.11], [83.33, 87.51], [87.73, 90.29], [90.96, 92.73], [93.4, 94.04], [94.26, 95.24], [95.46, 97.96], [98.63, 100.2], [100.42, 101.96], [102.63, 103.76], [104.43, 106.09], [106.31, 110.82], [111.04, 113.68], [114.35, 115.06], [115.28, 116.75], [117.42, 119.74], [120.41, 121.5]], "R": [["You call ICBC to book a road test.", "Agent", "When would you like to book your road test?", "As soon as possible, please. Do you have anything available next week?"], ["A neighbour asks about your licence.", "Neighbour", "Can you use your Brazilian licence here?", "Only for a short time. I need to take the knowledge test and the road test."]]}, {"num": 28, "title": "The Road Test", "lines": [["P", "Hi, I'm Dave. I'll be your examiner today. Can I see your licence?", "Dave"], ["S", "Here it is.", "Sérgio"], ["P", "Before we start, I'll check your vehicle. Please turn on your left signal. Now your right signal. Now step on the brake. Good, your brake lights work. Now sound the horn.", "Dave"], ["S", "Sorry, everyone in the parking lot is looking at us.", "Sérgio"], ["P", "That's okay. Here's how this works. I'll give you directions. If I don't say anything, follow the road. If you don't understand an instruction, just ask me. Pull out when you're ready.", "Dave"], ["S", "Mirror, shoulder check. Okay.", "Sérgio"], ["P", "At the lights, turn right.", "Dave"], ["P", "Take the second left.", "Dave"], ["S", "One, two. This one?", "Sérgio"], ["P", "Yes.", "Dave"], ["P", "We're entering a school zone. What's the speed limit here?", "Dave"], ["S", "Thirty kilometres an hour on school days, from eight to five.", "Sérgio"], ["P", "Correct. After the school zone, it's fifty.", "Dave"], ["P", "When it's safe, change lanes to the left.", "Dave"], ["S", "Mirror, signal, shoulder check.", "Sérgio"], ["P", "Now I'd like you to parallel park behind that blue car.", "Dave"], ["S", "I'm a little far from the curb.", "Sérgio"], ["P", "A little, but not too far. Let's continue up this hill.", "Dave"], ["P", "Please park here, on the hill. Imagine there's a curb.", "Dave"], ["S", "Wheels turned, car in park, park brake on.", "Sérgio"], ["P", "Which way did you turn your wheels, and why?", "Dave"], ["S", "Away from the curb, because we're facing uphill. If the car rolls, it'll stop against the curb.", "Sérgio"], ["P", "Good. Now let's drive back toward the office.", "Dave"], ["S", "My hands are wet on the steering wheel.", "Sérgio"], ["P", "You're doing fine. There's a stop sign on the last corner.", "Dave"], ["P", "Pull into the parking lot and park in any empty stall.", "Dave"], ["S", "Okay. Engine off.", "Sérgio"], ["P", "Give me a minute. I just need to finish writing.", "Dave"], ["S", "I can't breathe.", "Sérgio"]], "words": 274, "kind": "story", "scene": "It's Tuesday, the day of Sérgio's road test. He arrived at ten thirty. At ten forty-five exactly, the examiner comes out.", "F": "the examiner's instructions: left/right, second, speed limits (30/50), turn, pull over, park, can, will", "V": "examiner, brake lights, turn signal, pull out, follow the road, lane, intersection, traffic lights, school zone, speed limit, parallel park, curb, hill park, park brake", "t": [[2.0, 2.96], [3.18, 4.61], [4.83, 6.07], [6.74, 7.53], [8.2, 10.2], [10.42, 11.98], [12.2, 13.35], [13.57, 14.77], [14.99, 16.35], [16.57, 17.64], [18.31, 21.17], [21.84, 22.67], [22.89, 23.93], [24.15, 25.33], [25.55, 27.66], [27.88, 30.59], [30.81, 31.94], [32.61, 33.82], [34.04, 34.75], [35.42, 36.72], [37.39, 38.58], [39.25, 40.13], [40.35, 41.05], [41.72, 42.3], [42.97, 44.31], [44.53, 45.81], [46.48, 49.94], [50.61, 51.25], [51.47, 53.15], [53.82, 55.79], [56.46, 58.01], [58.68, 61.86], [62.53, 63.98], [64.65, 66.02], [66.24, 67.65], [68.32, 69.75], [69.97, 71.16], [71.83, 74.28], [74.95, 76.94], [77.61, 80.02], [80.24, 82.69], [83.36, 83.87], [84.09, 86.1], [86.77, 88.63], [89.3, 90.26], [90.48, 92.35], [93.02, 96.03], [96.7, 97.41], [97.63, 98.5], [99.17, 100.02], [100.24, 101.69], [102.36, 103.35]], "R": [["The examiner gives you an instruction.", "Examiner", "At the next intersection, turn right.", "Okay. Right at the next intersection."], ["You didn't hear the examiner.", "Examiner", "Pull over behind the blue car.", "Sorry, could you repeat that, please?"]]}, {"num": 29, "title": "The Result", "lines": [["P", "Okay. I'll start with the good things. Your parallel parking was good, and your hill park was perfect. You shoulder checked every time you changed lanes, and you kept to the speed limit in the school zone.", "Dave"], ["S", "Thank you.", "Sérgio"], ["P", "You made three minor errors. You were a little far from the curb when you parked, you braked a little late at one red light, and you didn't always signal early enough.", "Dave"], ["S", "Three minor errors isn't bad, right?", "Sérgio"], ["P", "No, it isn't. But at the stop sign on the last corner, you didn't make a complete stop. Your car was still moving. That's a rolling stop, and it's a dangerous action. I'm sorry, but that's a fail.", "Dave"], ["S", "A fail? But I stopped!", "Sérgio"], ["P", "You slowed down, but you didn't stop completely. In BC, you have to stop behind the line and wait until the car stops moving. Then you can look and go.", "Dave"], ["S", "Twenty years of driving, and I failed because of one stop sign. Can I take the test again?", "Sérgio"], ["P", "You can. You can rebook at the counter today. Practise your stops, and you'll be fine next time.", "Dave"], ["P", "Your second test is on Wednesday, December 2nd, at twelve twenty.", "Sherry"], ["S", "Twelve twenty or twelve twelve?", "Sérgio"], ["P", "Twelve twenty. Two-zero.", "Sherry"], ["S", "Stop. Count to three. Then look.", "Vern"], ["S", "Vern, you've said that a hundred times.", "Sérgio"], ["S", "And I'll say it a hundred more.", "Vern"], ["P", "Turn left at the lights. Take the second right. Pull over when it's safe.", "Carol"], ["S", "One, two, three.", "Sérgio"], ["P", "Two minor errors. No dangerous actions. Congratulations, you passed.", "Carol"], ["S", "I passed?", "Sérgio"], ["P", "You did. Go inside, and they'll take your photo. You'll get a temporary licence today, and your new licence will come in the mail.", "Carol"], ["S", "Well? Did you pass?", "Vern"], ["S", "I did. And I stopped at every single stop sign.", "Sérgio"]], "words": 291, "kind": "story", "scene": "Dave stops writing and looks at Sérgio.", "F": "feedback language, did/didn't, was, will, can, 12/20, dates and times", "V": "result, pass, fail, minor error, dangerous action, rolling stop, complete stop, retake, rebook, feedback, congratulations, temporary licence", "t": [[2.0, 2.66], [2.88, 4.31], [4.53, 7.97], [8.19, 13.71], [14.38, 15.15], [15.82, 17.25], [17.47, 24.51], [25.18, 27.1], [27.77, 28.69], [28.91, 32.77], [32.99, 34.27], [34.49, 37.13], [37.35, 38.78], [39.45, 40.18], [40.4, 41.31], [41.98, 44.42], [44.64, 49.09], [49.31, 50.53], [51.2, 55.0], [55.22, 56.65], [57.32, 58.0], [58.22, 59.95], [60.17, 62.64], [63.31, 67.28], [67.95, 69.59], [70.26, 71.24], [71.46, 72.36], [73.03, 73.84], [74.06, 75.26], [75.48, 76.41], [77.08, 78.94], [79.61, 81.64], [82.31, 83.61], [83.83, 85.13], [85.35, 86.65], [87.32, 88.41], [89.08, 90.25], [90.47, 91.88], [92.1, 93.87], [94.54, 95.29], [95.96, 96.7], [96.92, 99.06], [99.28, 103.25], [103.92, 104.64], [104.86, 106.01], [106.68, 107.39], [107.61, 110.02]], "R": [["The examiner tells you your result.", "Examiner", "Congratulations, you passed.", "Thank you so much! Is there anything I should work on?"], ["A friend asks how your test went.", "Friend", "How did your road test go?", "I passed! I made one minor error, but it was fine."]]}, {"num": 30, "title": "Ron's Driving Tips", "lines": [["P", "Before we drive anywhere, watch the bike lane. See that cyclist? He's very close to the parked cars. Now imagine you open your door without looking. What happens?", "Ron"], ["S", "The cyclist hits the door?", "Bill"], ["P", "Exactly. That's called dooring. People get seriously hurt. So before you open your door, you shoulder check. Every time. Here's a trick. Open the door with your right hand, not your left. It's called the Dutch reach.", "Ron"], ["S", "Why the right hand?", "Bill"], ["P", "When you use your right hand, your body turns, and you have to look over your shoulder. Try it.", "Ron"], ["S", "Oh, I can see the whole bike lane.", "Bill"], ["P", "That's the point. Okay, start the car. Before you pull out, check your mirror, signal, and shoulder check. The mirror doesn't show everything. There's a blind spot.", "Ron"], ["S", "I want to turn right at this corner.", "Bill"], ["P", "Wait. Check the bike lane first. Cyclists go straight, and you're turning across their lane.", "Ron"], ["S", "Two cyclists. Okay, now I can turn.", "Bill"], ["P", "Good. Now, see that crosswalk? If a pedestrian is waiting, you have to stop. Don't wave them across, and don't honk. Just stop and wait.", "Ron"], ["S", "That light is flashing green. What does that mean?", "Bill"], ["P", "A flashing green means pedestrians control it with a button. You can go, but be ready to stop if it turns yellow.", "Ron"], ["S", "And at a four-way stop, who goes first?", "Bill"], ["P", "The car that stopped first. If you stop at the same time, the car on the right goes first.", "Ron"], ["S", "What about following distance?", "Bill"], ["P", "Stay at least two seconds behind the car in front of you. In the rain, make it three or more. And one last tip. When you park, stay at least five metres from a fire hydrant. And put your phone away. Distracted driving is an expensive ticket.", "Ron"], ["S", "Okay, we're parked. I'll get out.", "Bill"], ["P", "Bill. Which hand?", "Ron"], ["S", "Oops. Right hand, and shoulder check.", "Bill"], ["P", "Better. You'll be fine on Friday.", "Ron"]], "words": 313, "kind": "story", "scene": "Bill's road test is next Friday. On Saturday morning, his friend Ron takes him out to practise. They're parked near Commercial Drive.", "F": "instructions and advice (should/shouldn't, don't, have to), can, does/doesn't, numbers (2/3 seconds, 5 metres), -ed", "V": "shoulder check, dooring, cyclist, bike lane, Dutch reach, blind spot, pull out, crosswalk, pedestrian, yield, flashing green light, four-way stop, following distance, fire hydrant, distracted driving", "t": [[2.0, 4.82], [5.04, 6.4], [6.62, 8.78], [9.0, 12.17], [12.39, 13.48], [14.15, 15.52], [16.19, 17.21], [17.43, 18.82], [19.04, 20.75], [20.97, 23.95], [24.17, 25.32], [25.54, 26.67], [26.89, 29.99], [30.21, 31.77], [32.44, 33.46], [34.13, 39.06], [39.28, 40.13], [40.8, 42.51], [43.18, 44.39], [44.61, 46.26], [46.48, 50.21], [50.43, 52.46], [52.68, 54.23], [54.9, 56.63], [57.3, 58.01], [58.23, 59.89], [60.11, 63.46], [64.13, 65.02], [65.24, 66.48], [67.15, 67.86], [68.08, 69.74], [69.96, 72.88], [73.1, 75.49], [75.71, 77.18], [77.85, 79.3], [79.52, 80.48], [81.15, 84.93], [85.15, 88.37], [89.04, 91.05], [91.72, 93.57], [93.79, 97.53], [98.2, 99.65], [100.32, 103.35], [103.57, 105.53], [105.75, 107.18], [107.4, 111.0], [111.22, 112.82], [113.04, 115.92], [116.59, 117.64], [117.86, 118.65], [119.32, 120.02], [120.24, 121.31], [121.98, 122.51], [122.73, 124.16], [124.83, 125.62], [125.84, 127.7]], "R": [["A friend gives you driving advice.", "Friend", "Always do a shoulder check before you change lanes.", "Thanks. I sometimes forget. I'll practise that."], ["Your friend asks about four-way stops.", "Friend", "Who goes first at a four-way stop?", "The first car to stop goes first. If two cars arrive together, the car on the right goes first."]]}, {"num": 31, "title": "Buying Car Insurance", "lines": [["P", "Hi, I'm Gary. Is this your first time insuring a car in BC?", "Gary"], ["S", "Yes, it is.", "Sérgio"], ["P", "Okay. Everyone has to buy basic insurance from ICBC. That's the minimum. Then you can add optional coverage.", "Gary"], ["S", "What does basic insurance cover?", "Sérgio"], ["P", "It covers injuries, and damage you cause to other people's cars or property. But it doesn't cover damage to your own car.", "Gary"], ["S", "What if I hit something and damage my own car?", "Sérgio"], ["P", "Then you need collision coverage. And comprehensive covers things like theft, fire, or a broken windshield.", "Gary"], ["S", "Should I get both?", "Sérgio"], ["P", "For a 2019 car, I'd recommend both. Now, the deductible. That's the amount you pay yourself if you make a claim. You can choose three hundred, five hundred, or one thousand dollars. A higher deductible means a lower price.", "Gary"], ["S", "I'll choose five hundred.", "Sérgio"], ["P", "Good choice. How many years have you been driving?", "Gary"], ["S", "Twenty years, in Brazil.", "Sérgio"], ["P", "Did you bring a letter from your insurance company or the driving authority in Brazil? It has to show your driving experience and your record.", "Gary"], ["S", "I did. It's translated too.", "Sérgio"], ["P", "Perfect. With this letter, ICBC can recognize your experience, and you'll get a discount. Without it, you'd pay the price for a new driver.", "Gary"], ["S", "How much is the discount?", "Sérgio"], ["P", "It depends, but it can be a lot. For you, the total is about two thousand four hundred dollars a year.", "Gary"], ["S", "Two thousand four hundred? That's expensive.", "Sérgio"], ["P", "Vancouver is expensive. But you can pay monthly. That's about two hundred and five dollars a month, with a small fee.", "Gary"], ["S", "Monthly is better for me.", "Sérgio"], ["P", "Okay. Please sign here, here, and here. Your policy starts today at twelve noon. And here's a small sticker for your licence plate. Put it on your back plate before you drive away.", "Gary"], ["S", "Can I drive home now?", "Sérgio"], ["P", "You can. And drive carefully. If you don't have any claims this year, your price will go down next year.", "Gary"]], "words": 317, "kind": "story", "scene": "Sérgio has his BC driver's licence, and he just bought a used car, a 2019 Toyota Corolla. Before he can drive it, he needs insurance from an Autoplan broker on Kingsway.", "F": "prices and payment plans, years of experience, did, does/doesn't, can, will, would", "V": "ICBC, Autoplan broker, basic insurance, optional coverage, collision, comprehensive, deductible, claim, driving experience, driver's record, discount, premium, monthly payments, policy", "t": [[2.0, 3.3], [3.52, 6.61], [7.28, 8.2], [8.87, 9.79], [10.01, 13.29], [13.51, 14.77], [14.99, 17.34], [18.01, 19.78], [20.45, 25.38], [25.6, 27.97], [28.64, 31.3], [31.97, 33.87], [34.09, 38.96], [39.63, 40.63], [41.3, 44.43], [44.65, 46.11], [46.33, 49.48], [49.7, 53.84], [54.06, 56.62], [57.29, 58.7], [59.37, 60.39], [60.61, 62.81], [63.48, 64.89], [65.56, 70.96], [71.18, 74.61], [75.28, 75.98], [76.2, 77.53], [78.2, 79.07], [79.29, 84.11], [84.33, 87.13], [87.8, 89.12], [89.79, 91.77], [91.99, 96.18], [96.85, 98.28], [98.5, 99.63], [100.3, 102.09], [102.31, 103.8], [104.02, 108.16], [108.83, 110.24], [110.91, 111.83], [112.05, 113.86], [114.08, 116.47], [116.69, 119.57], [119.79, 122.39], [123.06, 124.38], [125.05, 126.01], [126.23, 127.66], [127.88, 132.17]], "R": [["You're buying car insurance.", "Broker", "Would you like optional coverage?", "Yes, I'd like collision and comprehensive. What's the deductible?"], ["The broker asks about your experience.", "Broker", "How many years of driving experience do you have?", "Twenty years in Brazil. I have a letter from my insurance company there."]]}]}, {"part": 4, "title": "Exploring Vancouver", "desc": "Tours, day trips, and a night at the hockey game.", "scripts": [{"num": 32, "title": "A Day on Granville Island", "lines": [["P", "Is it really an island?", "Mom"], ["S", "Not really. It's more like a small peninsula, under the Granville Bridge. But everyone calls it an island. We didn't drive, because parking is difficult on weekends. So we'll take the Aquabus across False Creek.", "Carolina"], ["P", "This boat is tiny! It's like a toy boat!", "Mom"], ["S", "It only takes five minutes. Look, there's the Public Market.", "Carolina"], ["P", "So many people! And so much colour.", "Mom"], ["S", "There are stalls with fresh fruit, vegetables, cheese, bread, fish, and flowers. Everything here is local. Many of the vendors are small farmers and bakers from BC.", "Carolina"], ["P", "Would you like to try this one? It's from a farm in the Fraser Valley.", "Vendor"], ["P", "Mmm. Delicious. Much better than the cheese at the supermarket.", "Mom"], ["S", "We'll take some, please. And some bread and strawberries. Mom, what about lunch? Fish and chips, outside by the water?", "Carolina"], ["P", "Perfect.", "Mom"], ["S", "Watch out for the seagulls. They steal food.", "Carolina"], ["P", "Ah! He took my french fry! Right out of my hand!", "Mom"], ["S", "I told you!", "Carolina"], ["P", "Listen to that busker. He's very good. In Brazil, we have street musicians too. Here, I'll give him a coin.", "Mom"], ["S", "That's a toonie, two dollars. Now come with me. I have a surprise.", "Carolina"], ["P", "Look at those! Six giant silos, painted with huge colourful people, like giants. Who painted them?", "Mom"], ["S", "Two artists from São Paulo. Twin brothers.", "Carolina"], ["P", "From São Paulo? Really? I'm sending these photos to everyone in the family.", "Mom"], ["S", "That's your twentieth photo, Mom. It's four o'clock. Let's take the Aquabus back.", "Carolina"], ["P", "I didn't expect to find a piece of home here.", "Mom"], ["S", "Neither did I. The first time I saw those silos, I cried.", "Carolina"]], "words": 265, "kind": "story", "scene": "In June, Carolina's mother visits from São Paulo. The first place Carolina takes her is Granville Island, under the Granville Bridge.", "F": "directions and places, prices, times, did/didn't, is, -ed, there is/there are", "V": "Public Market, vendor, stall, local, fresh, sample, Aquabus, False Creek, busker, mural, \"Watch out for the seagulls,\" under the bridge", "t": [[2.0, 3.32], [3.99, 4.74], [4.96, 8.27], [8.49, 10.3], [10.52, 13.8], [14.02, 16.37], [17.04, 18.24], [18.46, 19.67], [20.34, 21.9], [22.12, 23.91], [24.58, 25.65], [25.87, 26.96], [27.63, 32.49], [32.71, 34.08], [34.3, 38.01], [38.68, 40.62], [40.84, 43.16], [43.83, 44.67], [44.89, 45.7], [45.92, 48.31], [48.98, 50.17], [50.39, 51.88], [52.1, 53.45], [53.67, 56.01], [56.68, 57.45], [58.12, 59.47], [59.69, 60.69], [61.36, 61.94], [62.16, 63.56], [63.78, 65.02], [65.69, 66.54], [67.21, 68.47], [68.69, 69.74], [69.96, 72.24], [72.46, 73.89], [74.56, 76.31], [76.53, 77.45], [77.67, 78.73], [79.4, 80.34], [80.56, 84.74], [84.96, 86.01], [86.68, 88.28], [88.5, 89.39], [90.06, 91.17], [91.39, 92.08], [92.3, 95.09], [95.76, 97.66], [97.88, 98.95], [99.17, 100.6], [101.27, 103.53], [104.2, 105.16], [105.38, 108.04]], "R": [["You're at a market stall.", "Vendor", "Would you like to try a sample?", "Yes, please! That's delicious. How much is it?"], ["A visitor asks about Granville Island.", "Visitor", "How do you get to Granville Island?", "You can take the Aquabus across False Creek. It's quick and fun."]]}, {"num": 33, "title": "Biking the Stanley Park Seawall", "lines": [["P", "Good morning, everyone! Before we start, a few rules. Everyone has to wear a helmet. On the seawall, bikes go in one direction only, counter-clockwise. Stay in the bike lane, because the other lane is for pedestrians. And if you need to stop, pull over to the side first.", "Trevor"], ["S", "How big is Stanley Park?", "Renata"], ["P", "It's over four hundred hectares. That's bigger than Central Park in New York. The seawall goes all the way around it, about nine kilometres.", "Trevor"], ["P", "Nine kilometres? I hope my legs can do it.", "Marla"], ["P", "Here we are at Brockton Point. These totem poles were carved by First Nations artists. Each one tells a story about families, animals, and history. Please don't touch them, but take as many photos as you like.", "Trevor"], ["S", "Listen to the bridge. The cars above us sound like thunder.", "Renata"], ["P", "That's the Lions Gate Bridge. It opened in 1938. It connects downtown Vancouver to the North Shore.", "Trevor"], ["P", "What's that rock in the water, all alone?", "Marla"], ["P", "That's Siwash Rock. It's been here for thousands of years, and there are many First Nations stories about it. Now we'll push our bikes up this hill to Prospect Point.", "Trevor"], ["S", "Wow. From the lookout, you can see the ocean, the mountains, and all those ships waiting to enter the harbour.", "Renata"], ["P", "Renata, look. There's a raccoon right next to our table. And that little boy wants to give it his muffin.", "Marla"], ["P", "Please don't feed the wildlife. It's bad for the animals, and raccoons can bite.", "Trevor"], ["P", "After the break, we'll ride past Third Beach and Second Beach, then back to the shop.", "Trevor"], ["P", "People are swimming and playing volleyball. In Vancouver!", "Marla"], ["P", "And we're back. It's one o'clock. How was it?", "Trevor"], ["S", "Amazing. My legs are tired, but I can't stop smiling. I've lived here for a year, and I didn't know the city was this beautiful.", "Renata"]], "words": 302, "kind": "story", "scene": "On Saturday at ten o'clock, Renata and her friend Marla join a bike tour of Stanley Park. They meet their guide, Trevor, at a bike rental shop on Denman Street.", "F": "a tour guide's instructions and facts, distances and numbers, can, will, didn't", "V": "bike rental, helmet, seawall, counter-clockwise, lane, pedestrians, totem poles, Brockton Point, Lions Gate Bridge, Siwash Rock, lookout, raccoon, \"Don't feed the wildlife\"", "t": [[2.0, 3.56], [3.78, 5.7], [5.92, 7.9], [8.12, 12.62], [12.84, 16.64], [16.86, 20.1], [20.77, 22.16], [22.83, 24.88], [25.1, 27.53], [27.75, 31.85], [32.52, 33.67], [33.89, 35.53], [36.2, 38.23], [38.45, 42.09], [42.31, 46.35], [46.57, 50.32], [50.99, 52.08], [52.3, 54.16], [54.83, 56.7], [56.92, 59.08], [59.3, 62.2], [62.87, 64.92], [65.59, 66.99], [67.21, 72.53], [72.75, 76.07], [76.74, 77.34], [77.56, 82.9], [83.57, 84.57], [84.79, 87.13], [87.35, 89.79], [90.46, 92.27], [92.49, 95.58], [96.25, 101.42], [102.09, 104.35], [104.57, 105.57], [106.24, 107.35], [107.57, 108.93], [109.15, 110.22], [110.89, 111.68], [111.9, 114.25], [114.47, 118.14]], "R": [["You're renting a bike.", "Employee", "Do you need a helmet?", "Yes, please. And which way do we ride on the seawall?"], ["A tour guide gives you a rule.", "Guide", "Remember, don't feed the raccoons.", "Okay, we won't. Are there lots of them in the park?"]]}, {"num": 34, "title": "Lynn Canyon", "lines": [["P", "Everyone goes to the Capilano Suspension Bridge. It's beautiful, but it's expensive. Lynn Canyon has a suspension bridge too, and it's free.", "Trish"], ["S", "Free? Then let's go!", "Mom"], ["S", "The air feels cooler here. And look at these enormous trees, all covered in green moss.", "Mom"], ["P", "Some of these trees are hundreds of years old. And here's the suspension bridge.", "Trish"], ["P", "It's so narrow. And it moves! How high is it?", "Son"], ["P", "About fifty metres above the water.", "Trish"], ["S", "Mom, I don't want to go.", "Daughter"], ["P", "It's safe. Thousands of people cross it every day. Just hold the side, and don't look down if you're scared.", "Trish"], ["S", "Hold my hand. We'll walk slowly. Wow. The river is so far below us, rushing over the rocks.", "Mom"], ["P", "On the other side, we'll follow the trail to the Thirty Foot Pool. It's a natural swimming hole.", "Trish"], ["P", "The water is so clear and green! Can we swim?", "Son"], ["P", "You can go in near the edge, where it's shallow. But be careful. The water is very cold, even in summer, and the current can be strong.", "Trish"], ["S", "What does that sign say?", "Mom"], ["P", "\"Danger. No cliff jumping.\" Some young people jump into the water from the cliffs. Every few years, someone dies here. The water is deeper and colder than it looks, and there are rocks under the surface.", "Trish"], ["P", "I'll just put my feet in.", "Son"], ["S", "Good choice.", "Mom"], ["P", "So, did you like it?", "Trish"], ["S", "The bridge was scary, but fun. Can we come back next weekend?", "Daughter"], ["S", "Trish, now I understand why you love this place.", "Mom"]], "words": 246, "kind": "story", "scene": "Trish has a day off on Tuesday, so she offers to take her neighbour's family to Lynn Canyon in North Vancouver.", "F": "safety warnings, heights and distances, don't, can, did, -ed", "V": "suspension bridge, canyon, trail, swimming hole, rapids, cliff jumping, dangerous, \"Stay on the trail,\" \"Keep an eye on the kids,\" \"It's free\"", "t": [[2.0, 4.75], [4.97, 6.85], [7.07, 10.21], [10.88, 11.52], [11.74, 12.76], [13.43, 14.9], [15.12, 18.58], [19.25, 21.62], [21.84, 23.56], [24.23, 25.19], [25.41, 26.29], [26.51, 27.47], [28.14, 30.08], [30.75, 32.09], [32.76, 33.62], [33.84, 36.03], [36.25, 39.11], [39.78, 40.81], [41.03, 42.18], [42.4, 43.0], [43.22, 46.48], [47.15, 50.52], [50.74, 52.26], [52.93, 54.72], [54.94, 55.81], [56.48, 58.53], [58.75, 59.73], [59.95, 63.96], [64.63, 65.93], [66.6, 67.41], [67.63, 68.91], [69.13, 71.89], [72.11, 74.2], [74.42, 78.58], [79.25, 80.63], [81.3, 82.2], [82.87, 84.09], [84.76, 86.29], [86.51, 88.13], [88.8, 91.49]], "R": [["You're taking your family to Lynn Canyon.", "Child", "Can we swim in the river?", "Only in the swimming hole, and only if it's safe. Stay on the trail, please."], ["A friend asks about your trip.", "Friend", "How was Lynn Canyon?", "It was beautiful! The suspension bridge was scary, but fun. And it's free!"]]}, {"num": 35, "title": "A Day Trip to Whistler", "lines": [["P", "You can't live in Vancouver and not see Whistler. It's about two hours by car, on the Sea to Sky Highway. It's one of the most beautiful drives in the world.", "Mike"], ["S", "Is it dangerous in winter?", "Rafa"], ["P", "It can be. From October 1st to April 30th, you need winter tires on this highway. It's the law.", "Mike"], ["P", "Look at that! The ocean on one side and mountains on the other.", "Camila"], ["P", "Beautiful, isn't it?", "Mike"], ["P", "Keep your eyes on the road, Mike!", "Camila"], ["P", "Ha. We'll stop at Shannon Falls, near Squamish. It's over three hundred metres high. Taller than most buildings in the world.", "Mike"], ["S", "Here we are in Whistler. It's only ten thirty. And there are no cars in the centre of the village.", "Rafa"], ["P", "Whistler hosted events for the 2010 Winter Olympics. See the giant Olympic rings? Everyone takes a photo here.", "Mike"], ["P", "Then we'll take one too. Rafa, smile!", "Camila"], ["P", "Now we'll take the gondola up Whistler Mountain.", "Mike"], ["P", "It's much colder up here. And there's already some snow!", "Camila"], ["P", "Now for the best part. The Peak to Peak Gondola. It goes from Whistler Mountain to Blackcomb Mountain.", "Mike"], ["P", "There's nothing below us but trees and air. How high are we?", "Camila"], ["P", "At the highest point, more than four hundred metres above the ground.", "Mike"], ["S", "Please don't tell me that.", "Rafa"], ["P", "So, when does the ski season start?", "Camila"], ["P", "Usually in late November. It goes until April, sometimes May.", "Mike"], ["P", "I've never skied in my life.", "Camila"], ["P", "Then this winter, you'll learn. I'll teach you.", "Mike"], ["P", "Rafa fell asleep in the back seat. Mike, thank you for today. It was one of the best days since we moved to Canada.", "Camila"]], "words": 264, "kind": "story", "scene": "In October, Mike invites his coworker Camila and her husband, Rafa, on a day trip to Whistler. They leave at eight in the morning.", "F": "highway travel, times and distances, heights, did, was/were, will, can/can't, -ed", "V": "Sea to Sky Highway, winter tires, lookout, waterfall, gondola, Peak 2 Peak, village, Olympic rings, Winter Olympics, ski season, \"Keep your eyes on the road\"", "t": [[2.0, 4.99], [5.21, 9.05], [9.27, 12.27], [12.94, 14.4], [15.07, 16.2], [16.42, 21.34], [21.56, 22.69], [23.36, 24.09], [24.31, 27.23], [27.9, 29.37], [30.04, 31.64], [32.31, 33.02], [33.24, 35.86], [36.08, 38.15], [38.37, 40.48], [41.15, 42.28], [42.5, 43.72], [43.94, 46.39], [47.06, 50.56], [50.78, 52.53], [52.75, 54.65], [55.32, 56.52], [56.74, 57.65], [58.32, 61.35], [62.02, 63.41], [63.63, 64.97], [65.64, 67.2], [67.42, 69.06], [69.28, 72.53], [73.2, 75.31], [75.53, 76.55], [77.22, 81.42], [82.09, 83.33], [84.0, 86.13], [86.8, 88.7], [88.92, 91.48], [92.15, 93.65], [94.32, 96.11], [96.33, 97.5], [98.17, 99.92], [100.14, 101.68], [101.9, 104.82]], "R": [["A coworker invites you on a day trip.", "Coworker", "Do you want to come to Whistler with us on Saturday?", "I'd love to! What time are you leaving?"], ["Your friend asks about the drive.", "Friend", "How was the Sea to Sky Highway?", "Amazing. We stopped at a waterfall and a lookout. The views were beautiful."]]}, {"num": 36, "title": "A Night at the Hockey Game", "lines": [["P", "You brought a toque. Good.", "Tom"], ["S", "I borrowed it from my neighbour. What's a toque, exactly?", "Marcos"], ["P", "It's a winter hat. The kind with no brim.", "Tom"], ["P", "Programs! Seven dollars!", "Seller"], ["S", "One, please. Here's ten.", "Marcos"], ["P", "Thanks. Here's your change.", "Seller"], ["S", "Dad, what are these coins? A big gold one and a two-colour one.", "Son"], ["P", "The gold one is a loonie. It's one dollar. It has a bird on it, a loon. The two-colour one is a toonie. It's two dollars.", "Tom"], ["S", "Loonie and toonie? That's funny.", "Son"], ["P", "Canadians are funny, eh?", "Tom"], ["S", "Why do you say \"eh\" at the end?", "Marcos"], ["P", "I don't know. We just do. It's like \"right?\" or \"don't you think?\"", "Tom"], ["P", "One second, I need coffee. I'll have a double-double, please.", "Tom"], ["S", "What's a double-double?", "Son"], ["P", "Coffee with two creams and two sugars. It's very Canadian.", "Tom"], ["S", "Our seats are high up, but we can see everything.", "Marcos"], ["P", "The game starts at seven. A hockey game has three periods. Each period is twenty minutes. Between periods, there's an intermission. That's when everyone goes to the washroom and buys food.", "Tom"], ["S", "Oh no. The other team scored.", "Son"], ["S", "Yes! Goal! And another one! Two to one!", "Son"], ["S", "Tom, where's the washroom?", "Marcos"], ["P", "Down the stairs, on the left. But hurry. The lines are long.", "Tom"], ["S", "What did I miss? Two to two?", "Marcos"], ["P", "They scored again. If it's tied at the end, they play overtime.", "Tom"], ["S", "Forty seconds left. Shoot! Shoot! Goal! Three to two!", "Son"], ["S", "Can we go again, Dad?", "Son"], ["S", "We'll see. Tickets aren't cheap, eh?", "Marcos"], ["P", "Ha! You're already talking like a Canadian.", "Tom"]], "words": 244, "kind": "story", "scene": "Tom has two extra tickets to the Canucks game, so he invites his coworker Marcos and Marcos's son. They meet at Stadium–Chinatown Station at six fifteen and walk to Rogers Arena.", "F": "Canadian words (toque, washroom, loonie, toonie, double-double, eh), numbers (prices, periods, scores), was, can", "V": "the Canucks, Rogers Arena, period, intermission, goal, overtime, toque, loonie, toonie, double-double, washroom, \"eh\"", "t": [[2.0, 3.26], [3.48, 4.18], [4.85, 6.3], [6.52, 7.74], [8.41, 9.82], [10.04, 11.64], [12.31, 13.18], [13.4, 14.49], [15.16, 16.01], [16.23, 17.02], [17.69, 18.42], [18.64, 19.7], [20.37, 21.76], [21.98, 24.07], [24.74, 26.34], [26.56, 27.91], [28.13, 30.05], [30.27, 32.16], [32.38, 33.73], [34.4, 35.4], [35.62, 36.47], [37.14, 38.92], [39.59, 41.06], [41.73, 42.86], [43.08, 44.21], [44.43, 45.75], [45.97, 47.34], [48.01, 49.91], [50.13, 52.02], [52.69, 53.85], [54.52, 56.71], [56.93, 58.34], [59.01, 61.36], [62.03, 63.76], [63.98, 66.05], [66.27, 68.33], [68.55, 71.16], [71.38, 74.6], [75.27, 75.99], [76.21, 77.41], [78.08, 78.65], [78.87, 79.47], [79.69, 80.65], [80.87, 81.73], [82.4, 83.7], [84.37, 86.14], [86.36, 87.34], [87.56, 89.03], [89.7, 90.64], [90.86, 91.73], [92.4, 93.68], [93.9, 96.61], [97.28, 98.5], [98.72, 99.32], [99.54, 100.13], [100.35, 100.95], [101.17, 102.13], [102.8, 104.04], [104.71, 105.46], [105.68, 106.89], [107.56, 108.29], [108.51, 110.64]], "R": [["A coworker offers you a ticket.", "Coworker", "I have an extra ticket to the Canucks game. Want to come?", "Yes, thanks! I've never been to a hockey game. What time does it start?"], ["Someone at the game talks to you.", "Fan", "Great game, eh?", "It's amazing! I didn't know hockey was so fast."]]}]}, {"part": 5, "title": "Shopping and Food", "desc": "Groceries, stores, malls, and eating out.", "scripts": [{"num": 37, "title": "Where Do You Buy Groceries?", "lines": [["P", "Joan, where do you buy your groceries? Everything is so expensive.", "Aline"], ["S", "Ha! It depends what I need. Every store is a little different.", "Joan"], ["P", "What's the difference?", "Aline"], ["S", "Save-On-Foods and Safeway are the big regular supermarkets. They're clean, they have everything, and there's one in almost every neighbourhood. There's a Safeway near Commercial–Broadway Station. But they aren't the cheapest.", "Joan"], ["P", "Do they have points cards?", "Aline"], ["S", "They do. Save-On-Foods has More Rewards, and Safeway uses Scene+. You collect points, and later you get money off your groceries. It's free to sign up, so you should do it.", "Joan"], ["P", "Where's cheaper?", "Aline"], ["S", "Superstore and No Frills. They're owned by the same company, and they use the PC Optimum points card. No Frills is very basic. You bag your own groceries, and the store isn't fancy. But the prices are lower.", "Joan"], ["P", "Why is it called No Frills?", "Aline"], ["S", "\"Frills\" means extra, fancy things. So \"no frills\" means just the basics.", "Joan"], ["P", "What about T&T? I see it everywhere.", "Aline"], ["S", "T&T is an Asian supermarket. It's great for fresh fish, vegetables, sauces, and noodles. And the bakery is amazing. Do you have a Costco membership?", "Joan"], ["P", "No. What's Costco?", "Aline"], ["S", "It's a huge warehouse store. You pay for a membership every year, and you buy everything in bulk. Big boxes, big bags, big bottles.", "Joan"], ["P", "Is it worth it?", "Aline"], ["S", "For a family with kids, usually yes. Toilet paper, coffee, rice, and meat are much cheaper. But be careful. You'll go in for milk and come out with a new TV.", "Joan"], ["P", "Ha! Any other tips?", "Aline"], ["S", "One more. Every Thursday, the stores publish their flyers online, with the week's sales. Check them before you shop. Some stores will even price match. If another store has something cheaper, show them the flyer, and they'll give you the same price.", "Joan"], ["P", "Wait, what happened? The receipt is sixty dollars less than usual. Did you forget half the list?", "Husband"], ["P", "No. I checked the flyers, made a list, went to No Frills, and packed everything myself. I just shopped like a Canadian.", "Aline"]], "words": 330, "kind": "story", "scene": "In their first month in Vancouver, Aline and her husband spent a lot of money on groceries. She asks her neighbour Joan for advice.", "F": "comparing stores and prices, cheaper/more expensive, do, did, should, can", "V": "grocery store, Save-On-Foods, Safeway, Superstore, No Frills, T&T, Costco, membership, points card, rewards, flyer, on sale, bulk, price match, \"bag your own groceries\"", "t": [[2.0, 4.15], [4.37, 5.93], [6.6, 7.24], [7.46, 8.85], [9.07, 10.75], [11.42, 12.47], [13.14, 16.83], [17.05, 21.17], [21.39, 24.2], [24.42, 25.85], [26.52, 27.97], [28.64, 29.45], [29.67, 33.41], [33.63, 36.89], [37.11, 39.14], [39.81, 40.64], [41.31, 42.97], [43.19, 47.5], [47.72, 49.43], [49.65, 52.68], [52.9, 54.35], [55.02, 56.49], [57.16, 59.19], [59.41, 61.65], [62.32, 63.53], [63.75, 64.76], [65.43, 67.71], [67.93, 71.41], [71.63, 73.27], [73.49, 75.22], [75.89, 76.4], [76.62, 77.58], [78.25, 79.85], [80.07, 83.74], [83.96, 86.39], [87.06, 87.85], [88.52, 90.76], [90.98, 94.22], [94.44, 95.42], [95.64, 98.44], [99.11, 99.66], [99.88, 100.76], [101.43, 102.28], [102.5, 106.73], [106.95, 108.33], [108.55, 110.52], [110.74, 115.66], [116.33, 117.38], [117.6, 120.07], [120.29, 121.64], [122.31, 122.82], [123.04, 127.8], [128.02, 129.7]], "R": [["You ask a neighbour about groceries.", "Neighbour", "Where do you usually shop?", "We usually go to Superstore, but it's expensive. Where do you shop?"], ["Your neighbour gives you a tip.", "Neighbour", "Check the flyer on Wednesday. That's when the sales start.", "Great tip, thanks! Do you use a points card too?"]]}, {"num": 38, "title": "Grocery Shopping", "lines": [["P", "The bananas are seventy-nine cents per pound? Per pound? I thought Canada used kilograms.", "Aline"], ["S", "It does. Look at the small numbers under the big ones. One dollar and seventy-four cents per kilogram. Stores show the price per pound in big letters because it looks cheaper.", "Joan"], ["P", "That's clever. Oh, the chicken breasts are on sale. Six ninety-nine a pound. And I need eggs.", "Aline"], ["S", "Get a dozen. That's twelve.", "Joan"], ["P", "And a bottle of pop. Pop? In Brazil, we say \"refrigerante.\"", "Aline"], ["S", "In BC, we say pop. But look at the price tag. See the word \"deposit\"? You pay ten cents extra for the bottle. When you return the empty bottle to a bottle depot, you get your ten cents back.", "Joan"], ["P", "The line is so long.", "Aline"], ["S", "Let's use the self-checkout. Scan each item here. For bananas and vegetables, type the code on the sticker, or search on the screen.", "Joan"], ["P", "Did you bring your own bags?", "Machine"], ["P", "I didn't.", "Aline"], ["S", "Then you'll pay for each paper bag. In Vancouver, stores have to charge for bags. Next time, bring reusable bags.", "Joan"], ["P", "Do you have a points card?", "Machine"], ["P", "I don't have one.", "Aline"], ["S", "You can sign up for free. You get points, and after a while, you get free groceries.", "Joan"], ["P", "Forty-two dollars and sixty cents. Why did it add tax on the pop and the chips, but not on the chicken or the eggs?", "Aline"], ["S", "Basic groceries don't have tax. But things like pop, chips, and candy do.", "Joan"], ["P", "Tap, insert, or swipe.", "Machine"], ["P", "Would you like your receipt?", "Machine"], ["P", "Yes, please.", "Aline"], ["P", "Canadian shopping is complicated. Pounds, kilos, deposits, bags, taxes.", "Aline"], ["S", "You did great. Next week, you can teach me something about Brazilian food.", "Joan"]], "words": 270, "kind": "story", "scene": "On Saturday morning, Aline goes grocery shopping with her neighbour Joan, who wants to show her some Canadian shopping tricks.", "F": "pounds and kilograms, prices, cents, \"a dozen,\" taxes, do/does/don't, is, can, -ed", "V": "per pound, per kilogram, produce, on sale, a dozen, pop, bottle deposit, bottle depot, reusable bags, self-checkout, points card, receipt, tap, insert", "t": [[2.0, 4.56], [4.78, 5.59], [5.81, 7.69], [8.36, 9.19], [9.41, 11.52], [11.74, 14.62], [14.84, 18.55], [19.22, 20.01], [20.23, 22.43], [22.65, 24.17], [24.39, 25.49], [26.16, 27.08], [27.3, 28.24], [28.91, 30.06], [30.28, 30.9], [31.12, 33.47], [34.14, 35.65], [35.87, 37.28], [37.5, 38.93], [39.15, 41.3], [41.52, 45.73], [46.4, 47.61], [48.28, 49.86], [50.08, 51.43], [51.65, 56.3], [56.97, 58.35], [59.02, 59.77], [60.44, 62.21], [62.43, 65.2], [65.42, 67.58], [68.25, 69.61], [70.28, 71.29], [71.96, 73.41], [73.63, 76.7], [77.37, 79.33], [79.55, 83.93], [84.6, 86.62], [86.84, 89.19], [89.86, 91.37], [92.04, 93.37], [94.04, 94.89], [95.56, 97.74], [97.96, 100.84], [101.51, 102.51], [102.73, 105.95]], "R": [["You're at the self-checkout.", "Machine", "Please place the item in the bagging area.", "(to an employee) Excuse me, the machine isn't working. Can you help me?"], ["The cashier asks you a question.", "Cashier", "Do you need a bag?", "No, thanks. I brought my own."]]}, {"num": 39, "title": "Meat and Vegetables for a Brazilian Barbecue", "lines": [["P", "The meat is the most important part. First, picanha.", "Tiago"], ["S", "What's picanha in English? Let's ask Mike. He loves cooking.", "Priscila"], ["P", "Ask the butcher for top sirloin cap. They don't always have it in the display, so ask at the counter.", "Mike"], ["S", "Hi, can I help you?", "Butcher"], ["S", "Yes, do you have top sirloin cap?", "Priscila"], ["S", "We do. How much would you like?", "Butcher"], ["S", "About two kilos, please. And can you leave the fat on? Don't trim it.", "Priscila"], ["S", "Sure. Most people ask me to cut it off. What else?", "Butcher"], ["S", "One kilo of flank steak and some pork ribs. And chicken thighs, please. Boneless and skinless, about a kilo and a half.", "Priscila"], ["P", "And sausage.", "Tiago"], ["S", "Oh, and eight sausages. Do you have something similar to Portuguese sausage?", "Priscila"], ["S", "We have chorizo. That's close.", "Butcher"], ["S", "Perfect. And some ground beef.", "Priscila"], ["S", "Lean or extra lean?", "Butcher"], ["P", "What's the difference?", "Tiago"], ["S", "Extra lean has less fat. For meatballs or burgers, lean is fine.", "Butcher"], ["P", "Lean, please. Five hundred grams.", "Tiago"], ["S", "Okay, produce. Two red bell peppers and two green ones. Two zucchini. One eggplant. A bunch of green onions and a bunch of parsley.", "Priscila"], ["P", "Not cilantro?", "Tiago"], ["S", "Cilantro too. Some people hate it, so I'll put it on the side.", "Priscila"], ["P", "What about the salad?", "Tiago"], ["S", "A head of romaine lettuce, six Roma tomatoes, and one red onion.", "Priscila"], ["P", "Corn on the cob?", "Tiago"], ["S", "Yes! Six ears. They're BC grown, and they're on sale. Now cassava, for mandioca frita. I can't find it.", "Priscila"], ["P", "Cassava? Sometimes it's called yuca. Check the Asian and Latin section, near the end of the aisle.", "Employee"], ["P", "Found it. And two sweet potatoes.", "Tiago"], ["P", "This is amazing. That's my fourth piece. What's this cut called again?", "Mike"], ["S", "In Brazil, picanha. Here, top sirloin cap. But remember to tell the butcher not to cut off the fat.", "Priscila"]], "words": 285, "kind": "story", "scene": "For her birthday, Priscila has invited six coworkers to a churrasco, a Brazilian barbecue. On Friday, she and her husband, Tiago, make the shopping list.", "F": "food vocabulary, weights (kilos and pounds, grams), quantities (a bunch, a head, a bag), can, do/don't", "V": "butcher counter, cut, top sirloin cap, flank steak, ribs, ground beef (lean, extra lean), chicken thighs, boneless, skinless, sausage, marinade; bell peppers, zucchini, eggplant, green onions, cilantro, parsley, romaine lettuce, Roma tomatoes, corn on the cob, cassava, sweet potatoes, a bunch, a head, a bag, organic, B.C. grown", "t": [[2.0, 3.88], [4.1, 5.16], [5.83, 7.33], [7.55, 8.61], [8.83, 9.94], [10.61, 13.05], [13.27, 17.04], [17.71, 18.84], [19.51, 21.45], [22.12, 22.85], [23.07, 24.18], [24.85, 26.43], [26.65, 28.08], [28.3, 29.23], [29.9, 30.5], [30.72, 32.56], [32.78, 33.48], [34.15, 36.86], [37.08, 38.57], [38.79, 41.46], [42.13, 42.98], [43.65, 45.13], [45.35, 48.31], [48.98, 50.13], [50.35, 51.21], [51.88, 52.62], [52.84, 54.04], [54.71, 56.01], [56.68, 57.72], [58.39, 59.8], [60.02, 62.18], [62.85, 63.74], [63.96, 65.07], [65.74, 66.85], [67.07, 69.35], [69.57, 70.56], [70.78, 71.74], [71.96, 74.73], [75.4, 76.36], [77.03, 78.16], [78.38, 81.05], [81.72, 82.76], [83.43, 87.53], [88.2, 89.2], [89.87, 90.47], [90.69, 91.54], [91.76, 93.94], [94.16, 96.38], [96.6, 97.68], [98.35, 99.16], [99.38, 100.92], [101.14, 104.51], [105.18, 105.82], [106.04, 107.32], [107.99, 109.31], [109.53, 111.03], [111.25, 113.04], [113.71, 115.05], [115.27, 116.72], [116.94, 120.14]], "R": [["You're at the butcher counter.", "Butcher", "What can I get for you?", "Hi, I'd like two kilos of top sirloin cap, please. And do you have chicken thighs?"], ["The butcher asks about the cut.", "Butcher", "Boneless or bone-in?", "Boneless and skinless, please."]]}, {"num": 40, "title": "The Cleaning Supplies List", "lines": [["P", "Okay. Let's start with the kitchen. We need dish soap.", "Priscila"], ["S", "In Brazil, we call it \"detergente.\" But I asked at the store last week, and they showed me laundry detergent. Here, detergent is usually for clothes.", "Tiago"], ["P", "So, dish soap for washing by hand, and dishwasher pods for the dishwasher. Do we have a dishwasher?", "Priscila"], ["S", "We do. We've never used it.", "Tiago"], ["P", "Then pods. What else?", "Priscila"], ["S", "Sponges, a scrub brush, and rubber gloves. And paper towels.", "Tiago"], ["P", "Now the laundry. We need laundry detergent, fabric softener, and dryer sheets.", "Priscila"], ["S", "What are dryer sheets?", "Tiago"], ["P", "You put one in the dryer with your clothes. It makes them soft, and they don't stick together.", "Priscila"], ["S", "And bleach.", "Tiago"], ["P", "Yes, but be careful with bleach. My coworker told me never to mix it with other cleaners. It can make dangerous gas.", "Priscila"], ["S", "Okay. Bathroom?", "Tiago"], ["P", "Toilet bowl cleaner, glass cleaner for the mirror, and an all-purpose cleaner for everything else.", "Priscila"], ["S", "What about the floors? In Brazil, I always used a squeegee and a cloth.", "Tiago"], ["P", "Here, most people use a mop and a bucket. And a broom and a dustpan.", "Priscila"], ["S", "Don't forget toilet paper.", "Tiago"], ["P", "Never! And garbage bags, the big ones for the kitchen and small ones for the bathroom.", "Priscila"], ["S", "Aluminum foil, plastic wrap, and freezer bags for leftovers.", "Tiago"], ["P", "Oh, and light bulbs. The one in the hallway burned out. And batteries for the smoke detector.", "Priscila"], ["S", "This aisle is huge. There are at least twenty kinds of dish soap. Which one should we buy?", "Tiago"], ["P", "Look at the small numbers on the shelf tag. That's the unit price. It tells you how much it costs per hundred millilitres. The bigger bottle is usually cheaper per millilitre.", "Priscila"], ["S", "Toilet paper comes in packs of six, twelve, or twenty-four rolls. Twenty-four.", "Tiago"], ["P", "One hundred and thirty-eight dollars.", "Priscila"], ["S", "That's a lot for soap.", "Tiago"], ["P", "It's a lot of soap.", "Priscila"], ["S", "Okay. Everything's put away. Now show me how this mop works.", "Tiago"]], "words": 311, "kind": "story", "scene": "On Sunday morning, Priscila and Tiago make a shopping list for their new apartment.", "F": "household vocabulary, quantities and packages (a roll, a pack of 12, a bottle, a box), do/don't, should, need/don't need", "V": "dish soap, dishwasher pods, laundry detergent, fabric softener, dryer sheets, bleach, all-purpose cleaner, glass cleaner, toilet bowl cleaner, sponges, scrub brush, rubber gloves, mop, bucket, broom, dustpan, paper towels, toilet paper, garbage bags, aluminum foil, plastic wrap, freezer bags, light bulbs, batteries, unit price", "t": [[2.0, 2.7], [2.92, 4.35], [4.57, 5.73], [6.4, 8.27], [8.49, 12.52], [12.74, 14.98], [15.65, 20.2], [20.42, 21.83], [22.5, 23.16], [23.38, 24.51], [25.18, 26.07], [26.29, 27.04], [27.71, 29.97], [30.19, 31.26], [31.93, 32.97], [33.19, 36.97], [37.64, 38.75], [39.42, 41.49], [41.71, 44.21], [44.88, 45.6], [46.27, 47.98], [48.2, 51.55], [51.77, 53.39], [54.06, 54.72], [54.94, 55.62], [56.29, 61.86], [62.53, 63.6], [63.82, 66.7], [67.37, 69.8], [70.02, 71.49], [72.16, 73.63], [74.3, 74.92], [75.14, 79.62], [80.29, 83.98], [84.65, 85.91], [86.13, 87.86], [88.08, 90.08], [90.75, 91.91], [92.13, 94.11], [94.33, 95.42], [96.09, 98.35], [98.57, 99.81], [100.03, 103.14], [103.36, 106.26], [106.93, 110.77], [110.99, 111.85], [112.52, 114.54], [115.21, 116.41], [117.08, 118.17], [118.84, 119.5], [119.72, 120.91], [121.13, 122.73]], "R": [["You're shopping for cleaning supplies.", "Partner", "What do we still need?", "Dish soap, laundry detergent, and a toilet bowl cleaner."], ["You can't find something in the store.", "Employee", "Can I help you find something?", "Yes, please. Where can I find dishwasher pods?"]]}, {"num": 41, "title": "London Drugs and the Dollar Store", "lines": [["P", "Go to London Drugs for the important things, and the dollar store for the cheap things.", "Tara"], ["S", "London Drugs? Is it from London?", "Aline"], ["P", "No! It's a BC company. It started in Vancouver. It's a pharmacy, but they sell everything: electronics, cameras, makeup, snacks, household things. You can even print photos there.", "Tara"], ["S", "Excuse me, where can I find school supplies?", "Aline"], ["P", "Aisle seven, near the back. Backpacks are in aisle eight.", "Employee"], ["S", "Thanks. And where's the electronics section? I need a new phone charger.", "Aline"], ["P", "Upstairs. Take the escalator.", "Employee"], ["S", "A backpack, a calculator, a phone charger, and your photo prints. Do you have a London Drugs account? You can collect points.", "Cashier"], ["S", "Not yet.", "Aline"], ["S", "It's free. Want me to sign you up?", "Cashier"], ["S", "Sure, why not.", "Aline"], ["S", "Now the dollar store. Why is it called a dollar store if things cost more than one dollar?", "Aline"], ["P", "Mom, look at the sign. \"Everything up to five dollars.\"", "Daughter"], ["S", "Before, everything was one dollar. Now it's one to five.", "Aline"], ["P", "Can I get these markers and notebooks?", "Daughter"], ["S", "Yes. Put them in the basket.", "Aline"], ["S", "Why is the total higher than the prices on the shelf?", "Aline"], ["S", "Tax is added at the register. On most things, it's twelve percent, five percent federal and seven percent provincial.", "Cashier"], ["S", "In Brazil, the tax is already in the price.", "Aline"], ["S", "A lot of newcomers say that. Check everything before you go. We don't take returns.", "Cashier"], ["S", "All of this cost less than fifty dollars. London Drugs for the important things, and the dollar store for everything else.", "Aline"]], "words": 245, "kind": "story", "scene": "Aline's daughter is starting school and needs a lot of supplies. Aline's coworker Tara gives her some advice.", "F": "asking where things are, prices, \"up to five dollars,\" do, can, did/didn't, is", "V": "aisle, \"Excuse me, where can I find...?\", pharmacy, electronics, photo printing, household items, school supplies, party supplies, \"Everything's under five dollars,\" receipt, return policy, exchange", "t": [[2.0, 6.48], [7.15, 8.15], [8.37, 9.46], [10.13, 10.81], [11.03, 12.42], [12.64, 14.09], [14.31, 20.13], [20.35, 22.04], [22.71, 25.42], [26.09, 27.5], [27.72, 29.15], [29.82, 30.41], [30.63, 32.3], [32.52, 34.05], [34.72, 35.51], [35.73, 36.89], [37.56, 41.22], [41.44, 43.24], [43.46, 44.8], [45.47, 46.17], [46.84, 47.63], [47.85, 49.13], [49.8, 50.79], [51.46, 52.54], [52.76, 56.33], [57.0, 58.15], [58.37, 60.05], [60.72, 62.75], [62.97, 64.1], [64.77, 66.73], [67.4, 67.94], [68.16, 69.33], [70.0, 72.82], [73.49, 75.24], [75.46, 80.38], [81.05, 83.59], [84.26, 85.8], [86.02, 87.72], [87.94, 89.31], [89.98, 92.11], [92.33, 96.77]], "R": [["You're looking for school supplies.", "Employee", "Can I help you?", "Yes, please. Where can I find t
